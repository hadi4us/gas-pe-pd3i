name: 🚀 Deploy to Google Apps Script

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'           # Hanya trigger jika ada perubahan di folder src/
  workflow_dispatch:       # Bisa dijalankan manual dari GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Deploy ke Google Apps Script
        run: |
          cd src
          clasp push --force
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

      - name: Create new version (optional)
        run: |
          cd src
          clasp version "Auto deploy from GitHub: ${{ github.sha }}"
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        continue-on-error: true   # Tidak gagal jika version gagal dibuat