<div id="pin-modal" class="hidden fixed inset-0 z-[110] items-center justify-center modal-backdrop">
  <div class="w-full max-w-md bg-white rounded-2xl p-6 modal-card mx-4">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i class="fas fa-key text-blue-600"></i>
        <h2 class="font-extrabold text-slate-900">Ubah PIN / Password</h2>
      </div>
      <button type="button" id="btn-close-pin-modal" class="w-10 h-10 rounded-xl hover:bg-slate-100 text-slate-600">
        <i class="fas fa-xmark"></i>
      </button>
    </div>

    <div id="pin-alert" class="hidden mt-4 p-3 rounded-lg text-sm font-bold border"></div>

    <form id="pin-form" class="mt-4 space-y-4">
      <div>
        <label class="block text-xs font-extrabold text-slate-600 uppercase tracking-wider mb-2">PIN Lama</label>
        <input id="pin-old" type="password"
          class="w-full px-3 py-3 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-500 font-bold"
          placeholder="PIN lama" />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-extrabold text-slate-600 uppercase tracking-wider mb-2">PIN Baru</label>
          <input id="pin-new" type="password"
            class="w-full px-3 py-3 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-500 font-bold"
            placeholder="PIN baru (min 6)" />
        </div>
        <div>
          <label class="block text-xs font-extrabold text-slate-600 uppercase tracking-wider mb-2">Ulangi PIN Baru</label>
          <input id="pin-new2" type="password"
            class="w-full px-3 py-3 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-500 font-bold"
            placeholder="ulang PIN baru" />
        </div>
      </div>

      <div class="border border-slate-200 rounded-2xl p-4 bg-slate-50">
        <div class="flex items-start justify-between gap-3">
          <div class="flex-1">
            <div class="text-xs font-extrabold text-slate-600 uppercase tracking-wider">Captcha</div>
            <div id="pin-captcha-question" class="mt-1 text-lg font-extrabold text-slate-900">...</div>
            <div class="mt-3">
              <input id="pin-captcha-answer" inputmode="numeric" pattern="[0-9]*"
                class="w-full px-3 py-3 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-500 font-bold"
                placeholder="Jawaban captcha (angka)" />
            </div>
          </div>
          <button type="button" id="btn-refresh-pin-captcha"
            class="w-11 h-11 shrink-0 rounded-xl border border-slate-200 bg-white hover:bg-slate-100 flex items-center justify-center">
            <i class="fas fa-rotate-right"></i>
          </button>
        </div>

        <div id="pin-captcha-error" class="hidden mt-3 p-2 rounded-lg bg-red-50 border border-red-200 text-red-700 text-xs font-bold">
          Captcha salah
        </div>
      </div>

      <button id="btn-save-pin" type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-4 rounded-2xl shadow-lg shadow-blue-200 flex items-center justify-center gap-2">
        <i class="fas fa-floppy-disk"></i> Simpan PIN Baru
      </button>
    </form>
  </div>
</div>
