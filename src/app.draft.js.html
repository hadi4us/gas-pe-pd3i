<script>
  // ============================================================
  // APP.DRAFT.JS.HTML — Draft per DX & Konfirmasi Ganti DX
  // ============================================================

  // Kembalikan kunci localStorage untuk DX tertentu
  function _draftKey_(dx) {
    return "FORM_DRAFT_" + String(dx || "").trim().toUpperCase();
  }

  // Menyimpan DX sebelumnya untuk keperluan rollback konfirmasi
  var _prevDx_ = "";

  // Cek apakah form memiliki data yang sudah diisi
  function _formHasData_() {
    try {
      var form = document.getElementById("dynamic-form");
      if (!form || form.classList.contains("hidden")) return false;
      var inputs = form.querySelectorAll("input[name], select[name], textarea[name]");
      for (var i = 0; i < inputs.length; i++) {
        var el = inputs[i];
        if (el.type === "hidden") continue;
        if (el.readOnly) continue;
        if (String(el.value || "").trim()) return true;
      }
      var tbodies = form.querySelectorAll("tbody");
      for (var j = 0; j < tbodies.length; j++) {
        if (tbodies[j].querySelectorAll("tr").length > 0) return true;
      }
      return false;
    } catch (e) {
      return false;
    }
  }

  // Inisialisasi handler konfirmasi ganti DX — dipanggil sekali saat app init
  function initDxChangeConfirmation() {
    var selector = document.getElementById("form-selector");
    if (!selector || selector.dataset.dxConfirmBound === "1") return;
    selector.dataset.dxConfirmBound = "1";
    _prevDx_ = selector.value || "";
    selector.addEventListener("change", function(e) {
      var newDx = this.value;
      if (_prevDx_ && newDx !== _prevDx_ && _formHasData_()) {
        var confirmed = window.confirm(
          "Anda akan mengganti jenis penyakit dari \"" + _prevDx_ + "\" ke \"" + newDx + "\".\n\n" +
          "Draft untuk \"" + _prevDx_ + "\" akan disimpan, tetapi form akan direset.\n\nLanjutkan?"
        );
        if (!confirmed) {
          this.value = _prevDx_;
          e.stopImmediatePropagation();
          return;
        }
        saveFormDraft();
      }
      _prevDx_ = newDx;
    }, true);
  }

  // Kumpulkan data tabel dinamis berdasarkan tableId
  function collectDynamicTableData(tableId) {
    var table = document.querySelector("table[data-dynamic-table=\"" + tableId + "\"]");
    if (!table) return [];
    var rows = [];
    table.querySelectorAll("tbody tr").forEach(function(row) {
      var rowObj = {};
      row.querySelectorAll("input, select").forEach(function(inp) {
        rowObj[inp.getAttribute("data-name")] = inp.value;
      });
      if (tableId === "Riwayat Imunisasi") rowObj.__kode = row.dataset.kodeImun || "";
      rows.push(rowObj);
    });
    return rows;
  }

  // Simpan draft ke localStorage dengan kunci per DX
  function saveFormDraft() {
    try {
      var selector = document.getElementById("form-selector");
      var form = document.getElementById("dynamic-form");
      if (!selector || !form || form.classList.contains("hidden")) return;
      var dx = String(selector.value || "").trim();
      if (!dx) return;
      var fields = {};
      form.querySelectorAll("input[name], select[name], textarea[name]").forEach(function(el) {
        fields[el.name] = el.value;
      });
      var searchEpidEl = document.getElementById("search-epid");
      var draft = {
        version: 1,
        savedAt: Date.now(),
        dx: dx,
        isEditMode: !!window.isEditMode,
        searchEpid: searchEpidEl ? searchEpidEl.value : "",
        fields: fields,
        tables: {
          "Kontak Erat": collectDynamicTableData("Kontak Erat"),
          "Riwayat Imunisasi": collectDynamicTableData("Riwayat Imunisasi")
        }
      };
      localStorage.setItem(_draftKey_(dx), JSON.stringify(draft));
    } catch (e) {
      console.warn("Gagal menyimpan draft:", e);
    }
  }

  // Hapus draft dari localStorage
  // Jika dx diberikan, hapus hanya draft DX itu; jika tidak, hapus semua draft FORM_DRAFT_*
  function clearFormDraft(dx) {
    try {
      if (dx) {
        localStorage.removeItem(_draftKey_(dx));
      } else {
        var keysToRemove = [];
        for (var i = 0; i < localStorage.length; i++) {
          var key = localStorage.key(i);
          if (key && key.indexOf("FORM_DRAFT_") === 0) keysToRemove.push(key);
        }
        keysToRemove.forEach(function(k) { localStorage.removeItem(k); });
      }
    } catch (e) {}
  }

  // Ambil draft dari localStorage untuk DX tertentu
  function getFormDraft(dx) {
    try {
      var raw = localStorage.getItem(_draftKey_(dx));
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  // Restore baris tabel dinamis dari data draft
  function restoreDraftRows(tableId, rows) {
    var tbody = document.getElementById("tbody-" + tableId);
    if (!tbody) return;
    tbody.innerHTML = "";
    (rows || []).forEach(function(item) { addDynamicRow(tableId, item); });
  }

  // Restore draft untuk DX tertentu
  // Jika dx tidak diberikan, gunakan DX yang sedang aktif di selector
  function restoreFormDraft(dx) {
    try {
      var selector = document.getElementById("form-selector");
      var targetDx = dx || (selector ? selector.value : "");
      if (!targetDx) return false;
      var draft = getFormDraft(targetDx);
      if (!draft || !draft.dx) return false;
      if (selector && selector.value !== draft.dx) {
        selector.value = draft.dx;
        selector.dispatchEvent(new Event("change", { bubbles: true }));
      }
      setTimeout(async function() {
        var fields = draft.fields || {};
        Object.keys(fields).forEach(function(name) {
          var el = document.getElementsByName(name)[0];
          if (el) {
            el.value = fields[name];
            el.dispatchEvent(new Event("change", { bubbles: true }));
          }
        });
        var searchEpid = document.getElementById("search-epid");
        if (searchEpid && draft.searchEpid) searchEpid.value = draft.searchEpid;
        if (typeof loadRefImunisasi === "function") await loadRefImunisasi();
        if (draft.tables) {
          restoreDraftRows("Kontak Erat", draft.tables["Kontak Erat"] || []);
          restoreDraftRows("Riwayat Imunisasi", draft.tables["Riwayat Imunisasi"] || []);
        }
        if (typeof updateImunisasiSummary === "function") updateImunisasiSummary();
        showTopAlert("Draft sebelumnya berhasil dipulihkan.", true);
      }, 350);
      return true;
    } catch (e) {
      console.warn("Gagal restore draft:", e);
      return false;
    }
  }

  // Tawarkan restore draft saat DX dipilih dan ada draft tersimpan
  // Dipanggil dari handler selector change setelah form di-render
  function handleDxDraftOnChange(dx) {
    if (!dx) return;
    var draft = getFormDraft(dx);
    if (!draft) return;
    var savedTime = new Date(draft.savedAt).toLocaleString("id-ID");
    var confirmed = window.confirm(
      "Ada draft tersimpan untuk \"" + dx + "\" (disimpan " + savedTime + ").\n\n" +
      "Klik OK untuk memulihkan draft, atau Batal untuk memulai form kosong."
    );
    if (confirmed) restoreFormDraft(dx);
  }
</script>
