      "section-verifikasi": `<i class="fas fa-id-card-clip"></i> Simpan Verifikasi EPID`,
      "section-sampel": `<i class="fas fa-vials"></i> Simpan Hasil Pemeriksaan`,
      "section-status": `<i class="fas fa-list-check"></i> Simpan Update Status`
    };

    btnSubmit.innerHTML = labels[normalized] || (isEditMode
      ? `<i class="fas fa-pen-to-square"></i> Perbarui Data`
      : `<i class="fas fa-save"></i> Simpan Data ke Database`);
  }

  function resetSubmitButtonForCurrentStage() {
    const btnSubmit = document.getElementById("btn-submit");
    if (!btnSubmit) return;
    btnSubmit.disabled = !!isViewerSession();
    updateSubmitButtonForWorkflowStep(document.querySelector(".pd3i-stepper-item.is-active")?.getAttribute("data-step-target") || "section-pelapor");
  }

  function applySectionStageAccess(sectionEl, editable) {
    if (!sectionEl) return;
    sectionEl.querySelectorAll("input, select, textarea, button").forEach(function(el) {
      if (!el || el.type === "hidden") return;
      if (el.id === "btn-submit" || el.id === "btn-prev-step" || el.id === "btn-next-step" || el.id === "btn-cancel-edit") return;
      if (el.dataset.stageOrigDisabled === undefined) el.dataset.stageOrigDisabled = el.disabled ? "1" : "0";
      if (el.dataset.stageOrigReadonly === undefined) el.dataset.stageOrigReadonly = el.readOnly ? "1" : "0";

      const origDisabled = el.dataset.stageOrigDisabled === "1";
      const origReadonly = el.dataset.stageOrigReadonly === "1";

      if (!editable) {
        el.setAttribute("disabled", "disabled");
        if (el.tagName !== "SELECT" && el.type !== "checkbox" && el.type !== "radio") {
          el.setAttribute("readonly", "readonly");
        }
      } else {
        if (origDisabled) el.setAttribute("disabled", "disabled");
        else el.removeAttribute("disabled");

        if (el.tagName !== "SELECT" && el.type !== "checkbox" && el.type !== "radio") {
          if (origReadonly) el.setAttribute("readonly", "readonly");
          else el.removeAttribute("readonly");
        }
      }
    });
  }

  function applyWorkflowStageLayout(activeId) {
    let normalized = normalizeWorkflowStepId(activeId);
    if (normalized !== "section-pelapor" && !canAccessDeferredWorkflowStages()) {
      normalized = "section-pelapor";
    }
    const steps = getWorkflowStepDefinitions();
    const current = steps.find(function(step) { return step.id === normalized; }) || steps[0];
    const visibleSections = new Set((current && current.sections) || []);
    const canAccessLater = canAccessDeferredWorkflowStages();
    const helperEl = document.getElementById("workflow-stage-helper");
    const canWriteThisStage = canWriteWorkflowStage(SESSION_USER, normalized);
    const viewerMode = isViewerSession();
    const stageEditable = canWriteThisStage && !viewerMode;

    ["section-pelapor", "section-pasien", "section-specific", "section-verifikasi", "section-sampel", "section-status"].forEach(function(id) {
      const section = document.getElementById(id);
      if (!section) return;
      const isVisible = visibleSections.has(id);
      section.classList.toggle("pd3i-stage-hidden", !isVisible);
      applySectionStageAccess(section, isVisible && stageEditable);
    });

    document.querySelectorAll(".pd3i-stepper-item[data-step-target]").forEach(function(item) {
      const target = normalizeWorkflowStepId(String(item.getAttribute("data-step-target") || "").trim());
      const lockedByDeferredFlow = target !== "section-pelapor" && !canAccessLater;
      item.classList.toggle("is-disabled", lockedByDeferredFlow);
      item.setAttribute("aria-disabled", lockedByDeferredFlow ? "true" : "false");
      item.setAttribute("title", lockedByDeferredFlow ? "Simpan input awal dulu atau buka record existing untuk tahap ini." : "");
    });

    if (helperEl) {
      let helperText = getWorkflowStageHelperText(normalized);
      if (!viewerMode && !canAccessLater && !canWriteThisStage) {
        helperText += " Role aktif tidak berwenang menyimpan tahap input awal; gunakan pencarian record existing atau login dengan role inputer/petugas.";
      } else if (!viewerMode && canAccessLater && !canWriteThisStage) {
        if (normalized === "section-verifikasi") {
          helperText += " Verifikasi memang dibatasi admin saja.";
        } else if (normalized === "section-sampel") {
          const scope = getCurrentRecordPengampuPuskesmasMeta();
          const userUnit = String((SESSION_USER && (SESSION_USER.unitKerja || SESSION_USER.kodePuskesmas)) || '').trim();
          helperText += scope.namaPuskesmas || scope.kodePuskesmas
            ? ` Record ini terpetakan ke puskesmas pengampu: ${(scope.namaPuskesmas || scope.kodePuskesmas)} untuk domisili ${scope.kecamatan || '-'} / ${scope.kelurahan || '-'}. Akun aktif: ${userUnit || 'belum diatur'}.`
            : " Record ini belum punya metadata pengampu di UI; backend tetap akan cek Kab/Kota + Kecamatan + Kelurahan ke REF_PENGAMPU saat simpan.";
        } else {
          helperText += " Role aktif bisa melihat tahap ini, tapi tidak berwenang menyimpan perubahan pada tahap ini.";
        }
      }
      helperEl.textContent = helperText;
    }
    updateSubmitButtonForWorkflowStep(normalized);

    const btnSubmit = document.getElementById("btn-submit");
    if (btnSubmit && !viewerMode) {
      btnSubmit.disabled = !stageEditable;
      btnSubmit.classList.toggle("opacity-60", !stageEditable);
      btnSubmit.classList.toggle("cursor-not-allowed", !stageEditable);
      if (!stageEditable) {
        btnSubmit.innerHTML = `<i class="fas fa-lock"></i> Tidak punya hak ubah tahap ini`;
      }
    }
  }

  function countRequiredCompletionForSections(sectionIds) {
    const ids = Array.isArray(sectionIds) ? sectionIds : [];
    let total = 0;
    let filled = 0;

    ids.forEach(function(id) {
      const root = document.getElementById(id);
      if (!root) return;
      root.querySelectorAll("input, select, textarea").forEach(function(el) {
        if (!el || el.disabled || !el.required) return;
        if (el.type === "hidden") return;
        const wrapper = el.closest(".field-wrapper");
        if (wrapper && wrapper.classList.contains("hidden")) return;
        total++;
        const value = String(el.value || "").trim();
        if (value !== "") filled++;
      });
    });

    return { total, filled, percent: total > 0 ? Math.round((filled / total) * 100) : 100 };
  }

  function validateWorkflowStepCompletion(stepId) {
    const normalized = normalizeWorkflowStepId(stepId);
    const step = getWorkflowStepDefinitions().find(function(item) { return item.id === normalized; });
    if (!step) return { ok: true };

    const invalidEls = [];
    (step.sections || []).forEach(function(id) {
      const root = document.getElementById(id);
      if (!root) return;
      root.querySelectorAll("input, select, textarea").forEach(function(el) {
        if (!el || el.disabled || !el.required) return;
        if (el.type === "hidden") return;
        const wrapper = el.closest(".field-wrapper");
        if (wrapper && wrapper.classList.contains("hidden")) return;
        if (typeof el.checkValidity === "function" && !el.checkValidity()) {
          invalidEls.push(el);
        }
      });
    });

    if (!invalidEls.length) return { ok: true };

    const first = invalidEls[0];
    try {
      first.focus();
      if (typeof first.reportValidity === "function") first.reportValidity();
    } catch (e) {}

    return {
      ok: false,
      message: `Lengkapi dulu field wajib pada langkah ${step.label} sebelum lanjut ke langkah berikutnya.`
    };
  }

  function updateWorkflowProgressUI(activeId) {
    const currentId = normalizeWorkflowStepId(activeId);
    const steps = getWorkflowStepDefinitions();
    const currentIndex = Math.max(0, steps.findIndex(function(step) { return step.id === currentId; }));
    const totalSteps = steps.length;
    const currentStep = steps[currentIndex] || steps[0];
    const completion = countRequiredCompletionForSections(currentStep.sections);
    const overallPercent = Math.round(((currentIndex + (completion.percent / 100)) / totalSteps) * 100);

    const currentLabel = document.getElementById("wizard-current-label");
    const progressLabel = document.getElementById("wizard-progress-label");
    const progressFill = document.getElementById("wizard-progress-fill");
    const btnPrev = document.getElementById("btn-prev-step");
    const btnNext = document.getElementById("btn-next-step");

    const canAccessLater = canAccessDeferredWorkflowStages();
    if (currentLabel) currentLabel.textContent = `Langkah ${currentIndex + 1} dari ${totalSteps} • ${currentStep.label}`;
    if (progressLabel) progressLabel.textContent = `${completion.filled}/${completion.total} field wajib terisi • total ${overallPercent}%`;
    if (progressFill) progressFill.style.width = `${Math.max(0, Math.min(100, overallPercent))}%`;
    if (btnPrev) btnPrev.disabled = currentIndex === 0;
    if (btnNext) btnNext.disabled = currentIndex === totalSteps - 1 || (!canAccessLater && currentId === "section-pelapor");

    document.querySelectorAll(".pd3i-stepper-item[data-step-target]").forEach(function(item) {
      const target = normalizeWorkflowStepId(String(item.getAttribute("data-step-target") || "").trim());
      const stepIdx = steps.findIndex(function(step) { return step.id === target; });
      item.classList.toggle("is-complete", stepIdx !== -1 && stepIdx < currentIndex);
    });
  }

  function goToWorkflowStep(targetId) {
    const normalized = normalizeWorkflowStepId(targetId);
    if (normalized !== "section-pelapor" && !canAccessDeferredWorkflowStages()) {
      setWorkflowSearchIntent(normalized, { focusSearch: true });
      showTopAlert(`Tahap ${getWorkflowStepDefinitions().find(function(step) { return step.id === normalized; })?.label || normalized} dimulai dari pencarian record existing. Cari dan buka record dulu, baru lanjut ke tahap ini.`, false);
      updateFormStepperState("section-pelapor");
      return;
    }

    const steps = getWorkflowStepDefinitions();
    const currentStep = steps.find(function(step) { return step.id === normalized; }) || steps[0];
    const targetSectionId = (currentStep.sections || [normalized])[0] || normalized;
    const el = document.getElementById(targetSectionId);
    if (el) {
      setWorkflowSearchIntent(normalized, { focusSearch: false, focusForm: false, skipStageSync: true });
      updateFormStepperState(normalized);
      updateSidebarActiveState(normalized);
      updateWorkflowProgressUI(normalized);
      el.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }

  function getLatestStatusFromTimeline() {
    const rows = collectDynamicTableData("Riwayat Status Kasus") || [];
    if (!rows.length) return "";
    const sorted = rows.slice().sort(function(a, b) {
      return String(a.Tanggal || "").localeCompare(String(b.Tanggal || ""));
    });
    const last = sorted[sorted.length - 1] || {};
    return String(last.Status || "").trim();
  }

  function getNextAllowedStatusesSummary(dx, currentStatus) {
    let options = [];
    if (typeof getAllowedStatusTransitions === "function") {
      options = getAllowedStatusTransitions(dx, currentStatus);
    } else if (typeof getCaseStatusOptions === "function") {
      options = getCaseStatusOptions(dx);
    }
    options = (options || []).filter(Boolean);
    if (!options.length) {
      if (currentStatus) return `Status terminal (${currentStatus})`;
      return "Tidak ada transisi lanjutan";
    }
    if (options.length <= 4) return options.join(", ");
    return options.slice(0, 4).join(", ") + ` +${options.length - 4} lagi`;
  }

  function getCaseStatusReasonOptions(dx, status) {
    if (typeof getCaseStatusReasonOptionsByDx === "function") {
      return getCaseStatusReasonOptionsByDx(dx, status);
    }

    const statusNorm = String(status || "").trim().toLowerCase();
    const dxNorm = String(dx || "").trim().toUpperCase();

    if (statusNorm === "konfirmasi") return ["", "Laboratorium", "Verifikasi program"];
    if (statusNorm === "klinis") return ["", "Klinis", "Epidemiologis", "Verifikasi program"];
    if (statusNorm === "discarded") return ["", "Laboratorium", "Klinis", "Verifikasi program"];
    if (statusNorm === "probable") return ["", "Epidemiologis", "Klinis", "Verifikasi program"];
    if (statusNorm === "menunggu hasil lab") return ["", "Laboratorium", "Verifikasi program"];
    if (statusNorm === "suspek") return ["", "Klinis", "Epidemiologis"];
    if (dxNorm === "AFP" && statusNorm === "follow up 60 hari") return ["", "Klinis", "Verifikasi program"];
    return ["", "Klinis", "Epidemiologis", "Laboratorium", "Verifikasi program"];
  }

  function syncStatusRulesByContext(dx) {
    const statusSelect = document.getElementById("Status Pasien/Kasus");
    const reasonSelect = document.getElementById("Dasar Penetapan Status");
    if (!statusSelect || !reasonSelect) return;

    const currentReason = String(reasonSelect.value || "").trim();
    const reasonOptions = getCaseStatusReasonOptions(dx, statusSelect.value);
    reasonSelect.innerHTML = reasonOptions.map(function(opt) {
      const selected = opt === currentReason ? ' selected' : '';
      const label = opt || '-- Pilih --';
      return `<option value="${opt}"${selected}>${label}</option>`;
    }).join("");

    if (currentReason && reasonOptions.indexOf(currentReason) === -1) {
      reasonSelect.value = reasonOptions[0] || "";
    }
  }

  function syncCaseStatusOptionsByDx(dx) {
    const select = document.getElementById("Status Pasien/Kasus");
    if (!select) return;

    const currentValue = String(select.value || "").trim();
    const previousStatus = getLatestStatusFromTimeline();
    let options = [];

    if (typeof getAllowedStatusTransitions === "function") {
      options = getAllowedStatusTransitions(dx, previousStatus);
    } else if (typeof getCaseStatusOptions === "function") {
      options = getCaseStatusOptions(dx);
    } else {
      options = ["Suspek", "Discarded", "Klinis", "Probable", "Konfirmasi", "Menunggu hasil lab", "Follow up", "Sembuh", "Meninggal", "Lost to follow-up"];
    }

    if (!previousStatus && typeof getCaseStatusOptions === "function") {
      options = getCaseStatusOptions(dx);
    }

    if (currentValue && options.indexOf(currentValue) === -1) {
      options = [currentValue].concat(options);
    }

    select.innerHTML = options.map(function(opt) {
      const selected = opt === currentValue ? ' selected' : '';
      return `<option value="${opt}"${selected}>${opt}</option>`;
    }).join("");

    if (currentValue && options.indexOf(currentValue) === -1) {
      select.value = options[0] || "";
    }

    syncStatusRulesByContext(dx);
  }

  function updateFormStepperState(activeId) {
    let normalized = normalizeWorkflowStepId(activeId);
    if (normalized !== "section-pelapor" && !canAccessDeferredWorkflowStages()) {
      normalized = "section-pelapor";
    }
    document.querySelectorAll(".pd3i-stepper-item[data-step-target]").forEach(function(item) {
      const target = normalizeWorkflowStepId(String(item.getAttribute("data-step-target") || "").trim());
      if (!target) return;
      if (target === normalized) item.classList.add("is-active");
      else item.classList.remove("is-active");
    });
    applyWorkflowStageLayout(normalized);
    updateWorkflowProgressUI(normalized);
  }

    const normalized = normalizeUiRole(role);

      admin: "Admin",
      petugas: "Petugas",
      surveilans: "Petugas",
      editor: "Petugas",
      koordinator: "Koordinator",
      viewer: "Viewer",
      readonly: "Viewer",
      read_only: "Viewer",
      "read-only": "Viewer",
      inputer: "Inputer",
      entry: "Inputer",
      registrasi: "Inputer",
      operator_input: "Inputer",
      "operator-input": "Inputer",
      verifikator: "Verifikator",
      verifier: "Verifikator",
      epid: "Verifikator",
      validator_epid: "Verifikator",
      "validator-epid": "Verifikator",
      lab: "Petugas Lab",
      laboratorium: "Petugas Lab",
      analislab: "Petugas Lab",
      analis_lab: "Petugas Lab",
      "analis-lab": "Petugas Lab",

    };
    return labelMap[normalized] || (role ? String(role) : "Tidak diketahui");
  }

  function getScopedWorkflowWriteStagesForRole(role) {
    const normalized = normalizeUiRole(role);
    const allStages = getAllWorkflowStageIds();

    if (normalized === "admin") return allStages.slice();
    if (["petugas", "surveilans", "editor", "koordinator"].includes(normalized)) return ["section-pelapor", "section-sampel", "section-status"];
    if (["viewer", "readonly", "read_only", "read-only"].includes(normalized)) return [];
    if (["inputer", "entry", "registrasi", "operator_input", "operator-input"].includes(normalized)) return ["section-pelapor"];
    if (["verifikator", "verifier", "epid", "validator_epid", "validator-epid"].includes(normalized)) return [];
    if (["lab", "laboratorium", "analislab", "analis_lab", "analis-lab"].includes(normalized)) return ["section-sampel"];
    if (["status", "updater_status", "updater-status", "followup", "follow_up", "follow-up", "tindaklanjut", "tindak_lanjut", "tindak-lanjut"].includes(normalized)) return ["section-status"];
    if (normalized) return ["section-pelapor", "section-status"];
    return [];
  }

  function normalizeUiKelurahanKey(value) {
    return String(value || "")
      .trim()
      .toUpperCase()
      .replace(/\s+/g, " ");
  }

  function getCurrentLoadedRecordMeta() {
    return (typeof window !== 'undefined' && window.__PD3I_ACTIVE_RECORD_META) ? window.__PD3I_ACTIVE_RECORD_META : null;
  }

  function getCurrentRecordPengampuPuskesmasMeta() {
    const record = getCurrentLoadedRecordMeta() || {};
    return {
      namaPuskesmas: normalizeUiKelurahanKey(record["Puskesmas Pengampu"] || record["NamaPuskesmas"] || ""),
      kodePuskesmas: normalizeUiKelurahanKey(record["KodePuskesmas Pengampu"] || record["KodePuskesmas"] || ""),
      kabKota: normalizeUiKelurahanKey(record["Kab/Kota Pasien"] || record["Kab/Kota"] || ""),
      kecamatan: normalizeUiKelurahanKey(record["Kecamatan"] || ""),
      kelurahan: normalizeUiKelurahanKey(record["Kelurahan"] || record["Kelurahan domisili"] || "")
    };
  }

  function canUserWriteSampleStageByScope(user) {
    const role = normalizeUiRole(user && user.role);
    if (role === "admin") return true;
    const recordScope = getCurrentRecordPengampuPuskesmasMeta();
    const userKode = normalizeUiKelurahanKey(user && user.kodePuskesmas);
    const userUnit = normalizeUiKelurahanKey(user && user.unitKerja);
    const userScopeLevel = String((user && user.scopeLevel) || "").trim().toLowerCase();
    if (userScopeLevel === "dinkes") return true;
    if (!recordScope.namaPuskesmas && !recordScope.kodePuskesmas) {
      return true;
    }
    if (userKode && recordScope.kodePuskesmas && userKode === recordScope.kodePuskesmas) return true;
    if (userUnit && recordScope.namaPuskesmas && userUnit === recordScope.namaPuskesmas) return true;
    return false;
  }

  function getRoleCapabilities(user) {
    const role = normalizeUiRole(user && user.role);
    const allStages = getAllWorkflowStageIds();
    const writeStages = getScopedWorkflowWriteStagesForRole(role);
    const canView = !!role && !["", "unknown"].includes(role) ? true : false;
    const canWrite = writeStages.length > 0;
    const canAdmin = role === "admin";
    const stageLabelMap = {
      "section-pelapor": "Input awal",
      "section-verifikasi": "Verifikasi EPID",
      "section-sampel": "Hasil pemeriksaan",
      "section-status": "Update status"
    };
    const stageSummary = writeStages.map(function(id) { return stageLabelMap[id] || id; }).join(", ");

    if (role === "admin") {
      return { roleLabel: "Admin", canView: true, canWrite: true, canAdmin: true, viewStages: allStages, writeStages: writeStages, summary: "Admin • akses penuh (lihat, ubah, aksi admin, semua tahap kerja)" };
    }
    if (["viewer", "readonly", "read_only", "read-only"].includes(role)) {
      return { roleLabel: "Viewer", canView: true, canWrite: false, canAdmin: false, viewStages: allStages, writeStages: [], summary: "Viewer • hanya lihat data, tanpa ubah / aksi admin" };
    }
    if (["petugas", "surveilans", "editor", "koordinator"].includes(role)) {
      return { roleLabel: getRoleDisplayLabel(role), canView: true, canWrite: true, canAdmin: false, viewStages: allStages, writeStages: writeStages, summary: "Petugas • input awal + update status; hasil pemeriksaan dibatasi puskesmas pengampu domisili, verifikasi admin-only" };
    }
    if (writeStages.length === 1) {
      return { roleLabel: getRoleDisplayLabel(role), canView: true, canWrite: true, canAdmin: false, viewStages: allStages, writeStages: writeStages, summary: `${getRoleDisplayLabel(role)} • hanya bisa ubah tahap ${stageSummary}` };
    }
    if (role) {
      return { roleLabel: getRoleDisplayLabel(role), canView: true, canWrite: canWrite, canAdmin: false, viewStages: allStages, writeStages: writeStages, summary: canWrite ? `${getRoleDisplayLabel(role)} • akses operasional standar` : `${getRoleDisplayLabel(role)} • hanya lihat data` };
    }
    return { roleLabel: "Tidak diketahui", canView: false, canWrite: false, canAdmin: false, viewStages: [], writeStages: [], summary: "Belum ada sesi" };
  }

  function canWriteWorkflowStage(user, stageId) {
    const caps = getRoleCapabilities(user);
    const normalized = normalizeWorkflowStepId(stageId);
    const role = normalizeUiRole(user && user.role);

    if (!caps.canWrite || caps.writeStages.indexOf(normalized) === -1) return false;
    if (normalized === "section-verifikasi") return role === "admin";
    if (normalized === "section-sampel") return canUserWriteSampleStageByScope(user);
    return true;
  }

  function getPreferredWorkflowStageForUser() {
    const caps = getRoleCapabilities(SESSION_USER);
    const canAccessLater = canAccessDeferredWorkflowStages();
    if (caps.writeStages.length === 1) {
      const onlyStage = normalizeWorkflowStepId(caps.writeStages[0]);
      if (onlyStage === "section-pelapor" || canAccessLater) return onlyStage;
    }
    return "section-pelapor";
  }

  function isViewerSession() {
    return !getRoleCapabilities(SESSION_USER).canWrite && getRoleCapabilities(SESSION_USER).canView;
  }

  function setReadonlyFormMode(enabled) {
    const form = document.getElementById("dynamic-form");
    if (!form) return;
    form.classList.toggle("pd3i-readonly-lock", !!enabled);

    form.querySelectorAll("input, select, textarea").forEach(function(el) {
      if (!el) return;
      const isMetaControl = el.id === "form-selector";
      if (isMetaControl) return;
      if (enabled) {
        if (el.tagName === "SELECT") el.setAttribute("disabled", "disabled");
        else el.setAttribute("readonly", "readonly");
      } else {
        el.removeAttribute("readonly");
        el.removeAttribute("disabled");
      }
    });

    form.querySelectorAll("button").forEach(function(btn) {
      if (!btn) return;
      if (["btn-prev-step", "btn-next-step", "btn-close-success", "btn-new-entry"].includes(btn.id)) return;
      if (enabled) btn.setAttribute("disabled", "disabled");
      else btn.removeAttribute("disabled");
    });
  }

  function syncStatusHistoryTimeline() {
    const tbody = document.getElementById("tbody-Riwayat Status Kasus");
    if (!tbody) return;

    const status = getFieldValueSafe("Status Pasien/Kasus");
    const tanggal = getFieldValueSafe("Tanggal Update Status");
    const dasar = getFieldValueSafe("Dasar Penetapan Status");
    const catatan = getFieldValueSafe("Catatan Status Pasien");
    const petugas = getFieldValueSafe("Petugas Verifikator") || getFieldValueSafe("Nama Petugas");

    if (!status || !tanggal) return;

    const rows = Array.from(tbody.querySelectorAll("tr"));
    const exists = rows.some(function(row) {
      const t = row.querySelector('[data-name="Tanggal"]')?.value || "";
      const s = row.querySelector('[data-name="Status"]')?.value || "";
      return t === tanggal && s === status;
    });

    if (exists) return;

    addDynamicRow("Riwayat Status Kasus", {
      "Tanggal": tanggal,
      "Status": status,
      "Dasar": dasar,
      "Petugas": petugas,
      "Catatan": catatan
    });
  }

  function renderDiagnosisSections(cfg, container) {
    container.innerHTML = "";
    if (!cfg || !Array.isArray(cfg.sections)) return;

  function getShowIfParentValue(parentId) {
    const parent = document.getElementById(parentId);
    return String(parent ? parent.value : "").trim();
  }

  function matchesShowIf(parentValue, vals, parentId) {
    const actual = String(parentValue || "").trim();
    const targets = Array.isArray(vals) ? vals.map(v => String(v || "").trim()) : [];
    if (targets.includes(actual)) return true;

    if (parentId === "JK") {
      if ((actual === "Perempuan" || actual === "P") && targets.some(v => v === "Perempuan" || v === "P")) return true;
      if ((actual === "Laki-laki" || actual === "L" || actual === "Laki-Laki") && targets.some(v => v === "Laki-laki" || v === "L" || v === "Laki-Laki")) return true;
    }

    return targets.map(v => v.toLowerCase()).includes(actual.toLowerCase());
  }

  function reevaluateShowIfFields() {
      const wrappers = document.querySelectorAll(".field-wrapper[data-parent]");
      wrappers.forEach(wrapper => {
        const parentId = wrapper.getAttribute("data-parent");
        const parent = document.getElementById(parentId);
        const parentValue = getShowIfParentValue(parentId);
        const vals = JSON.parse(wrapper.getAttribute("data-parent-vals") || "[]");
        const required = wrapper.getAttribute("data-required") === "true";
        const inp = wrapper.querySelector("input, select, textarea");

        let shouldShow = !!parent && matchesShowIf(parentValue, vals, parentId);

        if (!shouldShow && parentId === "JK") {
          const jkNorm = String(parentValue || "").trim().toLowerCase();
          const wantsPerempuan = vals.some(v => String(v || "").trim().toLowerCase() === "perempuan");
          if (wantsPerempuan && (jkNorm === "perempuan" || jkNorm === "p")) {
            shouldShow = true;
          }
        }

        if (shouldShow) {
          wrapper.classList.remove("hidden");
          if (required && inp) inp.required = true;

          if (parentId === "Apakah dirawat inap?" && parentValue === "Ya" && wrapper.querySelector("#Nama Rumah Sakit")) {
            setTimeout(() => {
              const currentRs = document.getElementById("Nama Rumah Sakit")?.value || "";
              initChoicesRumahSakit(currentRs);
            }, 50);
          }
        } else {
          wrapper.classList.add("hidden");
          if (inp) {
            inp.required = false;
            if (inp.tagName === "SELECT") inp.selectedIndex = 0;
            else inp.value = "";
          }
        }
      });
  }

  function buildClientPrintUrl(dx, epid, token) {
    try {
      const safeDx = String(dx || "").trim().toUpperCase();
      const safeEpid = String(epid || "").trim();
      const safeToken = String(token || "").trim();
      if (!safeDx || !safeEpid || !safeToken) return "";

      const url = new URL(window.location.href);
      url.search = "";
      url.hash = "";
      url.searchParams.set("action", "print");
      url.searchParams.set("dx", safeDx);
      url.searchParams.set("epid", safeEpid);
      url.searchParams.set("token", safeToken);
      return url.toString();
    } catch (e) {
      return "";
    }
  }

  function showSuccessModal(message, printUrl, fallbackMeta) {
    const modal = document.getElementById("success-modal");
    const msg = document.getElementById("success-modal-message");
    const btnPrint = document.getElementById("btn-print-pdf");
    const btnNew = document.getElementById("btn-new-entry");
    const btnClose = document.getElementById("btn-close-success");

    if (msg) msg.textContent = message || "Data berhasil disimpan.";

    if (btnPrint) {
      let safeUrl = String(printUrl || "").trim();
      const resolvedDx = String((fallbackMeta && fallbackMeta.dx) || document.getElementById("form-selector")?.value || "").trim();
      const resolvedEpid = String((fallbackMeta && fallbackMeta.epid) || document.getElementById("Nomor EPID")?.value || "").trim();
      const resolvedToken = String((fallbackMeta && fallbackMeta.token) || SESSION_TOKEN || "").trim();
      if (!safeUrl) {
        safeUrl = buildClientPrintUrl(resolvedDx, resolvedEpid, resolvedToken);
      }
      btnPrint.href = safeUrl || "javascript:void(0)";
      btnPrint.target = "_blank";
      btnPrint.rel = "noopener noreferrer";

      if (!safeUrl) {
        btnPrint.classList.add("opacity-60", "pointer-events-none");
        btnPrint.setAttribute("aria-disabled", "true");
      } else {
        btnPrint.classList.remove("opacity-60", "pointer-events-none");
        btnPrint.removeAttribute("aria-disabled");
      }

      if (!btnPrint.dataset.bound) {
        btnPrint.dataset.bound = "1";
        btnPrint.addEventListener("click", function(ev) {
          const href = String(btnPrint.getAttribute("href") || "").trim();
          if (!href || href === "javascript:void(0)") {
            ev.preventDefault();
          }
        });
      }
    }

    if (btnNew && !btnNew.dataset.bound) {
      btnNew.dataset.bound = "1";
      btnNew.addEventListener("click", function(ev) {
        ev.preventDefault();
        resetForNewEntry();
      });
    }

    if (btnClose && !btnClose.dataset.bound) {
      btnClose.dataset.bound = "1";
      btnClose.addEventListener("click", function(ev) {
        ev.preventDefault();
        closeModal(modal);
      });
    }

    openModal(modal);
  }

  async function postJsonToWebApp(url, payload) {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
      redirect: "follow"
    });

    const raw = await res.text();
    try {
      return JSON.parse(raw);
    } catch (e) {
      console.error("Raw response (not JSON):", raw);
      throw new Error("Server tidak mengembalikan JSON dari /exec.");
    }
  }

  function saveFormViaGsRun(payload) {
    return new Promise((resolve, reject) => {
      if (!safeGsRun()) {
        reject(new Error("google.script.run tidak tersedia"));
        return;
      }

      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .saveFormData(payload);
    });
  }

    return new Promise((resolve, reject) => {

        return;

      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .resolveLatestSavedMeta(payload);
    });
  }

      window._loadRecordFromSearch_ = function(epid, dx) {

        btnSubmit.disabled = true;

              showTopAlert("Data tidak ditemukan.", false);
              btnSubmit.disabled = false;
              btnSubmit.innerHTML = `<i class="fas fa-save"></i> Simpan Data ke Database`;
              return;
            }

            isEditMode = !isViewer;
            if (editBadge) {
              if (isViewer) editBadge.classList.add("hidden");
              else editBadge.classList.remove("hidden");
            }
            if (btnCancelEdit) {
              if (isViewer) btnCancelEdit.classList.add("hidden");
              else btnCancelEdit.classList.remove("hidden");
            }
            if (isViewer) {
              btnSubmit.innerHTML = `<i class="fas fa-eye"></i> Mode Viewer (Read Only)`;
              btnSubmit.classList.remove("bg-yellow-600", "bg-blue-600");
              btnSubmit.classList.add("opacity-60", "cursor-not-allowed");
              btnSubmit.disabled = true;
            } else {
              btnSubmit.innerHTML = `<i class="fas fa-pen-to-square"></i> Perbarui Data EPID ${epid}`;
              btnSubmit.classList.remove("bg-blue-600", "opacity-60", "cursor-not-allowed");
              btnSubmit.classList.add("bg-yellow-600");
              btnSubmit.disabled = false;
            }

            hydrateRecordToForm(record);
            applyAllShowIf();

            if (record["Sumber Laporan"]) {
              initChoices(record["Sumber Laporan"], record["Nama unit pelapor"] || "");
            }
            if (record["Apakah dirawat inap?"] === "Ya") {
              setTimeout(() => { initChoicesRumahSakit(record["Nama Rumah Sakit"] || ""); }, 150);
            }

            const birthValidation = validateAndApplyBirthUI({ silent: true, hard: false });
            applyBirthValidationUI(birthValidation);

            if (typeof window !== 'undefined') {
              window.__PD3I_ACTIVE_RECORD_META = Object.assign({}, record || {});
            }
            await loadRefImunisasi();
            buildRiwayatImunisasiRows();
            forceBuildImunisasiWhenReady();
            hydrateDynamicTables(record);
            syncCaseStatusOptionsByDx(dx);
            const requestedStage = WORKFLOW_SEARCH_INTENT || document.querySelector(".pd3i-stepper-item.is-active")?.getAttribute("data-step-target") || getPreferredWorkflowStageForUser();
            const preferredStage = canWriteWorkflowStage(SESSION_USER, requestedStage) || isViewerSession()
              ? requestedStage
              : getPreferredWorkflowStageForUser();
            setWorkflowSearchIntent(preferredStage, { focusSearch: false, focusForm: false, skipStageSync: true });
            updateFormStepperState(preferredStage);
            updateUiShellSummary();

            showTopAlert(`Data berhasil dimuat. ${getWorkflowSearchOpenSuccessMessage(preferredStage)}`, true);
            window.scrollTo({ top: formElement.offsetTop - 20, behavior: "smooth" });
          })
          .withFailureHandler(function(err) {

            showTopAlert("Gagal memuat data.", false);
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = `<i class="fas fa-save"></i> Simpan Data ke Database`;

      formElement.addEventListener("submit", async function(e) {
        e.preventDefault();

        if (isViewer) {
          showTopAlert("Role viewer hanya bisa melihat data dan mencetak, tidak bisa menyimpan perubahan.", false);
          return;
        }

        const activeStageOnSubmit = document.querySelector(".pd3i-stepper-item.is-active")?.getAttribute("data-step-target") || "section-pelapor";
        if (normalizeWorkflowStepId(activeStageOnSubmit) !== "section-pelapor" && !canAccessDeferredWorkflowStages()) {
          showTopAlert("Tahap lanjutan hanya bisa disimpan setelah input awal tersimpan / record existing dibuka.", false);
          resetSubmitButtonForCurrentStage();
          return;
        }

        const requiredCheck = validateRequiredVisibleFields(formElement);
        if (!requiredCheck.ok) {
          showTopAlert(requiredCheck.message || "Masih ada field wajib yang belum lengkap.", false);
          btnSubmit.disabled = false;
          resetSubmitButtonForCurrentStage();
          return;
        }

        const numericCheck = (typeof validateNumericOnlyRequiredFields === "function")
          ? validateNumericOnlyRequiredFields()
          : { ok: true, invalids: [] };

        if (!numericCheck.ok) {
          showTopAlert(
            "Field berikut hanya boleh angka: " + numericCheck.invalids.join(", "),
            false
          );
          btnSubmit.disabled = false;
          resetSubmitButtonForCurrentStage();
          return;
        }

        const birthValidation = validateAndApplyBirthUI({ silent: false, hard: true });

        if (!birthValidation || !birthValidation.ok) {
          btnSubmit.disabled = false;
          resetSubmitButtonForCurrentStage();
          return;
        }

        const dxRuleCheck = validateDxBusinessRules();
        if (!dxRuleCheck.ok) {
          showTopAlert(dxRuleCheck.errors.join(" "), false);
          btnSubmit.disabled = false;
          resetSubmitButtonForCurrentStage();
          return;
        }

        const warnings = checkConsistencyWarnings().concat(dxRuleCheck.warnings || []);
        if (warnings.length > 0) {
          showTopAlert(warnings.join(" "), false);
        }

        updateImunisasiSummary();
        syncStatusHistoryTimeline();

        btnSubmit.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>Menyimpan...`;
        btnSubmit.disabled = true;

        const formData = new FormData(this);
        const dataObj = { dx: selector.value, __token: SESSION_TOKEN, __workflowStage: normalizeWorkflowStepId(activeStageOnSubmit) };
        formData.forEach((v, k) => { dataObj[k] = v; });

        if (!dataObj["Nama unit pelapor"]) {
          showTopAlert("Nama Unit Pelapor wajib dipilih.", false);
          btnSubmit.disabled = false;
          resetSubmitButtonForCurrentStage();
          return;
        }

        const unitSelect = document.getElementById("Nama unit pelapor");
        dataObj["FaskesKey"] =
          unitSelect?.options[unitSelect.selectedIndex]?.getAttribute("data-key")
          || (dataObj["Nama unit pelapor"] || "").toUpperCase().replace(/[^A-Z0-9]/g, "");

        const rsSelect = document.getElementById("Nama Rumah Sakit");
        if (rsSelect) {
          dataObj["Nama Rumah Sakit"] = dataObj["Nama Rumah Sakit"] || rsSelect.value || "";
          if (dataObj["Nama Rumah Sakit"]) {
            dataObj["RumahSakitKey"] =
              rsSelect?.options[rsSelect.selectedIndex]?.getAttribute("data-key")
              || (dataObj["Nama Rumah Sakit"] || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
          }
        }

        document.querySelectorAll("table[data-dynamic-table]").forEach(table => {
          const tableId = table.getAttribute("data-dynamic-table");
          const tableData = [];

          table.querySelectorAll("tbody tr").forEach(row => {
            const rowObj = {};
            row.querySelectorAll("input, select").forEach(i => {
              rowObj[i.getAttribute("data-name")] = i.value;
            });

            if (tableId === "Riwayat Imunisasi") {
              rowObj["KodeImunisasi"] = row.dataset.kodeImun || "";
              if (rowObj["Jenis Imunisasi"]) tableData.push(rowObj);
            } else if (tableId === "Riwayat Status Kasus") {
              if (rowObj["Tanggal"] || rowObj["Status"]) tableData.push(rowObj);
            } else {
              if (rowObj["Nama"]) tableData.push(rowObj);
            }
          });

          dataObj[tableId] = tableData.length > 0 ? JSON.stringify(tableData) : "";
        });

        try {
          let res = null;

          try {
            res = await postJsonToWebApp(GOOGLE_SCRIPT_URL, dataObj);
          } catch (webErr) {
            console.warn("POST /exec gagal, fallback ke google.script.run.saveFormData:", webErr);
            res = await saveFormViaGsRun(dataObj);
          }

          if (res && res.status === "success") {
            showTopAlert(res.message || "Data berhasil disimpan.", true);

            let epidSaved = String((res && res.epid) || dataObj["Nomor EPID"] || "").trim();
            let dxSaved = String((res && res.dx) || dataObj.dx || "").trim();
            let printUrl = String((res && res.printUrl) || "").trim();

            if ((!epidSaved || !printUrl) && safeGsRun()) {
              try {
                const metaRes = await resolveLatestSavedMetaViaGsRun(dataObj);
                if (metaRes && metaRes.status === "success") {
                  epidSaved = String(metaRes.epid || epidSaved || "").trim();
                  dxSaved = String(metaRes.dx || dxSaved || "").trim();
                  printUrl = String(metaRes.printUrl || printUrl || "").trim();
                }
              } catch (metaErr) {
                console.warn("resolveLatestSavedMetaViaGsRun gagal:", metaErr);
              }
            }

            if (epidSaved && !dataObj["Nomor EPID"]) {
              dataObj["Nomor EPID"] = epidSaved;
              const epidInput = document.getElementById("Nomor EPID");
              if (epidInput) epidInput.value = epidSaved;
            }

            console.log("Save response:", res);
            console.log("Resolved print params:", { epidSaved, dxSaved, printUrl });

            clearFormDraft();
            if (epidSaved) {
              isEditMode = true;
              updateFormStepperState(document.querySelector(".pd3i-stepper-item.is-active")?.getAttribute("data-step-target") || "section-pelapor");
            }
            updateUiShellSummary();

            showSuccessModal(
              res.message || "Data berhasil disimpan.",
              printUrl,
              { dx: dxSaved, epid: epidSaved, token: SESSION_TOKEN }
            );
          } else {
            showTopAlert("Error: " + (res?.message || "Gagal menyimpan data."), false);
            btnSubmit.disabled = false;
            resetSubmitButtonForCurrentStage();
          }
        } catch (err) {
          console.error("submit failed:", err);
          showTopAlert("Gagal submit. Pastikan URL Web App /exec benar dan deployment terbaru sudah aktif.", false);
          btnSubmit.disabled = false;
          resetSubmitButtonForCurrentStage();
        }
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initAppModule);
    } else {
      initAppModule();
    }
  })();
</script>
