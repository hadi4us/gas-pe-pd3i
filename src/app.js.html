  function isCompleteDateValue(value) {
    const s = String(value || "").trim();
    return /^\d{4}-\d{2}-\d{2}$/.test(s);
  }

  function applyBirthValidationUI(res) {
    const umurEl = document.getElementById("Umur (auto)");
    const epiEl = document.getElementById("Kelompok Umur Epidemiologis");

    if (!res || !res.ok) {
      if (umurEl) umurEl.value = "";
      if (epiEl) epiEl.value = "";
      return false;
    }

    if (umurEl) umurEl.value = res.ageText || "";
    if (epiEl) epiEl.value = res.epiGroup || "";
    return true;
  }

  function validateAndApplyBirthUI(options) {
    const opts = options || {};
    const silent = opts.silent === true;
    const hard = opts.hard === true;

    const dobEl = document.getElementById("Tanggal Lahir");
    const refEl = document.getElementById("Tanggal Pelacakan");
    const umurEl = document.getElementById("Umur (auto)");
    const epiEl = document.getElementById("Kelompok Umur Epidemiologis");

    const dobValue = dobEl?.value || "";
    const refValue = refEl?.value || "";

    if (!isCompleteDateValue(dobValue)) {
      if (umurEl) umurEl.value = "";
      if (epiEl) epiEl.value = "";
      syncSchoolActivityOptionsByAge(null);
      return { ok: false, pending: true };
    }

    const safeRefValue = isCompleteDateValue(refValue) ? refValue : "";
    const res = validateBirthDateEpi(dobValue, safeRefValue);

    if (!res.ok) {
      if (umurEl) umurEl.value = "";
      if (epiEl) epiEl.value = "";
      syncSchoolActivityOptionsByAge(null);

      if (!silent && hard) {
        showTopAlert(res.message, false);
      }
      return res;
    }

    if (umurEl) umurEl.value = res.ageText || "";
    if (epiEl) epiEl.value = res.epiGroup || "";
    syncSchoolActivityOptionsByAge(res);

    return res;
  }

  const NUMERIC_ONLY_EXACT_IDS = [
    "NIK",
    "NIK Pasien",
    "RT",
    "RW",
    "No Whatsapp Petugas",
    "No. kontak orang tua/wali",
    "No Telp/WA Orang Tua/Wali",
    "No Telp Orang Tua/Wali",
    "No. Telp Orang Tua/Wali",
    "No. Kontak Pasien",
    "No. Telepon Wali",
    "No. Telp Dokter AFP"
  ];

  const NUMERIC_ONLY_KEYWORDS = [
    "nik",
    "whatsapp",
    "no whatsapp",
    "no. whatsapp",
    "no telp",
    "no. telp",
    "kontak",
    "rt",
    "rw"
  ];

  function _normalizeFieldId_(value) {
    return String(value || "").trim().toLowerCase();
  }

  function isNumericOnlyFieldId(fieldId) {
    const id = _normalizeFieldId_(fieldId);
    if (!id) return false;

    if (NUMERIC_ONLY_EXACT_IDS.some(x => _normalizeFieldId_(x) === id)) return true;
    if (id === "rt" || id === "rw") return true;

    return NUMERIC_ONLY_KEYWORDS.some(k => id.includes(k));
  }

  const NUMERIC_LENGTH_RULES = {
    "nik": { exact: 16 },
    "nik pasien": { exact: 16 },
    "rt": { min: 1, max: 3, pad3: true },
    "rw": { min: 1, max: 3, pad3: true },
    "no whatsapp petugas": { min: 10, max: 15, phone: true },
    "no. kontak orang tua/wali": { min: 10, max: 15, phone: true },
    "no telp/wa orang tua/wali": { min: 10, max: 15, phone: true },
    "no telp orang tua/wali": { min: 10, max: 15, phone: true },
    "no. telp orang tua/wali": { min: 10, max: 15, phone: true },
    "no. kontak pasien": { min: 10, max: 15, phone: true },
    "no. telepon wali": { min: 10, max: 15, phone: true },
    "no. telp dokter afp": { min: 10, max: 15, phone: true }
  };

  function _sanitizeNumericValue_(value) {
    return String(value || "").replace(/\D+/g, "");
  }

  function _getNumericLengthRule_(fieldId) {
    const id = _normalizeFieldId_(fieldId);
    return NUMERIC_LENGTH_RULES[id] || null;
  }

  function _normalizePhonePrefix_(digits) {
    const v = String(digits || "");
    if (!v) return v;
    if (v.startsWith("62")) return v;
    if (v.startsWith("0")) return "62" + v.slice(1);
    return v;
  }

  function enforceNumericOnlyInput(el, options) {
    if (!el || !el.id || !isNumericOnlyFieldId(el.id)) return;
    const opts = options || {};
    const onBlur = opts.onBlur === true;

    const rule = _getNumericLengthRule_(el.id);
    let cleaned = _sanitizeNumericValue_(el.value);

    if (rule && rule.phone && onBlur) {
      cleaned = _normalizePhonePrefix_(cleaned);
    }

    if (rule && rule.exact) {
      cleaned = cleaned.slice(0, Number(rule.exact));
    } else if (rule && rule.max) {
      cleaned = cleaned.slice(0, Number(rule.max));
    }

    if (rule && rule.pad3 && onBlur && cleaned) {
      cleaned = cleaned.padStart(3, "0");
    }

    if (String(el.value || "") !== cleaned) {
      el.value = cleaned;
    }
  }

  function validateNumericOnlyRequiredFields() {
    const invalids = [];
    const form = document.getElementById("dynamic-form");
    if (!form) return { ok: true, invalids: [] };

    form.querySelectorAll("input[name], textarea[name]").forEach(function(el) {
      if (!el || el.disabled || !el.id) return;
      if (!isNumericOnlyFieldId(el.id)) return;

      const raw = String(el.value || "").trim();
      if (!raw) return;
      if (!/^\d+$/.test(raw)) {
        invalids.push(el.id + " (harus angka)");
        return;
      }

      const rule = _getNumericLengthRule_(el.id);
      if (!rule) return;

      const len = raw.length;
      if (rule.exact && len !== Number(rule.exact)) {
        invalids.push(el.id + " (harus " + rule.exact + " digit)");
        return;
      }

      if (rule.phone && !(raw.startsWith("08") || raw.startsWith("62"))) {
        invalids.push(el.id + " (harus diawali 08 atau 62)");
        return;
      }

      const min = Number(rule.min || 0);
      const max = Number(rule.max || 0);
      if (min && len < min) {
        invalids.push(el.id + " (minimal " + min + " digit)");
        return;
      }
      if (max && len > max) {
        invalids.push(el.id + " (maksimal " + max + " digit)");
      }
    });

    return { ok: invalids.length === 0, invalids: invalids };
  }

  function getAllowedSchoolActivityOptions(validationRes) {
    const baseOptions = ["Belum sekolah", "Sekolah", "Kuliah", "Bekerja", "Tidak sekolah/tidak bekerja"];
    if (!validationRes || !validationRes.ok || !validationRes.age) return baseOptions.slice();

    const age = validationRes.age || {};
    const totalMonths = Number(age.totalMonths || 0);
    if (totalMonths < 60) {
      return ["Belum sekolah"];
    }

    return baseOptions.slice();
  }

  function syncSchoolActivityOptionsByAge(validationRes) {
    const statusEl = document.getElementById("Apakah sekolah/bekerja?");
    if (!statusEl) return;

    const allowed = getAllowedSchoolActivityOptions(validationRes);
    const currentValue = String(statusEl.value || "").trim();
    const fallbackValue = allowed[0] || "";
    const nextValue = allowed.includes(currentValue) ? currentValue : fallbackValue;

    statusEl.innerHTML = allowed.map(function(opt) {
      const selected = opt === nextValue ? ' selected' : '';
      return `<option value="${opt}"${selected}>${opt}</option>`;
    }).join("");
    statusEl.value = nextValue;

    if (!allowed.includes(currentValue)) {
      const kelasEl = document.getElementById("Kelas Saat Ini");
      const namaSekolahEl = document.getElementById("Nama sekolah/tempat bekerja");
      if (kelasEl) kelasEl.value = "";
      if (namaSekolahEl) namaSekolahEl.value = "";
      if (typeof reevaluateShowIfFields === "function") {
        reevaluateShowIfFields();
      }
    }
  }

  function checkConsistencyWarnings() {
    const warnings = [];

    const dobValue = document.getElementById("Tanggal Lahir")?.value || "";
    const refValue = document.getElementById("Tanggal Pelacakan")?.value || "";
    const statusSekolah = String(document.getElementById("Apakah sekolah/bekerja?")?.value || "").trim();
    const kelasSaatIni = String(document.getElementById("Kelas Saat Ini")?.value || "").trim();
    const dx = String(document.getElementById("form-selector")?.value || "").toUpperCase();

    if (!isCompleteDateValue(dobValue)) return warnings;

    const val = validateBirthDateEpi(dobValue, isCompleteDateValue(refValue) ? refValue : "");
    if (!val.ok) return warnings;

    const age = val.age || {};
    const years = Number(age.years || 0);
    const totalDays = Number(age.totalDays || 0);
    const allowedSchoolOptions = getAllowedSchoolActivityOptions(val);

    if (statusSekolah && allowedSchoolOptions.indexOf(statusSekolah) === -1) {
      warnings.push(`Status sekolah/kegiatan '${statusSekolah}' tidak sesuai dengan umur pasien (${val.ageText}).`);
    }

    const k = normalizeClassValue(kelasSaatIni);
    if (k !== null) {
      const est = estimateSchoolAgeFromClass(kelasSaatIni);
      if (est) {
        if (years < est.minYears - 1 || years > est.maxYears + 2) {
          warnings.push(`Kelas saat ini (${kelasSaatIni}) tampak kurang konsisten dengan umur pasien (${val.ageText}).`);
        }
      }
    }

    if (dx === "TN" && totalDays > 28) {
      warnings.push("Diagnosis TN dipilih, tetapi umur pasien bukan neonatus (lebih dari 28 hari).");
    }

    return warnings;
  }

  function getFieldValueSafe(fieldId) {
    return String(document.getElementById(fieldId)?.value || "").trim();
  }

  function isNonEmptyField(fieldId) {
    return getFieldValueSafe(fieldId) !== "";
  }

  function parseDateInputValue(value) {
    if (!isCompleteDateValue(value)) return null;
    const d = new Date(value + "T00:00:00");
    return isNaN(d.getTime()) ? null : d;
  }

  function compareDateInputValues(a, b) {
    const da = parseDateInputValue(a);
    const db = parseDateInputValue(b);
    if (!da || !db) return null;
    const ta = da.getTime();
    const tb = db.getTime();
    if (ta === tb) return 0;
    return ta > tb ? 1 : -1;
  }

  function validateRequiredVisibleFields(form) {
    if (!form) return { ok: true };

    const invalidEls = Array.from(form.querySelectorAll("input, select, textarea"))
      .filter(function(el) {
        if (!el || el.disabled) return false;
        if (el.type === "hidden") return false;
        const wrapper = el.closest(".field-wrapper");
        if (wrapper && wrapper.classList.contains("hidden")) return false;
        const hiddenStage = el.closest(".pd3i-stage-hidden");
        if (hiddenStage) return false;
        return typeof el.checkValidity === "function" && !el.checkValidity();
      });

    if (!invalidEls.length) return { ok: true };

    const first = invalidEls[0];
    try {
      first.focus();
      if (typeof first.reportValidity === "function") first.reportValidity();
    } catch (e) {}

    return {
      ok: false,
      message: "Masih ada field wajib yang belum lengkap atau formatnya belum valid."
    };
  }

  function validateDxBusinessRules() {
    const dx = String(document.getElementById("form-selector")?.value || "").trim().toUpperCase();
    const errors = [];
    const warnings = [];

    const tglLapor = getFieldValueSafe("Tanggal terima laporan");
    const tglLacak = getFieldValueSafe("Tanggal Pelacakan");
    const tglLahir = getFieldValueSafe("Tanggal Lahir");

    if (tglLapor && tglLacak && compareDateInputValues(tglLapor, tglLacak) === 1) {
      errors.push("Tanggal terima laporan tidak boleh lebih akhir dari tanggal pelacakan.");
    }

    if (tglLahir && tglLacak && compareDateInputValues(tglLahir, tglLacak) === 1) {
      errors.push("Tanggal lahir tidak boleh lebih akhir dari tanggal pelacakan.");
    }

    const statusVerifikasi = getFieldValueSafe("Status Verifikasi EPID");
    const activeStage = normalizeWorkflowStepId(document.querySelector('.pd3i-stepper-item.is-active')?.getAttribute('data-step-target') || 'section-pelapor');
    if (activeStage === 'section-pelapor' && !statusVerifikasi) {
      warnings.push("Status verifikasi EPID akan disimpan sebagai Pending sampai direview admin.");
    }
    if (activeStage === 'section-verifikasi' && statusVerifikasi === 'Pending') {
      errors.push("Pada tahap verifikasi admin harus memilih status Terverifikasi atau Perlu Revisi.");
    }
    if (statusVerifikasi === "Terverifikasi") {
      if (!isNonEmptyField("Tanggal Verifikasi EPID")) {
        errors.push("Tanggal verifikasi EPID wajib diisi jika status verifikasi sudah terverifikasi.");
      }
      if (!isNonEmptyField("Petugas Verifikator")) {
        errors.push("Petugas verifikator wajib diisi jika status verifikasi sudah terverifikasi.");
      }
    }
    if (statusVerifikasi === 'Perlu Revisi' && !isNonEmptyField('Catatan Verifikasi EPID')) {
      errors.push('Catatan verifikasi wajib diisi jika admin memilih Perlu Revisi.');
    }

    if (getFieldValueSafe("Pemeriksaan Sampel Dilakukan") === "Ya") {
      if (!isNonEmptyField("Tanggal Hasil Sampel")) {
        warnings.push("Tanggal hasil sampel belum diisi walau pemeriksaan sampel ditandai dilakukan.");
      }
      if (!isNonEmptyField("Interpretasi Hasil Sampel")) {
        warnings.push("Interpretasi hasil sampel belum diisi.");
      }
    }

    const statusKasusGlobal = getFieldValueSafe("Status Pasien/Kasus");
    if ((statusKasusGlobal === "Konfirmasi" || statusKasusGlobal === "Discarded" || statusKasusGlobal === "Klinis") && !isNonEmptyField("Dasar Penetapan Status")) {
      errors.push("Dasar penetapan status wajib diisi untuk status kasus klinis/discarded/konfirmasi.");
    }

    const latestStatus = getLatestStatusFromTimeline();
    if (latestStatus && statusKasusGlobal && latestStatus !== statusKasusGlobal && typeof getAllowedStatusTransitions === "function") {
      const allowedNext = getAllowedStatusTransitions(dx, latestStatus) || [];
      if (allowedNext.indexOf(statusKasusGlobal) === -1) {
        errors.push(`Transisi status dari '${latestStatus}' ke '${statusKasusGlobal}' tidak sesuai alur yang diizinkan.`);
      }
    }

    const dobForSchool = document.getElementById("Tanggal Lahir")?.value || "";
    const refForSchool = document.getElementById("Tanggal Pelacakan")?.value || "";
    const schoolStatus = getFieldValueSafe("Apakah sekolah/bekerja?");
    const schoolBirthVal = validateBirthDateEpi(dobForSchool, isCompleteDateValue(refForSchool) ? refForSchool : "");
    if (schoolBirthVal && schoolBirthVal.ok) {
      const allowedSchoolOptions = getAllowedSchoolActivityOptions(schoolBirthVal);
      if (schoolStatus && allowedSchoolOptions.indexOf(schoolStatus) === -1) {
        errors.push(`Status sekolah/kegiatan '${schoolStatus}' tidak sesuai dengan umur pasien (${schoolBirthVal.ageText}).`);
      }
    }

    if (dx === "MR") {
      const tglPergi = getFieldValueSafe("Tanggal pergi");
      const tglKembali = getFieldValueSafe("Tanggal pulang perjalanan");
      const darahAmbil = getFieldValueSafe("Tanggal ambil spesimen darah");
      const darahKirim = getFieldValueSafe("Tanggal pengiriman spesimen darah ke lab");
      const lainAmbil = getFieldValueSafe("Tanggal ambil spesimen lain");
      const lainKirim = getFieldValueSafe("Tanggal pengiriman spesimen lain ke lab");
      const statusAkhir = getFieldValueSafe("Status akhir kasus");

      if (tglPergi && tglKembali && compareDateInputValues(tglPergi, tglKembali) === 1) {
        errors.push("Tanggal kembali perjalanan MR tidak boleh lebih awal dari tanggal pergi.");
      }
      if (darahAmbil && darahKirim && compareDateInputValues(darahAmbil, darahKirim) === 1) {
        errors.push("Tanggal kirim spesimen darah MR tidak boleh lebih awal dari tanggal ambil.");
      }
      if (lainAmbil && lainKirim && compareDateInputValues(lainAmbil, lainKirim) === 1) {
        errors.push("Tanggal kirim spesimen lain MR tidak boleh lebih awal dari tanggal ambil.");
      }
      if (statusAkhir === "Meninggal" && !isNonEmptyField("Penyebab kematian")) {
        errors.push("Penyebab kematian wajib diisi jika status akhir MR adalah meninggal.");
      }
    }

    if (dx === "DIF") {
      const antibiotik = getFieldValueSafe("Antibiotik diberikan?");
      const ads = getFieldValueSafe("ADS diberikan?");
      const kondisi = getFieldValueSafe("Kondisi kasus saat ini");

      if (antibiotik === "Ya" && !isNonEmptyField("Jenis antibiotik")) {
        errors.push("Jenis antibiotik wajib diisi pada kasus difteri jika antibiotik diberikan.");
      }
      if (ads === "Ya" && !isNonEmptyField("Dosis ADS (IU)")) {
        errors.push("Dosis ADS wajib diisi pada kasus difteri jika ADS diberikan.");
      }
      if (kondisi === "Meninggal" && !isNonEmptyField("Tanggal meninggal DIF")) {
        errors.push("Tanggal meninggal wajib diisi pada kasus difteri jika kondisi akhir meninggal.");
      }
    }

    if (dx === "PERT") {
      const masuk = getFieldValueSafe("Tanggal Masuk Rawat Inap");
      const keluar = getFieldValueSafe("Tanggal Keluar");
      const tglPergi = getFieldValueSafe("Tanggal pergi PERT");
      const tglKembali = getFieldValueSafe("Tanggal kembali PERT");
      const ambil2 = getFieldValueSafe("Tanggal ambil spesimen lain pertusis");
      const kirim2 = getFieldValueSafe("Tanggal kirim spesimen lain pertusis");
      const status = getFieldValueSafe("Status akhir PERT");

      if (masuk && keluar && compareDateInputValues(masuk, keluar) === 1) {
        errors.push("Tanggal keluar rawat inap pertusis tidak boleh lebih awal dari tanggal masuk.");
      }
      if (tglPergi && tglKembali && compareDateInputValues(tglPergi, tglKembali) === 1) {
        errors.push("Tanggal kembali perjalanan pertusis tidak boleh lebih awal dari tanggal pergi.");
      }
      if (ambil2 && kirim2 && compareDateInputValues(ambil2, kirim2) === 1) {
        errors.push("Tanggal kirim spesimen lain pertusis tidak boleh lebih awal dari tanggal ambil.");
      }
      if (status === "Meninggal" && !isNonEmptyField("Tanggal meninggal PERT")) {
        errors.push("Tanggal meninggal wajib diisi pada kasus pertusis jika status akhir meninggal.");
      }
    }

    if (dx === "TN") {
      const dobValue = document.getElementById("Tanggal Lahir")?.value || "";
      const refValue = document.getElementById("Tanggal Pelacakan")?.value || "";
      const birthVal = validateBirthDateEpi(dobValue, isCompleteDateValue(refValue) ? refValue : "");

      if (birthVal && birthVal.ok) {
        const totalDays = Number((birthVal.age && birthVal.age.totalDays) || 0);
        if (totalDays > 28) {
          errors.push("Form TN hanya untuk neonatus. Umur pasien saat pelacakan tidak boleh lebih dari 28 hari.");
        }
      }

      if (getFieldValueSafe("Apakah bayi dirawat") === "Ya") {
        if (!isNonEmptyField("Tempat perawatan TN")) {
          errors.push("Tempat perawatan TN wajib diisi jika bayi dirawat.");
        }
        if (!isNonEmptyField("Tanggal mulai dirawat TN")) {
          errors.push("Tanggal mulai dirawat TN wajib diisi jika bayi dirawat.");
        }
      }
    }

    if (dx === "AFP") {
      const sifatAkut = getFieldValueSafe("Sifat akut");
      const lumpuhLayuh = getFieldValueSafe("Lumpuh layuh");
      const rudapaksa = getFieldValueSafe("Rudapaksa AFP");
      const t1 = getFieldValueSafe("Tanggal tinja 1");
      const t1a = getFieldValueSafe("Tanggal kirim tinja 1 kab-prov");
      const t1b = getFieldValueSafe("Tanggal kirim tinja 1 prov-lab");
      const t2 = getFieldValueSafe("Tanggal tinja 2");
      const t2a = getFieldValueSafe("Tanggal kirim tinja 2 kab-prov");
      const t2b = getFieldValueSafe("Tanggal kirim tinja 2 prov-lab");

      if (sifatAkut && sifatAkut !== "Ya") {
        errors.push("Kasus AFP harus memiliki kelemahan/kelumpuhan akut (1-14 hari).");
      }
      if (lumpuhLayuh && lumpuhLayuh !== "Ya") {
        errors.push("Kasus AFP harus memiliki kelumpuhan layuh (flaccid).");
      }
      if (rudapaksa === "Ya") {
        errors.push("Kasus AFP tidak boleh disebabkan rudapaksa.");
      }
      if (t1 && t1a && compareDateInputValues(t1, t1a) === 1) {
        errors.push("Tanggal kirim spesimen I AFP ke provinsi tidak boleh lebih awal dari tanggal ambil.");
      }
      if (t1a && t1b && compareDateInputValues(t1a, t1b) === 1) {
        errors.push("Tanggal kirim spesimen I AFP ke lab tidak boleh lebih awal dari tanggal kirim ke provinsi.");
      }
      if (t2 && t2a && compareDateInputValues(t2, t2a) === 1) {
        errors.push("Tanggal kirim spesimen II AFP ke provinsi tidak boleh lebih awal dari tanggal ambil.");
      }
      if (t2a && t2b && compareDateInputValues(t2a, t2b) === 1) {
        errors.push("Tanggal kirim spesimen II AFP ke lab tidak boleh lebih awal dari tanggal kirim ke provinsi.");
      }
      if (isNonEmptyField("Tanggal follow up 60 hari") && !isNonEmptyField("Masih ada kelumpuhan")) {
        warnings.push("Tanggal follow up 60 hari AFP sudah diisi, tetapi hasil follow up masih kosong.");
      }
    }

    return { ok: errors.length === 0, errors, warnings };
  }

          : workspaceLabel;

      : "Tidak ada sampel";
    const userName = String((SESSION_USER && (SESSION_USER.nama || SESSION_USER.username || SESSION_USER.name)) || "Belum login").trim() || "Belum login";

    const latestStatus = getLatestStatusFromTimeline() || statusKasus;
    const nextStatusSummary = getNextAllowedStatusesSummary(dx, latestStatus);
    const lastWorkflowStageLabel = getFieldValueSafe("Label Tahap Workflow Terakhir") || getFieldValueSafe("Tahap Workflow Terakhir") || "Belum ada jejak tahap";
    const lastWorkflowActor = getFieldValueSafe("Diupdate Oleh Tahap Terakhir") || "";
    const lastWorkflowRole = getFieldValueSafe("Role Pengupdate Tahap Terakhir") || "";
    const lastWorkflowSummary = [lastWorkflowStageLabel, lastWorkflowActor ? `oleh ${lastWorkflowActor}` : "", lastWorkflowRole ? `(${getRoleDisplayLabel(lastWorkflowRole)})` : ""].filter(Boolean).join(" ");

    setSummaryText("summary-dx-name", dxTitle);

    setSummaryText("summary-umur", ageText);
    setSummaryText("summary-epi-group", epiGroupText);
    setSummaryText("summary-mode", viewerMode ? "Mode lihat" : modeText);
    setSummaryText("summary-user", userName);
    setSummaryText("summary-role-capability", roleCaps.summary || "Belum ada sesi");
    let authText = userName === "Belum login" ? "Belum ada sesi" : "Sesi aktif";
    if (authMeta && authMeta.ttlSec) {
      const minutes = Math.max(1, Math.round(Number(authMeta.ttlSec || 0) / 60));
      authText = `Sesi aktif • timeout server ±${minutes} menit`;
    }
    setSummaryText("summary-auth-session", authText);
    setSummaryText("summary-last-workflow-stage", lastWorkflowSummary || "Belum ada jejak tahap");
    setSummaryText("summary-status-kasus", statusKasus);
    setSummaryText("summary-next-statuses", nextStatusSummary);
    setSummaryText("summary-verifikasi-epid", statusVerifikasi);

    setSummaryText("summary-mode-pill", modeText);
    setSummaryText("summary-warning-count", issueCount > 0 ? `${issueCount} isu perlu dicek` : "0 warning");
    setSummaryText("summary-warning-pill", String(issueCount));
    setSummaryText("workflow-input-state", viewerMode ? "Record dibuka dalam mode lihat" : (isEditMode ? "Record existing sedang dibuka" : "Input baru / draft kerja"));
    setSummaryText("workflow-verifikasi-state", statusVerifikasi);
    setSummaryText("workflow-sampel-state", sampelState);
    setSummaryText("workflow-status-kasus", statusKasus);
    setSummaryText("edit-badge-dx", dx ? `DX ${dx}` : "DX -");
    setSummaryText("edit-badge-epid", epidText);
    setSummaryText("edit-badge-status", statusKasus);
    setSummaryText("viewer-badge-dx", dx ? `DX ${dx}` : "DX -");
    setSummaryText("viewer-badge-epid", epidText);
    setSummaryText("viewer-badge-status", statusKasus);
  }

  let ACTIVE_SIDEBAR_WORKSPACE = "overview";
  let WORKSPACE_RUNTIME_SEQ = 0;
  let WORKFLOW_INBOX_CACHE = null;
  let WORKSPACE_SEARCH_FILTER_STATE = {};
  const PD3I_LAST_WORKSPACE_KEY = 'pd3i:last-workspace:v1';

  function normalizeSidebarWorkspace(workspaceOrSection) {
    const raw = String(workspaceOrSection || '').trim().toLowerCase();
    if (!raw) return ACTIVE_SIDEBAR_WORKSPACE || 'overview';
    const map = {
      overview: 'overview',
      'section-overview': 'overview',
      search: 'search',
      'section-search-shell': 'search',
      input: 'input',
      'section-pelapor': 'input',
      'section-pasien': 'input',
      'section-specific': 'input',
      verifikasi: 'verifikasi',
      'section-verifikasi': 'verifikasi',
      sampel: 'sampel',
      'section-sampel': 'sampel',
      status: 'status',
      'section-status': 'status',
      dashboard: 'dashboard',
      'section-dashboard': 'dashboard',
      guide: 'guide',
      'section-guide': 'guide'
    };
    return map[raw] || 'overview';
  }

  function isWorkspaceRestorable(workspace) {
    return ['overview', 'search', 'input', 'verifikasi', 'sampel', 'status', 'dashboard', 'guide'].includes(normalizeSidebarWorkspace(workspace));
  }

  function saveLastWorkspace(workspace) {
    const normalized = normalizeSidebarWorkspace(workspace);
    if (!isWorkspaceRestorable(normalized)) return;
    try {
      if (window && window.localStorage) {
        window.localStorage.setItem(PD3I_LAST_WORKSPACE_KEY, normalized);
      }
    } catch (e) {}
  }

  function getLastWorkspace() {
    try {
      const saved = window && window.localStorage ? window.localStorage.getItem(PD3I_LAST_WORKSPACE_KEY) : '';
      const normalized = normalizeSidebarWorkspace(saved || '');
      return isWorkspaceRestorable(normalized) ? normalized : '';
    } catch (e) {
      return '';
    }
  }

  function getUrlRequestedWorkspace() {
    try {
      const url = new URL(window.location.href);
      const view = String(url.searchParams.get('view') || '').trim().toLowerCase();
      if (view === 'dashboard') return 'dashboard';
      const workspace = String(url.searchParams.get('workspace') || '').trim();
      if (workspace) return normalizeSidebarWorkspace(workspace);
    } catch (e) {}
    return '';
  }

  function createWorkspaceRuntimeGuard(workspace) {
    return {
      seq: WORKSPACE_RUNTIME_SEQ,
      workspace: normalizeSidebarWorkspace(workspace)
    };
  }

  function isWorkspaceRuntimeGuardActive(guard) {
    if (!guard) return false;
    return Number(guard.seq || 0) === Number(WORKSPACE_RUNTIME_SEQ || 0)
      && normalizeSidebarWorkspace(guard.workspace) === normalizeSidebarWorkspace(ACTIVE_SIDEBAR_WORKSPACE);
  }

  function beginWorkspaceRuntime(workspace) {
    ACTIVE_SIDEBAR_WORKSPACE = normalizeSidebarWorkspace(workspace);
    try {
      if (document && document.body) {
        document.body.setAttribute('data-active-workspace', ACTIVE_SIDEBAR_WORKSPACE);
      }
    } catch (e) {}
    WORKSPACE_RUNTIME_SEQ += 1;
    saveLastWorkspace(ACTIVE_SIDEBAR_WORKSPACE);
    return createWorkspaceRuntimeGuard(ACTIVE_SIDEBAR_WORKSPACE);
  }

  function cleanupWorkspaceTransientUi(nextWorkspace) {
    const normalized = normalizeSidebarWorkspace(nextWorkspace);
    const adminMenuDropdown = document.getElementById('admin-menu-dropdown');
    if (adminMenuDropdown) adminMenuDropdown.classList.add('hidden');

    if (['verifikasi', 'sampel', 'status'].includes(normalized) && typeof hideTopAlert === 'function') {
      hideTopAlert();
    }

    if (normalized !== 'overview') {
      window.__OVERVIEW_REQUEST_ID = 0;
    }

    if (normalized !== 'dashboard') {
      const dashboardContent = document.getElementById('dashboard-content');
      if (dashboardContent) {
        delete dashboardContent.dataset.loadingRequest;
      }
    }

    if (!['search', 'verifikasi', 'sampel', 'status'].includes(normalized)) {
      const searchResultsBox = document.getElementById('search-results');
      if (searchResultsBox && !isEditMode && !isViewerSession()) {
        searchResultsBox.classList.add('hidden');
      }
    }
  }

  function getRouteBootConfig() {
    const body = document.body;
    return {
      initialView: String(body?.dataset.initialView || 'app').trim().toLowerCase(),
      initialWorkspace: normalizeSidebarWorkspace(body?.dataset.initialWorkspace || 'overview'),
      appUrl: String(body?.dataset.appUrl || '').trim(),
      dashboardUrl: String(body?.dataset.dashboardUrl || '').trim()
    };
  }

  function getEffectiveDxScopeForWorkspace(workspace) {
    const normalized = normalizeSidebarWorkspace(workspace);
    if (['search', 'verifikasi', 'sampel', 'status', 'overview', 'dashboard', 'guide'].includes(normalized)) return '';
    return String(document.getElementById('form-selector')?.value || '').trim();
  }

  function buildWorkspaceRouteUrl(workspace) {
    const normalized = normalizeSidebarWorkspace(workspace);
    const boot = getRouteBootConfig();
    const appUrl = boot.appUrl || window.location.href.split('?')[0];
    if (normalized === 'dashboard') {
      return boot.dashboardUrl || (appUrl ? appUrl + '?view=dashboard' : '');
    }
    if (normalized === 'overview') return appUrl;
    return appUrl ? appUrl + '?workspace=' + encodeURIComponent(normalized) : '';
  }

  function getSafeSessionTokenLocal() {
    try {
      if (typeof SESSION_TOKEN !== 'undefined' && SESSION_TOKEN) return SESSION_TOKEN;
    } catch (e) {}
    try {
      if (typeof window !== 'undefined' && window.__PD3I_SESSION_TOKEN) return window.__PD3I_SESSION_TOKEN;
    } catch (e) {}
    return '';
  }

  function syncWorkspaceRoute(workspace, options) {
    const opts = options || {};
    const targetUrl = buildWorkspaceRouteUrl(workspace);
    if (!targetUrl || !window.history) return;
    try {
      const currentUrl = window.location.href.split('#')[0];
      if (currentUrl === targetUrl) return;
      const method = opts.replace ? 'replaceState' : 'pushState';
      if (typeof window.history[method] === 'function') {
        window.history[method]({}, '', targetUrl);
      }
    } catch (e) {}
  }

  function applyInitialRouteView() {
    const boot = getRouteBootConfig();
    const urlWorkspace = getUrlRequestedWorkspace();
    const bootWorkspace = boot.initialView === 'dashboard' ? 'dashboard' : boot.initialWorkspace;
    const savedWorkspace = getLastWorkspace();
    const requestedWorkspace = urlWorkspace || (bootWorkspace !== 'overview' ? bootWorkspace : (savedWorkspace || bootWorkspace));
    if (!SESSION_USER) {
      return openSidebarWorkspace(requestedWorkspace, {
        scroll: false,
        useRoute: false,
        autoLoad: false,
        replaceRoute: true
      });
    }
    const currentRole = String((SESSION_USER && SESSION_USER.role) || '').trim().toLowerCase();
    if (requestedWorkspace === 'dashboard' && currentRole !== 'admin') {
      try {
        const fallbackUrl = buildWorkspaceRouteUrl('overview');
        if (fallbackUrl && window.history && window.history.replaceState) {
          window.history.replaceState({}, '', fallbackUrl);
        }
      } catch (e) {}
      if (typeof showTopAlert === 'function') {
        showTopAlert('Dashboard statistik saat ini hanya tersedia untuk role admin.', false);
      }
      openSidebarWorkspace('overview', { scroll: false, useRoute: false });
      return 'overview';
    }
    return openSidebarWorkspace(requestedWorkspace, {
      scroll: false,
      useRoute: false,
      autoLoad: requestedWorkspace === 'dashboard',
      replaceRoute: true
    });
  }

  window.applyInitialRouteView = applyInitialRouteView;

  function getWorkspaceStageForSidebar(workspace) {
    const normalized = normalizeSidebarWorkspace(workspace);
    const map = {
      input: 'section-pelapor',
      verifikasi: 'section-verifikasi',
      sampel: 'section-sampel',
      status: 'section-status'
    };
    return map[normalized] || 'section-pelapor';
  }

  function updateSidebarActiveState(activeId) {
    const workspace = normalizeSidebarWorkspace(activeId);
    document.querySelectorAll('.pd3i-nav-link[data-sidebar-workspace]').forEach(function(link) {
      const targetWorkspace = normalizeSidebarWorkspace(link.getAttribute('data-sidebar-workspace'));
      link.classList.toggle('is-active', targetWorkspace === workspace);
    });
  }

  function applyWorkspaceFormChrome(workspace) {
    const normalized = normalizeSidebarWorkspace(workspace);
    const isDeferredWorkspace = ['verifikasi', 'sampel', 'status'].includes(normalized);
    const hasOpenRecord = isEditMode || isViewerSession();
    const editBadge = document.getElementById('edit-badge');
    const viewerBadge = document.getElementById('viewer-badge');
    const stepperCard = document.getElementById('form-stepper-card');
    const summaryPanel = document.getElementById('case-summary-panel');
    const wizardPanel = document.getElementById('wizard-panel');
    const workflowPanel = document.getElementById('workflow-panel');
    const actionPanel = document.getElementById('action-panel');
    const actionHeader = document.getElementById('action-panel-header');
    const actionNote = document.getElementById('action-panel-note');
    const actionHelper = document.getElementById('action-panel-helper');

    if (editBadge) editBadge.hidden = !hasOpenRecord || isViewerSession() || isDeferredWorkspace;
    if (viewerBadge) viewerBadge.hidden = !isViewerSession() || isDeferredWorkspace;
    if (stepperCard) stepperCard.classList.toggle('hidden', isDeferredWorkspace);
    if (summaryPanel) summaryPanel.classList.toggle('hidden', isDeferredWorkspace);
    if (wizardPanel) wizardPanel.classList.toggle('hidden', isDeferredWorkspace);
    if (workflowPanel) workflowPanel.classList.toggle('hidden', isDeferredWorkspace);
    if (actionPanel) actionPanel.classList.toggle('is-stage-minimal', isDeferredWorkspace);
    if (actionHeader) actionHeader.classList.toggle('hidden', isDeferredWorkspace);
    if (actionNote) actionNote.classList.toggle('hidden', isDeferredWorkspace);
    if (actionHelper) actionHelper.classList.toggle('hidden', isDeferredWorkspace);

  function applySidebarWorkspaceLayout(workspace) {
    const normalized = normalizeSidebarWorkspace(workspace);

    const overviewSection = document.getElementById('section-overview');
    const inputLauncherSection = document.getElementById('section-input-launcher');
    const inputFormSection = document.getElementById('section-input-form-shell');
    const searchSection = document.getElementById('section-search-shell');
    const verifikasiFormSection = document.getElementById('section-verifikasi-form-shell');
    const sampelFormSection = document.getElementById('section-sampel-form-shell');
    const statusFormSection = document.getElementById('section-status-form-shell');
    const editorForm = document.getElementById('dynamic-form');
    const inputForm = document.getElementById('dynamic-form-input');
    const verifikasiForm = document.getElementById('dynamic-form-verifikasi');
    const sampelForm = document.getElementById('dynamic-form-sampel');
    const statusForm = document.getElementById('dynamic-form-status');
    const dashboardSection = document.getElementById('section-dashboard');
    const guideSection = document.getElementById('section-guide');
    const isDeferredWorkspace = ['verifikasi', 'sampel', 'status'].includes(normalized);
    const isInputWorkspace = normalized === 'input';
    const isSearchWorkspace = normalized === 'search';
    const isDashboardWorkspace = normalized === 'dashboard';
    const isGuideWorkspace = normalized === 'guide';
    const hasOpenRecord = isEditMode || isViewerSession();
    const hasDx = !!String(document.getElementById('form-selector')?.value || '').trim();

    function setWorkspaceSectionVisibility(sectionEl, shouldShow) {
      if (!sectionEl) return;
      sectionEl.classList.toggle('hidden', !shouldShow);
      sectionEl.style.display = shouldShow ? '' : 'none';
      sectionEl.setAttribute('aria-hidden', shouldShow ? 'false' : 'true');
    }

    setWorkspaceSectionVisibility(overviewSection, normalized === 'overview');
    setWorkspaceSectionVisibility(inputLauncherSection, isInputWorkspace);
    setWorkspaceSectionVisibility(inputFormSection, isInputWorkspace && hasDx && !hasOpenRecord);
    setWorkspaceSectionVisibility(searchSection, isSearchWorkspace || isDeferredWorkspace);
    setWorkspaceSectionVisibility(verifikasiFormSection, normalized === 'verifikasi' && hasOpenRecord);
    setWorkspaceSectionVisibility(sampelFormSection, normalized === 'sampel' && hasOpenRecord);
    setWorkspaceSectionVisibility(statusFormSection, normalized === 'status' && hasOpenRecord);
    setWorkspaceSectionVisibility(dashboardSection, isDashboardWorkspace);
    setWorkspaceSectionVisibility(guideSection, isGuideWorkspace);
    applySearchDefaultsForWorkspace(normalized);

    if (editorForm) {
      const showEditorForm = isSearchWorkspace && hasOpenRecord;
      editorForm.classList.toggle('hidden', !showEditorForm);
    }
    if (inputForm) {
      inputForm.classList.toggle('hidden', !(isInputWorkspace && hasDx && !hasOpenRecord));
    }
    if (verifikasiForm) verifikasiForm.classList.toggle('hidden', !(normalized === 'verifikasi' && hasOpenRecord));
    if (sampelForm) sampelForm.classList.toggle('hidden', !(normalized === 'sampel' && hasOpenRecord));
    if (statusForm) statusForm.classList.toggle('hidden', !(normalized === 'status' && hasOpenRecord));

    applyWorkspaceFormChrome(normalized);
    updateSidebarActiveState(normalized);
  }

  function openSidebarWorkspace(workspace, options) {
    const opts = options || {};
    const normalized = normalizeSidebarWorkspace(workspace);
    const targetStage = getWorkspaceStageForSidebar(normalized);
    const previousWorkspace = normalizeSidebarWorkspace(ACTIVE_SIDEBAR_WORKSPACE || 'overview');
    saveWorkflowSearchFiltersForWorkspace(previousWorkspace);
    beginWorkspaceRuntime(normalized);
    cleanupWorkspaceTransientUi(normalized);

    if (opts.useRoute) {
      syncWorkspaceRoute(normalized, { replace: !!opts.replaceRoute });
    }

    if (normalized === 'dashboard') {
      if (typeof openDashboardSection === 'function') {
        openDashboardSection({ autoLoad: opts.autoLoad, scroll: opts.scroll !== false });
      }
      return normalized;
    }

    if (normalized === 'guide') {
      setWorkflowSearchIntent('section-pelapor', { focusSearch: false, focusForm: false, skipStageSync: true });
      updateFormStepperState('section-pelapor');
      applySidebarWorkspaceLayout('guide');
      applySearchShellCopyForWorkspace('guide');
      if (opts.scroll !== false) document.getElementById('section-guide')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return normalized;
    }

    if (normalized === 'overview') {
      setWorkflowSearchIntent('section-pelapor', { focusSearch: false, focusForm: false, skipStageSync: true });
      updateFormStepperState('section-pelapor');
      applySidebarWorkspaceLayout('overview');
      applySearchShellCopyForWorkspace('overview');
      renderOverviewWorkspace();
      if (opts.scroll !== false) document.getElementById('section-overview')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return normalized;
    }

    if (normalized === 'search') {
      setWorkflowSearchIntent('section-pelapor', { focusSearch: false, focusForm: false, skipStageSync: true });
      updateFormStepperState('section-pelapor');
      applySidebarWorkspaceLayout('search');
      applySearchShellCopyForWorkspace('search');
      restoreWorkflowSearchFiltersForWorkspace('search');
      refreshWorkflowInbox();
      if (opts.scroll !== false) document.getElementById('section-search-shell')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return normalized;
    }

    if (normalized === 'input' && (isEditMode || isViewerSession())) {
      clearActiveRecordContext();
    }
    if (normalized === 'input') {
      const selectedDx = String(document.getElementById('form-selector')?.value || '').trim().toUpperCase();
      if (selectedDx && typeof window !== 'undefined' && typeof window.renderDxWorkspaceForm === 'function') {
        window.renderDxWorkspaceForm(selectedDx, 'input');
      }
    }

    setWorkflowSearchIntent(targetStage, { focusSearch: false, focusForm: false, skipStageSync: true });
    updateFormStepperState(targetStage);
    applySidebarWorkspaceLayout(normalized);
    applySearchShellCopyForWorkspace(normalized);
    restoreWorkflowSearchFiltersForWorkspace(normalized);

    const activeRecordMeta = (typeof window !== 'undefined' && window.__PD3I_ACTIVE_RECORD_META) ? window.__PD3I_ACTIVE_RECORD_META : null;
    const activeRecordKey = String((activeRecordMeta && (activeRecordMeta.recordKey || activeRecordMeta['ID Registrasi Kasus'] || activeRecordMeta['Nomor EPID'])) || '').trim();
    const activeRecordDx = String((activeRecordMeta && (activeRecordMeta.dx || activeRecordMeta.DX)) || document.getElementById('form-selector')?.value || '').trim().toUpperCase();
    if (!opts.skipRecordReload && ['search', 'verifikasi', 'sampel', 'status'].includes(normalized) && activeRecordKey && activeRecordDx && typeof window !== 'undefined' && typeof window._loadRecordFromSearch_ === 'function') {
      window._loadRecordFromSearch_(activeRecordKey, activeRecordDx, { workspace: normalized, skipWorkspaceSwitch: true, skipSearchHide: true });
      return normalized;
    }

    refreshWorkflowInbox();
    if (normalized === 'input') {
      setTimeout(function() {
        maybePromptRestoreInputDraft();
      }, 120);
    }
    const inboxEl = document.getElementById('workflow-inbox');
    const hasVisibleInbox = inboxEl && !inboxEl.classList.contains('hidden') && String(inboxEl.innerHTML || '').trim();
    const targetEl = normalized === 'input'
      ? (document.getElementById('section-input-form-shell') || document.getElementById('section-input-launcher'))
      : (hasVisibleInbox ? inboxEl : (document.getElementById('section-search-shell') || document.getElementById(targetStage)));
    if (opts.scroll !== false && targetEl) targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return normalized;
  }

  let WORKFLOW_SEARCH_INTENT = "section-pelapor";

  function getWorkflowStepDefinitions() {
    return [
      { id: "section-pelapor", label: "Input Kasus", sections: ["section-pelapor", "section-pasien", "section-specific"] },
      { id: "section-verifikasi", label: "Verifikasi EPID", sections: ["section-verifikasi"] },
      { id: "section-sampel", label: "Hasil Sampel", sections: ["section-sampel"] },
      { id: "section-status", label: "Status Pasien", sections: ["section-status"] }
    ];
  }

  function normalizeWorkflowStepId(activeId) {
    if (["section-pelapor", "section-pasien", "section-specific"].includes(activeId)) return "section-pelapor";
    if (["section-verifikasi", "section-sampel", "section-status"].includes(activeId)) return activeId;
    return "section-pelapor";
  }

  function canAccessDeferredWorkflowStages() {
    const epid = String(document.getElementById("Nomor EPID")?.value || "").trim();
    return !!epid || isEditMode || isViewerSession();
  }

  function getLandingWorkflowIntentForUser() {
    const caps = getRoleCapabilities(SESSION_USER);
    if (caps.writeStages && caps.writeStages.length === 1) {
      return normalizeWorkflowStepId(caps.writeStages[0]);
    }
    return "section-pelapor";
  }

  function syncDiagnosisSelectorUi() {
    const selectorCard = document.getElementById('diagnosis-selector-card');
    const selectorBadge = document.getElementById('diagnosis-selector-badge');
    const selectorHelper = document.getElementById('diagnosis-selector-helper');
    const selector = document.getElementById('form-selector');
    const searchContainer = document.getElementById('search-container');
    const searchPlaceholder = document.getElementById('search-placeholder');
    const launcherSection = document.getElementById('section-input-launcher');
    const hasOpenRecord = isEditMode || isViewerSession();
    const requiresDiagnosis = ACTIVE_SIDEBAR_WORKSPACE === 'input' && !hasOpenRecord;
    const dx = String(selector?.value || '').trim().toUpperCase();
    const cfg = getDxConfigSafe(dx);

    if (launcherSection) launcherSection.classList.toggle('hidden', !requiresDiagnosis);
    if (selectorCard) selectorCard.classList.toggle('hidden', !requiresDiagnosis);
    if (selectorBadge) selectorBadge.textContent = requiresDiagnosis ? 'Mandatory' : 'Auto';
    if (selectorHelper) {
      selectorHelper.textContent = requiresDiagnosis
        ? 'Pemilihan diagnosis hanya diperlukan untuk mulai input kasus baru dan memuat blok form spesifik yang sesuai.'
        : 'Diagnosis akan mengikuti record yang dibuka dari hasil pencarian, jadi tidak perlu dipilih manual di langkah ini.';
    }

    if (!requiresDiagnosis) {
      if (searchContainer) searchContainer.classList.remove('hidden');
      if (searchPlaceholder) searchPlaceholder.classList.add('hidden');
      return;
    }

    if (!dx || !cfg) {
      if (searchContainer) searchContainer.classList.add('hidden');
      if (searchPlaceholder) {
        searchPlaceholder.textContent = 'Pilih diagnosis dulu untuk mulai input kasus baru.';
        searchPlaceholder.classList.remove('hidden');
      }
    } else {
      if (searchContainer) searchContainer.classList.remove('hidden');
      if (searchPlaceholder) searchPlaceholder.classList.add('hidden');
    }
  }

  function focusSearchShell() {
    const shell = document.getElementById("section-search-shell");
    if (shell) shell.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function getSearchFirstBannerText(stepId) {
    const normalized = normalizeWorkflowStepId(stepId);
    const map = {
      "section-verifikasi": "<strong>Mode review admin aktif.</strong> Cari dan buka kasus existing yang masih <strong>Pending</strong>, lalu lakukan verifikasi EPID.",
      "section-sampel": "<strong>Mode input hasil pemeriksaan aktif.</strong> Cari record existing yang sudah lolos verifikasi, lalu isi hasil pemeriksaan sampel.",
      "section-status": "<strong>Mode update status aktif.</strong> Cari record existing yang ingin diperbarui status pasien / kasusnya."
    };
    return map[normalized] || "";
  }

  function applySearchDefaultsForWorkflowIntent(stepId) {
    const normalized = normalizeWorkflowStepId(stepId);
    const statusFilter = document.getElementById('search-status-verifikasi');
    if (!statusFilter) return;
    if (normalized === 'section-verifikasi' && !statusFilter.value) {
      statusFilter.value = 'Pending';
      return;
    }
    if ((normalized === 'section-sampel' || normalized === 'section-status') && !statusFilter.value) {
      statusFilter.value = 'Terverifikasi';
      return;
    }
    if (normalized === 'section-pelapor' && (statusFilter.value === 'Pending' || statusFilter.value === 'Terverifikasi')) {
      statusFilter.value = '';
    }
  }

  function applySearchDefaultsForWorkspace(workspace) {
    const normalized = normalizeSidebarWorkspace(workspace);
    const statusFilter = document.getElementById('search-status-verifikasi');
    if (!statusFilter) return;
    if (normalized === 'search') {
      statusFilter.value = '';
    } else if (normalized === 'verifikasi' && !statusFilter.value) {
      statusFilter.value = 'Pending';
    } else if ((normalized === 'sampel' || normalized === 'status') && !statusFilter.value) {
      statusFilter.value = 'Terverifikasi';
    }
  }

  function togglePreRecordWorkflowFocus(focusSearchOnly, stepId) {
    const searchCard = document.getElementById('section-search-shell');
    const form = document.getElementById('dynamic-form');
    const banner = document.getElementById('workflow-presearch-banner');
    const shouldFocus = !!focusSearchOnly;
    if (searchCard) searchCard.classList.toggle('is-workflow-focus', shouldFocus);
    if (form) form.classList.toggle('pd3i-stage-hidden', shouldFocus);
    if (banner) {
      banner.innerHTML = shouldFocus ? getSearchFirstBannerText(stepId) : '';
      banner.classList.toggle('hidden', !shouldFocus);
    }
    if (shouldFocus) applySearchDefaultsForWorkflowIntent(stepId);
  }

  function setWorkflowSearchIntent(intent, options) {
    const opts = options || {};
    const normalized = normalizeWorkflowStepId(intent);
    const cfg = getWorkflowIntentConfig(normalized);
    WORKFLOW_SEARCH_INTENT = normalized;

    document.querySelectorAll(".pd3i-workflow-intent-card[data-workflow-intent]").forEach(function(btn) {
      const target = normalizeWorkflowStepId(String(btn.getAttribute("data-workflow-intent") || "").trim());
      btn.classList.toggle("is-active", target === normalized);
    });

    const titleEl = document.getElementById("workflow-search-title");
    const badgeEl = document.getElementById("workflow-search-badge");
    const helperEl = document.getElementById("workflow-search-helper");
    const searchHelperEl = document.getElementById("search-context-helper");

    if (titleEl) titleEl.textContent = cfg.title;
    if (badgeEl) badgeEl.textContent = cfg.badge;
    if (helperEl) helperEl.textContent = cfg.helper;
    if (searchHelperEl) searchHelperEl.textContent = cfg.searchHelper + ' Gunakan filter status verifikasi bila perlu.';

    const shouldFocusSearchOnly = normalized !== "section-pelapor" && !canAccessDeferredWorkflowStages();
    togglePreRecordWorkflowFocus(shouldFocusSearchOnly, normalized);
    syncDiagnosisSelectorUi();
    applySidebarWorkspaceLayout(ACTIVE_SIDEBAR_WORKSPACE || normalizeSidebarWorkspace(normalized));

    if (!opts.skipStageSync && normalized === "section-pelapor") {
      updateFormStepperState("section-pelapor");
      if (opts.focusForm) {
        const form = document.getElementById("dynamic-form");
        if (form) form.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    } else if (opts.focusSearch !== false && normalized !== "section-pelapor") {
      focusSearchShell();
    }

    return normalized;
  }

  function getWorkflowSearchActionLabel() {
    return getWorkflowIntentConfig(WORKFLOW_SEARCH_INTENT).actionLabel || "Buka / Edit";
  }

  function getWorkflowSearchOpenSuccessMessage(intent) {
    return getWorkflowIntentConfig(intent).successMessage || "Record existing berhasil dibuka.";
  }

  function collectWorkflowSearchFilters() {
    return {
      epid: (document.getElementById('search-epid')?.value || '').trim(),
      nama: (document.getElementById('search-nama')?.value || '').trim(),
      tanggalLahir: (document.getElementById('search-tgl-lahir')?.value || '').trim(),
      orangTua: (document.getElementById('search-orang-tua')?.value || '').trim(),
      alamat: (document.getElementById('search-alamat')?.value || '').trim(),
      kelurahan: (document.getElementById('search-kelurahan')?.value || '').trim(),
      statusVerifikasi: (document.getElementById('search-status-verifikasi')?.value || '').trim(),
      sortBy: (document.getElementById('search-sort')?.value || 'updated_desc').trim()
    };
  }

  function applyWorkflowSearchFilters(filters) {
    const values = filters || {};
    const map = {
      'search-epid': 'epid',
      'search-nama': 'nama',
      'search-tgl-lahir': 'tanggalLahir',
      'search-orang-tua': 'orangTua',
      'search-alamat': 'alamat',
      'search-kelurahan': 'kelurahan',
      'search-status-verifikasi': 'statusVerifikasi',
      'search-sort': 'sortBy'
    };
    Object.keys(map).forEach(function(id) {
      const el = document.getElementById(id);
      if (!el) return;
      const key = map[id];
      const nextValue = values[key] != null ? String(values[key]) : (id === 'search-sort' ? 'updated_desc' : '');
      el.value = nextValue;
    });
  }

  function saveWorkflowSearchFiltersForWorkspace(workspace) {
    const normalized = normalizeSidebarWorkspace(workspace);
    if (!['search', 'verifikasi', 'sampel', 'status'].includes(normalized)) return;
    WORKSPACE_SEARCH_FILTER_STATE[normalized] = collectWorkflowSearchFilters();
  }

  function restoreWorkflowSearchFiltersForWorkspace(workspace) {
    const normalized = normalizeSidebarWorkspace(workspace);
    if (!['search', 'verifikasi', 'sampel', 'status'].includes(normalized)) return;
    const saved = WORKSPACE_SEARCH_FILTER_STATE[normalized] || null;
    if (saved) {
      applyWorkflowSearchFilters(saved);
    } else {
      applyWorkflowSearchFilters({ sortBy: 'updated_desc' });
      applySearchDefaultsForWorkspace(normalized);
      saveWorkflowSearchFiltersForWorkspace(normalized);
    }
  }

  function resetWorkflowSearchFilters() {
    applyWorkflowSearchFilters({ sortBy: 'updated_desc' });
    applySearchDefaultsForWorkspace(ACTIVE_SIDEBAR_WORKSPACE || 'search');
    saveWorkflowSearchFiltersForWorkspace(ACTIVE_SIDEBAR_WORKSPACE || 'search');
  }

    if (toolbarBadge) toolbarBadge.textContent = 'Record-first workflow';
    if (btnSearch) btnSearch.innerHTML = '<i class="fas fa-search"></i> Cari Data Existing';
    if (btnReset) btnReset.classList.add('hidden');
    if (searchHelper && !searchHelper.textContent) {

  function filterQueueItemsForWorkspace(items, workspace) {
    const normalized = normalizeSidebarWorkspace(workspace);
    const rows = Array.isArray(items) ? items.slice() : [];
    const filters = collectWorkflowSearchFilters();
    const match = function(haystack, needle) {
      const h = String(haystack || '').trim().toLowerCase();
      const n = String(needle || '').trim().toLowerCase();
      if (!n) return true;
      return h.indexOf(n) !== -1;
    };

    let filtered = rows;
    if (['verifikasi', 'sampel', 'status'].includes(normalized)) {
      filtered = rows.filter(function(item) {
        const recordText = [item && item.epid, item && item.recordId, item && item.recordKey].filter(Boolean).join(' ').toLowerCase();
        return match(recordText, filters.epid)
          && match(item && item.nama, filters.nama)
          && match(item && item.kelurahan, filters.kelurahan);
      });
    }

    const sortBy = String(filters.sortBy || 'updated_desc').trim();
    filtered.sort(function(a, b) {
      if (sortBy === 'name_asc') return String(a && a.nama || '').localeCompare(String(b && b.nama || ''));
      if (sortBy === 'name_desc') return String(b && b.nama || '').localeCompare(String(a && a.nama || ''));
      if (sortBy === 'epid_asc') return String(a && (a.epid || a.recordId || '')).localeCompare(String(b && (b.epid || b.recordId || '')));
      if (sortBy === 'epid_desc') return String(b && (b.epid || b.recordId || '')).localeCompare(String(a && (a.epid || a.recordId || '')));
      const aa = String(a && (a.updatedAt || a.inputAt || '') || '');
      const bb = String(b && (b.updatedAt || b.inputAt || '') || '');
      if (aa === bb) return String(a && a.nama || '').localeCompare(String(b && b.nama || ''));
      return aa < bb ? 1 : -1;
    });
    return filtered;
  }

  function getQueueBucketMeta(item) {
    const status = String(item && item.statusVerifikasi || '').trim();
    if (status === 'Perlu Revisi') {
      return { label: 'Perlu revisi', className: 'is-danger' };
    }
    if (status === 'Terverifikasi') {
      return { label: 'Terverifikasi', className: 'is-success' };
    }
    if (item && item.__queueStatusLabel) {
      return { label: String(item.__queueStatusLabel || '').trim() || 'Aktif', className: String(item.__queueStatusClass || 'is-warning').trim() || 'is-warning' };
    }
    return { label: 'Pending review', className: 'is-warning' };
  }

  function updateVerificationSectionState() {
    const statusEl = document.getElementById('Status Verifikasi EPID');
    const actorEl = document.getElementById('Petugas Verifikator');
    const dateEl = document.getElementById('Tanggal Verifikasi EPID');
    const reviewEl = document.getElementById('Review Admin Terakhir');
    const finalEpidEl = document.getElementById('Nomor EPID Final');
    const currentMainEpidEl = document.getElementById('Nomor EPID');
    const status = String(statusEl?.value || '').trim();
    const actorName = getCurrentSessionActorName();

    if (!statusEl) return;
    if (!statusEl.value) statusEl.value = 'Pending';

    if (status === 'Terverifikasi') {
      if (actorEl && !actorEl.value) actorEl.value = actorName;
      if (dateEl && !dateEl.value) dateEl.value = getTodayInputValue();
      if (reviewEl) reviewEl.value = actorName ? `Review admin oleh ${actorName}` : 'Review admin';
      if (finalEpidEl && !finalEpidEl.value && currentMainEpidEl && currentMainEpidEl.value) {
        finalEpidEl.value = currentMainEpidEl.value;
      }
    }

    if (status === 'Perlu Revisi') {
      if (actorEl && !actorEl.value) actorEl.value = actorName;
      if (dateEl && !dateEl.value) dateEl.value = getTodayInputValue();
      if (reviewEl) reviewEl.value = actorName ? `Perlu revisi oleh ${actorName}` : 'Perlu revisi';
      if (finalEpidEl) finalEpidEl.value = '';
      if (currentMainEpidEl) currentMainEpidEl.value = '';
    }
  }

  function renderQueueTable(items, options) {
    const opts = options || {};
    const rows = Array.isArray(items) ? items : [];
    const actionLabel = String(opts.actionLabel || 'Buka').trim() || 'Buka';
    const title = String(opts.title || 'Daftar antrian').trim() || 'Daftar antrian';
    const pageSize = Math.max(1, Number(opts.pageSize || 8) || 8);
    const pageKey = String(opts.pageKey || title || 'queue').trim().toLowerCase().replace(/[^a-z0-9_-]+/g, '-');
    if (!rows.length) {
      return `<div class="pd3i-empty-state">${escapeHtml(opts.emptyText || 'Belum ada antrian kerja penting saat ini.')}</div>`;
    }

    const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
    const savedPage = Number((window.__PD3I_QUEUE_PAGE_STATE__ && window.__PD3I_QUEUE_PAGE_STATE__[pageKey]) || 1) || 1;
    const currentPage = Math.min(Math.max(1, savedPage), totalPages);
    window.__PD3I_QUEUE_PAGE_STATE__[pageKey] = currentPage;
    const startIndex = (currentPage - 1) * pageSize;
    const endIndexExclusive = Math.min(startIndex + pageSize, rows.length);
    const visibleRows = rows.slice(startIndex, endIndexExclusive);

    let html = '<div class="pd3i-queue-card">';
    html += '<div class="pd3i-queue-toolbar">';
    html += `<div class="pd3i-queue-toolbar-title">${escapeHtml(title)}</div>`;

    html += '</div>';

    html += '<table class="pd3i-queue-table">';
    html += '<thead><tr>';
    html += '<th class="is-no">No.</th>';
    html += '<th>Nama kasus</th>';
    html += '<th>Wilayah / DX</th>';
    html += '<th>ID record</th>';
    html += '<th>Status</th>';
    html += '<th>Update</th>';
    html += '<th class="is-action">Aksi</th>';
    html += '</tr></thead><tbody>';

    visibleRows.forEach(function(item, visibleIndex) {
      const recordKeyArg = JSON.stringify(String(item && (item.recordKey || item.recordId || item.epid) || ''));
      const dxArg = JSON.stringify(String(item && item.dx || ''));
      const bucket = getQueueBucketMeta(item);
      const wilayahText = [item && item.dx, item && item.kecamatan, item && item.kelurahan].filter(Boolean).join(' • ') || '-';
      const recordText = String(item && (item.recordId || item.epid) || '-');
      const updateText = String(item && (item.updatedAt || item.inputAt || item.timestamp) || '-');
      const noteText = String(item && item.catatanVerifikasi || '').trim();
      const rowNumber = startIndex + visibleIndex + 1;

      html += `<tr class="pd3i-queue-table-row ${bucket.className}">
        <td class="pd3i-queue-cell is-no" data-label="No.">${rowNumber}</td>
        <td class="pd3i-queue-cell pd3i-queue-col-main" data-label="Nama kasus">
          <div class="pd3i-queue-row-title">${escapeHtml(item && item.nama || '-')}</div>
          ${noteText ? `<div class="pd3i-queue-row-subtitle">${escapeHtml(noteText)}</div>` : ''}
        </td>
        <td class="pd3i-queue-cell" data-label="Wilayah / DX">${escapeHtml(wilayahText)}</td>
        <td class="pd3i-queue-cell" data-label="ID record">${escapeHtml(recordText)}</td>
        <td class="pd3i-queue-cell" data-label="Status"><span class="pd3i-queue-status ${bucket.className}"><span class="dot"></span>${escapeHtml(bucket.label)}</span></td>
        <td class="pd3i-queue-cell" data-label="Update">${escapeHtml(updateText)}</td>
        <td class="pd3i-queue-cell is-action" data-label="Aksi">
          <button type="button" class="pd3i-queue-action-btn" onclick='window._loadRecordFromSearch_ && window._loadRecordFromSearch_(${recordKeyArg}, ${dxArg}, { triggerButton: this })'>${escapeHtml(actionLabel)}</button>
        </td>
      </tr>`;
    });

    html += '</tbody></table></div>';
    html += '<div class="pd3i-queue-footer">';
    html += `<div class="pd3i-queue-footer-meta">Showing ${startIndex + 1} to ${endIndexExclusive} of ${rows.length} entries</div>`;
    if (totalPages > 1) {
      html += '<div class="pd3i-queue-pagination">';
      html += `<button type="button" class="pd3i-queue-page-btn" data-page-key="${escapeHtml(pageKey)}" data-page-target="${currentPage - 1}" ${currentPage <= 1 ? 'disabled' : ''}>Prev</button>`;
      html += `<span class="pd3i-queue-page-indicator">Page ${currentPage} / ${totalPages}</span>`;
      html += `<button type="button" class="pd3i-queue-page-btn" data-page-key="${escapeHtml(pageKey)}" data-page-target="${currentPage + 1}" ${currentPage >= totalPages ? 'disabled' : ''}>Next</button>`;
      html += '</div>';
    }
    html += '</div>';
    html += '</div>';
    return html;
  }

  function renderWorkflowInbox(data) {
    const box = document.getElementById('workflow-inbox');
    if (!box) return;

    const workspace = normalizeSidebarWorkspace(ACTIVE_SIDEBAR_WORKSPACE);
    const pendingVerification = (data && data.pendingVerification) || [];
    const revisionQueue = (data && data.revisionQueue) || [];
    const verificationDone = (data && data.verificationDone) || [];
    const sampleQueue = (data && data.sampleQueue) || [];
    const sampleDone = (data && data.sampleDone) || [];
    const statusQueue = (data && data.statusQueue) || [];
    const statusDone = (data && data.statusDone) || [];
    const summary = (data && data.summary) || { pendingVerification: 0, revisionQueue: 0, verificationDone: 0, sampleQueue: 0, sampleDone: 0, statusQueue: 0, statusDone: 0 };
    const verifCountEl = document.getElementById('intent-count-section-verifikasi');
    const pelaporCountEl = document.getElementById('intent-count-section-pelapor');
    const sampelCountEl = document.getElementById('intent-count-section-sampel');
    const statusCountEl = document.getElementById('intent-count-section-status');

    if (verifCountEl) {
      verifCountEl.textContent = String(summary.pendingVerification || 0);
      verifCountEl.classList.toggle('hidden', !(summary.pendingVerification > 0 && normalizeUiRole(SESSION_USER && SESSION_USER.role) === 'admin'));
    }
    if (pelaporCountEl) {
      pelaporCountEl.textContent = String(summary.revisionQueue || 0);
      pelaporCountEl.classList.toggle('hidden', !(summary.revisionQueue > 0 && normalizeUiRole(SESSION_USER && SESSION_USER.role) !== 'admin'));
    }
    if (sampelCountEl) {
      sampelCountEl.textContent = String(summary.sampleQueue || 0);
      sampelCountEl.classList.toggle('hidden', !(summary.sampleQueue > 0));
    }
    if (statusCountEl) {
      statusCountEl.textContent = String(summary.statusQueue || 0);
      statusCountEl.classList.toggle('hidden', !(summary.statusQueue > 0));
    }

    const visiblePending = workspace === 'verifikasi' ? filterQueueItemsForWorkspace(pendingVerification, workspace) : [];
    const visibleRevision = workspace === 'verifikasi'
      ? filterQueueItemsForWorkspace(revisionQueue, workspace)
      : ((workspace === 'input' || workspace === 'search') ? revisionQueue : []);
    const visibleSample = workspace === 'sampel' ? filterQueueItemsForWorkspace(sampleQueue, workspace) : [];
    const visibleSampleDone = workspace === 'sampel' ? filterQueueItemsForWorkspace(sampleDone, workspace) : [];
    const visibleStatus = workspace === 'status' ? filterQueueItemsForWorkspace(statusQueue, workspace) : [];
    const visibleStatusDone = workspace === 'status' ? filterQueueItemsForWorkspace(statusDone, workspace) : [];

    if (!visiblePending.length && !visibleRevision.length && !visibleSample.length && !visibleSampleDone.length && !visibleStatus.length && !visibleStatusDone.length) {

    updateSubmitButtonForWorkflowStep(document.querySelector(".pd3i-stepper-item.is-active")?.getAttribute("data-step-target") || "section-pelapor");

  function applySectionStageAccess(sectionEl, editable) {
    if (!sectionEl) return;
    sectionEl.querySelectorAll("input, select, textarea, button").forEach(function(el) {
      if (!el || el.type === "hidden") return;
      if (el.id === "btn-submit" || el.id === "btn-prev-step" || el.id === "btn-next-step" || el.id === "btn-cancel-edit") return;
      if (el.dataset.stageOrigDisabled === undefined) el.dataset.stageOrigDisabled = el.disabled ? "1" : "0";
      if (el.dataset.stageOrigReadonly === undefined) el.dataset.stageOrigReadonly = el.readOnly ? "1" : "0";

      const origDisabled = el.dataset.stageOrigDisabled === "1";
      const origReadonly = el.dataset.stageOrigReadonly === "1";

      if (!editable) {
        el.setAttribute("disabled", "disabled");
        if (el.tagName !== "SELECT" && el.type !== "checkbox" && el.type !== "radio") {
          el.setAttribute("readonly", "readonly");
        }
      } else {
        if (origDisabled) el.setAttribute("disabled", "disabled");
        else el.removeAttribute("disabled");

        if (el.tagName !== "SELECT" && el.type !== "checkbox" && el.type !== "radio") {
          if (origReadonly) el.setAttribute("readonly", "readonly");
          else el.removeAttribute("readonly");
        }
      }
    });
  }

  function applyWorkflowStageLayout(activeId) {
    let normalized = normalizeWorkflowStepId(activeId);
    if (normalized !== "section-pelapor" && !canAccessDeferredWorkflowStages()) {
      normalized = "section-pelapor";
    }
    const steps = getWorkflowStepDefinitions();
    const current = steps.find(function(step) { return step.id === normalized; }) || steps[0];
    const visibleSections = new Set((current && current.sections) || []);
    const canAccessLater = canAccessDeferredWorkflowStages();
    const helperEl = document.getElementById("workflow-stage-helper");
    const verificationHelperEl = document.getElementById('verification-admin-helper');
    const currentRole = normalizeUiRole(SESSION_USER && SESSION_USER.role);
    const isAdminReviewWorkspace = normalized === 'section-verifikasi' && currentRole === 'admin' && canAccessLater;
    if (isAdminReviewWorkspace) {
      ['section-pelapor', 'section-pasien', 'section-specific', 'section-verifikasi'].forEach(function(id) { visibleSections.add(id); });
    }
    const canWriteThisStage = canWriteWorkflowStage(SESSION_USER, normalized);
    const viewerMode = isViewerSession();
    const stageEditable = canWriteThisStage && !viewerMode;

    ["section-pelapor", "section-pasien", "section-specific", "section-verifikasi", "section-sampel", "section-status"].forEach(function(id) {

      if (!section) return;

      section.classList.toggle("pd3i-stage-hidden", !isVisible);
      const allowEdit = isVisible && (isAdminReviewWorkspace ? ['section-pelapor','section-pasien','section-specific','section-verifikasi'].includes(id) : stageEditable);
      applySectionStageAccess(section, allowEdit);
      section.classList.toggle('pd3i-admin-review-highlight', isAdminReviewWorkspace && ['section-pelapor','section-pasien','section-specific'].includes(id));

    document.querySelectorAll(".pd3i-stepper-item[data-step-target]").forEach(function(item) {

      const lockedByDeferredFlow = target !== "section-pelapor" && !canAccessLater;
      item.classList.toggle("is-disabled", lockedByDeferredFlow);
      item.setAttribute("aria-disabled", lockedByDeferredFlow ? "true" : "false");

    if (helperEl) {
      let helperText = getWorkflowStageHelperText(normalized);

      } else if (!viewerMode && !canAccessLater && !canWriteThisStage) {
        helperText += " Role aktif tidak berwenang menyimpan tahap input awal; gunakan pencarian record existing atau login dengan role inputer/petugas.";
      } else if (!viewerMode && canAccessLater && !canWriteThisStage) {
        if (normalized === "section-verifikasi") {
          helperText += " Verifikasi memang dibatasi admin saja.";
        } else if (normalized === "section-sampel") {
          const scope = getCurrentRecordPengampuPuskesmasMeta();

          helperText += scope.namaPuskesmas || scope.kodePuskesmas
            ? ` Record ini terpetakan ke puskesmas pengampu: ${(scope.namaPuskesmas || scope.kodePuskesmas)} untuk domisili ${scope.kecamatan || '-'} / ${scope.kelurahan || '-'}. Akun aktif: ${userUnit || 'belum diatur'}.`
            : " Record ini belum punya metadata pengampu di UI; backend tetap akan cek Kab/Kota + Kecamatan + Kelurahan ke REF_PENGAMPU saat simpan.";
        } else {
          helperText += " Role aktif bisa melihat tahap ini, tapi tidak berwenang menyimpan perubahan pada tahap ini.";
        }
      }
      helperEl.textContent = helperText;
    }
    if (verificationHelperEl) {
      verificationHelperEl.textContent = isAdminReviewWorkspace
        ? 'Admin review workspace aktif. Semua field input petugas dibuka untuk direview dan bisa diedit sebelum admin memilih Terverifikasi atau Perlu Revisi.'
        : 'Admin mereview kelengkapan input petugas puskesmas. Jika lengkap, admin menetapkan status Terverifikasi dan memilih nomor EPID final (default dari rekomendasi sistem, tetap bisa di-override). Jika belum lengkap, pilih Perlu Revisi agar kasus masuk daftar revisi akun puskesmas.';
    }
    updateSubmitButtonForWorkflowStep(normalized);

    const btnSubmit = document.getElementById("btn-submit");
    if (btnSubmit && !viewerMode) {
      btnSubmit.disabled = !stageEditable;
      btnSubmit.classList.toggle("opacity-60", !stageEditable);
      btnSubmit.classList.toggle("cursor-not-allowed", !stageEditable);
      if (!stageEditable) {
        btnSubmit.innerHTML = `<i class="fas fa-lock"></i> Tidak punya hak ubah tahap ini`;
      }
    }
  }

  function countRequiredCompletionForSections(sectionIds) {
    const ids = Array.isArray(sectionIds) ? sectionIds : [];
    let total = 0;
    let filled = 0;

    ids.forEach(function(id) {
      const root = document.getElementById(id);
      if (!root) return;
      root.querySelectorAll("input, select, textarea").forEach(function(el) {
        if (!el || el.disabled || !el.required) return;
        if (el.type === "hidden") return;
        const wrapper = el.closest(".field-wrapper");
        if (wrapper && wrapper.classList.contains("hidden")) return;
        total++;
        const value = String(el.value || "").trim();
        if (value !== "") filled++;
      });
    });

    return { total, filled, percent: total > 0 ? Math.round((filled / total) * 100) : 100 };
  }

  function validateWorkflowStepCompletion(stepId) {
    const normalized = normalizeWorkflowStepId(stepId);
    const step = getWorkflowStepDefinitions().find(function(item) { return item.id === normalized; });
    if (!step) return { ok: true };

    const invalidEls = [];
    (step.sections || []).forEach(function(id) {
      const root = document.getElementById(id);
      if (!root) return;
      root.querySelectorAll("input, select, textarea").forEach(function(el) {
        if (!el || el.disabled || !el.required) return;
        if (el.type === "hidden") return;
        const wrapper = el.closest(".field-wrapper");
        if (wrapper && wrapper.classList.contains("hidden")) return;
        if (typeof el.checkValidity === "function" && !el.checkValidity()) {
          invalidEls.push(el);
        }
      });
    });

    if (!invalidEls.length) return { ok: true };

    const first = invalidEls[0];
    try {
      first.focus();
      if (typeof first.reportValidity === "function") first.reportValidity();
    } catch (e) {}

    return {
      ok: false,
      message: `Lengkapi dulu field wajib pada langkah ${step.label} sebelum lanjut ke langkah berikutnya.`
    };
  }

  function updateWorkflowProgressUI(activeId) {
    const currentId = normalizeWorkflowStepId(activeId);
    const steps = getWorkflowStepDefinitions();
    const currentIndex = Math.max(0, steps.findIndex(function(step) { return step.id === currentId; }));
    const totalSteps = steps.length;
    const currentStep = steps[currentIndex] || steps[0];
    const completion = countRequiredCompletionForSections(currentStep.sections);
    const overallPercent = Math.round(((currentIndex + (completion.percent / 100)) / totalSteps) * 100);

    const currentLabel = document.getElementById("wizard-current-label");
    const progressLabel = document.getElementById("wizard-progress-label");
    const progressFill = document.getElementById("wizard-progress-fill");
    const btnPrev = document.getElementById("btn-prev-step");
    const btnNext = document.getElementById("btn-next-step");

    const canAccessLater = canAccessDeferredWorkflowStages();
    if (currentLabel) currentLabel.textContent = `Langkah ${currentIndex + 1} dari ${totalSteps} • ${currentStep.label}`;
    if (progressLabel) progressLabel.textContent = `${completion.filled}/${completion.total} field wajib terisi • total ${overallPercent}%`;
    if (progressFill) progressFill.style.width = `${Math.max(0, Math.min(100, overallPercent))}%`;
    if (btnPrev) btnPrev.disabled = currentIndex === 0;
    if (btnNext) btnNext.disabled = currentIndex === totalSteps - 1 || (!canAccessLater && currentId === "section-pelapor");

    document.querySelectorAll(".pd3i-stepper-item[data-step-target]").forEach(function(item) {
      const target = normalizeWorkflowStepId(String(item.getAttribute("data-step-target") || "").trim());
      const stepIdx = steps.findIndex(function(step) { return step.id === target; });
      item.classList.toggle("is-complete", stepIdx !== -1 && stepIdx < currentIndex);
    });
  }

  function goToWorkflowStep(targetId) {
    const normalized = normalizeWorkflowStepId(targetId);
    if (normalized !== "section-pelapor" && !canAccessDeferredWorkflowStages()) {
      setWorkflowSearchIntent(normalized, { focusSearch: true, skipStageSync: true });
      showTopAlert(`Tahap ${getWorkflowStepDefinitions().find(function(step) { return step.id === normalized; })?.label || normalized} dimulai dari pencarian record existing. Form input awal disembunyikan dulu supaya fokus ke pencarian kasus yang akan direview.`, false);
      return;
    }

    const steps = getWorkflowStepDefinitions();
    const currentStep = steps.find(function(step) { return step.id === normalized; }) || steps[0];
    const targetSectionId = (currentStep.sections || [normalized])[0] || normalized;
    const el = document.getElementById(targetSectionId);
    if (el) {
      const workspace = normalizeSidebarWorkspace(normalized);
      setWorkflowSearchIntent(normalized, { focusSearch: false, focusForm: false, skipStageSync: true });
      updateFormStepperState(normalized);
      applySidebarWorkspaceLayout(workspace);
      updateWorkflowProgressUI(normalized);
      el.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }

  function getLatestStatusFromTimeline() {
    const rows = collectDynamicTableData("Riwayat Status Kasus") || [];
    if (!rows.length) return "";
    const sorted = rows.slice().sort(function(a, b) {
      return String(a.Tanggal || "").localeCompare(String(b.Tanggal || ""));
    });
    const last = sorted[sorted.length - 1] || {};
    return String(last.Status || "").trim();
  }

  function getNextAllowedStatusesSummary(dx, currentStatus) {
    let options = [];
    if (typeof getAllowedStatusTransitions === "function") {
      options = getAllowedStatusTransitions(dx, currentStatus);
    } else if (typeof getCaseStatusOptions === "function") {
      options = getCaseStatusOptions(dx);
    }
    options = (options || []).filter(Boolean);
    if (!options.length) {
      if (currentStatus) return `Status terminal (${currentStatus})`;
      return "Tidak ada transisi lanjutan";
    }
    if (options.length <= 4) return options.join(", ");
    return options.slice(0, 4).join(", ") + ` +${options.length - 4} lagi`;
  }

  function getCaseStatusReasonOptions(dx, status) {
    if (typeof getCaseStatusReasonOptionsByDx === "function") {
      return getCaseStatusReasonOptionsByDx(dx, status);
    }

    const statusNorm = String(status || "").trim().toLowerCase();
    const dxNorm = String(dx || "").trim().toUpperCase();

    if (statusNorm === "konfirmasi") return ["", "Laboratorium", "Verifikasi program"];
    if (statusNorm === "klinis") return ["", "Klinis", "Epidemiologis", "Verifikasi program"];
    if (statusNorm === "discarded") return ["", "Laboratorium", "Klinis", "Verifikasi program"];
    if (statusNorm === "probable") return ["", "Epidemiologis", "Klinis", "Verifikasi program"];
    if (statusNorm === "menunggu hasil lab") return ["", "Laboratorium", "Verifikasi program"];
    if (statusNorm === "suspek") return ["", "Klinis", "Epidemiologis"];
    if (dxNorm === "AFP" && statusNorm === "follow up 60 hari") return ["", "Klinis", "Verifikasi program"];
    return ["", "Klinis", "Epidemiologis", "Laboratorium", "Verifikasi program"];
  }

  function syncStatusRulesByContext(dx) {
    const statusSelect = document.getElementById("Status Pasien/Kasus");
    const reasonSelect = document.getElementById("Dasar Penetapan Status");
    if (!statusSelect || !reasonSelect) return;

    const currentReason = String(reasonSelect.value || "").trim();
    const reasonOptions = getCaseStatusReasonOptions(dx, statusSelect.value);
    reasonSelect.innerHTML = reasonOptions.map(function(opt) {
      const selected = opt === currentReason ? ' selected' : '';
