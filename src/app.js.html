<script>
  // ============================================================
  // APP.JS.HTML — FINAL STABLE
  // ============================================================

  window.rsChoicesInstance = window.rsChoicesInstance || null;

  // ============================================================
  // RENDER FIELD
  // ============================================================
  function _getNumericFieldHintById(fieldId) {
    const id = String(fieldId || "").trim().toLowerCase();
    if (!id) return "";

    if (id === "nik" || id === "nik pasien") return "Harus 16 digit angka.";
    if (id === "rt" || id === "rw") return "Hanya angka. Otomatis format 3 digit (contoh: 001).";

    const phoneKeys = [
      "no whatsapp petugas",
      "no. kontak orang tua/wali",
      "no telp/wa orang tua/wali",
      "no telp orang tua/wali",
      "no. telp orang tua/wali",
      "no. kontak pasien",
      "no. telepon wali",
      "no. telp dokter afp"
    ];
    if (phoneKeys.includes(id)) {
      return "Hanya angka, 10–15 digit, awalan 08/62. Saat keluar field, 08 akan otomatis jadi 62.";
    }

    return "";
  }

  function generateHTML(field) {
    if (field.type === "header") {
      return `<div class="col-span-1 md:col-span-2 lg:col-span-3 mt-8 mb-2 border-b-2 border-slate-200 pb-2 text-lg font-extrabold text-slate-800 uppercase tracking-tight">${field.label}</div>`;
    }

    const widthClass = field.fullWidth ? "col-span-1 md:col-span-2 lg:col-span-3" : "";
    const showIfAttr = field.showIf
      ? `data-parent="${field.showIf.field}" data-parent-vals='${JSON.stringify(field.showIf.values)}' data-required="${field.required ? "true" : "false"}"`
      : "";

    const wrapperClass = `${widthClass} field-wrapper pd3i-field-card ${field.fullWidth ? "pd3i-field-card-full" : ""} ${field.showIf ? "pd3i-field-card-dependent hidden" : ""}`;
    const cls = `pd3i-generated-control border border-slate-300 text-sm rounded-lg block w-full p-2.5 shadow-sm ${
      field.readonly
        ? "bg-slate-100 cursor-not-allowed font-extrabold text-slate-600"
        : "bg-white focus:ring-blue-500 focus:border-blue-500"
    }`;
    const requiredAttr = (field.required && !field.showIf) ? "required" : "";

    if (field.type === "dynamic_table") {
      let tableDef = field;
      if (field.id === "Riwayat Imunisasi") tableDef = getImunisasiSectionDefinition();
      if (field.id === "Kontak Erat") tableDef = getContactSectionDefinition();
      if (field.id === "Riwayat Status Kasus") tableDef = field;

      const columns = tableDef.columns || [];
      let extraHtml = "";

      if (field.id === "Riwayat Imunisasi") {
        extraHtml = `
          <div class="mt-4 grid grid-cols-1 md:grid-cols-3 gap-3">
            <div class="rounded-xl border border-blue-200 bg-blue-50 p-4">
              <div class="text-xs font-extrabold uppercase tracking-wide text-blue-800">Ringkasan Dokumentasi Imunisasi</div>
              <div id="imun-summary-text" class="mt-2 text-lg font-black text-blue-900">Belum diringkas</div>
              <div id="imun-summary-subtext" class="mt-1 text-xs font-semibold text-blue-700">
                Menunggu data tanggal lahir / tanggal pelacakan / kelas untuk menandai item imunisasi yang relevan
              </div>
            </div>
            <div class="rounded-xl border border-slate-200 bg-slate-50 p-4">
              <div class="text-xs font-extrabold uppercase tracking-wide text-slate-700">Item Imunisasi Relevan</div>
              <div id="imun-summary-due" class="mt-2 text-2xl font-black text-slate-900">0</div>
            </div>
            <div class="rounded-xl border border-slate-200 bg-slate-50 p-4">
              <div class="text-xs font-extrabold uppercase tracking-wide text-slate-700">Tercatat Ya</div>
              <div id="imun-summary-yes" class="mt-2 text-2xl font-black text-slate-900">0</div>
            </div>
          </div>
          <input type="hidden" id="Ringkasan Riwayat Imunisasi" name="Ringkasan Riwayat Imunisasi" value="">
        `;
      }

      return `<div class="${widthClass} pd3i-dynamic-card bg-white p-5 border border-slate-200 rounded-lg shadow-sm">
        <div class="flex justify-between items-center mb-4 gap-3 flex-wrap">
          <label class="block text-sm font-extrabold text-slate-700 uppercase tracking-wide">${field.label}</label>
          <button type="button" onclick="addDynamicRow('${field.id}')"
            class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-extrabold shadow-md hover:bg-blue-700 transition">
            <i class="fas fa-plus mr-2"></i> Tambah
          </button>
        </div>
        <div class="table-container overflow-x-auto w-full border rounded-lg border-slate-200">
          <table class="w-full text-sm text-left text-slate-500" data-dynamic-table="${field.id}">
            <thead class="text-xs text-slate-700 uppercase bg-slate-100 border-b">
              <tr>
                ${columns.map(c => `<th class="px-2 py-4 text-xs font-extrabold text-slate-600">${c.name}</th>`).join("")}
                <th class="px-2 py-4 text-center">Aksi</th>
              </tr>
            </thead>
            <tbody id="tbody-${field.id}"></tbody>
          </table>
        </div>
        ${extraHtml}
      </div>`;
    }

    if (field.type === "geo_button") {
      return `<div class="${widthClass}">
        <label class="block mb-2 text-sm font-extrabold text-slate-700 uppercase tracking-tight">${field.label}</label>
        <div class="flex flex-col lg:flex-row gap-3">
          <div class="flex flex-col sm:flex-row gap-3 shrink-0">
            <button type="button" id="btn-ambil-lokasi"
              class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-3 rounded-lg font-extrabold shadow-md transition flex items-center justify-center gap-2">
              <i class="fas fa-location-crosshairs"></i> Ambil Lokasi
            </button>
            <button type="button" id="btn-cari-lokasi-alamat"
              class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-3 rounded-lg font-extrabold shadow-md transition flex items-center justify-center gap-2">
              <i class="fas fa-magnifying-glass-location"></i> Cari dari Alamat
            </button>
          </div>
          <div id="geo-status"
            class="flex-1 px-4 py-3 rounded-lg border border-slate-200 bg-slate-50 text-slate-600 text-sm font-semibold">
            Klik tombol untuk mengambil titik koordinat atau cari dari alamat domisili.
          </div>
        </div>
      </div>`;
    }

    let inputHtml = "";

    if (field.type === "select" || field.type === "search_select") {
      inputHtml = `<select id="${field.id}" name="${field.id}" class="${cls}" ${requiredAttr}>
        <option value="">-- Pilih --</option>
        ${(field.options || []).map(o => `<option value="${o}">${o}</option>`).join("")}
      </select>`;
    } else if (field.type === "textarea") {
      inputHtml = `<textarea id="${field.id}" name="${field.id}" class="${cls} min-h-[110px]" ${requiredAttr} ${field.readonly ? "readonly" : ""}></textarea>`;
    } else {
      const patternAttr = field.pattern ? `pattern="${field.pattern}"` : "";
      let maxAttr = field.max ? `max="${field.max}"` : "";
      const numericAttrs = (typeof isNumericOnlyFieldId === "function" && isNumericOnlyFieldId(field.id))
        ? 'inputmode="numeric" autocomplete="off"'
        : '';

      if (field.id === "Tanggal Lahir") {
        const today = new Date().toISOString().split("T")[0];
        maxAttr = `max="${today}"`;
      }

      inputHtml = `<input type="${field.type}" id="${field.id}" name="${field.id}" class="${cls}" ${requiredAttr} ${field.readonly ? "readonly" : ""} ${patternAttr} ${maxAttr} ${numericAttrs} step="any">`;
    }

    const numericHint = _getNumericFieldHintById(field.id);

    const dependentMeta = field.showIf
      ? `<div class="pd3i-field-context"><i class="fas fa-turn-up text-[10px]"></i> Field lanjutan · aktif jika <strong>${field.showIf.field}</strong> sesuai</div>`
      : "";

    return `<div class="${wrapperClass}" ${showIfAttr}>
      ${dependentMeta}
      <label for="${field.id}" class="block mb-2 text-sm font-extrabold text-slate-700 uppercase tracking-tight pd3i-field-label-generated">
        ${field.label} ${field.required ? '<span class="text-red-500">*</span>' : ""}
      </label>
      ${inputHtml}
      ${numericHint ? `<p class="mt-2 text-[11px] font-semibold text-slate-500">${numericHint}</p>` : ""}
    </div>`;
  }

  function renderSectionTitle(title) {
    return `<div class="col-span-1 md:col-span-2 lg:col-span-3 pd3i-section-banner"><div class="pd3i-section-banner-eyebrow">Sub-section diagnosis</div><div class="pd3i-section-banner-title">${title}</div></div>`;
  }

  // ============================================================
  // DYNAMIC TABLE DEFINITIONS
  // ============================================================
  function getContactSectionDefinition() {
    if (typeof CONTACT_SECTION !== "undefined") return CONTACT_SECTION;
    return {
      type: "dynamic_table",
      id: "Kontak Erat",
      label: "Daftar Kontak Erat",
      fullWidth: true,
      columns: [
        { name: "Nama", type: "text", width: "w-40" },
        { name: "Tanggal Lahir", type: "date", width: "w-36" },
        { name: "Umur", type: "text", readonly: true, width: "w-40" },
        { name: "Hub dgn Kasus", type: "text", width: "w-40" },
        { name: "Status Imunisasi", type: "select", width: "w-40", options: ["Lengkap", "Tidak lengkap", "Tidak tahu"] },
        { name: "Kondisi", type: "select", width: "w-40", options: ["Sehat", "Demam", "Ruam", "Suspek Campak", "Suspek Rubella", "Meninggal"] }
      ]
    };
  }

  function getImunisasiSectionDefinition() {
    return {
      type: "dynamic_table",
      id: "Riwayat Imunisasi",
      label: "Daftar Riwayat Imunisasi",
      fullWidth: true,
      columns: [
        { name: "Jenis Imunisasi", type: "text", width: "w-56", readonly: true },
        { name: "Status", type: "select", width: "w-36", options: ["Ya", "Tidak", "Belum cukup umur", "Tidak sesuai sasaran"] },
        { name: "Tanggal", type: "date", width: "w-32" },
        { name: "Sumber Informasi", type: "select", width: "w-44", options: ["Buku KIA/KMS", "Kartu/rekam imunisasi", "Aplikasi/Sertifikat", "Ingatan orang tua/wali", "Catatan sekolah", "Tidak diketahui", "Lainnya"] },
        { name: "Keterangan", type: "text", width: "w-44" }
      ]
    };
  }

  function getDynamicTableDefinition(tableId) {
    if (tableId === "Riwayat Imunisasi") return getImunisasiSectionDefinition();
    if (tableId === "Kontak Erat") return getContactSectionDefinition();
    if (tableId === "Riwayat Status Kasus") {
      const common = getCommonConfigSafe();
      const statusFields = (common && common.status) || [];
      return statusFields.find(function(f) { return f && f.id === "Riwayat Status Kasus"; }) || null;
    }
    return null;
  }

  // ============================================================
  // DYNAMIC ROWS
  // ============================================================
  window.addDynamicRow = function(tableId, presetRow) {
    const tbody = document.getElementById(`tbody-${tableId}`);
    if (!tbody) return;

    const def = getDynamicTableDefinition(tableId);
    if (!def || !Array.isArray(def.columns)) return;

    const tr = document.createElement("tr");
    tr.className = "bg-white border-b hover:bg-slate-50 transition";

    if (presetRow && presetRow.__kode) tr.dataset.kodeImun = presetRow.__kode;

    let rowHtml = "";
    def.columns.forEach(col => {
      const cls = `${col.readonly ? "bg-slate-100 cursor-not-allowed font-extrabold" : "bg-slate-50"} border border-slate-300 text-xs rounded block w-full p-1.5 ${col.width || ""}`;
      const value = presetRow && presetRow[col.name] !== undefined ? String(presetRow[col.name]) : "";

      if (["text", "date", "number", "tel", "email"].includes(col.type)) {
        rowHtml += `<td class="px-2 py-2">
          <input type="${col.type}" data-name="${col.name}" class="${cls}" value="${value.replace(/"/g, '&quot;')}" ${col.readonly ? 'readonly tabindex="-1"' : ""}>
        </td>`;
      } else {
        const opts = (col.options || []).map(o => `<option value="${o}" ${o === value ? "selected" : ""}>${o}</option>`).join("");
        rowHtml += `<td class="px-2 py-2">
          <select data-name="${col.name}" class="${cls}">
            <option value="">-</option>${opts}
          </select>
        </td>`;
      }
    });

    rowHtml += `<td class="px-2 py-2 text-center">
      <button type="button" onclick="removeDynamicRow(this, '${tableId}')" class="text-red-400 hover:text-red-600 p-2">
        <i class="fas fa-trash"></i>
      </button>
    </td>`;

    tr.innerHTML = rowHtml;
    tbody.appendChild(tr);

    const tglLahirInput = tr.querySelector('input[data-name="Tanggal Lahir"]');
    const umurInput = tr.querySelector('input[data-name="Umur"]');

    if (tglLahirInput && umurInput) {
      const updateUmurKontakErat = (hardValidate) => {
        const rawDob = String(tglLahirInput.value || "").trim();
        const refValue = document.getElementById("Tanggal Pelacakan")?.value || "";

        if (!isCompleteDateValue(rawDob)) {
          umurInput.value = "";
          return;
        }

        const res = validateBirthDateEpi(
          rawDob,
          isCompleteDateValue(refValue) ? refValue : ""
        );

        if (!res.ok) {
          umurInput.value = "";
          if (hardValidate) {
            tglLahirInput.value = "";
            showTopAlert(res.message, false);
          }
          return;
        }

        umurInput.value = res.ageText || "";
      };

      tglLahirInput.addEventListener("change", function() {
        updateUmurKontakErat(false);
      });

      tglLahirInput.addEventListener("blur", function() {
        updateUmurKontakErat(true);
      });
    }

    if (tableId === "Riwayat Imunisasi") {
      const statusSelect = tr.querySelector('select[data-name="Status"]');
      if (statusSelect) statusSelect.addEventListener("change", updateImunisasiSummary);
    }
  };

  window.removeDynamicRow = function(btn, tableId) {
    const tr = btn.closest("tr");
    if (tr) tr.remove();
    if (tableId === "Riwayat Imunisasi") updateImunisasiSummary();
  };

  function addDefaultRowsForDynamicTables() {
    document.querySelectorAll("table[data-dynamic-table]").forEach(tbl => {
      const id = tbl.getAttribute("data-dynamic-table");
      if (id === "Riwayat Imunisasi") return;
      const tbody = document.getElementById(`tbody-${id}`);
      if (tbody && tbody.children.length === 0) addDynamicRow(id);
    });
  }

  // ============================================================
  // GEOLOCATION
  // ============================================================
  function buildDomisiliAddressQuery() {
    const parts = [
      document.getElementById("Alamat")?.value || "",
      (() => {
        const rt = document.getElementById("RT")?.value || "";
        const rw = document.getElementById("RW")?.value || "";
        if (!rt && !rw) return "";
        const rtText = rt ? `RT ${rt}` : "";
        const rwText = rw ? `RW ${rw}` : "";
        return [rtText, rwText].filter(Boolean).join(" ");
      })(),
      document.getElementById("Kelurahan")?.value || "",
      document.getElementById("Kecamatan")?.value || "",
      document.getElementById("Kab/Kota Pasien")?.value || "",
      document.getElementById("Provinsi Pasien")?.value || "",
      "Indonesia"
    ];

    return parts.map(function(v) { return String(v || "").trim(); }).filter(Boolean).join(", ");
  }

  async function geocodeDomisiliAddress(query) {
    const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=id&q=${encodeURIComponent(query)}`;
    const res = await fetch(url, {
      method: "GET",
      headers: { "Accept": "application/json" }
    });
    if (!res.ok) {
      throw new Error("Layanan pencarian lokasi sedang gagal.");
    }
    const rows = await res.json();
    return Array.isArray(rows) ? rows[0] : null;
  }

  function setCoordinateManualMode(enabled) {
    const latEl = document.getElementById("Latitude");
    const lonEl = document.getElementById("Longitude");
    const editable = !!enabled && !isViewerSession();

    [latEl, lonEl].forEach(function(el) {
      if (!el) return;

      el.classList.remove("bg-slate-100", "cursor-not-allowed", "font-extrabold", "text-slate-600", "bg-white", "focus:ring-blue-500", "focus:border-blue-500", "border-amber-300", "ring-1", "ring-amber-200");

      if (editable) {
        el.removeAttribute("readonly");
        el.placeholder = "Isi manual jika titik tidak ditemukan";
        el.classList.add("bg-white", "focus:ring-blue-500", "focus:border-blue-500", "border-amber-300", "ring-1", "ring-amber-200");
      } else {
        el.setAttribute("readonly", "readonly");
        el.placeholder = "Akan terisi otomatis / bisa dibuka manual jika gagal";
        el.classList.add("bg-slate-100", "cursor-not-allowed", "font-extrabold", "text-slate-600");
      }
    });
  }

  function initGeoButton() {
    const btn = document.getElementById("btn-ambil-lokasi");
    const btnCariAlamat = document.getElementById("btn-cari-lokasi-alamat");
    const latEl = document.getElementById("Latitude");
    const lonEl = document.getElementById("Longitude");
    const statusEl = document.getElementById("geo-status");

    if (!btn || !latEl || !lonEl || !statusEl) return;
    setCoordinateManualMode(false);
    if (btn.dataset.bound === "1") return;
    btn.dataset.bound = "1";
    if (btnCariAlamat) btnCariAlamat.dataset.bound = "1";

    btn.addEventListener("click", function() {
      if (!navigator.geolocation) {
        setCoordinateManualMode(true);
        statusEl.textContent = "Geolocation tidak didukung di perangkat/browser ini. Isi latitude/longitude manual.";
        statusEl.className = "flex-1 px-4 py-3 rounded-lg border border-red-200 bg-red-50 text-red-700 text-sm font-semibold";
        return;
      }

      setCoordinateManualMode(false);
      statusEl.textContent = "Sedang mengambil lokasi...";
      statusEl.className = "flex-1 px-4 py-3 rounded-lg border border-blue-200 bg-blue-50 text-blue-700 text-sm font-semibold";

      navigator.geolocation.getCurrentPosition(
        function(position) {
          const lat = position.coords.latitude.toFixed(6);
          const lon = position.coords.longitude.toFixed(6);
          latEl.value = lat;
          lonEl.value = lon;
          setCoordinateManualMode(false);
          statusEl.textContent = `Lokasi berhasil diambil. Lat: ${lat}, Lon: ${lon}`;
          statusEl.className = "flex-1 px-4 py-3 rounded-lg border border-green-200 bg-green-50 text-green-700 text-sm font-semibold";
        },
        function(error) {
          let msg = "Gagal mengambil lokasi.";
          if (error.code === 1) msg = "Izin lokasi ditolak.";
          else if (error.code === 2) msg = "Lokasi tidak tersedia.";
          else if (error.code === 3) msg = "Permintaan lokasi timeout.";
          setCoordinateManualMode(true);
          statusEl.textContent = msg + " Isi latitude/longitude manual jika perlu.";
          statusEl.className = "flex-1 px-4 py-3 rounded-lg border border-red-200 bg-red-50 text-red-700 text-sm font-semibold";
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    });

    if (btnCariAlamat) {
      btnCariAlamat.addEventListener("click", async function() {
        const query = buildDomisiliAddressQuery();
        if (!query) {
          setCoordinateManualMode(true);
          statusEl.textContent = "Alamat domisili belum cukup lengkap untuk dicari. Isi alamat, wilayah, atau koordinat manual.";
          statusEl.className = "flex-1 px-4 py-3 rounded-lg border border-red-200 bg-red-50 text-red-700 text-sm font-semibold";
          return;
        }

        btnCariAlamat.disabled = true;
        btnCariAlamat.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mencari...';
        setCoordinateManualMode(false);
        statusEl.textContent = `Mencari koordinat dari alamat: ${query}`;
        statusEl.className = "flex-1 px-4 py-3 rounded-lg border border-blue-200 bg-blue-50 text-blue-700 text-sm font-semibold";

        try {
          const match = await geocodeDomisiliAddress(query);
          if (!match || !match.lat || !match.lon) {
            throw new Error("Alamat tidak ditemukan.");
          }

          const lat = Number(match.lat).toFixed(6);
          const lon = Number(match.lon).toFixed(6);
          latEl.value = lat;
          lonEl.value = lon;
          setCoordinateManualMode(false);
          statusEl.textContent = `Koordinat ditemukan dari alamat. Lat: ${lat}, Lon: ${lon}`;
          statusEl.className = "flex-1 px-4 py-3 rounded-lg border border-green-200 bg-green-50 text-green-700 text-sm font-semibold";
        } catch (err) {
          setCoordinateManualMode(true);
          statusEl.textContent = ((err && err.message) || "Gagal mencari koordinat dari alamat.") + " Isi latitude/longitude manual jika perlu.";
          statusEl.className = "flex-1 px-4 py-3 rounded-lg border border-red-200 bg-red-50 text-red-700 text-sm font-semibold";
        } finally {
          btnCariAlamat.disabled = false;
          btnCariAlamat.innerHTML = '<i class="fas fa-magnifying-glass-location"></i> Cari dari Alamat';
        }
      });
    }
  }

  // ============================================================
  // WILAYAH
  // ============================================================
  function initWilayahDropdowns() {
    fetch(`${API_WILAYAH_BASE}/provinces.json`)
      .then(res => res.json())
      .then(data => {
        const provPelapor = document.getElementById("Provinsi");
        const provPasien = document.getElementById("Provinsi Pasien");

        if (provPelapor) {
          provPelapor.innerHTML = '<option value="">Pilih Provinsi</option>';
          data.forEach(p => {
            provPelapor.innerHTML += `<option value="${p.name}" data-id="${p.id}">${p.name}</option>`;
          });
        }

        if (provPasien) {
          provPasien.innerHTML = '<option value="">Pilih Provinsi</option>';
          data.forEach(p => {
            provPasien.innerHTML += `<option value="${p.name}" data-id="${p.id}">${p.name}</option>`;
          });
        }
      })
      .catch(err => console.error("load provinces failed:", err));
  }

  // ============================================================
  // REF FASKES
  // ============================================================
  window.loadFaskesRealtime = function(selectedUnitName, forceReload) {
    if (!safeGsRun() || !SESSION_TOKEN) return;

    const hasCache = Array.isArray(MASTER_FASKES) && MASTER_FASKES.length > 0;
    if (hasCache && !forceReload) {
      const src = document.getElementById("Sumber Laporan");
      const currentSelected =
        selectedUnitName ||
        document.getElementById("Nama unit pelapor")?.value ||
        "";

      if (src && src.value) {
        initChoices(src.value, currentSelected);
      }

      if (document.getElementById("Nama Rumah Sakit")) {
        const currentRs = document.getElementById("Nama Rumah Sakit")?.value || "";
        initChoicesRumahSakit(currentRs);
      }
      return;
    }

    google.script.run
      .withSuccessHandler(function(data) {
        MASTER_FASKES = Array.isArray(data) ? data : [];

        const src = document.getElementById("Sumber Laporan");
        const currentSelected =
          selectedUnitName ||
          document.getElementById("Nama unit pelapor")?.value ||
          "";

        if (src && src.value) {
          initChoices(src.value, currentSelected);
        }

        if (document.getElementById("Nama Rumah Sakit")) {
          const currentRs = document.getElementById("Nama Rumah Sakit")?.value || "";
          initChoicesRumahSakit(currentRs);
        }
      })
      .withFailureHandler(function(err) {
        console.error("getFaskesFromSheet failed:", err);
        MASTER_FASKES = [];
      })
      .getFaskesFromSheet(SESSION_TOKEN);
  };

  function isPcvCode(kode) {
    return ["PCV1", "PCV2", "PCV3"].includes(String(kode || "").trim().toUpperCase());
  }

  function collectExistingImunisasiState(tbody) {
    const map = {};
    if (!tbody) return map;

    Array.from(tbody.querySelectorAll("tr")).forEach(row => {
      const kode = String(row.dataset.kodeImun || "").trim().toUpperCase();
      if (!kode) return;
      const status = row.querySelector('select[data-name="Status"]')?.value || "";
      const tanggal = row.querySelector('input[data-name="Tanggal"]')?.value || "";
      const sumber = row.querySelector('select[data-name="Sumber Informasi"]')?.value || "";
      const keterangan = row.querySelector('input[data-name="Keterangan"]')?.value || "";
      const statusOrigin = String(row.dataset.statusOrigin || "").trim().toLowerCase();
      const isManual = statusOrigin === "manual" || ["YA", "TIDAK"].includes(String(status).trim().toUpperCase()) || !!tanggal || !!sumber;

      map[kode] = {
        kode,
        status,
        tanggal,
        sumber,
        keterangan,
        statusOrigin: isManual ? "manual" : (statusOrigin || "auto")
      };
    });

    return map;
  }

  function getRuleMap() {
    const map = {};
    (Array.isArray(REF_IMUN) ? REF_IMUN : []).forEach(rule => {
      const kode = String(rule?.KodeImunisasi || "").trim().toUpperCase();
      if (kode) map[kode] = rule;
    });
    return map;
  }

  function isAutoLockedStatus(status) {
    const s = String(status || "").trim();
    return s === "Belum cukup umur" || s === "Tidak sesuai sasaran";
  }

  function shouldPreserveManualImunisasiState(previousState, ruleMap) {
    if (!previousState) return false;
    if (String(previousState.statusOrigin || "").toLowerCase() === "manual") return true;

    const status = String(previousState.status || "").trim();
    if (!status && !previousState.tanggal && !previousState.sumber && !previousState.keterangan) return false;
    if (status === "Ya" || status === "Tidak") return true;
    if (previousState.tanggal || previousState.sumber) return true;

    if (isPcvCode(previousState.kode)) {
      const rule = ruleMap[String(previousState.kode || "").trim().toUpperCase()];
      if (rule && previousState.keterangan && String(previousState.keterangan).trim() !== String(rule.Catatan || "").trim()) return true;
    }

    return false;
  }

  function getPcvHistoryFromStateMap(existingStateMap) {
    const rows = Object.values(existingStateMap || {}).filter(item => isPcvCode(item.kode));
    const yesRows = rows
      .filter(item => String(item.status || "").trim().toUpperCase() === "YA")
      .map(item => ({ ...item, parsedDate: parseDateSafe(item.tanggal) }))
      .sort((a, b) => {
        if (a.parsedDate && b.parsedDate) return a.parsedDate - b.parsedDate;
        if (a.parsedDate) return -1;
        if (b.parsedDate) return 1;
        return a.kode.localeCompare(b.kode);
      });

    return {
      yesRows,
      givenCount: yesRows.length,
      lastDoseDate: yesRows.length ? (yesRows[yesRows.length - 1].parsedDate || null) : null,
      hasAnyUndatedYes: yesRows.some(item => !item.parsedDate)
    };
  }

  function diffWeeks(fromDate, toDate) {
    if (!(fromDate instanceof Date) || isNaN(fromDate) || !(toDate instanceof Date) || isNaN(toDate)) return null;
    return Math.floor((toDate.getTime() - fromDate.getTime()) / (1000 * 60 * 60 * 24 * 7));
  }

  function getAgeInMonths(ageParts) {
    if (!ageParts) return null;
    return Number(ageParts.years || 0) * 12 + Number(ageParts.months || 0);
  }

  function getPcvCatchupPlan(context) {
    const ageParts = context.ageParts;
    const ageMonths = getAgeInMonths(ageParts);
    if (ageMonths === null) return null;

    if (ageMonths >= 60) {
      return { bucket: "OUT_OF_TARGET", targetTotalDoses: 0, minIntervalWeeks: 8 };
    }
    if (ageMonths >= 24) {
      return { bucket: "24_59_MONTHS", targetTotalDoses: 1, minIntervalWeeks: 8 };
    }
    if (ageMonths >= 12) {
      return { bucket: "12_23_MONTHS", targetTotalDoses: 2, minIntervalWeeks: 8 };
    }
    return { bucket: "LT12_MONTHS", targetTotalDoses: 3, minIntervalWeeks: 8 };
  }

  function evaluatePcvStatus(rule, context) {
    const kode = String(rule.KodeImunisasi || "").trim().toUpperCase();
    const plan = getPcvCatchupPlan(context);
    const bawahUmur = rule.StatusDiBawahUmur || "Belum cukup umur";
    const luarSasaran = rule.StatusDiLuarSasaran || "Tidak sesuai sasaran";
    if (!plan) return bawahUmur;

    const existing = context.existingImunisasiState || {};
    const current = existing[kode] || null;
    if (current && String(current.status || "").trim().toUpperCase() === "YA") return "";

    const history = getPcvHistoryFromStateMap(existing);
    const givenCount = history.givenCount;
    const trackingDate = context.tglPelacakan || new Date();
    const weeksSinceLastDose = history.lastDoseDate ? diffWeeks(history.lastDoseDate, trackingDate) : null;
    const enoughInterval = !history.lastDoseDate ? !history.hasAnyUndatedYes : (weeksSinceLastDose !== null && weeksSinceLastDose >= plan.minIntervalWeeks);

    if (plan.bucket === "OUT_OF_TARGET") return luarSasaran;

    if (plan.bucket === "24_59_MONTHS") {
      if (kode === "PCV1") return givenCount >= 1 ? luarSasaran : "";
      return luarSasaran;
    }

    if (plan.bucket === "12_23_MONTHS") {
      if (kode === "PCV1") return givenCount >= 1 ? luarSasaran : "";
      if (kode === "PCV2") {
        if (givenCount === 0) return bawahUmur;
        if (givenCount >= 2) return luarSasaran;
        return enoughInterval ? "" : bawahUmur;
      }
      return luarSasaran;
    }

    if (kode === "PCV1") {
      return compareMinAge(context.ageParts, rule) ? (givenCount >= 1 ? luarSasaran : "") : bawahUmur;
    }

    if (kode === "PCV2") {
      if (givenCount === 0) return bawahUmur;
      if (givenCount >= 2) return luarSasaran;
      const enoughAge = compareMinAge(context.ageParts, rule);
      return enoughAge && enoughInterval ? "" : bawahUmur;
    }

    if (kode === "PCV3") {
      if (givenCount < 2) return bawahUmur;
      if (givenCount >= 3) return luarSasaran;
      const enoughAge = compareMinAge(context.ageParts, rule);
      return enoughAge && enoughInterval ? "" : bawahUmur;
    }

    return "";
  }

  function hasExplicitMinAge(rule) {
    return Number(rule?.UmurMinHari || 0) > 0 || Number(rule?.UmurMinBulan || 0) > 0 || Number(rule?.UmurMinTahun || 0) > 0;
  }

  function buildRuleWithKelompokUsiaFallback(rule) {
    if (!rule) return rule;
    if (hasExplicitMinAge(rule)) return rule;

    const kelompok = String(rule.KelompokUsia || "").trim().toLowerCase();
    if (!kelompok) return rule;

    const nextRule = { ...rule };
    const match = kelompok.match(/(\d+)\s*(hari|bulan|tahun|sd|smp)/i);
    if (!match) return nextRule;

    const num = Number(match[1] || 0);
    const unit = String(match[2] || "").toLowerCase();

    if (unit === "hari") nextRule.UmurMinHari = num;
    else if (unit === "bulan") nextRule.UmurMinBulan = num;
    else if (unit === "tahun") nextRule.UmurMinTahun = num;

    return nextRule;
  }

  function getImunisasiRuleSortKey(rule) {
    const r = buildRuleWithKelompokUsiaFallback(rule);
    const basis = String(r?.BasisValidasi || "").toUpperCase();
    if (basis === "KELAS") {
      return (Number(r?.KelasMin || 0) * 100) + Number(r?.UrutanDosis || 0);
    }
    return (Number(r?.UmurMinTahun || 0) * 3650) + (Number(r?.UmurMinBulan || 0) * 30) + Number(r?.UmurMinHari || 0) + (Number(r?.UrutanDosis || 0) / 100);
  }

  function evaluateImunisasiStatus(rule, context) {
    const normalizedRule = buildRuleWithKelompokUsiaFallback(rule);
    const jk = normalizeSex(context.jk);
    const kelas = normalizeClassValue(context.kelasSaatIni);
    const statusSekolah = String(context.statusSekolah || "").trim().toUpperCase();

    const actualAgeParts = context.ageParts;
    const hasActualAge = !!actualAgeParts;
    const birthDate = context.birthDate || null;

    const estSchoolAge = estimateSchoolAgeFromClass(context.kelasSaatIni);
    const estimatedAgeParts = estSchoolAge ? buildAgePartsFromEstimatedYears(estSchoolAge.minYears) : null;
    const effectiveAgeParts = hasActualAge ? actualAgeParts : estimatedAgeParts;

    if (normalizedRule.JKTarget && normalizedRule.JKTarget !== "SEMUA" && jk && normalizedRule.JKTarget !== jk) {
      return normalizedRule.StatusDiLuarSasaran || "Tidak sesuai sasaran";
    }

    const introCheck = checkIntroduksiEligibility(normalizedRule, birthDate);
    if (introCheck.applies && introCheck.eligible === false) {
      return normalizedRule.StatusDiLuarSasaran || "Tidak sesuai sasaran";
    }

    const basis = String(normalizedRule.BasisValidasi || "").toUpperCase();

    if (basis === "KELAS") {
      const kelasMin = normalizedRule.KelasMin ? Number(normalizedRule.KelasMin) : null;
      const kelasMax = normalizedRule.KelasMax ? Number(normalizedRule.KelasMax) : null;

      if (hasActualAge) {
        const actualYears = Number(actualAgeParts.years || 0);
        if (actualYears < 6) return normalizedRule.StatusDiBawahUmur || "Belum cukup umur";
      }

      if (String(normalizedRule.ButuhSekolah || "").toUpperCase() === "YA" && statusSekolah !== "Sekolah") {
        if (hasActualAge && Number(actualAgeParts.years || 0) >= 6) return "";
        return normalizedRule.StatusDiBawahUmur || "Belum cukup umur";
      }

      if (kelas === null) {
        if (hasActualAge && Number(actualAgeParts.years || 0) >= 6) return "";
        return normalizedRule.StatusDiBawahUmur || "Belum cukup umur";
      }

      if (kelasMin !== null && kelas < kelasMin) return normalizedRule.StatusDiBawahUmur || "Belum cukup umur";
      if (kelasMax !== null && kelas > kelasMax) return normalizedRule.StatusDiLuarSasaran || "Tidak sesuai sasaran";
      return "";
    }

    if (basis === "UMUR_DAN_KELAS") {
      const cukupUmur = compareMinAge(effectiveAgeParts, normalizedRule);
      const masihMasukUmur = compareMaxAge(effectiveAgeParts, normalizedRule);
      const kelasMin = normalizedRule.KelasMin ? Number(normalizedRule.KelasMin) : null;
      const kelasMax = normalizedRule.KelasMax ? Number(normalizedRule.KelasMax) : null;

      if (!cukupUmur) return normalizedRule.StatusDiBawahUmur || "Belum cukup umur";
      if (!masihMasukUmur) return normalizedRule.StatusDiLuarSasaran || "Tidak sesuai sasaran";

      if (String(normalizedRule.ButuhSekolah || "").toUpperCase() === "YA" && statusSekolah !== "Sekolah") {
        if (hasActualAge && Number(actualAgeParts.years || 0) >= 6) return "";
        return normalizedRule.StatusDiBawahUmur || "Belum cukup umur";
      }

      if (kelas === null) {
        if (hasActualAge && Number(actualAgeParts.years || 0) >= 6) return "";
        return normalizedRule.StatusDiBawahUmur || "Belum cukup umur";
      }

      if (kelasMin !== null && kelas < kelasMin) return normalizedRule.StatusDiBawahUmur || "Belum cukup umur";
      if (kelasMax !== null && kelas > kelasMax) return normalizedRule.StatusDiLuarSasaran || "Tidak sesuai sasaran";

      return "";
    }

    const cukupUmur = compareMinAge(effectiveAgeParts, normalizedRule);
    if (!cukupUmur) return normalizedRule.StatusDiBawahUmur || "Belum cukup umur";
    if (!compareMaxAge(effectiveAgeParts, normalizedRule)) return normalizedRule.StatusDiLuarSasaran || "Tidak sesuai sasaran";
    return "";
  }

  function updateImunisasiSummary() {
    const tbody = document.getElementById("tbody-Riwayat Imunisasi");
    const txt = document.getElementById("imun-summary-text");
    const sub = document.getElementById("imun-summary-subtext");
    const dueEl = document.getElementById("imun-summary-due");
    const yesEl = document.getElementById("imun-summary-yes");
    const hidden = document.getElementById("Ringkasan Riwayat Imunisasi");

    if (!tbody || !txt || !sub || !dueEl || !yesEl || !hidden) return;

    const rows = Array.from(tbody.querySelectorAll("tr"));
    let relevantCount = 0;
    let documentedCount = 0;
    let yesCount = 0;
    let noCount = 0;
    let unknownCount = 0;

    rows.forEach(row => {
      const status = String(row.querySelector('select[data-name="Status"]')?.value || "").trim();
      if (!status || status === "Belum cukup umur" || status === "Tidak sesuai sasaran") return;
      relevantCount++;
      if (["Ya", "Tidak"].includes(status)) documentedCount++;
      if (status === "Ya") yesCount++;
      else if (status === "Tidak") noCount++;
      else unknownCount++;
    });

    dueEl.textContent = String(relevantCount);
    yesEl.textContent = String(yesCount);

    const umurText = document.getElementById("Umur (auto)")?.value || "umur tidak diketahui";
    const jkText = document.getElementById("JK")?.value || "jenis kelamin tidak diketahui";

    let summary = "Belum diringkas";
    const subParts = [`Ringkasan riwayat imunisasi untuk pasien usia ${umurText} dengan jenis kelamin ${jkText}.`];

    if (rows.length === 0) {
      summary = "Belum ada data";
      subParts.push("Baris riwayat imunisasi belum tersedia.");
    } else if (relevantCount === 0) {
      summary = "Belum ada item relevan";
      subParts.push("Belum ada item imunisasi yang relevan untuk usia/sasaran saat ini.");
    } else {
      summary = `${documentedCount}/${relevantCount} item terdokumentasi`;
      subParts.push(`${documentedCount} dari ${relevantCount} item imunisasi yang relevan sudah punya status dokumentasi.`);
      if (yesCount) subParts.push(`${yesCount} item tercatat Ya.`);
      if (noCount) subParts.push(`${noCount} item tercatat Tidak.`);
      if (unknownCount) subParts.push(`${unknownCount} item masih kosong / belum dipastikan.`);
    }

    txt.textContent = summary;
    sub.textContent = subParts.join(" ");
    hidden.value = `${summary} — ${subParts.join(" ")}`;

    if (documentedCount === 0) txt.className = "mt-2 text-lg font-black text-blue-900";
    else if (documentedCount < relevantCount) txt.className = "mt-2 text-lg font-black text-amber-700";
    else txt.className = "mt-2 text-lg font-black text-green-700";
  }

  function buildRiwayatImunisasiRows() {
    const tbody = document.getElementById("tbody-Riwayat Imunisasi");
    if (!tbody) return;

    const existingImunisasiState = collectExistingImunisasiState(tbody);
    const birthDate = parseDateSafe(document.getElementById("Tanggal Lahir")?.value);
    const tglPelacakan = parseDateSafe(document.getElementById("Tanggal Pelacakan")?.value) || new Date();
    const jk = document.getElementById("JK")?.value || "";
    const statusSekolah = document.getElementById("Apakah sekolah/bekerja?")?.value || "";
    const kelasSaatIni = document.getElementById("Kelas Saat Ini")?.value || "";

    tbody.innerHTML = "";

    const ageParts = diffAgeParts(birthDate, tglPelacakan);
    const context = { jk, statusSekolah, kelasSaatIni, ageParts, birthDate, tglPelacakan, existingImunisasiState };
    const hasCoreContext = !!birthDate && !!jk;
    const rules = Array.isArray(REF_IMUN) ? REF_IMUN.filter(r => r && r.KodeImunisasi && r.LabelImunisasi) : [];
    const ruleMap = getRuleMap();

    console.log("[imunisasi] build rows", { ruleCount: rules.length, hasCoreContext, tbodyId: tbody.id, source: rules[0]?.__source || null });

    rules.forEach(rule => {
      const kode = String(rule.KodeImunisasi || "").trim().toUpperCase();
      const previous = existingImunisasiState[kode] || null;
      const preserveManualState = shouldPreserveManualImunisasiState(previous, ruleMap);
      const autoStatus = hasCoreContext ? evaluateImunisasiStatus(rule, context) : "";
      const finalStatus = preserveManualState ? (previous?.status || autoStatus || "") : (autoStatus || "");
      const finalTanggal = preserveManualState ? (previous?.tanggal || "") : "";
      const finalSumber = preserveManualState ? (previous?.sumber || "") : "";
      const finalKeterangan = preserveManualState ? (previous?.keterangan || rule.Catatan || "") : (rule.Catatan || "");

      const preset = {
        __kode: rule.KodeImunisasi,
        "Jenis Imunisasi": rule.LabelImunisasi,
        "Status": finalStatus,
        "Tanggal": finalTanggal,
        "Sumber Informasi": finalSumber,
        "Keterangan": finalKeterangan
      };

      window.addDynamicRow("Riwayat Imunisasi", preset);

      const lastRow = tbody.lastElementChild;
      if (!lastRow) return;

      const statusSelect = lastRow.querySelector('select[data-name="Status"]');
      const tglInput = lastRow.querySelector('input[data-name="Tanggal"]');
      const sumberSelect = lastRow.querySelector('select[data-name="Sumber Informasi"]');
      lastRow.dataset.statusOrigin = preserveManualState ? "manual" : "auto";
      if (statusSelect && !statusSelect.dataset.boundImunOrigin) {
        statusSelect.dataset.boundImunOrigin = "1";
        statusSelect.addEventListener("change", () => {
          lastRow.dataset.statusOrigin = ["Ya", "Tidak"].includes(statusSelect.value) ? "manual" : "auto";
          updateImunisasiSummary();
        });
      }
      if (tglInput && !tglInput.dataset.boundImunOrigin) {
        tglInput.dataset.boundImunOrigin = "1";
        tglInput.addEventListener("input", () => { lastRow.dataset.statusOrigin = "manual"; });
      }
      if (sumberSelect && !sumberSelect.dataset.boundImunOrigin) {
        sumberSelect.dataset.boundImunOrigin = "1";
        sumberSelect.addEventListener("change", () => { lastRow.dataset.statusOrigin = "manual"; });
      }
    });

    if (rules.length === 0) {
      console.warn("[imunisasi] REF_IMUN kosong saat build");
    }

    updateImunisasiSummary();
  }

  function forceBuildImunisasiWhenReady() {
    const attempt = () => {
      const tbody = document.getElementById("tbody-Riwayat Imunisasi");
      if (!tbody) return false;
      if (!Array.isArray(REF_IMUN) || REF_IMUN.length === 0) return false;
      if (tbody.children.length > 0) return true;
      buildRiwayatImunisasiRows();
      return tbody.children.length > 0;
    };

    let delays = [0, 150, 400, 800, 1500];
    delays.forEach(ms => {
      setTimeout(() => {
        const ok = attempt();
        console.log("[imunisasi] force build attempt", { ms, ok, refLen: Array.isArray(REF_IMUN) ? REF_IMUN.length : null, rows: document.getElementById("tbody-Riwayat Imunisasi")?.children.length ?? null });
      }, ms);
    });
  }

  const FORM_DRAFT_TTL_MS = 30 * 60 * 1000;

  function saveFormDraft() {
    try {
      const selector = document.getElementById("form-selector");
      const form = document.getElementById("dynamic-form");
      if (!selector || !form || form.classList.contains("hidden")) return;

      const dx = String(selector.value || "").trim();
      if (!dx) return;

      const fields = {};
      form.querySelectorAll("input[name], select[name], textarea[name]").forEach(el => {
        fields[el.name] = el.value;
      });

      const now = Date.now();
      const draft = {
        version: 1,
        savedAt: now,
        expiresAt: now + FORM_DRAFT_TTL_MS,
        dx,
        isEditMode: !!window.isEditMode,
        searchEpid: document.getElementById("search-epid")?.value || "",
        fields,
        tables: {
          "Kontak Erat": collectDynamicTableData("Kontak Erat"),
          "Riwayat Imunisasi": collectDynamicTableData("Riwayat Imunisasi"),
          "Riwayat Status Kasus": collectDynamicTableData("Riwayat Status Kasus")
        }
      };

      sessionStorage.setItem(FORM_DRAFT_KEY, JSON.stringify(draft));
    } catch (e) {
      console.warn("Gagal menyimpan draft:", e);
    }
  }

  function clearFormDraft() {
    try {
      sessionStorage.removeItem(FORM_DRAFT_KEY);
    } catch (e) {}
  }

  function getFormDraft() {
    try {
      const raw = sessionStorage.getItem(FORM_DRAFT_KEY);
      const draft = raw ? JSON.parse(raw) : null;
      if (!draft) return null;
      if (draft.expiresAt && Date.now() > Number(draft.expiresAt)) {
        clearFormDraft();
        return null;
      }
      return draft;
    } catch (e) {
      return null;
    }
  }

  function restoreDraftRows(tableId, rows) {
    const tbody = document.getElementById(`tbody-${tableId}`);
    if (!tbody) return;
    tbody.innerHTML = "";
    (rows || []).forEach(item => addDynamicRow(tableId, item));
  }

  function restoreFormDraft() {
    try {
      const draft = getFormDraft();
      if (!draft || !draft.dx) return false;

      const selector = document.getElementById("form-selector");
      if (!selector) return false;

      selector.value = draft.dx;
      selector.dispatchEvent(new Event("change", { bubbles: true }));

      setTimeout(async () => {
        const fields = draft.fields || {};
        Object.keys(fields).forEach(name => {
          const el = document.getElementsByName(name)[0];
          if (el) {
            el.value = fields[name];
            el.dispatchEvent(new Event("change", { bubbles: true }));
          }
        });

        const searchEpid = document.getElementById("search-epid");
        if (searchEpid && draft.searchEpid) searchEpid.value = draft.searchEpid;

        if (typeof loadRefImunisasi === "function") {
          await loadRefImunisasi();
        }

        if (draft.tables) {
          restoreDraftRows("Kontak Erat", draft.tables["Kontak Erat"] || []);
          restoreDraftRows("Riwayat Imunisasi", draft.tables["Riwayat Imunisasi"] || []);
          restoreDraftRows("Riwayat Status Kasus", draft.tables["Riwayat Status Kasus"] || []);
        }

        if (typeof updateImunisasiSummary === "function") {
          updateImunisasiSummary();
        }

        showTopAlert("Draft sebelumnya berhasil dipulihkan.", true);
      }, 350);

      return true;
    } catch (e) {
      console.warn("Gagal restore draft:", e);
      return false;
    }
  }

  const NUMERIC_ONLY_EXACT_IDS = [
    "NIK",
    "NIK Pasien",
    "RT",
    "RW",
    "No Whatsapp Petugas",
    "No. kontak orang tua/wali",
    "No Telp/WA Orang Tua/Wali",
    "No Telp Orang Tua/Wali",
    "No. Telp Orang Tua/Wali",
    "No. Kontak Pasien",
    "No. Telepon Wali",
    "No. Telp Dokter AFP"
  ];

  const NUMERIC_ONLY_KEYWORDS = [
    "nik",
    "whatsapp",
    "no whatsapp",
    "no. whatsapp",
    "no telp",
    "no. telp",
    "kontak",
    "rt",
    "rw"
  ];

  function _normalizeFieldId_(value) {
    return String(value || "").trim().toLowerCase();
  }

  function isNumericOnlyFieldId(fieldId) {
    const id = _normalizeFieldId_(fieldId);
    if (!id) return false;

    if (NUMERIC_ONLY_EXACT_IDS.some(x => _normalizeFieldId_(x) === id)) return true;
    if (id === "rt" || id === "rw") return true;

    return NUMERIC_ONLY_KEYWORDS.some(k => id.includes(k));
  }

  const NUMERIC_LENGTH_RULES = {
    "nik": { exact: 16 },
    "nik pasien": { exact: 16 },
    "rt": { min: 1, max: 3, pad3: true },
    "rw": { min: 1, max: 3, pad3: true },
    "no whatsapp petugas": { min: 10, max: 15, phone: true },
    "no. kontak orang tua/wali": { min: 10, max: 15, phone: true },
    "no telp/wa orang tua/wali": { min: 10, max: 15, phone: true },
    "no telp orang tua/wali": { min: 10, max: 15, phone: true },
    "no. telp orang tua/wali": { min: 10, max: 15, phone: true },
    "no. kontak pasien": { min: 10, max: 15, phone: true },
    "no. telepon wali": { min: 10, max: 15, phone: true },
    "no. telp dokter afp": { min: 10, max: 15, phone: true }
  };

  function _sanitizeNumericValue_(value) {
    return String(value || "").replace(/\D+/g, "");
  }

  function _getNumericLengthRule_(fieldId) {
    const id = _normalizeFieldId_(fieldId);
    return NUMERIC_LENGTH_RULES[id] || null;
  }

  function _normalizePhonePrefix_(digits) {
    const v = String(digits || "");
    if (!v) return v;
    if (v.startsWith("62")) return v;
    if (v.startsWith("0")) return "62" + v.slice(1);
    return v;
  }

  function enforceNumericOnlyInput(el, options) {
    if (!el || !el.id || !isNumericOnlyFieldId(el.id)) return;
    const opts = options || {};
    const onBlur = opts.onBlur === true;

    const rule = _getNumericLengthRule_(el.id);
    let cleaned = _sanitizeNumericValue_(el.value);

    if (rule && rule.phone && onBlur) {
      cleaned = _normalizePhonePrefix_(cleaned);
    }

    if (rule && rule.exact) {
      cleaned = cleaned.slice(0, Number(rule.exact));
    } else if (rule && rule.max) {
      cleaned = cleaned.slice(0, Number(rule.max));
    }

    if (rule && rule.pad3 && onBlur && cleaned) {
      cleaned = cleaned.padStart(3, "0");
    }

    if (String(el.value || "") !== cleaned) {
      el.value = cleaned;
    }
  }

  function validateNumericOnlyRequiredFields() {
    const invalids = [];
    const form = document.getElementById("dynamic-form");
    if (!form) return { ok: true, invalids: [] };

    form.querySelectorAll("input[name], textarea[name]").forEach(function(el) {
      if (!el || el.disabled || !el.id) return;
      if (!isNumericOnlyFieldId(el.id)) return;

      const raw = String(el.value || "").trim();
      if (!raw) return;
      if (!/^\d+$/.test(raw)) {
        invalids.push(el.id + " (harus angka)");
        return;
      }

      const rule = _getNumericLengthRule_(el.id);
      if (!rule) return;

      const len = raw.length;
      if (rule.exact && len !== Number(rule.exact)) {
        invalids.push(el.id + " (harus " + rule.exact + " digit)");
        return;
      }

      if (rule.phone && !(raw.startsWith("08") || raw.startsWith("62"))) {
        invalids.push(el.id + " (harus diawali 08 atau 62)");
        return;
      }

      const min = Number(rule.min || 0);
      const max = Number(rule.max || 0);
      if (min && len < min) {
        invalids.push(el.id + " (minimal " + min + " digit)");
        return;
      }
      if (max && len > max) {
        invalids.push(el.id + " (maksimal " + max + " digit)");
      }
    });

    return { ok: invalids.length === 0, invalids: invalids };
  }

  function getAllowedSchoolActivityOptions(validationRes) {
    const baseOptions = ["Belum sekolah", "Sekolah", "Kuliah", "Bekerja", "Tidak sekolah/tidak bekerja"];
    if (!validationRes || !validationRes.ok || !validationRes.age) return baseOptions.slice();

    const age = validationRes.age || {};
    const totalMonths = Number(age.totalMonths || 0);
    if (totalMonths < 60) {
      return ["Belum sekolah"];
    }

    return baseOptions.slice();
  }

  function syncSchoolActivityOptionsByAge(validationRes) {
    const statusEl = document.getElementById("Apakah sekolah/bekerja?");
    if (!statusEl) return;

    const allowed = getAllowedSchoolActivityOptions(validationRes);
    const currentValue = String(statusEl.value || "").trim();
    const fallbackValue = allowed[0] || "";
    const nextValue = allowed.includes(currentValue) ? currentValue : fallbackValue;

    statusEl.innerHTML = allowed.map(function(opt) {
      const selected = opt === nextValue ? ' selected' : '';
      return `<option value="${opt}"${selected}>${opt}</option>`;
    }).join("");
    statusEl.value = nextValue;

    if (!allowed.includes(currentValue)) {
      const kelasEl = document.getElementById("Kelas Saat Ini");
      const namaSekolahEl = document.getElementById("Nama sekolah/tempat bekerja");
      if (kelasEl) kelasEl.value = "";
      if (namaSekolahEl) namaSekolahEl.value = "";
      if (typeof reevaluateShowIfFields === "function") {
        reevaluateShowIfFields();
      }
    }
  }

  function checkConsistencyWarnings() {
    const warnings = [];

    const dobValue = document.getElementById("Tanggal Lahir")?.value || "";
    const refValue = document.getElementById("Tanggal Pelacakan")?.value || "";
    const statusSekolah = String(document.getElementById("Apakah sekolah/bekerja?")?.value || "").trim();
    const kelasSaatIni = String(document.getElementById("Kelas Saat Ini")?.value || "").trim();
    const dx = String(document.getElementById("form-selector")?.value || "").toUpperCase();

    if (!isCompleteDateValue(dobValue)) return warnings;

    const val = validateBirthDateEpi(dobValue, isCompleteDateValue(refValue) ? refValue : "");
    if (!val.ok) return warnings;

    const age = val.age || {};
    const years = Number(age.years || 0);
    const totalDays = Number(age.totalDays || 0);
    const allowedSchoolOptions = getAllowedSchoolActivityOptions(val);

    if (statusSekolah && allowedSchoolOptions.indexOf(statusSekolah) === -1) {
      warnings.push(`Status sekolah/kegiatan '${statusSekolah}' tidak sesuai dengan umur pasien (${val.ageText}).`);
    }

    const k = normalizeClassValue(kelasSaatIni);
    if (k !== null) {
      const est = estimateSchoolAgeFromClass(kelasSaatIni);
      if (est) {
        if (years < est.minYears - 1 || years > est.maxYears + 2) {
          warnings.push(`Kelas saat ini (${kelasSaatIni}) tampak kurang konsisten dengan umur pasien (${val.ageText}).`);
        }
      }
    }

    if (dx === "TN" && totalDays > 28) {
      warnings.push("Diagnosis TN dipilih, tetapi umur pasien bukan neonatus (lebih dari 28 hari).");
    }

    return warnings;
  }

  function getFieldValueSafe(fieldId) {
    return String(document.getElementById(fieldId)?.value || "").trim();
  }

  function isNonEmptyField(fieldId) {
    return getFieldValueSafe(fieldId) !== "";
  }

  function parseDateInputValue(value) {
    if (!isCompleteDateValue(value)) return null;
    const d = new Date(value + "T00:00:00");
    return isNaN(d.getTime()) ? null : d;
  }

  function compareDateInputValues(a, b) {
    const da = parseDateInputValue(a);
    const db = parseDateInputValue(b);
    if (!da || !db) return null;
    const ta = da.getTime();
    const tb = db.getTime();
    if (ta === tb) return 0;
    return ta > tb ? 1 : -1;
  }

  function validateRequiredVisibleFields(form) {
    if (!form) return { ok: true };

    const invalidEls = Array.from(form.querySelectorAll("input, select, textarea"))
      .filter(function(el) {
        if (!el || el.disabled) return false;
        if (el.type === "hidden") return false;
        const wrapper = el.closest(".field-wrapper");
        if (wrapper && wrapper.classList.contains("hidden")) return false;
        const hiddenStage = el.closest(".pd3i-stage-hidden");
        if (hiddenStage) return false;
        return typeof el.checkValidity === "function" && !el.checkValidity();
      });

    if (!invalidEls.length) return { ok: true };

    const first = invalidEls[0];
    try {
      first.focus();
      if (typeof first.reportValidity === "function") first.reportValidity();
    } catch (e) {}

    return {
      ok: false,
      message: "Masih ada field wajib yang belum lengkap atau formatnya belum valid."
    };
  }

  function validateDxBusinessRules() {
    const dx = String(document.getElementById("form-selector")?.value || "").trim().toUpperCase();
    const errors = [];
    const warnings = [];

    const tglLapor = getFieldValueSafe("Tanggal terima laporan");
    const tglLacak = getFieldValueSafe("Tanggal Pelacakan");
    const tglLahir = getFieldValueSafe("Tanggal Lahir");

    if (tglLapor && tglLacak && compareDateInputValues(tglLapor, tglLacak) === 1) {
      errors.push("Tanggal terima laporan tidak boleh lebih akhir dari tanggal pelacakan.");
    }

    if (tglLahir && tglLacak && compareDateInputValues(tglLahir, tglLacak) === 1) {
      errors.push("Tanggal lahir tidak boleh lebih akhir dari tanggal pelacakan.");
    }

    const statusVerifikasi = getFieldValueSafe("Status Verifikasi EPID");
    if (statusVerifikasi === "Terverifikasi") {
      if (!isNonEmptyField("Tanggal Verifikasi EPID")) {
        errors.push("Tanggal verifikasi EPID wajib diisi jika status verifikasi sudah terverifikasi.");
      }
      if (!isNonEmptyField("Petugas Verifikator")) {
        errors.push("Petugas verifikator wajib diisi jika status verifikasi sudah terverifikasi.");
      }
    }

    if (getFieldValueSafe("Pemeriksaan Sampel Dilakukan") === "Ya") {
      if (!isNonEmptyField("Tanggal Hasil Sampel")) {
        warnings.push("Tanggal hasil sampel belum diisi walau pemeriksaan sampel ditandai dilakukan.");
      }
      if (!isNonEmptyField("Interpretasi Hasil Sampel")) {
        warnings.push("Interpretasi hasil sampel belum diisi.");
      }
    }

    const statusKasusGlobal = getFieldValueSafe("Status Pasien/Kasus");
    if ((statusKasusGlobal === "Konfirmasi" || statusKasusGlobal === "Discarded" || statusKasusGlobal === "Klinis") && !isNonEmptyField("Dasar Penetapan Status")) {
      errors.push("Dasar penetapan status wajib diisi untuk status kasus klinis/discarded/konfirmasi.");
    }

    const latestStatus = getLatestStatusFromTimeline();
    if (latestStatus && statusKasusGlobal && latestStatus !== statusKasusGlobal && typeof getAllowedStatusTransitions === "function") {
      const allowedNext = getAllowedStatusTransitions(dx, latestStatus) || [];
      if (allowedNext.indexOf(statusKasusGlobal) === -1) {
        errors.push(`Transisi status dari '${latestStatus}' ke '${statusKasusGlobal}' tidak sesuai alur yang diizinkan.`);
      }
    }

    const dobForSchool = document.getElementById("Tanggal Lahir")?.value || "";
    const refForSchool = document.getElementById("Tanggal Pelacakan")?.value || "";
    const schoolStatus = getFieldValueSafe("Apakah sekolah/bekerja?");
    const schoolBirthVal = validateBirthDateEpi(dobForSchool, isCompleteDateValue(refForSchool) ? refForSchool : "");
    if (schoolBirthVal && schoolBirthVal.ok) {
      const allowedSchoolOptions = getAllowedSchoolActivityOptions(schoolBirthVal);
      if (schoolStatus && allowedSchoolOptions.indexOf(schoolStatus) === -1) {
        errors.push(`Status sekolah/kegiatan '${schoolStatus}' tidak sesuai dengan umur pasien (${schoolBirthVal.ageText}).`);
      }
    }

    if (dx === "MR") {
      const tglPergi = getFieldValueSafe("Tanggal pergi");
      const tglKembali = getFieldValueSafe("Tanggal pulang perjalanan");
      const darahAmbil = getFieldValueSafe("Tanggal ambil spesimen darah");
      const darahKirim = getFieldValueSafe("Tanggal pengiriman spesimen darah ke lab");
      const lainAmbil = getFieldValueSafe("Tanggal ambil spesimen lain");
      const lainKirim = getFieldValueSafe("Tanggal pengiriman spesimen lain ke lab");
      const statusAkhir = getFieldValueSafe("Status akhir kasus");

      if (tglPergi && tglKembali && compareDateInputValues(tglPergi, tglKembali) === 1) {
        errors.push("Tanggal kembali perjalanan MR tidak boleh lebih awal dari tanggal pergi.");
      }
      if (darahAmbil && darahKirim && compareDateInputValues(darahAmbil, darahKirim) === 1) {
        errors.push("Tanggal kirim spesimen darah MR tidak boleh lebih awal dari tanggal ambil.");
      }
      if (lainAmbil && lainKirim && compareDateInputValues(lainAmbil, lainKirim) === 1) {
        errors.push("Tanggal kirim spesimen lain MR tidak boleh lebih awal dari tanggal ambil.");
      }
      if (statusAkhir === "Meninggal" && !isNonEmptyField("Penyebab kematian")) {
        errors.push("Penyebab kematian wajib diisi jika status akhir MR adalah meninggal.");
      }
    }

    if (dx === "DIF") {
      const antibiotik = getFieldValueSafe("Antibiotik diberikan?");
      const ads = getFieldValueSafe("ADS diberikan?");
      const kondisi = getFieldValueSafe("Kondisi kasus saat ini");

      if (antibiotik === "Ya" && !isNonEmptyField("Jenis antibiotik")) {
        errors.push("Jenis antibiotik wajib diisi pada kasus difteri jika antibiotik diberikan.");
      }
      if (ads === "Ya" && !isNonEmptyField("Dosis ADS (IU)")) {
        errors.push("Dosis ADS wajib diisi pada kasus difteri jika ADS diberikan.");
      }
      if (kondisi === "Meninggal" && !isNonEmptyField("Tanggal meninggal DIF")) {
        errors.push("Tanggal meninggal wajib diisi pada kasus difteri jika kondisi akhir meninggal.");
      }
    }

    if (dx === "PERT") {
      const masuk = getFieldValueSafe("Tanggal Masuk Rawat Inap");
      const keluar = getFieldValueSafe("Tanggal Keluar");
      const tglPergi = getFieldValueSafe("Tanggal pergi PERT");
      const tglKembali = getFieldValueSafe("Tanggal kembali PERT");
      const ambil2 = getFieldValueSafe("Tanggal ambil spesimen lain pertusis");
      const kirim2 = getFieldValueSafe("Tanggal kirim spesimen lain pertusis");
      const status = getFieldValueSafe("Status akhir PERT");

      if (masuk && keluar && compareDateInputValues(masuk, keluar) === 1) {
        errors.push("Tanggal keluar rawat inap pertusis tidak boleh lebih awal dari tanggal masuk.");
      }
      if (tglPergi && tglKembali && compareDateInputValues(tglPergi, tglKembali) === 1) {
        errors.push("Tanggal kembali perjalanan pertusis tidak boleh lebih awal dari tanggal pergi.");
      }
      if (ambil2 && kirim2 && compareDateInputValues(ambil2, kirim2) === 1) {
        errors.push("Tanggal kirim spesimen lain pertusis tidak boleh lebih awal dari tanggal ambil.");
      }
      if (status === "Meninggal" && !isNonEmptyField("Tanggal meninggal PERT")) {
        errors.push("Tanggal meninggal wajib diisi pada kasus pertusis jika status akhir meninggal.");
      }
    }

    if (dx === "TN") {
      const dobValue = document.getElementById("Tanggal Lahir")?.value || "";
      const refValue = document.getElementById("Tanggal Pelacakan")?.value || "";
      const birthVal = validateBirthDateEpi(dobValue, isCompleteDateValue(refValue) ? refValue : "");

      if (birthVal && birthVal.ok) {
        const totalDays = Number((birthVal.age && birthVal.age.totalDays) || 0);
        if (totalDays > 28) {
          errors.push("Form TN hanya untuk neonatus. Umur pasien saat pelacakan tidak boleh lebih dari 28 hari.");
        }
      }

      if (getFieldValueSafe("Apakah bayi dirawat") === "Ya") {
        if (!isNonEmptyField("Tempat perawatan TN")) {
          errors.push("Tempat perawatan TN wajib diisi jika bayi dirawat.");
        }
        if (!isNonEmptyField("Tanggal mulai dirawat TN")) {
          errors.push("Tanggal mulai dirawat TN wajib diisi jika bayi dirawat.");
        }
      }
    }

    if (dx === "AFP") {
      const sifatAkut = getFieldValueSafe("Sifat akut");
      const lumpuhLayuh = getFieldValueSafe("Lumpuh layuh");
      const rudapaksa = getFieldValueSafe("Rudapaksa AFP");
      const t1 = getFieldValueSafe("Tanggal tinja 1");
      const t1a = getFieldValueSafe("Tanggal kirim tinja 1 kab-prov");
      const t1b = getFieldValueSafe("Tanggal kirim tinja 1 prov-lab");
      const t2 = getFieldValueSafe("Tanggal tinja 2");
      const t2a = getFieldValueSafe("Tanggal kirim tinja 2 kab-prov");
      const t2b = getFieldValueSafe("Tanggal kirim tinja 2 prov-lab");

      if (sifatAkut && sifatAkut !== "Ya") {
        errors.push("Kasus AFP harus memiliki kelemahan/kelumpuhan akut (1-14 hari).");
      }
      if (lumpuhLayuh && lumpuhLayuh !== "Ya") {
        errors.push("Kasus AFP harus memiliki kelumpuhan layuh (flaccid).");
      }
      if (rudapaksa === "Ya") {
        errors.push("Kasus AFP tidak boleh disebabkan rudapaksa.");
      }
      if (t1 && t1a && compareDateInputValues(t1, t1a) === 1) {
        errors.push("Tanggal kirim spesimen I AFP ke provinsi tidak boleh lebih awal dari tanggal ambil.");
      }
      if (t1a && t1b && compareDateInputValues(t1a, t1b) === 1) {
        errors.push("Tanggal kirim spesimen I AFP ke lab tidak boleh lebih awal dari tanggal kirim ke provinsi.");
      }
      if (t2 && t2a && compareDateInputValues(t2, t2a) === 1) {
        errors.push("Tanggal kirim spesimen II AFP ke provinsi tidak boleh lebih awal dari tanggal ambil.");
      }
      if (t2a && t2b && compareDateInputValues(t2a, t2b) === 1) {
        errors.push("Tanggal kirim spesimen II AFP ke lab tidak boleh lebih awal dari tanggal kirim ke provinsi.");
      }
      if (isNonEmptyField("Tanggal follow up 60 hari") && !isNonEmptyField("Masih ada kelumpuhan")) {
        warnings.push("Tanggal follow up 60 hari AFP sudah diisi, tetapi hasil follow up masih kosong.");
      }
    }

    return { ok: errors.length === 0, errors, warnings };
  }

  function updateUiShellSummary() {
    const dx = String(document.getElementById("form-selector")?.value || "").trim().toUpperCase();
    const cfg = getDxConfigSafe(dx);
    const dxTitle = cfg && cfg.title ? cfg.title : "Belum dipilih";
    const modeText = isEditMode ? "Mode edit" : "Input baru";
    const epidText = getFieldValueSafe("Nomor EPID") || "Otomatis saat simpan";
    const ageText = getFieldValueSafe("Umur (auto)") || "-";
    const epiGroupText = getFieldValueSafe("Kelompok Umur Epidemiologis") || "-";
    const statusKasus = getFieldValueSafe("Status Pasien/Kasus") || "Belum ditentukan";
    const statusVerifikasi = getFieldValueSafe("Status Verifikasi EPID") || "Belum diverifikasi";
    const sampelState = getFieldValueSafe("Pemeriksaan Sampel Dilakukan") === "Ya"
      ? (getFieldValueSafe("Interpretasi Hasil Sampel") || "Menunggu hasil")
      : "Tidak ada sampel";
    const userName = String((SESSION_USER && (SESSION_USER.nama || SESSION_USER.username || SESSION_USER.name)) || "Belum login").trim() || "Belum login";
    const authMeta = (typeof window !== "undefined" && window.__AUTH_SESSION_META) ? window.__AUTH_SESSION_META : null;
    const roleCaps = getRoleCapabilities(SESSION_USER);
    const viewerMode = !roleCaps.canWrite && roleCaps.canView;
    const latestStatus = getLatestStatusFromTimeline() || statusKasus;
    const nextStatusSummary = getNextAllowedStatusesSummary(dx, latestStatus);
    const lastWorkflowStageLabel = getFieldValueSafe("Label Tahap Workflow Terakhir") || getFieldValueSafe("Tahap Workflow Terakhir") || "Belum ada jejak tahap";
    const lastWorkflowActor = getFieldValueSafe("Diupdate Oleh Tahap Terakhir") || "";
    const lastWorkflowRole = getFieldValueSafe("Role Pengupdate Tahap Terakhir") || "";
    const lastWorkflowSummary = [lastWorkflowStageLabel, lastWorkflowActor ? `oleh ${lastWorkflowActor}` : "", lastWorkflowRole ? `(${getRoleDisplayLabel(lastWorkflowRole)})` : ""].filter(Boolean).join(" ");

    let issueCount = 0;
    try {
      issueCount += (checkConsistencyWarnings() || []).length;
      const ruleCheck = validateDxBusinessRules();
      issueCount += ((ruleCheck && ruleCheck.warnings) || []).length;
      issueCount += ((ruleCheck && ruleCheck.errors) || []).length;
    } catch (e) {}

    setSummaryText("summary-dx-name", dxTitle);
    setSummaryText("summary-dx-code", dx || "-");
    setSummaryText("summary-epid", epidText);
    setSummaryText("summary-umur", ageText);
    setSummaryText("summary-epi-group", epiGroupText);
    setSummaryText("summary-mode", viewerMode ? "Mode lihat" : modeText);
    setSummaryText("summary-user", userName);
    setSummaryText("summary-role-capability", roleCaps.summary || "Belum ada sesi");
    let authText = userName === "Belum login" ? "Belum ada sesi" : "Sesi aktif";
    if (authMeta && authMeta.ttlSec) {
      const minutes = Math.max(1, Math.round(Number(authMeta.ttlSec || 0) / 60));
      authText = `Sesi aktif • timeout server ±${minutes} menit`;
    }
    setSummaryText("summary-auth-session", authText);
    setSummaryText("summary-last-workflow-stage", lastWorkflowSummary || "Belum ada jejak tahap");
    setSummaryText("summary-status-kasus", statusKasus);
    setSummaryText("summary-next-statuses", nextStatusSummary);
    setSummaryText("summary-verifikasi-epid", statusVerifikasi);
    setSummaryText("summary-sampel-state", sampelState);
    setSummaryText("summary-dx-pill", dx ? `${dx} • ${dxTitle}` : "Belum dipilih");
    setSummaryText("summary-mode-pill", modeText);
    setSummaryText("summary-warning-count", issueCount > 0 ? `${issueCount} isu perlu dicek` : "0 warning");
    setSummaryText("summary-warning-pill", String(issueCount));
    setSummaryText("workflow-input-state", viewerMode ? "Record dibuka dalam mode lihat" : (isEditMode ? "Record existing sedang dibuka" : "Input baru / draft kerja"));
    setSummaryText("workflow-verifikasi-state", statusVerifikasi);
    setSummaryText("workflow-sampel-state", sampelState);
    setSummaryText("workflow-status-kasus", statusKasus);
    setSummaryText("edit-badge-dx", dx ? `DX ${dx}` : "DX -");
    setSummaryText("edit-badge-epid", epidText);
    setSummaryText("edit-badge-status", statusKasus);
    setSummaryText("viewer-badge-dx", dx ? `DX ${dx}` : "DX -");
    setSummaryText("viewer-badge-epid", epidText);
    setSummaryText("viewer-badge-status", statusKasus);
  }

    document.querySelectorAll(".pd3i-nav-link[href^='#']").forEach(function(link) {
      const target = String(link.getAttribute("href") || "").replace(/^#/, "");
      if (!target) return;
      if (target === activeId) link.classList.add("is-active");
      else link.classList.remove("is-active");
    });

    return [
      { id: "section-pelapor", label: "Input Kasus", sections: ["section-pelapor", "section-pasien", "section-specific"] },
      { id: "section-verifikasi", label: "Verifikasi EPID", sections: ["section-verifikasi"] },
      { id: "section-sampel", label: "Hasil Sampel", sections: ["section-sampel"] },
      { id: "section-status", label: "Status Pasien", sections: ["section-status"] }
    ];

  function normalizeWorkflowStepId(activeId) {
    if (["section-pelapor", "section-pasien", "section-specific"].includes(activeId)) return "section-pelapor";
    if (["section-verifikasi", "section-sampel", "section-status"].includes(activeId)) return activeId;

    const shell = document.getElementById("section-search-shell");
    if (shell) shell.scrollIntoView({ behavior: "smooth", block: "start" });

  function setWorkflowSearchIntent(intent, options) {
    const opts = options || {};
    const normalized = normalizeWorkflowStepId(intent);
    const cfg = getWorkflowIntentConfig(normalized);
    WORKFLOW_SEARCH_INTENT = normalized;

    document.querySelectorAll(".pd3i-workflow-intent-card[data-workflow-intent]").forEach(function(btn) {
      const target = normalizeWorkflowStepId(String(btn.getAttribute("data-workflow-intent") || "").trim());
      btn.classList.toggle("is-active", target === normalized);
    });

    const titleEl = document.getElementById("workflow-search-title");
    const badgeEl = document.getElementById("workflow-search-badge");
    const helperEl = document.getElementById("workflow-search-helper");
    const searchHelperEl = document.getElementById("search-context-helper");

    if (titleEl) titleEl.textContent = cfg.title;
    if (badgeEl) badgeEl.textContent = cfg.badge;
    if (helperEl) helperEl.textContent = cfg.helper;
    if (searchHelperEl) searchHelperEl.textContent = cfg.searchHelper;

    if (!opts.skipStageSync && normalized === "section-pelapor") {
      updateFormStepperState("section-pelapor");
      if (opts.focusForm) {
        const form = document.getElementById("dynamic-form");
        if (form) form.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    } else if (opts.focusSearch !== false && normalized !== "section-pelapor") {
      focusSearchShell();
    }

    return normalized;

  function getWorkflowStageHelperText(stepId) {

      return "Tahap lanjutan belum dibuka. Simpan input awal dulu atau buka record existing untuk verifikasi, hasil pemeriksaan, dan update status.";
