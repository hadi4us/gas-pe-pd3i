  function matchesShowIf(parentValue, vals, parentId) {
    const actual = String(parentValue || "").trim();
    const targets = Array.isArray(vals) ? vals.map(function(v) { return String(v || "").trim(); }) : [];
    if (targets.includes(actual)) return true;

    if (parentId === "JK") {
      if ((actual === "Perempuan" || actual === "P") && targets.some(function(v) { return v === "Perempuan" || v === "P"; })) return true;
      if ((actual === "Laki-laki" || actual === "L" || actual === "Laki-Laki") && targets.some(function(v) { return v === "Laki-laki" || v === "L" || v === "Laki-Laki"; })) return true;
    }

    return targets.map(function(v) { return v.toLowerCase(); }).includes(actual.toLowerCase());
  }

  function stashShowIfFieldValue(inp) {
    if (!inp) return;
    const tag = String(inp.tagName || '').toUpperCase();
    const type = String(inp.type || '').toLowerCase();
    const currentValue = String(inp.value || '');

    if (type === 'checkbox' || type === 'radio') {
      inp.dataset.showIfStashChecked = inp.checked ? '1' : '0';
      inp.dataset.showIfStashValue = currentValue;
      inp.checked = false;
      return;
    }

    inp.dataset.showIfStashValue = currentValue;
    if (tag === 'SELECT') inp.selectedIndex = 0;
    else inp.value = '';

    if (inp.dataset && inp.dataset.choiceGroup === '1') {
      syncChoiceButtons(inp);
    }
  }

  function restoreShowIfFieldValue(inp) {
    if (!inp) return;
    const tag = String(inp.tagName || '').toUpperCase();
    const type = String(inp.type || '').toLowerCase();
    const stashedValue = String(inp.dataset.showIfStashValue || '').trim();
    const stashedChecked = String(inp.dataset.showIfStashChecked || '0') === '1';

    if (type === 'checkbox' || type === 'radio') {
      if (!inp.checked && stashedChecked) inp.checked = true;
      if (!inp.value && stashedValue) inp.value = stashedValue;
      return;
    }

    if (tag === 'SELECT') {
      if (!String(inp.value || '').trim() && stashedValue) {
        ensureSelectOptionValue(inp, stashedValue);
        inp.value = stashedValue;
        stabilizeUserSelectedValue(inp, stashedValue);
      }
      return;

    if (!String(inp.value || '').trim() && stashedValue) {
      inp.value = stashedValue;

      syncChoiceButtons(inp);

  function applyShowIfVisibility(wrapper) {
    if (!wrapper) return;
    const wasHidden = wrapper.classList.contains('hidden');
    const parentId = wrapper.getAttribute('data-parent');
    const parent = document.getElementById(parentId);
    const parentValue = getShowIfParentValue(parentId);
    const vals = JSON.parse(wrapper.getAttribute('data-parent-vals') || '[]');
    const required = wrapper.getAttribute('data-required') === 'true';
    const inp = wrapper.querySelector('input, select, textarea');

    let shouldShow = !!parent && matchesShowIf(parentValue, vals, parentId);

    if (!shouldShow && parentId === 'JK') {
      const jkNorm = String(parentValue || '').trim().toLowerCase();
      const wantsPerempuan = vals.some(function(v) { return String(v || '').trim().toLowerCase() === 'perempuan'; });
      if (wantsPerempuan && (jkNorm === 'perempuan' || jkNorm === 'p')) {
        shouldShow = true;
      }
    }

    if (shouldShow) {
      wrapper.classList.remove('hidden');
      if (required && inp) inp.required = true;
      if (inp) restoreShowIfFieldValue(inp);

      if (parentId === 'Apakah dirawat inap?' && String(parentValue || '').trim() === 'Ya' && wrapper.querySelector('#Nama\ Rumah\ Sakit')) {

      if (inp) {
        inp.required = false;
        if (!wasHidden) {
          stashShowIfFieldValue(inp);
        }
      }
    }

  function ensureSelectOptionValue(selectEl, value) {
    if (!selectEl) return;
    const targetValue = String(value || '').trim();
    if (!targetValue) return;
    const exists = Array.from(selectEl.options || []).some(function(opt) {
      return String(opt.value || '').trim() === targetValue;
    });
    if (exists) return;
    const option = document.createElement('option');
    option.value = targetValue;
    option.textContent = targetValue;
    option.setAttribute('data-manual', '1');
    selectEl.appendChild(option);
  }

  function stabilizeUserSelectedValue(selectEl, chosenValue) {
    if (!selectEl) return;
    const targetValue = String(chosenValue || '').trim();
    if (!targetValue) return;
    selectEl.dataset.lastUserValue = targetValue;
    [80, 180, 320, 520, 820].forEach(function(delayMs) {
      setTimeout(function() {
        if (!selectEl || !selectEl.isConnected) return;
        const wrapper = selectEl.closest('.field-wrapper');
        if (wrapper && wrapper.classList.contains('hidden')) return;
        if (selectEl.disabled) return;
        const stickyValue = String(selectEl.dataset.lastUserValue || '').trim();
        if (!stickyValue) return;
        const currentValue = String(selectEl.value || '').trim();
        if (currentValue === stickyValue) return;
        if (currentValue && currentValue !== '-- Pilih --') return;
        ensureSelectOptionValue(selectEl, stickyValue);
        selectEl.value = stickyValue;
      }, delayMs);
    });
  }

  function loadDependentWilayahOptions(parentEl) {
    return new Promise(function(resolve) {
      if (!parentEl) {
        resolve(null);
        return;
      }
      const next = getWilayahNextFieldId(parentEl.id);
      const nextEl = document.getElementById(next);
      if (!nextEl) {
        resolve(null);
        return;
      }

      const id = parentEl.options[parentEl.selectedIndex]?.getAttribute("data-id");
      nextEl.innerHTML = '<option value="">-- Pilih --</option>';
      if (!id) {
        resolve(nextEl);
        return;
      }

      const type = getWilayahRequestType(parentEl.id);
      if (!type) {
        resolve(nextEl);
        return;
      }

      fetch(`${API_WILAYAH_BASE}/${type}/${id}.json`)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          const finalData = applyWilayahOptionOverrides(type, parentEl, data);
          finalData.forEach(function(item) {
            const option = document.createElement('option');
            option.value = String(item && item.name || '');
            option.setAttribute('data-id', String(item && item.id || ''));
            option.textContent = String(item && item.name || '');
            nextEl.appendChild(option);
          });
          resolve(nextEl);
        })
        .catch(function(err) {
          if (type === 'villages') {
            const finalData = applyWilayahOptionOverrides(type, parentEl, []);
            finalData.forEach(function(item) {
              const option = document.createElement('option');
              option.value = String(item && item.name || '');
              option.setAttribute('data-id', String(item && item.id || ''));
              option.textContent = String(item && item.name || '');
              nextEl.appendChild(option);
            });
          }
          console.error("load wilayah failed:", err);
          resolve(nextEl);
        });
    });
  }

  async function hydrateWilayahChain(fieldIds, record) {
    const chain = Array.isArray(fieldIds) ? fieldIds.slice() : [];
    for (let i = 0; i < chain.length; i++) {
      const fieldId = chain[i];
      const value = String((record && record[fieldId]) || '').trim();
      const el = document.getElementById(fieldId);
      if (!el) continue;
      if (value) {
        ensureSelectOptionValue(el, value);
        el.value = value;
        stabilizeUserSelectedValue(el, value);
      }
      if (value && i < chain.length - 1) {
        await loadDependentWilayahOptions(el);
      }
    }
  }

  function applyWilayahOptionOverrides(type, triggerEl, items) {
    const list = Array.isArray(items) ? items.slice() : [];
    if (type !== 'villages' || !triggerEl) return list;

    const districtName = String(triggerEl.value || '').trim().toUpperCase();
    const extras = (((WILAYAH_OPTION_OVERRIDES || {}).villagesByDistrict || {})[districtName] || []).slice();
    if (!extras.length) return list;

    const existing = new Set(list.map(function(item) {
      return String((item && item.name) || '').trim().toUpperCase();
    }).filter(Boolean));

    extras.forEach(function(name) {
      const clean = String(name || '').trim();
      if (!clean) return;
      if (existing.has(clean.toUpperCase())) return;
      list.push({ id: '', name: clean, __manual: true });
      existing.add(clean.toUpperCase());
    });

    return list;
  }

  function hydrateDynamicTableByJson(tableId, rawValue) {
    const tbody = document.getElementById(`tbody-${tableId}`);
    if (!tbody || rawValue == null || rawValue === "") return;

    tbody.innerHTML = "";
    try {
      let rows = [];
      if (Array.isArray(rawValue)) {
        rows = rawValue;
      } else if (typeof rawValue === 'object') {
        rows = Array.isArray(rawValue.rows) ? rawValue.rows : Object.values(rawValue || {});
      } else {
        const text = String(rawValue || '').trim();
        if (!text || text === '[object Object]') return;
        rows = JSON.parse(text);
      }

      if (!Array.isArray(rows)) {
        rows = rows ? [rows] : [];
      }

      rows.forEach(item => {
        if (!item || typeof item !== 'object') return;
        if (tableId === "Riwayat Imunisasi") {
          addDynamicRow(tableId, {
            __kode: item.KodeImunisasi || item.Kode || item.__kode || "",

          });
        } else {
          addDynamicRow(tableId, item);
        }
      });
    } catch (e) {
      console.warn(`Gagal parse ${tableId}:`, e, rawValue);
    }
  }

  function buildClientPrintUrl(dx, epid, token) {
    try {
      const safeDx = String(dx || "").trim().toUpperCase();
      const safeEpid = String(epid || "").trim();
      const safeToken = String(token || "").trim();
      if (!safeDx || !safeEpid || !safeToken) return "";

      const url = new URL(window.location.href);
      url.search = "";
      url.hash = "";
      url.searchParams.set("action", "print");
      url.searchParams.set("dx", safeDx);
      url.searchParams.set("epid", safeEpid);
      url.searchParams.set("token", safeToken);
      return url.toString();
    } catch (e) {
      return "";
    }
  }

  function showSuccessModal(message, printUrl, fallbackMeta) {
    const modal = document.getElementById("success-modal");
    const msg = document.getElementById("success-modal-message");
    const btnPrint = document.getElementById("btn-print-pdf");
    const btnNew = document.getElementById("btn-new-entry");
    const btnClose = document.getElementById("btn-close-success");

    if (msg) msg.textContent = message || "Data berhasil disimpan.";

    if (btnPrint) {
      let safeUrl = String(printUrl || "").trim();
      const resolvedDx = String((fallbackMeta && fallbackMeta.dx) || document.getElementById("form-selector")?.value || "").trim();
      const resolvedEpid = String((fallbackMeta && fallbackMeta.epid) || document.getElementById("Nomor EPID")?.value || "").trim();
      const resolvedToken = String((fallbackMeta && fallbackMeta.token) || SESSION_TOKEN || "").trim();
      if (!safeUrl) {
        safeUrl = buildClientPrintUrl(resolvedDx, resolvedEpid, resolvedToken);
      }
      btnPrint.href = safeUrl || "javascript:void(0)";
      btnPrint.target = "_blank";
      btnPrint.rel = "noopener noreferrer";

      if (!safeUrl) {
        btnPrint.classList.add("opacity-60", "pointer-events-none");
        btnPrint.setAttribute("aria-disabled", "true");
      } else {
        btnPrint.classList.remove("opacity-60", "pointer-events-none");
        btnPrint.removeAttribute("aria-disabled");
      }

      if (!btnPrint.dataset.bound) {
        btnPrint.dataset.bound = "1";
        btnPrint.addEventListener("click", function(ev) {
          const href = String(btnPrint.getAttribute("href") || "").trim();
          if (!href || href === "javascript:void(0)") {
            ev.preventDefault();
          }
        });
      }
    }

    if (btnNew && !btnNew.dataset.bound) {
      btnNew.dataset.bound = "1";
      btnNew.addEventListener("click", function(ev) {
        ev.preventDefault();
        resetForNewEntry();
      });
    }

    if (btnClose && !btnClose.dataset.bound) {
      btnClose.dataset.bound = "1";
      btnClose.addEventListener("click", function(ev) {
        ev.preventDefault();
        closeModal(modal);
      });
    }

    openModal(modal);
  }

      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
      redirect: "follow"
    });

    const raw = await res.text();
    try {
      return JSON.parse(raw);
    } catch (e) {
      console.error("Raw response (not JSON):", raw);
      throw new Error("Server tidak mengembalikan JSON dari /exec.");
    }
  }

      /**

      function _renderSearchResultsList(results, total, dx) {
        const box = document.getElementById("search-results");
        if (!box) return;

        const safeEscape = typeof escapeHtml === "function"
          ? escapeHtml
          : function(value) {
              return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#39;");
            };

        box.classList.remove("hidden");

        try {
          if (!results || results.length === 0) {
            box.innerHTML = `<div class="pd3i-empty-state">Tidak ada data yang cocok dengan kriteria pencarian. Coba longgarkan filter atau ganti kata kunci.</div>`;

            </div>
            <span class="pd3i-badge-soft">${safeEscape(workflowActionLabel)}</span>
          </div>`;
          html += `<div class="pd3i-search-results-wrap">`;

          results.forEach(function(item, index) {
            const recordKeyArg = JSON.stringify(String(item.recordKey || item.recordId || item.epid || ""));
            const statusKasus = item.statusKasus || "Belum ditentukan";
            const statusVerifikasi = item.statusVerifikasi || "Pending";
            const sampelState = String(item.sampelDilakukan || "").trim().toUpperCase() === "YA"
              ? (item.interpretasiSampel || "Menunggu hasil")
              : "Tidak ada sampel";
            const resolvedDx = String(item.dx || dx || '').trim();
            const dxArg = JSON.stringify(resolvedDx);
            html += `<div class="pd3i-search-result-card">
              <div class="pd3i-search-result-leading">
                <span class="pd3i-search-result-index">${index + 1}</span>
              </div>
              <div class="min-w-0 flex-1">
                <div class="pd3i-search-result-title-row">
                  <div class="font-extrabold text-slate-800 text-sm md:text-base">${safeEscape(item.nama || "-")}</div>
                  <span class="pd3i-search-result-dx">${safeEscape(resolvedDx || '-')}</span>
                </div>
                <div class="pd3i-search-result-meta">
                  <span class="pd3i-search-result-badge"><i class="fas fa-fingerprint"></i> ${safeEscape(item.epid || item.recordId || "-")}</span>
                  <span class="pd3i-search-result-badge"><i class="fas fa-cake-candles"></i> ${safeEscape(item.tanggalLahir || "-")}</span>
                  <span class="pd3i-search-result-badge"><i class="fas fa-location-dot"></i> ${safeEscape([item.kecamatan, item.kelurahan].filter(Boolean).join(' / ') || "-")}</span>
                </div>
                <div class="pd3i-search-result-meta pd3i-search-result-meta-secondary">
                  <span class="pd3i-search-result-badge is-status"><i class="fas fa-list-check"></i> ${safeEscape(statusKasus)}</span>
                  <span class="pd3i-search-result-badge is-verify"><i class="fas fa-id-card-clip"></i> ${safeEscape(statusVerifikasi)}</span>
                  <span class="pd3i-search-result-badge is-sample"><i class="fas fa-vials"></i> ${safeEscape(sampelState)}</span>
                </div>
                <div class="pd3i-search-result-copy mt-2">
                  ${item.orangTua ? `Ortu/Wali: <strong>${safeEscape(item.orangTua)}</strong><br>` : ""}
                  ${item.alamat ? `Alamat: ${safeEscape(item.alamat)}` : "Alamat belum tersedia"}
                </div>
              </div>
              <div class="pd3i-search-result-cta-wrap">
                <button type="button" class="pd3i-search-result-action" onclick='window._loadRecordFromSearch_ && window._loadRecordFromSearch_(${recordKeyArg}, ${dxArg}, { triggerButton: this })'>
                  <i class="fas ${isViewerMode ? 'fa-eye' : 'fa-pen-to-square'}"></i> ${isViewerMode ? 'Buka / Lihat' : workflowActionLabel}
                </button>
              </div>
            </div>`;
          });

          html += `</div>`;
          box.innerHTML = html;
        } catch (err) {
          console.error("_renderSearchResultsList failed:", err);
          box.innerHTML = `<div class="p-4 text-sm text-red-600 font-semibold">List kasus gagal dirender. Silakan refresh lalu coba lagi.</div>`;
        }
      }

      window._loadRecordFromSearch_ = function(recordKey, dx, options) {
        const opts = options || {};
        if (!recordKey || !dx) return;
        if (!safeGsRun()) return;
        if (typeof window !== 'undefined') {
          window.__PD3I_SUPPRESS_DRAFT_PROMPT_UNTIL = Date.now() + 4000;
        }

        const requestedWorkspace = normalizeSidebarWorkspace(opts.workspace || ACTIVE_SIDEBAR_WORKSPACE || 'search');
        const requestedStageBeforeLoad = opts.workspace
          ? getWorkspaceStageForSidebar(requestedWorkspace)
          : (WORKFLOW_SEARCH_INTENT || document.querySelector(".pd3i-stepper-item.is-active")?.getAttribute("data-step-target") || getPreferredWorkflowStageForUser());
        const searchResultsBox = document.getElementById("search-results");
        if (searchResultsBox && !opts.skipSearchHide) searchResultsBox.classList.add("hidden");

        const loadingButton = requestedWorkspace === 'verifikasi'
          ? btnSubmitVerifikasi
          : requestedWorkspace === 'sampel'
            ? btnSubmitSampel
            : requestedWorkspace === 'status'
              ? btnSubmitStatus
              : btnSubmit;
        const triggerButton = opts.triggerButton && opts.triggerButton.nodeType === 1 ? opts.triggerButton : null;
        const triggerButtonOriginalHtml = triggerButton ? triggerButton.innerHTML : '';
        function showOpenRecordLoadingOverlay(label) {
          let overlay = document.getElementById('pd3i-open-record-loading');
          if (!overlay) {
            overlay = document.createElement('div');
            overlay.id = 'pd3i-open-record-loading';
            overlay.setAttribute('role', 'status');
            overlay.setAttribute('aria-live', 'polite');
            overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(15,23,42,.38);backdrop-filter:blur(2px);padding:20px;';
            document.body.appendChild(overlay);
          }
          overlay.innerHTML = `
            <div style="width:min(92vw,420px);border-radius:22px;background:#fff;box-shadow:0 24px 70px rgba(15,23,42,.24);border:1px solid rgba(226,232,240,.95);padding:24px;text-align:center;color:#0f172a;">
              <div style="width:54px;height:54px;margin:0 auto 14px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:#eff6ff;color:#2563eb;font-size:24px;">
                <i class="fas fa-spinner fa-spin"></i>
              </div>
              <div style="font-weight:900;font-size:18px;letter-spacing:-.01em;">Membuka form...</div>
              <div style="margin-top:6px;font-size:13px;font-weight:700;color:#64748b;line-height:1.45;">${escapeHtml(label || 'Mohon tunggu, data kasus sedang dimuat ke form.')}</div>
            </div>`;
          overlay.classList.remove('hidden');
          overlay.style.display = 'flex';
          document.body.classList.add('pd3i-record-loading-open');
        }
        function hideOpenRecordLoadingOverlay() {
          const overlay = document.getElementById('pd3i-open-record-loading');
          if (overlay) {
            overlay.classList.add('hidden');
            overlay.style.display = 'none';
          }
          document.body.classList.remove('pd3i-record-loading-open');
        }
        function setOpenTriggerLoading() {
          if (triggerButton) {
            triggerButton.dataset.loadingRecord = '1';
            triggerButton.disabled = true;
            triggerButton.setAttribute('aria-busy', 'true');
            triggerButton.classList.add('opacity-70', 'cursor-wait');
            triggerButton.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>Membuka...`;
          }
          showOpenRecordLoadingOverlay('Form sedang disiapkan. Jangan klik ulang dulu ya, MasBro.');
        }
        function resetOpenTriggerLoading() {
          if (triggerButton) {
            triggerButton.disabled = false;
            triggerButton.removeAttribute('aria-busy');
            triggerButton.classList.remove('opacity-70', 'cursor-wait');
            triggerButton.innerHTML = triggerButtonOriginalHtml || 'Buka';
            delete triggerButton.dataset.loadingRecord;
          }
          hideOpenRecordLoadingOverlay();
        }
        setOpenTriggerLoading();
        if (loadingButton) {
          loadingButton.disabled = true;
          loadingButton.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>Memuat Data...`;
        }

        const recordLoadRequestId = Date.now();
        window.__RECORD_LOAD_REQUEST_ID = recordLoadRequestId;
        setTimeout(function() {
          if (window.__RECORD_LOAD_REQUEST_ID !== recordLoadRequestId) return;
          if (loadingButton && !loadingButton.disabled) return;
          resetOpenTriggerLoading();
          if (loadingButton) loadingButton.disabled = false;
          resetSubmitButtonByMode(requestedWorkspace);
          showTopAlert('Membuka record terlalu lama. Coba ulangi dari hasil pencarian.', false);
        }, 10000);

        google.script.run
          .withSuccessHandler(async function(record) {
            if (window.__RECORD_LOAD_REQUEST_ID !== recordLoadRequestId) return;
            if (!record) {
              showTopAlert("Data tidak ditemukan.", false);
              resetOpenTriggerLoading();
              if (loadingButton) loadingButton.disabled = false;
              resetSubmitButtonByMode(requestedWorkspace);
              return;
            }

            const resolvedDx = String(dx || record.dx || '').trim().toUpperCase();
            const requestedStage = requestedStageBeforeLoad;
            const preferredStage = canWriteWorkflowStage(SESSION_USER, requestedStage) || isViewerSession()
              ? requestedStage
              : getPreferredWorkflowStageForUser();
            const openedWorkspace = normalizeWorkflowStepId(preferredStage) === 'section-pelapor'
              ? 'search'
              : normalizeSidebarWorkspace(preferredStage);
            if (resolvedDx) {
              selector.value = resolvedDx;
              renderDxWorkspaceForm(resolvedDx, openedWorkspace);
              await new Promise(function(resolve) { setTimeout(resolve, 220); });
            }

            isEditMode = !isViewer;
            if (editBadge) {
              editBadge.hidden = !!isViewer || openedWorkspace !== 'search';
            }
            if (btnCancelEdit) {
              if (isViewer || openedWorkspace !== 'search') btnCancelEdit.classList.add("hidden");
              else btnCancelEdit.classList.remove("hidden");
            }
            if (loadingButton) {
              if (isViewer) {
                loadingButton.innerHTML = `<i class="fas fa-eye"></i> Mode Viewer (Read Only)`;
                loadingButton.classList.remove("bg-yellow-600", "bg-blue-600");
                loadingButton.classList.add("opacity-60", "cursor-not-allowed");
                loadingButton.disabled = true;
              } else {
                resetSubmitButtonByMode(openedWorkspace);
                if (loadingButton === btnSubmit) {
                  loadingButton.innerHTML = `<i class="fas fa-pen-to-square"></i> Perbarui Data ${recordKey}`;
                  loadingButton.classList.remove("bg-blue-600", "opacity-60", "cursor-not-allowed");
                  loadingButton.classList.add("bg-yellow-600");
                }
                loadingButton.disabled = false;
              }
            }

            syncDiagnosisSelectorUi();
            await hydrateRecordToForm(record);
            applyAllShowIf();
            updateVerificationSectionState();
            refreshRecommendedEpidPreview({ silentLoading: true });

            const birthValidation = validateAndApplyBirthUI({ silent: true, hard: false });
            applyBirthValidationUI(birthValidation);

            if (typeof window !== 'undefined') {
              window.__PD3I_ACTIVE_RECORD_META = Object.assign({}, record || {});
            }
            await loadRefImunisasi();
            buildRiwayatImunisasiRows();
            forceBuildImunisasiWhenReady();
            hydrateDynamicTables(record);
            syncCaseStatusOptionsByDx(dx);
            setWorkflowSearchIntent(preferredStage, { focusSearch: false, focusForm: false, skipStageSync: true });
            togglePreRecordWorkflowFocus(false, preferredStage);
            updateFormStepperState(preferredStage);
            if (!opts.skipWorkspaceSwitch) {
              openSidebarWorkspace(openedWorkspace, { scroll: false, skipRecordReload: true });
            } else {
              applySidebarWorkspaceLayout(openedWorkspace);
            }
            setTimeout(function() {
              unlockVisibleSelectsInActiveStage();
            }, 240);
            updateUiShellSummary();
            refreshWorkflowInbox();
            resetOpenTriggerLoading();

            if (['verifikasi', 'sampel', 'status'].includes(openedWorkspace)) {
              hideTopAlert();
            } else {
              showTopAlert(`Data berhasil dimuat. ${getWorkflowSearchOpenSuccessMessage(preferredStage)}`, true);
            }
            window.scrollTo({ top: formElement.offsetTop - 20, behavior: "smooth" });
          })
          .withFailureHandler(function(err) {
            if (window.__RECORD_LOAD_REQUEST_ID !== recordLoadRequestId) return;
            console.error("getRecordByKey failed:", err);
            showTopAlert("Gagal memuat data.", false);
            resetOpenTriggerLoading();
            if (loadingButton) loadingButton.disabled = false;
            resetSubmitButtonByMode(requestedWorkspace);
          })
          .getRecordByKey(dx, recordKey, SESSION_TOKEN);
      };

      if (btnCancelEdit) {
        btnCancelEdit.addEventListener("click", function() {
          location.reload();
        });
      }

      if (btnResetInput && !btnResetInput.dataset.boundReset) {
        btnResetInput.dataset.boundReset = '1';

      (function patchSuccessModalForVerificationWorkflow() {
        if (window.__PD3I_VERIFICATION_SUCCESS_PATCHED__) return;
        if (typeof showSuccessModal !== 'function') return;
        window.__PD3I_VERIFICATION_SUCCESS_PATCHED__ = true;

        const originalShowSuccessModal = showSuccessModal;

        function isVerificationWorkspaceActive() {
          return normalizeSidebarWorkspace(ACTIVE_SIDEBAR_WORKSPACE || 'overview') === 'verifikasi';
        }

        function findSuccessModalElements() {
          const modal = document.getElementById('success-modal') || document.getElementById('successModal') || document.querySelector('[data-success-modal]');
          if (!modal) return { modal: null, buttons: [] };
          return { modal: modal, buttons: Array.from(modal.querySelectorAll('button')) };
        }

        function relabelVerificationSuccessButtons() {
          const refs = findSuccessModalElements();
          if (!refs.modal) return;
          const buttons = refs.buttons || [];
          const queueBtn = buttons.find(btn => /Input Data Baru/i.test(String(btn.textContent || '').trim()));
          const stayBtn = buttons.find(btn => /Tetap di Halaman/i.test(String(btn.textContent || '').trim()));
          if (queueBtn) {
            queueBtn.textContent = 'Kembali ke Daftar Verifikasi';
            queueBtn.onclick = function() {
              if (typeof closeSuccessModal === 'function') closeSuccessModal();
            };
          }
          if (stayBtn) {
            stayBtn.textContent = 'Tetap di Daftar Verifikasi';
            stayBtn.onclick = function() {
              if (typeof closeSuccessModal === 'function') closeSuccessModal();
            };
          }
        }

        function returnToVerificationQueueAfterSave(result) {
          if (!isVerificationWorkspaceActive()) return;
          try {
            if (typeof clearActiveRecordContext === 'function') clearActiveRecordContext();
          } catch (e) {}
          try {
            if (typeof openSidebarWorkspace === 'function') {
              openSidebarWorkspace('verifikasi', { scroll: false });
            }
          } catch (e) {}
          try {
            if (typeof refreshWorkflowInbox === 'function') refreshWorkflowInbox();
          } catch (e) {}
          try {
            if (typeof updateUiShellSummary === 'function') updateUiShellSummary();
          } catch (e) {}
          try {
            if (typeof setWorkflowSearchIntent === 'function') {
              setWorkflowSearchIntent('section-verifikasi', { focusSearch: true, focusForm: false, skipStageSync: true });
            }
          } catch (e) {}
          setTimeout(relabelVerificationSuccessButtons, 60);
        }

        showSuccessModal = function() {
          const result = arguments[0] || {};
          const shouldReturnToQueue = isVerificationWorkspaceActive();
          if (shouldReturnToQueue) {
            returnToVerificationQueueAfterSave(result);
          }
          const out = originalShowSuccessModal.apply(this, arguments);
          if (shouldReturnToQueue) {
            setTimeout(relabelVerificationSuccessButtons, 60);
          }
          return out;
        };
      })();

      function resetSubmitButtonByMode(mode) {
        const submitMode = normalizeSidebarWorkspace(mode || 'search');
        if (submitMode === 'input') {
          resetInputSubmitButton();
          return;
        }
        if (submitMode === 'verifikasi' && btnSubmitVerifikasi) {
          btnSubmitVerifikasi.disabled = !!isViewerSession();
          btnSubmitVerifikasi.innerHTML = `<i class="fas fa-id-card-clip"></i> Simpan Verifikasi EPID`;
          return;

        if (submitMode === 'sampel' && btnSubmitSampel) {
          btnSubmitSampel.disabled = !!isViewerSession();
          btnSubmitSampel.innerHTML = `<i class="fas fa-vials"></i> Simpan Hasil Pemeriksaan`;
          return;
        }
        if (submitMode === 'status' && btnSubmitStatus) {
          btnSubmitStatus.disabled = !!isViewerSession();
          btnSubmitStatus.innerHTML = `<i class="fas fa-list-check"></i> Simpan Update Status`;
          return;
        }
        resetSubmitButtonForCurrentStage();
      }

      const handleMainFormSubmit = async function(mode) {
        const submitMode = normalizeSidebarWorkspace(mode || 'search');
        const activeFormElement = submitMode === 'input'
          ? inputFormElement
          : submitMode === 'verifikasi'
            ? formElementVerifikasi
            : submitMode === 'sampel'
              ? formElementSampel
              : submitMode === 'status'
                ? formElementStatus
                : formElement;
        const activeSubmitButton = submitMode === 'input'
          ? btnSubmitInput
          : submitMode === 'verifikasi'
            ? btnSubmitVerifikasi
            : submitMode === 'sampel'
              ? btnSubmitSampel
              : submitMode === 'status'
                ? btnSubmitStatus
                : btnSubmit;

        if (isViewer) {
          showTopAlert("Role viewer hanya bisa melihat data dan mencetak, tidak bisa menyimpan perubahan.", false);
          return;
        }
        if (!activeFormElement || !activeSubmitButton) {
          showTopAlert('Form aktif tidak tersedia.', false);
          return;
        }

        const activeStageOnSubmit = submitMode === 'input'
          ? 'section-pelapor'
          : submitMode === 'verifikasi'
            ? 'section-verifikasi'
            : submitMode === 'sampel'
              ? 'section-sampel'
              : submitMode === 'status'
                ? 'section-status'
                : (document.querySelector(".pd3i-stepper-item.is-active")?.getAttribute("data-step-target") || "section-pelapor");
        if (!['input', 'search'].includes(submitMode) && normalizeWorkflowStepId(activeStageOnSubmit) !== "section-pelapor" && !canAccessDeferredWorkflowStages()) {
          showTopAlert("Tahap lanjutan hanya bisa disimpan setelah input awal tersimpan / record existing dibuka.", false);
          resetSubmitButtonByMode(submitMode);
          return;
        }

        const requiredCheck = validateRequiredVisibleFields(activeFormElement);
        if (!requiredCheck.ok) {
          showTopAlert(requiredCheck.message || "Masih ada field wajib yang belum lengkap.", false);
          activeSubmitButton.disabled = false;
          resetSubmitButtonByMode(submitMode);
          return;
        }

        const numericCheck = (typeof validateNumericOnlyRequiredFields === "function")
          ? validateNumericOnlyRequiredFields()
          : { ok: true, invalids: [] };

        if (!numericCheck.ok) {
          showTopAlert(
            "Field berikut hanya boleh angka: " + numericCheck.invalids.join(", "),
            false
          );
          activeSubmitButton.disabled = false;
          resetSubmitButtonByMode(submitMode);
          return;
        }

        const birthValidation = validateAndApplyBirthUI({ silent: false, hard: true });
        if (!birthValidation || !birthValidation.ok) {
          activeSubmitButton.disabled = false;
          resetSubmitButtonByMode(submitMode);
          return;
        }

        const dxRuleCheck = validateDxBusinessRules();
        if (!dxRuleCheck.ok) {
          showTopAlert(dxRuleCheck.errors.join(" "), false);
          activeSubmitButton.disabled = false;
          resetSubmitButtonByMode(submitMode);
          return;
        }

        const warnings = checkConsistencyWarnings().concat(dxRuleCheck.warnings || []);
        if (warnings.length > 0) {
          showTopAlert(warnings.join(" "), false);
        }

        updateImunisasiSummary();
        syncStatusHistoryTimeline();

        activeSubmitButton.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>Menyimpan...`;
        activeSubmitButton.disabled = true;

        const dataObj = { dx: selector.value, __token: SESSION_TOKEN, __workflowStage: normalizeWorkflowStepId(activeStageOnSubmit) };
        activeFormElement.querySelectorAll('input[name], select[name], textarea[name]').forEach((el) => {
          const fieldKey = _getSemanticFieldKey_(el);
          if (!fieldKey) return;
          dataObj[fieldKey] = el.value;
        });

        if (!dataObj["ID Registrasi Kasus"] && window.__PD3I_ACTIVE_RECORD_META && window.__PD3I_ACTIVE_RECORD_META["ID Registrasi Kasus"]) {
          dataObj["ID Registrasi Kasus"] = window.__PD3I_ACTIVE_RECORD_META["ID Registrasi Kasus"];
        }
        if (!dataObj.RAW_ROW_NUMBER && window.__PD3I_ACTIVE_RECORD_META && window.__PD3I_ACTIVE_RECORD_META.RAW_ROW_NUMBER) {
          dataObj.RAW_ROW_NUMBER = window.__PD3I_ACTIVE_RECORD_META.RAW_ROW_NUMBER;
        }

        const activeStageNormalized = normalizeWorkflowStepId(activeStageOnSubmit);
        if (!dataObj["Status Verifikasi EPID"] && activeStageNormalized === 'section-pelapor') {
          dataObj["Status Verifikasi EPID"] = 'Pending';
        }
        if (activeStageNormalized === 'section-verifikasi') {
          const currentStatus = String(dataObj["Status Verifikasi EPID"] || '').trim();
          if (!currentStatus || currentStatus === 'Pending') {
            showTopAlert('Pada tahap verifikasi admin harus memilih status Terverifikasi atau Perlu Revisi.', false);
            activeSubmitButton.disabled = false;
            resetSubmitButtonByMode(submitMode);
            return;
          }
          if (!dataObj["Petugas Verifikator"]) dataObj["Petugas Verifikator"] = getCurrentSessionActorName();
          if (!dataObj["Tanggal Verifikasi EPID"]) dataObj["Tanggal Verifikasi EPID"] = getTodayInputValue();
          dataObj["Review Admin Terakhir"] = `${currentStatus} oleh ${getCurrentSessionActorName() || 'admin'}`;
          if (currentStatus === 'Terverifikasi') {
            dataObj["Nomor EPID Final"] = String(dataObj["Nomor EPID Final"] || dataObj["Nomor EPID Rekomendasi"] || '').trim();
            if (!dataObj["Nomor EPID Final"]) {
              showTopAlert('Nomor EPID final belum tersedia. Tunggu rekomendasi sistem atau isi manual.', false);
              activeSubmitButton.disabled = false;
              resetSubmitButtonByMode(submitMode);
              return;
            }
            dataObj["Nomor EPID"] = dataObj["Nomor EPID Final"];
            dataObj["Status Notifikasi Pengampu"] = '';
            dataObj["Reason Notifikasi Pengampu"] = '';
            dataObj["Notifikasi Revisi Dibaca"] = 'Ya';
          }
          if (currentStatus === 'Perlu Revisi') {
            if (!String(dataObj["Catatan Verifikasi EPID"] || '').trim()) {
              showTopAlert('Catatan verifikasi wajib diisi jika status Perlu Revisi.', false);
              activeSubmitButton.disabled = false;
              resetSubmitButtonByMode(submitMode);
              return;
            }
            dataObj["Nomor EPID Final"] = '';
            dataObj["Nomor EPID"] = '';
            dataObj["Waktu Permintaan Revisi"] = new Date().toISOString();
            dataObj["Notifikasi Revisi Dibaca"] = 'Tidak';
          }
        }

        if (!dataObj["Nama unit pelapor"]) {
          showTopAlert("Nama Unit Pelapor wajib dipilih.", false);
          activeSubmitButton.disabled = false;
          resetSubmitButtonByMode(submitMode);
          return;
        }

        const unitSelect = document.getElementById("Nama unit pelapor");
        dataObj["FaskesKey"] =
          unitSelect?.options[unitSelect.selectedIndex]?.getAttribute("data-key")
          || (dataObj["Nama unit pelapor"] || "").toUpperCase().replace(/[^A-Z0-9]/g, "");

        const rsSelect = document.getElementById("Nama Rumah Sakit");
        if (rsSelect) {
          dataObj["Nama Rumah Sakit"] = dataObj["Nama Rumah Sakit"] || rsSelect.value || "";
          if (dataObj["Nama Rumah Sakit"]) {
            dataObj["RumahSakitKey"] =
              rsSelect?.options[rsSelect.selectedIndex]?.getAttribute("data-key")
              || (dataObj["Nama Rumah Sakit"] || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
          }
        }

        activeFormElement.querySelectorAll("table[data-dynamic-table]").forEach(table => {
          const tableId = table.getAttribute("data-dynamic-table");
          const tableData = [];

          table.querySelectorAll("tbody tr").forEach(row => {
            const rowObj = {};
            row.querySelectorAll("input, select").forEach(i => {
              rowObj[i.getAttribute("data-name")] = i.value;
            });

            if (tableId === "Riwayat Imunisasi") {
              rowObj["KodeImunisasi"] = row.dataset.kodeImun || "";
              if (rowObj["Jenis Imunisasi"]) tableData.push(rowObj);
            } else if (tableId === "Riwayat Status Kasus") {
              if (rowObj["Tanggal"] || rowObj["Status"]) tableData.push(rowObj);
            } else {
              if (rowObj["Nama"]) tableData.push(rowObj);
            }
          });

          dataObj[tableId] = tableData.length > 0 ? JSON.stringify(tableData) : "";
        });

        try {
          let res = null;

          try {
            res = await postJsonToWebApp(GOOGLE_SCRIPT_URL, dataObj);
          } catch (webErr) {
            console.warn("POST /exec gagal, fallback ke google.script.run.saveFormData:", webErr);
            res = await saveFormViaGsRun(dataObj);
          }

          if (res && res.status === "success") {
            showTopAlert(res.message || "Data berhasil disimpan.", true);

            let epidSaved = String((res && res.epid) || dataObj["Nomor EPID"] || "").trim();
            let dxSaved = String((res && res.dx) || dataObj.dx || "").trim();
            let printUrl = String((res && res.printUrl) || "").trim();

            if ((!epidSaved || !printUrl) && safeGsRun()) {
              try {
                const metaRes = await resolveLatestSavedMetaViaGsRun(dataObj);
                if (metaRes && metaRes.status === "success") {
                  epidSaved = String(metaRes.epid || epidSaved || "").trim();
                  dxSaved = String(metaRes.dx || dxSaved || "").trim();
                  printUrl = String(metaRes.printUrl || printUrl || "").trim();
                }
              } catch (metaErr) {
                console.warn("resolveLatestSavedMetaViaGsRun gagal:", metaErr);
              }
            }

            if (epidSaved && !dataObj["Nomor EPID"]) {
              dataObj["Nomor EPID"] = epidSaved;
              const epidInput = document.getElementById("Nomor EPID");
              if (epidInput) epidInput.value = epidSaved;
            }
            if (typeof window !== 'undefined') {
              window.__PD3I_ACTIVE_RECORD_META = Object.assign({}, window.__PD3I_ACTIVE_RECORD_META || {}, dataObj || {}, { "Nomor EPID": epidSaved || dataObj["Nomor EPID"] || '' });
            }

            console.log("Save response:", res);
            console.log("Resolved print params:", { epidSaved, dxSaved, printUrl });

            clearFormDraft();
            if (epidSaved && submitMode !== 'input') {
              isEditMode = true;
              updateFormStepperState(document.querySelector(".pd3i-stepper-item.is-active")?.getAttribute("data-step-target") || "section-pelapor");
            }
            updateUiShellSummary();
            refreshWorkflowInbox();

            if (activeStageNormalized === 'section-sampel') {
              clearActiveRecordContext();
              openSidebarWorkspace('sampel', { scroll: true });
              refreshWorkflowInbox();
              showTopAlert('Hasil sampel berhasil disimpan. Kasus yang sudah selesai keluar dari daftar menunggu hasil lab.', true);
            } else {
              showSuccessModal(
                res.message || "Data berhasil disimpan.",
                printUrl,
                { dx: dxSaved, epid: epidSaved, token: SESSION_TOKEN }
              );
            }
          } else {
            showTopAlert("Error: " + (res?.message || "Gagal menyimpan data."), false);
            activeSubmitButton.disabled = false;
            resetSubmitButtonByMode(submitMode);
          }
        } catch (err) {
          console.error("submit failed:", err);
          showTopAlert("Gagal submit. Pastikan URL Web App /exec benar dan deployment terbaru sudah aktif.", false);
          activeSubmitButton.disabled = false;
          resetSubmitButtonByMode(submitMode);
        }
      };

      if (btnSubmit && !btnSubmit.dataset.boundSubmit) {
        btnSubmit.dataset.boundSubmit = '1';
        btnSubmit.addEventListener('click', function() {
          handleMainFormSubmit('search');
        });
      }
      if (btnSubmitInput && !btnSubmitInput.dataset.boundSubmit) {
        btnSubmitInput.dataset.boundSubmit = '1';
        btnSubmitInput.addEventListener('click', function() {
          handleMainFormSubmit('input');
        });
      }
      if (btnSubmitVerifikasi && !btnSubmitVerifikasi.dataset.boundSubmit) {
        btnSubmitVerifikasi.dataset.boundSubmit = '1';
        btnSubmitVerifikasi.addEventListener('click', function() {
          handleMainFormSubmit('verifikasi');
        });
      }
      if (btnSubmitSampel && !btnSubmitSampel.dataset.boundSubmit) {
        btnSubmitSampel.dataset.boundSubmit = '1';
        btnSubmitSampel.addEventListener('click', function() {
          handleMainFormSubmit('sampel');
        });
      }
      if (btnSubmitStatus && !btnSubmitStatus.dataset.boundSubmit) {
        btnSubmitStatus.dataset.boundSubmit = '1';
        btnSubmitStatus.addEventListener('click', function() {
          handleMainFormSubmit('status');
        });
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initAppModule);
    } else {
      initAppModule();
    }
  })();
</script>
