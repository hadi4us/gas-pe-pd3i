<script>
// ============================================================
  // APP INIT
  // ============================================================
  (function () {
    let __appInitialized = false;

    function initAppModule() {
      if (__appInitialized) return;
      __appInitialized = true;

      const selector = document.getElementById("form-selector");
      const formElement = document.getElementById("dynamic-form");
      const pelaporContainer = document.getElementById("pelapor-fields-container");
      const pasienContainer = document.getElementById("pasien-fields-container");
      const specificContainer = document.getElementById("specific-fields-container");
      const specificTitle = document.getElementById("specific-title");
      const btnSubmit = document.getElementById("btn-submit");
      const searchContainer = document.getElementById("search-container");
      const editBadge = document.getElementById("edit-badge");
      const btnCancelEdit = document.getElementById("btn-cancel-edit");
      const btnSearchEpid = document.getElementById("btn-search-epid");

      if (!selector || !formElement || !pelaporContainer || !pasienContainer || !specificContainer || !btnSubmit) {
        console.warn("App init dibatalkan: elemen inti belum lengkap.");
        return;
      }

      const COMMON = getCommonConfigSafe();

      document.addEventListener("input", function(e) {
        if (e.target && e.target.closest && e.target.closest("#dynamic-form")) {
          saveFormDraft();
        }
      });

      document.addEventListener("change", function(e) {
        if (e.target && ((e.target.closest && e.target.closest("#dynamic-form")) || e.target.id === "form-selector" || e.target.id === "search-epid")) {
          saveFormDraft();
        }
      });

      window.addEventListener("beforeunload", function() {
        saveFormDraft();
      });

      selector.addEventListener("change", function() {
        const dx = this.value;
        const cfg = getDxConfigSafe(dx);

        pelaporContainer.innerHTML = "";
        pasienContainer.innerHTML = "";
        specificContainer.innerHTML = "";
        hideTopAlert();

        isEditMode = false;
        if (editBadge) editBadge.classList.add("hidden");
        if (btnCancelEdit) btnCancelEdit.classList.add("hidden");
        btnSubmit.disabled = false;
        btnSubmit.classList.remove("bg-yellow-600");
        btnSubmit.classList.add("bg-blue-600");
        btnSubmit.innerHTML = `<i class="fas fa-save"></i> Simpan Data ke Database`;

        if (choicesInstance) {
          try { choicesInstance.destroy(); } catch (e) {}
          choicesInstance = null;
        }
        if (rsChoicesInstance) {
          try { rsChoicesInstance.destroy(); } catch (e) {}
          rsChoicesInstance = null;
        }

        if (!dx || !cfg) {
          formElement.classList.add("hidden");
          if (searchContainer) searchContainer.classList.add("hidden");
          return;
        }

        formElement.classList.remove("hidden");
        if (searchContainer) searchContainer.classList.remove("hidden");

        (COMMON.pelapor || []).forEach(f => {
          pelaporContainer.innerHTML += generateHTML(f);
        });

        (COMMON.pasien || []).forEach(f => {
          pasienContainer.innerHTML += generateHTML(f);
        });

        specificTitle.innerHTML = `<i class="fas fa-stethoscope text-blue-600"></i> Data Spesifik (${cfg.title || dx})`;
        renderDiagnosisSections(cfg, specificContainer);

        setTimeout(async () => {
          addDefaultRowsForDynamicTables();
          initWilayahDropdowns();
          initGeoButton();
          // Evaluasi showIf setelah form dirender
          if (typeof applyAllShowIf === "function") applyAllShowIf();

          const unit = document.getElementById("Nama unit pelapor");
          if (unit) {
            unit.disabled = true;
            unit.innerHTML = '<option value="">Pilih sumber laporan dahulu...</option>';
          }

          await loadRefImunisasi();
          ensureRiwayatImunisasiRowsReady();
          setTimeout(() => {
            try { ensureRiwayatImunisasiRowsReady(); } catch (e) {}
          }, 200);
          setTimeout(() => {
            try { ensureRiwayatImunisasiRowsReady(); } catch (e) {}
          }, 600);

          if (MASTER_FASKES && MASTER_FASKES.length > 0) {
            initChoicesRumahSakit();
          }
        }, 50);
      });

      function renderSearchResults(results) {
        const box = document.getElementById("search-results");
        if (!box) return;

        if (!Array.isArray(results) || results.length === 0) {
          box.classList.remove("hidden");
          box.innerHTML = `
            <div class="p-5 bg-white rounded-lg">
              <div class="text-sm font-extrabold text-slate-700">Hasil Pencarian</div>
              <div class="mt-2 text-sm text-slate-500">Tidak ada data yang cocok dengan filter pencarian.</div>
            </div>
          `;
          return;
        }

        box.classList.remove("hidden");
        box.innerHTML = `
          <div class="bg-white rounded-lg border border-slate-200 overflow-hidden">
            <div class="flex items-center justify-between px-4 py-3 border-b border-slate-200 bg-slate-50">
              <div>
                <div class="text-sm font-extrabold text-slate-800">Hasil Pencarian</div>
                <div class="text-xs text-slate-500 font-semibold">Ditemukan ${results.length} data. Pilih salah satu untuk mode edit.</div>
              </div>
            </div>

            <div class="p-3 md:p-4 space-y-3 bg-slate-50">
              ${results.map((r, idx) => `
                <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
                  <div class="flex items-start justify-between gap-3">
                    <div class="min-w-0">
                      <div class="text-xs font-extrabold uppercase tracking-wide text-slate-500">#${idx + 1}</div>
                      <div class="mt-1 text-sm md:text-base font-black text-slate-800 break-words">${r.nama || "-"}</div>
                      <div class="mt-1 text-[11px] font-mono text-blue-700 break-all">${r.epid || "-"}</div>
                    </div>
                    <button type="button" class="btn-pilih-edit shrink-0 inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg text-xs font-extrabold shadow-sm" data-epid="${r.epid || ""}">
                      <i class="fas fa-pen-to-square"></i> Edit
                    </button>
                  </div>

                  <div class="mt-3 grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">
                    <div>
                      <div class="text-[11px] font-bold uppercase tracking-wide text-slate-500">Tanggal Lahir</div>
                      <div class="text-slate-700">${r.tanggalLahir || "-"}</div>
                    </div>
                    <div>
                      <div class="text-[11px] font-bold uppercase tracking-wide text-slate-500">Orang Tua / Wali</div>
                      <div class="text-slate-700 break-words">${r.orangTua || "-"}</div>
                    </div>
                    <div>
                      <div class="text-[11px] font-bold uppercase tracking-wide text-slate-500">Kelurahan</div>
                      <div class="text-slate-700 break-words">${r.kelurahan || "-"}</div>
                    </div>
                    <div class="md:col-span-2">
                      <div class="text-[11px] font-bold uppercase tracking-wide text-slate-500">Alamat</div>
                      <div class="text-slate-700 break-words">${r.alamat || "-"}</div>
                    </div>
                  </div>
                </div>
              `).join("")}
            </div>
          </div>
        `;

        box.querySelectorAll(".btn-pilih-edit").forEach(btn => {
          btn.addEventListener("click", function() {
            const epid = this.getAttribute("data-epid") || "";
            loadRecordForEdit(epid);
          });
        });
      }

      function loadRecordForEdit(epid) {
        const dx = selector.value;
        if (!dx || !epid) {
          showTopAlert("EPID tidak valid untuk mode edit.", false);
          return;
        }

        btnSubmit.disabled = true;
        btnSubmit.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>Mencari Data...`;

        google.script.run
          .withSuccessHandler(async function(record) {
            if (!record) {
              showTopAlert("Data tidak ditemukan.", false);
              btnSubmit.disabled = false;
              btnSubmit.innerHTML = `<i class="fas fa-save"></i> Simpan Data ke Database`;
              return;
            }

            isEditMode = true;
            if (editBadge) editBadge.classList.remove("hidden");
            if (btnCancelEdit) btnCancelEdit.classList.remove("hidden");
            btnSubmit.innerHTML = `<i class="fas fa-pen-to-square"></i> Perbarui Data EPID ${epid}`;
            btnSubmit.classList.remove("bg-blue-600");
            btnSubmit.classList.add("bg-yellow-600");
            btnSubmit.disabled = false;

            hydrateRecordToForm(record);

            // Evaluasi showIf setelah data di-hydrate ke form
            if (typeof applyAllShowIf === "function") applyAllShowIf();

            if (record["Sumber Laporan"]) {
              initChoices(record["Sumber Laporan"], record["Nama unit pelapor"] || "");
            }

            if (record["Apakah dirawat inap?"] === "Ya") {
              setTimeout(() => {
                initChoicesRumahSakit(record["Nama Rumah Sakit"] || "");
              }, 150);
            }

            const birthValidation = validateAndApplyBirthUI({ silent: true, hard: false });
            applyBirthValidationUI(birthValidation);

            await loadRefImunisasi();
            buildRiwayatImunisasiRows();
            hydrateDynamicTables(record);

            showTopAlert("Data berhasil dimuat. Silakan lakukan perubahan.", true);
            window.scrollTo({ top: formElement.offsetTop - 20, behavior: "smooth" });
          })
          .withFailureHandler(function(err) {
            console.error("getRecordByEpid failed:", err);
            showTopAlert("Gagal memuat data untuk edit.", false);
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = `<i class="fas fa-save"></i> Simpan Data ke Database`;
          })
          .getRecordByEpid(dx, epid, SESSION_TOKEN);
      }

      if (btnSearchEpid) {
        btnSearchEpid.addEventListener("click", function() {
          const dx = selector.value;
          const filters = {
            epid: document.getElementById("search-epid")?.value.trim() || "",
            nama: document.getElementById("search-nama")?.value.trim() || "",
            tanggalLahir: document.getElementById("search-tgl-lahir")?.value || "",
            orangTua: document.getElementById("search-orang-tua")?.value.trim() || "",
            alamat: document.getElementById("search-alamat")?.value.trim() || "",
            kelurahan: document.getElementById("search-kelurahan")?.value.trim() || "",
            sortBy: document.getElementById("search-sort")?.value || "updated_desc"
          };

          if (!dx) {
            showTopAlert("Pilih jenis penyakit terlebih dahulu.", false);
            return;
          }

          if (!filters.epid && !filters.nama && !filters.tanggalLahir && !filters.orangTua && !filters.alamat && !filters.kelurahan) {
            showTopAlert("Isi minimal satu kriteria pencarian.", false);
            return;
          }

          if (!safeGsRun()) {
            showTopAlert("Fitur Cari/Edit hanya berfungsi di lingkungan WebApp (/exec).", false);
            return;
          }

          btnSubmit.disabled = true;
          btnSubmit.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>Mencari Data...`;

          google.script.run
            .withSuccessHandler(function(results) {
              btnSubmit.disabled = false;
              btnSubmit.innerHTML = `<i class="fas fa-save"></i> Simpan Data ke Database`;
              renderSearchResults(results || []);
            })
            .withFailureHandler(function(err) {
              console.error("searchRecords failed:", err);
              showTopAlert("Gagal melakukan pencarian data.", false);
              btnSubmit.disabled = false;
              btnSubmit.innerHTML = `<i class="fas fa-save"></i> Simpan Data ke Database`;
            })
            .searchRecords(dx, filters, SESSION_TOKEN);
        });
      }

      if (btnCancelEdit) {
        btnCancelEdit.addEventListener("click", function() {
          resetForNewEntry();
        });
      }

      restoreFormDraft();

      formElement.addEventListener("submit", async function(e) {
        e.preventDefault();

        const birthValidation = validateAndApplyBirthUI({ silent: false, hard: true });

        if (!birthValidation || !birthValidation.ok) {
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = isEditMode
            ? `<i class="fas fa-pen-to-square"></i> Perbarui Data`
            : `<i class="fas fa-save"></i> Simpan Data ke Database`;
          return;
        }

        const warnings = checkConsistencyWarnings();
        if (warnings.length > 0) {
          showTopAlert(warnings.join(" "), false);
        }

        updateImunisasiSummary();

        btnSubmit.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>Menyimpan...`;
        btnSubmit.disabled = true;

        const formData = new FormData(this);
        const dataObj = { dx: selector.value, __token: SESSION_TOKEN };
        formData.forEach((v, k) => { dataObj[k] = v; });

        if (!dataObj["Nama unit pelapor"]) {
          showTopAlert("Nama Unit Pelapor wajib dipilih.", false);
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = `<i class="fas fa-save"></i> Simpan Data ke Database`;
          return;
        }

        const unitSelect = document.getElementById("Nama unit pelapor");
        dataObj["FaskesKey"] =
          unitSelect?.options[unitSelect.selectedIndex]?.getAttribute("data-key")
          || (dataObj["Nama unit pelapor"] || "").toUpperCase().replace(/[^A-Z0-9]/g, "");

        const rsSelect = document.getElementById("Nama Rumah Sakit");
        if (rsSelect && dataObj["Nama Rumah Sakit"]) {
          dataObj["RumahSakitKey"] =
            rsSelect?.options[rsSelect.selectedIndex]?.getAttribute("data-key")
            || (dataObj["Nama Rumah Sakit"] || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
        }

        document.querySelectorAll("table[data-dynamic-table]").forEach(table => {
          const tableId = table.getAttribute("data-dynamic-table");
          const tableData = [];

          table.querySelectorAll("tbody tr").forEach(row => {
            const rowObj = {};
            row.querySelectorAll("input, select").forEach(i => {
              rowObj[i.getAttribute("data-name")] = i.value;
            });

            if (tableId === "Riwayat Imunisasi") {
              rowObj["KodeImunisasi"] = row.dataset.kodeImun || "";
              if (rowObj["Jenis Imunisasi"]) tableData.push(rowObj);
            } else {
              if (rowObj["Nama"]) tableData.push(rowObj);
            }
          });

          dataObj[tableId] = tableData.length > 0 ? JSON.stringify(tableData) : "";
        });

        try {
          if (!safeGsRun()) {
            throw new Error("google.script.run tidak tersedia");
          }

          google.script.run
            .withSuccessHandler(function(res) {
              if (res && res.status === "success") {
                showTopAlert(res.message || "Data berhasil disimpan.", true);

                const epidSaved = String((res && res.epid) || dataObj["Nomor EPID"] || "").trim();
                const dxSaved = String((res && res.dx) || dataObj.dx || "").trim();
                const printUrl = String((res && res.printUrl) || "").trim();

                if (res.epid && !dataObj["Nomor EPID"]) {
                  dataObj["Nomor EPID"] = res.epid;
                  const epidInput = document.getElementById("Nomor EPID");
                  if (epidInput) epidInput.value = res.epid;
                }

                console.log("Save response:", res);
                console.log("Resolved print params:", { epidSaved, dxSaved, printUrl });

                clearFormDraft();

                showSuccessModal(
                  res.message || "Data berhasil disimpan.",
                  printUrl
                );
              } else {
                showTopAlert("Error: " + ((res && res.message) || "Gagal menyimpan data."), false);
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = isEditMode
                  ? `<i class="fas fa-pen-to-square"></i> Perbarui Data`
                  : `<i class="fas fa-save"></i> Simpan Data ke Database`;
              }
            })
            .withFailureHandler(function(err) {
              console.error("submit failed:", err);
              showTopAlert("Gagal submit. Server Apps Script menolak request atau terjadi error runtime.", false);
              btnSubmit.disabled = false;
              btnSubmit.innerHTML = `<i class="fas fa-save"></i> Simpan Data ke Database`;
            })
            .saveFormData(dataObj);
        } catch (err) {
          console.error("submit setup failed:", err);
          showTopAlert("Gagal submit. google.script.run tidak tersedia di halaman ini.", false);
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = `<i class="fas fa-save"></i> Simpan Data ke Database`;
        }
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initAppModule);
    } else {
      initAppModule();
    }
  })();
</script>
