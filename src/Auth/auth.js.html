<script>
  // ============================================================
  // AUTH.JS.HTML — FINAL (INIT SAFE)
  // ============================================================

  (function () {
    let __authInitialized = false;
    let loginAttempt = 0;
    let otpCooldownTimer = null;
    const AUTH_RESTORE_TIMEOUT_MS = 8000;
    let AUTH_SESSION_META = null;

    function initAuthModule() {
      if (__authInitialized) return;
      __authInitialized = true;

      const loginModal = document.getElementById("login-modal");
      const pinModal = document.getElementById("pin-modal");
      const app = document.getElementById("app");

      const userBadge = document.getElementById("user-badge");
      const userBadgeText = document.getElementById("user-badge-text");

      const loginForm = document.getElementById("login-form");
      const loginAlert = document.getElementById("login-alert");
      const loginCard = document.getElementById("login-card");
      const btnLogin = document.getElementById("btn-login");
      const btnSendOtp = document.getElementById("btn-send-otp");
      const otpSection = document.getElementById("otp-section");

      const pinForm = document.getElementById("pin-form");
      const pinAlert = document.getElementById("pin-alert");

      const btnRefreshCaptcha = document.getElementById("btn-refresh-captcha");
      const btnRefreshPinCaptcha = document.getElementById("btn-refresh-pin-captcha");
      const btnOpenPin = document.getElementById("btn-open-pin");
      const btnClosePinModal = document.getElementById("btn-close-pin-modal");
      const btnLogout = document.getElementById("btn-logout");

      const loginEmail = document.getElementById("login-email");
      const loginOtp = document.getElementById("login-otp");
      const loginUsername = loginEmail;
      const loginPin = loginOtp;
      const loginCaptchaAnswerInput = null;

      const pinOld = document.getElementById("pin-old");
      const pinNew = document.getElementById("pin-new");
      const pinNew2 = document.getElementById("pin-new2");
      const pinCaptchaAnswerInput = document.getElementById("pin-captcha-answer");
      const btnSavePin = document.getElementById("btn-save-pin");

      const toggleLoginPin = document.getElementById("toggle-login-pin");

      function setCredentialInputsEnabled(mode) {
        const enableLogin = mode === 'login';
        const enablePin = mode === 'pin';
        [loginEmail, loginOtp, btnLogin, btnSendOtp].forEach(function(el) {
          if (!el) return;
          el.disabled = !enableLogin;
        });
        [pinOld, pinNew, pinNew2, pinCaptchaAnswerInput, btnSavePin, btnRefreshPinCaptcha].forEach(function(el) {
          if (!el) return;
          el.disabled = !enablePin;
        });
      }

      function refreshLoginCaptcha() {}

      function startOtpCooldown(seconds) {
        if (!btnSendOtp) return;
        let remaining = Number(seconds || 60);
        if (otpCooldownTimer) clearInterval(otpCooldownTimer);
        btnSendOtp.disabled = true;
        btnSendOtp.innerHTML = `<span>Kirim OTP (${remaining}d)</span>`;
        otpCooldownTimer = setInterval(function () {
          remaining -= 1;
          if (remaining <= 0) {
            clearInterval(otpCooldownTimer);
            otpCooldownTimer = null;
            btnSendOtp.disabled = false;
            btnSendOtp.innerHTML = `<span>Kirim OTP</span>`;
            return;
          }
          btnSendOtp.innerHTML = `<span>Kirim OTP (${remaining}d)</span>`;
        }, 1000);
      }

      function refreshPinCaptcha() {
        if (typeof forceRenderPinCaptcha === "function") {
          forceRenderPinCaptcha(0);
        } else if (typeof makeLocalCaptcha === "function") {
          makeLocalCaptcha("pin");
        }
        if (pinCaptchaAnswerInput) pinCaptchaAnswerInput.value = "";
      }

      function hideAuthBootOverlay() {
        const overlay = document.getElementById("auth-boot-overlay");
        if (overlay) overlay.classList.add("hidden");
      }

      function showAuthBootOverlay() {
        const overlay = document.getElementById("auth-boot-overlay");
        if (overlay) overlay.classList.remove("hidden");
      }

      function setAuthSessionMeta(meta) {
        AUTH_SESSION_META = meta || null;
        try {
          window.__AUTH_SESSION_META = AUTH_SESSION_META;
        } catch (e) {}
      }

      function setLoggedInUI(user) {
        SESSION_USER = user || null;
        setCredentialInputsEnabled('none');
        try { window.__PD3I_SESSION_USER = SESSION_USER; } catch (e) {}

        if (app) app.classList.remove("hidden");
        closeModal(loginModal);
        closeModal(pinModal);
        hideAuthBootOverlay();

        const role = String((user && user.role) || "").trim().toLowerCase();
        const adminMenuWrap = document.getElementById("admin-menu-wrap");
        const roleLabel = (typeof getRoleDisplayLabel === "function") ? getRoleDisplayLabel(role) : role;

        if (userBadge) userBadge.classList.remove("hidden");
        if (userBadgeText) {
          const name = String((user && (user.nama || user.username)) || "");
          userBadgeText.textContent = roleLabel ? `${name} • ${roleLabel}` : name;
        }

        if (adminMenuWrap) {
          if (role === "admin" || role === "super-admin") adminMenuWrap.classList.remove("hidden");
          else adminMenuWrap.classList.add("hidden");
        }

        if (typeof window.applyRoleUIState === "function") {
          window.applyRoleUIState();
        }
        if (typeof window.applyInitialRouteView === "function") {
          window.applyInitialRouteView();
        }
      }

      function setLoggedOutUI() {
        SESSION_TOKEN = "";
        setCredentialInputsEnabled('login');
        SESSION_USER = null;
        try { window.__PD3I_SESSION_TOKEN = ""; window.__PD3I_SESSION_USER = null; } catch (e) {}
        setAuthSessionMeta(null);
        loginAttempt = 0;
        MASTER_FASKES = [];
        MASTER_WORKFLOW_FILTERS = { kecamatan: [], kelurahanByKecamatan: {}, statusKasus: [] };
        clearSessionFromBrowser();
        stopIdleTimer();

        if (choicesInstance) {
          try { choicesInstance.destroy(); } catch (e) {}
        }
        choicesInstance = null;

        if (typeof rsChoicesInstance !== "undefined" && rsChoicesInstance) {
          try { rsChoicesInstance.destroy(); } catch (e) {}
          rsChoicesInstance = null;
        }

        if (app) app.classList.add("hidden");
        if (userBadge) userBadge.classList.add("hidden");
        if (userBadgeText) userBadgeText.textContent = "";

        closeModal(pinModal);
        openModal(loginModal);
        hideAuthBootOverlay();

        if (loginForm) loginForm.reset();
        if (pinForm) pinForm.reset();

        hideAlert(loginAlert);
        hideAlert(pinAlert);
        hideTopAlert();

        setTimeout(refreshLoginCaptcha, 100);
      }

      async function handleIdleTimeout() {
        if (!SESSION_TOKEN) return;

        try {
          if (safeGsRun()) {
            google.script.run
              .withSuccessHandler(function () {
                setLoggedOutUI();
                setAlert(loginAlert, "Sesi berakhir karena tidak ada aktivitas.", false);
              })
              .withFailureHandler(function () {
                setLoggedOutUI();
                setAlert(loginAlert, "Sesi berakhir karena tidak ada aktivitas.", false);
              })
              .authLogout(SESSION_TOKEN);
          } else {
            setLoggedOutUI();
            setAlert(loginAlert, "Sesi berakhir karena tidak ada aktivitas.", false);
          }
        } catch (e) {
          setLoggedOutUI();
        }
      }

      function refreshIdleSession() {
        if (!SESSION_TOKEN) return;
        startIdleTimer(handleIdleTimeout);
      }

      bindIdleEvents(refreshIdleSession);

      if (btnSendOtp) {
        btnSendOtp.addEventListener("click", function () {
          hideAlert(loginAlert);
          const email = ((loginEmail && loginEmail.value) || "").trim();
          if (!email) {
            setAlert(loginAlert, "Masukkan alamat Gmail terlebih dahulu.", false);
            return;
          }
          if (!safeGsRun()) {
            setAlert(loginAlert, "Login hanya bisa digunakan di WebApp (/exec).", false);
            return;
          }
          btnSendOtp.disabled = true;
          btnSendOtp.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Mengirim...`;
          google.script.run
            .withSuccessHandler(function (res) {
              if (!res || res.status !== "success") {
                setAlert(loginAlert, (res && res.message) || "Gagal mengirim OTP.", false);
                if (res && res.cooldownSec) startOtpCooldown(res.cooldownSec);
                else {
                  btnSendOtp.disabled = false;
                  btnSendOtp.innerHTML = `<span>Kirim OTP</span>`;
                }
                return;
              }
              setAlert(loginAlert, res.message || "OTP sudah dikirim ke Gmail Anda.", true);
              if (otpSection) otpSection.classList.remove("hidden");
              if (loginOtp) loginOtp.focus();
              startOtpCooldown(res.cooldownSec || 60);
            })
            .withFailureHandler(function (err) {
              console.error("requestLoginOtp failed:", err);
              setAlert(loginAlert, "Gagal mengirim OTP. Coba lagi.", false);
              btnSendOtp.disabled = false;
              btnSendOtp.innerHTML = `<span>Kirim OTP</span>`;
            })
            .requestLoginOtp(email);
        });
      }

      if (loginForm) {
        loginForm.addEventListener("submit", function (e) {
          e.preventDefault();
          hideAlert(loginAlert);
          const email = ((loginEmail && loginEmail.value) || "").trim();
          const otp = ((loginOtp && loginOtp.value) || "").trim();

          if (!email || !otp) {
            setAlert(loginAlert, "Email dan OTP wajib diisi.", false);
            if (loginCard) {
              loginCard.classList.add("shake");
              setTimeout(() => loginCard.classList.remove("shake"), 450);
            }
            return;
          }

          if (!safeGsRun()) {
            setAlert(loginAlert, "Login hanya bisa digunakan di WebApp (/exec).", false);
            return;
          }

          if (btnLogin) {
            btnLogin.disabled = true;
            btnLogin.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Memverifikasi...`;
          }

          google.script.run
            .withSuccessHandler(function (res) {
              if (btnLogin) {
                btnLogin.disabled = false;
                btnLogin.innerHTML = `<span>Masuk</span> <i class="fas fa-arrow-right"></i>`;
              }
              if (!res || res.status !== "success") {
                loginAttempt++;
                setAlert(loginAlert, (res && res.message) || "Login gagal.", false);
                return;
              }
              loginAttempt = 0;
              SESSION_TOKEN = res.token || "";
              SESSION_USER = res.user || null;
              try { window.__PD3I_SESSION_TOKEN = SESSION_TOKEN; window.__PD3I_SESSION_USER = SESSION_USER; } catch (e) {}
              setAuthSessionMeta({
                ttlSec: Number(res.ttlSec || 0),
                issuedAt: Number(res.issuedAt || 0),
                expiresAt: Number(res.expiresAt || 0)
              });
              saveSessionToBrowser(SESSION_TOKEN, SESSION_USER);
              setLoggedInUI(SESSION_USER);
              refreshIdleSession();
              if (window.loadFaskesRealtime) window.loadFaskesRealtime();
              if (window.loadWorkflowFilterOptions) window.loadWorkflowFilterOptions(true);
            })
            .withFailureHandler(function (err) {
              console.error("verifyLoginOtp failed:", err);
              if (btnLogin) {
                btnLogin.disabled = false;
                btnLogin.innerHTML = `<span>Masuk</span> <i class="fas fa-arrow-right"></i>`;
              }
              setAlert(loginAlert, "Login gagal. Coba lagi.", false);
            })
            .verifyLoginOtp(email, otp);
        });
      }

      if (btnLogout) {
        btnLogout.addEventListener("click", function () {
          function resetUI() {
            setLoggedOutUI();
          }

          if (!safeGsRun()) {
            resetUI();
            return;
          }

          google.script.run
            .withSuccessHandler(resetUI)
            .withFailureHandler(resetUI)
            .authLogout(SESSION_TOKEN);
        });
      }

      if (btnOpenPin) {
        btnOpenPin.addEventListener("click", function () {
          if (!SESSION_TOKEN) return;

          if (pinForm) pinForm.reset();
          hideAlert(pinAlert);
          setCredentialInputsEnabled('pin');
          openModal(pinModal);

          setTimeout(refreshPinCaptcha, 100);
        });
      }

      if (btnClosePinModal) {
        btnClosePinModal.addEventListener("click", function () {
          closeModal(pinModal);
          setCredentialInputsEnabled('none');
        });
      }

      if (btnSavePin) {
        btnSavePin.addEventListener("click", function () {
          hideAlert(pinAlert);

          const oldPin = ((pinOld && pinOld.value) || "").trim();
          const newPin = ((pinNew && pinNew.value) || "").trim();
          const newPin2 = ((pinNew2 && pinNew2.value) || "").trim();
          const capAns = Number(((pinCaptchaAnswerInput && pinCaptchaAnswerInput.value) || "").trim());

          if (!oldPin || !newPin || !newPin2) {
            setAlert(pinAlert, "Semua field password wajib diisi.", false);
            return;
          }

          if (newPin.length < 6) {
            setAlert(pinAlert, "Password baru minimal 6 karakter.", false);
            return;
          }

          if (newPin !== newPin2) {
            setAlert(pinAlert, "Konfirmasi password baru tidak sama.", false);
            return;
          }

          if (!Number.isFinite(capAns)) {
            setAlert(pinAlert, "Jawaban captcha harus angka.", false);
            return;
          }

          if (pinCaptchaAnswer === null || typeof pinCaptchaAnswer === "undefined") {
            setAlert(pinAlert, "Captcha belum siap. Silakan refresh captcha.", false);
            refreshPinCaptcha();
            return;
          }

          if (capAns !== pinCaptchaAnswer) {
            setAlert(pinAlert, "Captcha salah. Silakan coba lagi.", false);
            if (typeof showCaptchaError === "function") {
              showCaptchaError("pin-captcha-error", "Captcha salah. Silakan coba lagi.");
            }
            refreshPinCaptcha();
            return;
          }

          if (!safeGsRun()) {
            setAlert(pinAlert, "Fitur ini hanya bisa digunakan di WebApp (/exec).", false);
            return;
          }

          const btnSavePin = document.getElementById("btn-save-pin");
          if (btnSavePin) {
            btnSavePin.disabled = true;
            btnSavePin.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Menyimpan...`;
          }

          google.script.run
            .withSuccessHandler(function (res) {
              if (btnSavePin) {
                btnSavePin.disabled = false;
                btnSavePin.innerHTML = `<i class="fas fa-floppy-disk"></i> Simpan Password Baru`;
              }

              if (!res || res.status !== "success") {
                setAlert(pinAlert, (res && res.message) || "Gagal mengubah password.", false);
                refreshPinCaptcha();
                return;
              }

              setAlert(pinAlert, res.message || "Password berhasil diubah.", true);
              refreshPinCaptcha();

              setTimeout(function () {
                closeModal(pinModal);
                setCredentialInputsEnabled('none');
              }, 900);
            })
            .withFailureHandler(function (err) {
              console.error("authChangePin failed:", err);
              if (btnSavePin) {
                btnSavePin.disabled = false;
                btnSavePin.innerHTML = `<i class="fas fa-floppy-disk"></i> Simpan Password Baru`;
              }
              setAlert(pinAlert, "Gagal mengubah password.", false);
              refreshPinCaptcha();
            })
            .authChangePin(SESSION_TOKEN, oldPin, newPin);
        });
      }

      function restoreSessionIfAny() {
        const savedToken = getSessionTokenFromBrowser();
        const savedUser = getSessionUserFromBrowser();

        if (!savedToken || !safeGsRun()) {
          closeModal(pinModal);
          setCredentialInputsEnabled('login');
          openModal(loginModal);
          hideAuthBootOverlay();
          setTimeout(refreshLoginCaptcha, 120);
          return;
        }

        let restoreFinished = false;
        const optimisticRestoreTimeout = savedUser ? window.setTimeout(function () {
          if (restoreFinished) return;
          SESSION_TOKEN = savedToken;
          SESSION_USER = savedUser;
          try { window.__PD3I_SESSION_TOKEN = SESSION_TOKEN; window.__PD3I_SESSION_USER = SESSION_USER; } catch (e) {}
          setLoggedInUI(SESSION_USER);
          refreshIdleSession();
          if (window.loadFaskesRealtime) window.loadFaskesRealtime();
          if (window.loadWorkflowFilterOptions) window.loadWorkflowFilterOptions(true);
          if (typeof window.initPieWorkspace === 'function') {
            try { window.initPieWorkspace(); } catch (e) { console.warn('initPieWorkspace after optimistic restore failed:', e); }
          }
        }, 3000) : null;

        const restoreTimeout = window.setTimeout(function () {
          if (restoreFinished) return;
          restoreFinished = true;
          if (optimisticRestoreTimeout) window.clearTimeout(optimisticRestoreTimeout);
          console.warn("authCheck timeout after", AUTH_RESTORE_TIMEOUT_MS, "ms");
          if (savedUser) {
            SESSION_TOKEN = savedToken;
            SESSION_USER = savedUser;
            try { window.__PD3I_SESSION_TOKEN = SESSION_TOKEN; window.__PD3I_SESSION_USER = SESSION_USER; } catch (e) {}
            setLoggedInUI(SESSION_USER);
            refreshIdleSession();
            return;
          }
          setLoggedOutUI();
          setAlert(loginAlert, "Pemeriksaan sesi terlalu lama. Silakan login ulang.", false);
        }, AUTH_RESTORE_TIMEOUT_MS);

        function finishRestoreSession(action) {
          if (restoreFinished) return false;
          restoreFinished = true;
          if (optimisticRestoreTimeout) window.clearTimeout(optimisticRestoreTimeout);
          window.clearTimeout(restoreTimeout);
          if (typeof action === "function") action();
          return true;
        }

        google.script.run
          .withSuccessHandler(function (res) {
            finishRestoreSession(function () {
              if (!res || res.status !== "success") {
                setLoggedOutUI();
                return;
              }

              SESSION_TOKEN = (res && res.token) || savedToken;
              SESSION_USER = (res && res.user) || savedUser || null;
              try { window.__PD3I_SESSION_TOKEN = SESSION_TOKEN; window.__PD3I_SESSION_USER = SESSION_USER; } catch (e) {}
              setAuthSessionMeta({
                ttlSec: Number(res.ttlSec || 0),
                issuedAt: Number(res.issuedAt || 0),
                expiresAt: Number(res.expiresAt || 0)
              });

              saveSessionToBrowser(SESSION_TOKEN, SESSION_USER);
              setLoggedInUI(SESSION_USER);
              refreshIdleSession();

              if (window.loadFaskesRealtime) window.loadFaskesRealtime();
              if (window.loadWorkflowFilterOptions) window.loadWorkflowFilterOptions(true);
              if (typeof window.initPieWorkspace === 'function') {
                try { window.initPieWorkspace(); } catch (e) { console.warn('initPieWorkspace after auth restore failed:', e); }
              }
            });
          })
          .withFailureHandler(function () {
            finishRestoreSession(function () {
              setLoggedOutUI();
            });
          })
          .authCheck(savedToken);
      }

      closeModal(pinModal);
      closeModal(loginModal);
      setCredentialInputsEnabled('none');
      showAuthBootOverlay();

      restoreSessionIfAny();
    }

    window.setTimeout(function () {
      const overlay = document.getElementById("auth-boot-overlay");
      const app = document.getElementById("app");
      const loginModal = document.getElementById("login-modal");
      const appHidden = app && app.classList.contains("hidden");
      const loginHidden = loginModal && loginModal.classList.contains("hidden");
      if (overlay && !overlay.classList.contains("hidden") && appHidden && loginHidden) {
        overlay.classList.add("hidden");
        if (loginModal && typeof openModal === "function") openModal(loginModal);
      }
    }, AUTH_RESTORE_TIMEOUT_MS + 2000);

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initAuthModule);
    } else {
      initAuthModule();
    }
  })();
</script>
