<div id="pin-modal" class="hidden fixed inset-0 z-[110] items-start justify-center modal-backdrop overflow-y-auto pt-6 sm:pt-10">
  <div class="pd3i-pin-modal-card w-full max-w-md bg-white p-6 modal-card mx-4 mt-4 mb-8">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i class="fas fa-key text-blue-600"></i>
        <h2 class="font-extrabold text-slate-900">Ubah Password Akses</h2>
      </div>
      <button type="button" id="btn-close-pin-modal" class="pd3i-pin-control w-10 h-10 hover:bg-slate-100 text-slate-600">
        <i class="fas fa-xmark"></i>
      </button>
    </div>

    <div id="pin-alert" class="pd3i-pin-alert hidden mt-4 p-3 text-sm font-bold border"></div>

    <form id="pin-form" class="mt-4 space-y-4" autocomplete="off" data-form-type="other" data-lpignore="true" data-1p-ignore="true" novalidate>
      <div>
        <label class="block text-xs font-extrabold text-slate-600 uppercase tracking-wider mb-2">Password Lama</label>
        <input id="pin-old" type="password" autocomplete="current-password" aria-autocomplete="none" autocorrect="off" autocapitalize="off" spellcheck="false" data-form-type="other" data-lpignore="true" data-1p-ignore="true" data-masked="1"
          class="pd3i-pin-control w-full px-3 py-3 border border-slate-200 bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-500 font-bold"
          placeholder="Password lama" />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-extrabold text-slate-600 uppercase tracking-wider mb-2">Password Baru</label>
          <input id="pin-new" type="password" autocomplete="new-password" aria-autocomplete="none" autocorrect="off" autocapitalize="off" spellcheck="false" data-form-type="other" data-lpignore="true" data-1p-ignore="true" data-masked="1"
            class="pd3i-pin-control w-full px-3 py-3 border border-slate-200 bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-500 font-bold"
            placeholder="Password baru (min 6 karakter)" />
        </div>
        <div>
          <label class="block text-xs font-extrabold text-slate-600 uppercase tracking-wider mb-2">Konfirmasi Password Baru</label>
          <input id="pin-new2" type="password" autocomplete="new-password" aria-autocomplete="none" autocorrect="off" autocapitalize="off" spellcheck="false" data-form-type="other" data-lpignore="true" data-1p-ignore="true" data-masked="1"
            class="pd3i-pin-control w-full px-3 py-3 border border-slate-200 bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-500 font-bold"
            placeholder="Ulangi password baru" />
        </div>
      </div>

      <div class="pd3i-pin-captcha border border-slate-200 p-4 bg-slate-50">
        <div class="flex items-start justify-between gap-3">
          <div class="flex-1">
            <div class="text-xs font-extrabold text-slate-600 uppercase tracking-wider">Captcha</div>
            <div id="pin-captcha-question" class="mt-1 text-lg font-extrabold text-slate-900">...</div>
            <div class="mt-3">
              <input id="pin-captcha-answer" inputmode="numeric" pattern="[0-9]*"
                class="pd3i-pin-control w-full px-3 py-3 border border-slate-200 bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-500 font-bold"
                placeholder="Jawaban captcha (angka)" />
            </div>
          </div>
          <button type="button" id="btn-refresh-pin-captcha"
            class="pd3i-pin-control w-11 h-11 shrink-0 border border-slate-200 bg-white hover:bg-slate-100 flex items-center justify-center">
            <i class="fas fa-rotate-right"></i>
          </button>
        </div>

        <div id="pin-captcha-error" class="pd3i-pin-alert hidden mt-3 p-2 bg-red-50 border border-red-200 text-red-700 text-xs font-bold">
          Captcha salah
        </div>
      </div>

      <button id="btn-save-pin" type="button"
        class="pd3i-pin-submit w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-4 shadow-lg shadow-blue-200 flex items-center justify-center gap-2">
        <i class="fas fa-floppy-disk"></i> Simpan Password Baru
      </button>
    </form>
  </div>
</div>
