<script>
  (function () {
    let __appInitialized = false;

    function initAppModule() {
      if (__appInitialized) return;
      __appInitialized = true;

      const selector = document.getElementById("form-selector");
      const formElement = document.getElementById("dynamic-form");
      const inputFormElement = document.getElementById("dynamic-form-input");
      const pelaporContainer = document.getElementById("pelapor-fields-container");
      const pasienContainer = document.getElementById("pasien-fields-container");
      const verifikasiContainer = document.getElementById("verifikasi-fields-container");
      const sampelContainer = document.getElementById("sampel-fields-container");
      const statusContainer = document.getElementById("status-fields-container");
      const specificContainer = document.getElementById("specific-fields-container");
      const specificTitle = document.getElementById("specific-title");
      const pelaporContainerInput = document.getElementById("pelapor-fields-container-input");
      const pasienContainerInput = document.getElementById("pasien-fields-container-input");
      const specificContainerInput = document.getElementById("specific-fields-container-input");
      const specificTitleInput = document.getElementById("specific-title-input");
      const formElementVerifikasi = document.getElementById("dynamic-form-verifikasi");
      const pelaporContainerVerifikasi = document.getElementById("pelapor-fields-container-verifikasi");
      const pasienContainerVerifikasi = document.getElementById("pasien-fields-container-verifikasi");
      const specificContainerVerifikasi = document.getElementById("specific-fields-container-verifikasi");
      const specificTitleVerifikasi = document.getElementById("specific-title-verifikasi");
      const verifikasiContainerWorkspace = document.getElementById("verifikasi-fields-container-workspace");
      const formElementSampel = document.getElementById("dynamic-form-sampel");
      const pelaporContainerSampel = document.getElementById("pelapor-fields-container-sampel");
      const pasienContainerSampel = document.getElementById("pasien-fields-container-sampel");
      const specificContainerSampel = document.getElementById("specific-fields-container-sampel");
      const specificTitleSampel = document.getElementById("specific-title-sampel");
      const sampelContainerWorkspace = document.getElementById("sampel-fields-container-workspace");
      const formElementStatus = document.getElementById("dynamic-form-status");
      const pelaporContainerStatus = document.getElementById("pelapor-fields-container-status");
      const pasienContainerStatus = document.getElementById("pasien-fields-container-status");
      const specificContainerStatus = document.getElementById("specific-fields-container-status");
      const specificTitleStatus = document.getElementById("specific-title-status");
      const statusContainerWorkspace = document.getElementById("status-fields-container-workspace");
      const btnSubmit = document.getElementById("btn-submit");
      const btnSubmitInput = document.getElementById("btn-submit-input");
      const btnSubmitVerifikasi = document.getElementById("btn-submit-verifikasi");
      const btnSubmitSampel = document.getElementById("btn-submit-sampel");
      const btnSubmitStatus = document.getElementById("btn-submit-status");
      const btnResetInput = document.getElementById("btn-reset-input");
      const searchContainer = document.getElementById("search-container");
      const searchPlaceholder = document.getElementById("search-placeholder");
      const editBadge = document.getElementById("edit-badge");
      const viewerBadge = document.getElementById("viewer-badge");
      const btnCancelEdit = document.getElementById("btn-cancel-edit");
      const btnSearchEpid = document.getElementById("btn-search-epid");
      const btnRetrySync = document.getElementById("btn-retry-sync");
      const btnRetryNotify = document.getElementById("btn-retry-notify");
      const btnRetryTelegram = document.getElementById("btn-retry-telegram");
      const btnRetryRevisionNotify = document.getElementById("btn-retry-revision-notify");
      const btnRetryRevisionTelegram = document.getElementById("btn-retry-revision-telegram");
      const btnRepairPertRaw = document.getElementById("btn-repair-pert-raw");
      const btnSidebarDashboard = document.getElementById("btn-sidebar-dashboard");
      const btnSidebarToggle = document.getElementById("btn-sidebar-toggle");
      const btnSidebarClose = document.getElementById("btn-sidebar-close");
      const btnPd3iCasesNavToggle = document.getElementById("pd3i-cases-nav-toggle");
      const btnPd3iReportingNavToggle = document.getElementById("pd3i-reporting-nav-toggle");
      const btnPd3iPieNavToggle = document.getElementById("pd3i-pie-nav-toggle");
      const btnPd3iToolsNavToggle = document.getElementById("pd3i-tools-nav-toggle");
      const sidebar = document.getElementById("pd3i-sidebar");
      const sidebarOverlay = document.getElementById("pd3i-sidebar-overlay");
      const btnAdminMenu = document.getElementById("btn-admin-menu");
      const btnAdminMenuLabel = document.getElementById("btn-admin-menu-label");
      const adminMenuWrap = document.getElementById("admin-menu-wrap");
      const adminMenuDropdown = document.getElementById("admin-menu-dropdown");
      const btnOpenPin = document.getElementById("btn-open-pin");
      const btnPrevStep = document.getElementById("btn-prev-step");
      const btnNextStep = document.getElementById("btn-next-step");
      const workflowIntentButtons = Array.from(document.querySelectorAll('.pd3i-workflow-intent-card[data-workflow-intent]'));

      if (!selector || !formElement || !inputFormElement || !formElementVerifikasi || !formElementSampel || !formElementStatus || !pelaporContainer || !pasienContainer || !verifikasiContainer || !sampelContainer || !statusContainer || !specificContainer || !pelaporContainerInput || !pasienContainerInput || !specificContainerInput || !pelaporContainerVerifikasi || !pasienContainerVerifikasi || !specificContainerVerifikasi || !verifikasiContainerWorkspace || !sampelContainerWorkspace || !pelaporContainerStatus || !pasienContainerStatus || !specificContainerStatus || !statusContainerWorkspace || !btnSubmit || !btnSubmitInput || !btnSubmitVerifikasi || !btnSubmitSampel || !btnSubmitStatus) {
        console.warn("App init dibatalkan: elemen inti belum lengkap.");
        return;
      }

      if (btnPd3iCasesNavToggle) {
        btnPd3iCasesNavToggle.addEventListener('click', function() {
          syncPd3iCasesNavExpanded(btnPd3iCasesNavToggle.getAttribute('aria-expanded') !== 'true');
        });
      }
      if (btnPd3iReportingNavToggle) {
        btnPd3iReportingNavToggle.addEventListener('click', function() {
          syncPd3iReportingNavExpanded(btnPd3iReportingNavToggle.getAttribute('aria-expanded') !== 'true');
        });
      }
      if (btnPd3iPieNavToggle) {
        btnPd3iPieNavToggle.addEventListener('click', function() {
          syncPd3iPieNavExpanded(btnPd3iPieNavToggle.getAttribute('aria-expanded') !== 'true');
        });
      }
      if (btnPd3iToolsNavToggle) {
        btnPd3iToolsNavToggle.addEventListener('click', function() {
          syncPd3iToolsNavExpanded(btnPd3iToolsNavToggle.getAttribute('aria-expanded') !== 'true');
        });
      }

      // Lazy-load filter options: only fetch on demand when user opens search workspace
      // Previously called at init (unnecessary server hit on every page load)
      // Now defered to first search workspace open via restoreWorkflowSearchFiltersForWorkspace()

      const searchFormRefs = {
        mode: 'search',
        formElement,
        pelaporContainer,
        pasienContainer,
        specificContainer,
        specificTitle,
        btnSubmit
      };
      const inputFormRefs = {
        mode: 'input',
        formElement: inputFormElement,
        pelaporContainer: pelaporContainerInput,
        pasienContainer: pasienContainerInput,
        specificContainer: specificContainerInput,
        specificTitle: specificTitleInput,
        btnSubmit: btnSubmitInput
      };
      const verifikasiFormRefs = {
        mode: 'verifikasi',
        formElement: formElementVerifikasi,
        pelaporContainer: pelaporContainerVerifikasi,
        pasienContainer: pasienContainerVerifikasi,
        specificContainer: specificContainerVerifikasi,
        specificTitle: specificTitleVerifikasi,
        verifikasiContainer: verifikasiContainerWorkspace,
        btnSubmit: btnSubmitVerifikasi
      };
      const sampelFormRefs = {
        mode: 'sampel',
        formElement: formElementSampel,
        pelaporContainer: null,
        pasienContainer: null,
        specificContainer: null,
        specificTitle: null,
        sampelContainer: sampelContainerWorkspace,
        btnSubmit: btnSubmitSampel
      };
      const statusFormRefs = {
        mode: 'status',
        formElement: formElementStatus,
        pelaporContainer: pelaporContainerStatus,
        pasienContainer: pasienContainerStatus,
        specificContainer: specificContainerStatus,
        specificTitle: specificTitleStatus,
        statusContainer: statusContainerWorkspace,
        btnSubmit: btnSubmitStatus
      };

      function destroyDynamicEnhancers() {
        if (choicesInstance) {
          try { choicesInstance.destroy(); } catch (e) {}
          choicesInstance = null;
        }
        if (rsChoicesInstance) {
          try { rsChoicesInstance.destroy(); } catch (e) {}
          rsChoicesInstance = null;
        }
      }

      function clearRenderedFormRefs(refs) {
        if (!refs) return;
        [refs.pelaporContainer, refs.pasienContainer, refs.verifikasiContainer, refs.sampelContainer, refs.statusContainer, refs.specificContainer].forEach(function(container) {
          if (container) container.innerHTML = '';
        });
        if (refs.formElement) refs.formElement.classList.add('hidden');
      }

      function renderVerifikasiReviewMode(formRoot, enabled) {
        const root = formRoot && formRoot.querySelectorAll ? formRoot : document.getElementById('dynamic-form-verifikasi');
        if (!root) return;
        root.classList.toggle('pd3i-verifikasi-review-mode', !!enabled);
        const actionRoot = document.getElementById('verifikasi-fields-container-workspace');
        root.querySelectorAll('input, select, textarea, button').forEach(function(el) {
          if (!el || el.type === 'hidden') return;
          if (el.matches && el.matches('[data-pd3i-verifikasi-action]')) return;
          if (actionRoot && actionRoot.contains(el)) return;
          if (el.id === 'btn-submit-verifikasi') return;
          if (enabled) {
            if (el.tagName === 'SELECT' || el.tagName === 'BUTTON') el.setAttribute('disabled', 'disabled');
            else el.setAttribute('readonly', 'readonly');
            el.setAttribute('aria-readonly', 'true');
          } else {
            el.removeAttribute('readonly');
            el.removeAttribute('disabled');
            el.removeAttribute('aria-readonly');
          }
        });
        const statusEl = findScopedFieldControl('Status Verifikasi EPID', root);
        ['Status Verifikasi EPID', 'Nomor EPID'].forEach(function(fieldId) {
          const el = findScopedFieldControl(fieldId, root);
          const wrapper = el && el.closest ? el.closest('[data-pd3i-field-id="' + fieldId + '"], [data-pd3i-field-wrapper], .pd3i-field-wrapper, .field-wrapper, .space-y-2') : null;
          if (!wrapper) return;
          wrapper.hidden = !!enabled;
          wrapper.style.display = enabled ? 'none' : '';
          wrapper.classList.toggle('pd3i-verifikasi-hidden-technical-field', !!enabled);
        });
        root.querySelectorAll('[data-pd3i-verifikasi-action]').forEach(function(btn) {
          btn.removeAttribute('disabled');
          btn.removeAttribute('aria-readonly');
        });
      }

      function renderSampelCaseSummary(record) {
        const summaryEl = document.getElementById('sampel-case-summary');
        if (!summaryEl) return;
        const escape = function(value) {
          return String(value || '-')
            .replace(/&/g, '&amp;')
            .replace(new RegExp('<', 'g'), '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/\"/g, '&quot;')
            .replace(/'/g, '&#39;');
        };
        if (!record) {
          summaryEl.innerHTML = '<div class="pd3i-helper-text">Pilih satu data dari antrean hasil pemeriksaan untuk melihat ringkasan kasus. Detail entri awal tidak ditampilkan di menu ini.</div>';
          return;
        }
        const dx = String(record.dx || document.getElementById('form-selector')?.value || '').trim().toUpperCase();
        const rows = [
          ['Diagnosis', dx || record['Diagnosis'] || '-'],
          ['Nama pasien', record['Nama Pasien'] || record['Nama'] || '-'],
          ['Nomor EPID', record['Nomor EPID'] || '-'],
          ['ID registrasi', record['ID Registrasi Kasus'] || record.recordKey || record.RAW_ROW_NUMBER || '-'],
          ['Umur / JK', [record['Umur (auto)'] || record['Umur'], record['JK']].filter(Boolean).join(' / ') || '-'],
          ['Domisili', [record['Kecamatan'], record['Kelurahan']].filter(Boolean).join(' / ') || '-'],
          ['Status verifikasi', record['Status Verifikasi EPID'] || 'Pending'],
          ['Status pasien/kasus', record['Status Pasien/Kasus'] || '-'],
          ['Kebutuhan sampel', record['Pemeriksaan Sampel Dilakukan'] || record['Status Proses Pemeriksaan'] || '-'],
          ['Hasil pemeriksaan saat ini', record['Interpretasi Hasil Sampel'] || record['Hasil Pemeriksaan Sampel'] || 'Belum ada hasil final']
        ];
        summaryEl.innerHTML = rows.map(function(pair) {
          return `<div class="pd3i-summary-item"><span class="pd3i-summary-label">${escape(pair[0])}</span><span class="pd3i-summary-value">${escape(pair[1])}</span></div>`;
        }).join('');
      }

      function getWorkspaceFormRefs(mode) {
        const normalizedMode = normalizeSidebarWorkspace(mode || 'search');
        if (normalizedMode === 'input') return inputFormRefs;
        if (normalizedMode === 'verifikasi') return verifikasiFormRefs;
        if (normalizedMode === 'sampel') return sampelFormRefs;
        if (normalizedMode === 'status') return statusFormRefs;
        return searchFormRefs;
      }

      const COMMON = getCommonConfigSafe();

      function renderDxWorkspaceForm(dx, mode) {
        const normalizedMode = normalizeSidebarWorkspace(mode || 'search');
        const cfg = getDxConfigSafe(dx);
        const refs = getWorkspaceFormRefs(normalizedMode);
        clearRenderedFormRefs(refs);
        destroyDynamicEnhancers(refs && refs.formElement ? refs.formElement : null);
        hideTopAlert();

        if (typeof window !== 'undefined' && normalizedMode === 'input') {
          window.__PD3I_ACTIVE_RECORD_META = null;
        }

        if (!dx || !cfg || !refs) {
          syncDiagnosisSelectorUi();
          updateUiShellSummary();
          applySidebarWorkspaceLayout(ACTIVE_SIDEBAR_WORKSPACE || 'input');
          return;
        }

        refs.formElement.classList.remove('hidden');

        const isOptionalExaminationDate = function(field, section) {
          if (!field || String(field.type || '').toLowerCase() !== 'date') return false;
          const haystack = [
            field.id, field.label,
            section && section.key,
            section && section.title
          ].filter(Boolean).join(' ').toLowerCase();
          return /(pemeriksaan|sampel|spesimen)/i.test(haystack);
        };
        const makeInputFieldMandatory = function(field, section) {
          if (!field || normalizedMode !== 'input') return field;
          // Questions mandatory; system-generated/read-only controls and tables stay optional.
          if (field.readonly || ['header', 'dynamic_table', 'geo_button'].includes(field.type)) return field;
          // Tanggal pemeriksaan/sampel/spesimen diisi bila tersedia, bukan blocker input awal.
          if (isOptionalExaminationDate(field, section)) return Object.assign({}, field, {
            required: false,
            sectionKey: section && section.key,
            sectionTitle: section && section.title
          });
          // Tanggal meninggal AFP opsional saat input awal, walau semua pertanyaan lain mandatory.
          if (String(field.id || '') === 'Tanggal meninggal AFP') return Object.assign({}, field, { required: false });
          return Object.assign({}, field, { required: true });
        };
        if (refs.pelaporContainer) {
          refs.pelaporContainer.innerHTML = (COMMON.pelapor || []).map(makeInputFieldMandatory).map(generateHTML).join('');
        }
        if (refs.pasienContainer) {
          refs.pasienContainer.innerHTML = (COMMON.pasien || []).filter(function(f) {
            return !f.hideInWorkspaces || f.hideInWorkspaces.indexOf(normalizedMode) === -1;
          }).map(makeInputFieldMandatory).map(generateHTML).join('');
        }
        if (refs.verifikasiContainer) {
          refs.verifikasiContainer.innerHTML = (COMMON.verifikasi || []).map(generateHTML).join('');
        }
        if (refs.sampelContainer) {
          const sampleFields = (typeof getSampleFieldsForDx === 'function')
            ? getSampleFieldsForDx(dx)
            : (COMMON.sampel || []);
          refs.sampelContainer.innerHTML = sampleFields.map(generateHTML).join('');
        }
        if (refs.statusContainer) {
          refs.statusContainer.innerHTML = (COMMON.status || []).map(generateHTML).join('');
        }

        if (refs.specificTitle) {
          refs.specificTitle.innerHTML = `<i class="fas fa-stethoscope text-blue-600"></i> Data Spesifik (${escapeHtml(cfg.title || dx)})`;
        }
        if (refs.specificContainer) {
          if (normalizedMode === 'input') {
            const mandatoryCfg = Object.assign({}, cfg, {
              sections: (cfg.sections || []).map(function(section) {
                return Object.assign({}, section, {
                fields: (section.fields || []).map(function(field) {
                  return makeInputFieldMandatory(field, section);
                })
                });
              })
            });
            renderDiagnosisSections(mandatoryCfg, refs.specificContainer);
          } else {
            renderDiagnosisSections(cfg, refs.specificContainer);
          }
        }
        if (normalizedMode === 'sampel') {
          renderSampelCaseSummary(null);
        }
        syncCaseStatusOptionsByDx(dx);
        setReadonlyFormMode(isViewerSession());
        if (viewerBadge) viewerBadge.hidden = !isViewerSession();
        if (editBadge && isViewerSession()) editBadge.hidden = true;
        syncDiagnosisSelectorUi();
        ensureSumberLaporanOptions(refs.formElement);
        applySidebarWorkspaceLayout(ACTIVE_SIDEBAR_WORKSPACE || normalizedMode);

        setTimeout(async function() {
          addDefaultRowsForDynamicTables();
          await initWilayahDropdowns(refs.formElement);
          initGeoButton();
          applyAllShowIf();
          enhanceLongSelectsWithFilter(refs.formElement);
          if (normalizedMode === 'input') updateInputWizardBlock('pelapor');
          if (normalizedMode === 'verifikasi') renderVerifikasiReviewMode(refs.formElement, true);

          const unit = document.getElementById("Nama unit pelapor");
          if (unit) {
            unit.disabled = true;
            unit.innerHTML = '<option value="">Pilih sumber laporan dahulu...</option>';
          }

          await loadRefImunisasi();
          ensureRiwayatImunisasiRowsReady();
          setTimeout(function() {
            try { ensureRiwayatImunisasiRowsReady(); } catch (e) {}
          }, 200);
          setTimeout(function() {
            try { ensureRiwayatImunisasiRowsReady(); } catch (e) {}
          }, 600);
          buildRiwayatImunisasiRows();
          forceBuildImunisasiWhenReady();

          loadFaskesRealtime("", true);
          if (MASTER_FASKES && MASTER_FASKES.length > 0) {
            initChoicesRumahSakit();
          }

          updateUiShellSummary();
          ensureSumberLaporanOptions(refs.formElement);
          enhanceLongSelectsWithFilter(refs.formElement);
          if (normalizedMode === 'input') updateInputWizardBlock(PD3I_INPUT_WIZARD_ACTIVE || 'pelapor');
        }, 50);
      }

      if (typeof window !== 'undefined') {
        window.renderDxWorkspaceForm = renderDxWorkspaceForm;
      }

      function resetInputSubmitButton() {
        if (!btnSubmitInput) return;
        btnSubmitInput.disabled = !!isViewerSession();
        btnSubmitInput.removeAttribute('aria-busy');
        btnSubmitInput.innerHTML = `<i class="fas fa-save"></i> Simpan Input Awal`;
      }

      function closeSidebarDrawer(options) {
        const opts = options || {};
        document.body.classList.remove('pd3i-sidebar-open');
        if (sidebarOverlay) {
          sidebarOverlay.classList.add('hidden');
          sidebarOverlay.setAttribute('aria-hidden', 'true');
        }
        if (btnSidebarToggle) btnSidebarToggle.setAttribute('aria-expanded', 'false');
        if (opts.restoreFocus !== false && btnSidebarToggle && window.innerWidth <= 1100) {
          try { btnSidebarToggle.focus(); } catch (e) {}
        }
      }

      function openSidebarDrawer() {
        document.body.classList.add('pd3i-sidebar-open');
        if (sidebarOverlay) {
          sidebarOverlay.classList.remove('hidden');
          sidebarOverlay.setAttribute('aria-hidden', 'false');
        }
        if (btnSidebarToggle) btnSidebarToggle.setAttribute('aria-expanded', 'true');
        if (sidebar && window.innerWidth <= 1100) {
          try { sidebar.focus(); } catch (e) {}
        }
      }

      window.applyRoleUIState = function applyRoleUIState() {
        const caps = getRoleCapabilities(SESSION_USER);
        const currentRole = normalizeUiRole(SESSION_USER && SESSION_USER.role);
        const isViewer = !caps.canWrite && caps.canView;
        const isAdmin = isAdminUiRole(currentRole);

        if (isViewer) {
          btnSubmit.disabled = true;
          btnSubmit.classList.add("opacity-60", "cursor-not-allowed");
          btnSubmit.innerHTML = `<i class="fas fa-eye"></i> Mode Viewer (Read Only)`;
          if (btnSubmitInput) {
            btnSubmitInput.disabled = true;
            btnSubmitInput.classList.add("opacity-60", "cursor-not-allowed");
            btnSubmitInput.innerHTML = `<i class="fas fa-eye"></i> Mode Viewer (Read Only)`;
          }
          if (btnCancelEdit) btnCancelEdit.classList.add("hidden");
          selector.classList.add("opacity-90");
        } else {
          btnSubmit.classList.remove("opacity-60", "cursor-not-allowed");
          if (btnSubmitInput) {
            btnSubmitInput.disabled = false;
            btnSubmitInput.classList.remove("opacity-60", "cursor-not-allowed");
            resetInputSubmitButton();
          }
          selector.classList.remove("opacity-90");
        }

        if (btnOpenPin) {
          if (isViewer) btnOpenPin.classList.add("hidden");
          else btnOpenPin.classList.remove("hidden");
        }

        if (adminMenuWrap) {
          adminMenuWrap.classList.remove("hidden");
        }
        if (btnAdminMenu) {
          btnAdminMenu.classList.remove("hidden");
        }
        if (btnAdminMenuLabel) {
          btnAdminMenuLabel.textContent = "Keluar";
        }

        function summarizeBatchResult(res) {
        const summary = { total: 0, retried: 0, success: 0, failed: 0, status: String((res && res.status) || '').trim(), durationMs: Number((res && res.durationMs) || 0) || 0 };
        const byDx = (res && res.byDx && typeof res.byDx === 'object') ? res.byDx : {};
        Object.keys(byDx).forEach(function(dxKey) {
          const item = byDx[dxKey] || {};
          summary.total += Number(item.total || 0) || 0;
          summary.retried += Number(item.retried || 0) || 0;
          summary.success += Number(item.success || 0) || 0;
          summary.failed += Number(item.failed || 0) || 0;
        });
        return summary;
      }

      if (btnRetrySync) {
          if (!isAdmin) btnRetrySync.classList.add("hidden");
          else btnRetrySync.classList.remove("hidden");
        }
        if (btnRetryNotify) {
          if (!isAdmin) btnRetryNotify.classList.add("hidden");
          else btnRetryNotify.classList.remove("hidden");
        }
        if (btnRetryTelegram) {
          if (!isAdmin) btnRetryTelegram.classList.add("hidden");
          else btnRetryTelegram.classList.remove("hidden");
        }
        if (btnSidebarDashboard) {
          if (isAdmin) btnSidebarDashboard.classList.remove("hidden");
          else btnSidebarDashboard.classList.add("hidden");
        }

        const allowedWorkspaces = getAllowedSidebarWorkspacesForUser(SESSION_USER);
        document.querySelectorAll('.pd3i-nav-link[data-sidebar-workspace]').forEach(function(link) {
          const workspace = normalizeSidebarWorkspace(link.getAttribute('data-sidebar-workspace'));
          link.classList.toggle('hidden', !allowedWorkspaces.has(workspace));
        });

        const currentActiveStage = document.querySelector(".pd3i-stepper-item.is-active")?.getAttribute("data-step-target") || getLandingWorkflowIntentForUser();
        setWorkflowSearchIntent(currentActiveStage, { focusSearch: false, focusForm: false, skipStageSync: true });
        updateFormStepperState(currentActiveStage);

        return { isViewer, isAdmin, currentRole, caps };
      };

      const { isViewer, isAdmin } = window.applyRoleUIState();
      if (!isAdmin && normalizeSidebarWorkspace(ACTIVE_SIDEBAR_WORKSPACE) === 'verifikasi') {
        openSidebarWorkspace('overview', { scroll: false, useRoute: true, replaceRoute: true });
      }
      if (editBadge && isViewer) editBadge.hidden = true;
      if (viewerBadge) viewerBadge.hidden = !isViewer;
      setReadonlyFormMode(isViewer);
      syncStatusRulesByContext(document.getElementById("form-selector")?.value || "");
      updateUiShellSummary();
      syncDiagnosisSelectorUi();
      updateSidebarActiveState("overview");
      updateFormStepperState("section-pelapor");
      applyInitialRouteView();

      window.__PD3I_INIT_NAV_BOUND = true;
      document.querySelectorAll('.pd3i-nav-link[data-sidebar-workspace]').forEach(function(link) {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          const workspace = String(link.getAttribute('data-sidebar-workspace') || '').trim();
          const pieTab = String(link.getAttribute('data-pie-tab') || '').trim();
          const settingsTab = String(link.getAttribute('data-settings-tab') || '').trim();
          window.__ACTIVE_APPROVAL_MENU = String(link.getAttribute('data-approval-menu') || '').trim();
          if (pieTab) { window.__PIE_ACTIVE_TAB = pieTab; if (typeof window.applyPieTab === 'function') window.applyPieTab(pieTab); }
          if (settingsTab) { window.__SETTINGS_ACTIVE_TAB = settingsTab; if (typeof window.applySettingsTab === 'function') window.applySettingsTab(settingsTab); }
          if (!workspace) return;
          closeSidebarDrawer({ restoreFocus: false });
          openSidebarWorkspace(workspace, { autoLoad: workspace === 'dashboard', useRoute: true });
        });
      });

      if (btnSidebarToggle) {
        btnSidebarToggle.addEventListener('click', function() {
          if (document.body.classList.contains('pd3i-sidebar-open')) closeSidebarDrawer();
          else openSidebarDrawer();
        });
      }
      if (btnSidebarClose) btnSidebarClose.addEventListener('click', closeSidebarDrawer);
      if (sidebarOverlay) sidebarOverlay.addEventListener('click', function() { closeSidebarDrawer(); });

      function runWorkflowSearchPage(page) {
        const workspace = normalizeSidebarWorkspace(ACTIVE_SIDEBAR_WORKSPACE);
        const dx = getEffectiveDxScopeForWorkspace(workspace);
        const filters = Object.assign({}, collectWorkflowSearchFilters(), {
          workspace: String(ACTIVE_SIDEBAR_WORKSPACE || '').trim(),
          workflowIntent: String(WORKFLOW_SEARCH_INTENT || '').trim()
        });
        filters.page = Math.max(1, parseInt(page, 10) || 1);
        filters.pageSize = SEARCH_RESULTS_PAGE_SIZE;

        if (['verifikasi', 'sampel', 'status'].includes(workspace)) {
          hideTopAlert();
          if (WORKFLOW_INBOX_CACHE) {
            renderWorkflowInbox(WORKFLOW_INBOX_CACHE);
          } else {
            refreshWorkflowInbox();
          }
          return;
        }

        const hasFilter = filters.keyword || filters.epid || filters.nama || filters.tanggalLahir ||
                          filters.orangTua || filters.alamat || filters.diagnosis || filters.kecamatan ||
                          filters.kelurahan || filters.statusKasus || filters.statusVerifikasi;

        if (workspace !== 'search' && !hasFilter) {
          showPd3iBanner('Isi minimal satu kriteria pencarian sebelum mencari data.', { type: 'error' });
          return;
        }
        if (!safeGsRun()) {
          showPd3iBanner('Fitur Cari/Edit hanya tersedia di WebApp. Buka melalui URL /exec atau /dev.', { type: 'error' });
          return;
        }

        const searchResultsBox = document.getElementById("search-results");
        const cachedSearchData = typeof getWorkspaceSearchResultCache === 'function'
          ? getWorkspaceSearchResultCache(workspace, dx, filters)
          : null;
        if (cachedSearchData) {
          _renderSearchResultsList(cachedSearchData, dx);
          return;
        }
        if (searchResultsBox) {
          searchResultsBox.classList.remove("hidden");
          searchResultsBox.innerHTML = renderPd3iSkeleton({
            title: workspace === 'search' && !hasFilter ? 'Memuat daftar kasus halaman ' + filters.page + '…' : 'Mencari kasus halaman ' + filters.page + '…',
            hint: 'Filter sedang diproses. Hasil akan muncul otomatis.',
            rows: 5,
            variant: 'case-list'
          });
        }

        const runtimeGuard = createWorkspaceRuntimeGuard(ACTIVE_SIDEBAR_WORKSPACE);
        const searchRunner = google.script.run
          .withSuccessHandler(function(data) {
            if (typeof setWorkspaceSearchResultCache === 'function') setWorkspaceSearchResultCache(workspace, dx, filters, data);
            _renderSearchResultsList(data, dx);
            if (data && data.audit && Number(data.total || 0) === 0 && searchResultsBox) {
              searchResultsBox.insertAdjacentHTML('beforeend', '<details class="pd3i-debug-details"><summary>Diagnostik pencarian</summary><pre>' + escapeHtml(JSON.stringify(data.audit, null, 2)) + '</pre></details>');
            }
          })
          .withFailureHandler(function(err) {
            console.error("searchRecords failed:", err);
            if (searchResultsBox) {
              searchResultsBox.innerHTML = `<div class="pd3i-dashboard-state is-error">Gagal mencari data. Silakan coba lagi.</div>`;
            }
          });

      if (btnSearchEpid && !btnSearchEpid.dataset.bound) {

      const btnSearchReset = document.getElementById('btn-search-reset');
      if (btnSearchReset && !btnSearchReset.dataset.bound) {

          hideTopAlert();

            if (WORKFLOW_INBOX_CACHE) renderWorkflowInbox(WORKFLOW_INBOX_CACHE);

      let searchFilterDebounceTimeout = null;
      ['search-epid', 'search-diagnosis', 'search-kecamatan', 'search-kelurahan', 'search-status-kasus', 'search-status-verifikasi', 'search-sort'].forEach(function(id) {
        const el = document.getElementById(id);
        if (!el || el.dataset.boundFilter === '1') return;
        el.dataset.boundFilter = '1';
        const eventName = el.tagName === 'SELECT' ? 'change' : 'input';
        el.addEventListener(eventName, function() {
          if (id === 'search-kecamatan') {
            populateWorkflowKelurahanFilterOptions('');
          }
          if (id === 'search-diagnosis') {
            populateWorkflowStatusKasusFilterOptions('');
          }
          saveWorkflowSearchFiltersForWorkspace(ACTIVE_SIDEBAR_WORKSPACE);
          if (['verifikasi', 'sampel', 'status'].includes(normalizeSidebarWorkspace(ACTIVE_SIDEBAR_WORKSPACE))) {
            if (WORKFLOW_INBOX_CACHE) renderWorkflowInbox(WORKFLOW_INBOX_CACHE);
          } else {
            if (eventName === 'change') {
              runWorkflowSearchPage(1);
            } else {
              if (searchFilterDebounceTimeout) clearTimeout(searchFilterDebounceTimeout);
              searchFilterDebounceTimeout = setTimeout(function() {
                runWorkflowSearchPage(1);

          el.addEventListener('keydown', function(ev) {

      /**
       * Render daftar hasil pencarian multi-kriteria.
       */
      function _renderSearchResultsList(data, dx) {
        const box = document.getElementById("search-results");
        if (!box) return;

        const results = Array.isArray(data) ? data : (data && data.results ? data.results : []);
        const total = Array.isArray(data) ? data.length : (data && data.total != null ? Number(data.total) : results.length);
        const page = Math.max(1, Array.isArray(data) ? 1 : (parseInt(data && data.page, 10) || 1));
        const pageSize = Math.max(1, Array.isArray(data) ? (results.length || SEARCH_RESULTS_PAGE_SIZE) : (parseInt(data && data.pageSize, 10) || SEARCH_RESULTS_PAGE_SIZE));
        const totalPages = Math.max(1, Array.isArray(data) ? 1 : (parseInt(data && data.totalPages, 10) || Math.ceil(total / pageSize) || 1));
        const startNumber = total > 0 ? ((page - 1) * pageSize) + 1 : 0;
        const endNumber = total > 0 ? Math.min(startNumber + results.length - 1, total) : 0;

        const safeEscape = typeof escapeHtml === "function"
          ? escapeHtml
          : function(value) {
              return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(new RegExp("<", "g"), "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#39;");
            };

        const normalizeListDate = function(value) {
          if (value == null || value === "") return "-";
          if (Object.prototype.toString.call(value) === "[object Date]" && !isNaN(value.getTime())) {
            const dd = String(value.getDate()).padStart(2, "0");
            const mm = String(value.getMonth() + 1).padStart(2, "0");
            return dd + "/" + mm + "/" + value.getFullYear();
          }
          const raw = String(value || "").trim();
          if (!raw) return "-";
          if (/^\d{5}(?:\.\d+)?$/.test(raw)) {
            const serial = Number(raw);
            if (serial > 20000 && serial < 80000) {
              const ms = Math.round((serial - 25569) * 86400 * 1000);
              const d = new Date(ms);
              if (!isNaN(d.getTime())) {
                const dd = String(d.getUTCDate()).padStart(2, "0");
                const mm = String(d.getUTCMonth() + 1).padStart(2, "0");
                return dd + "/" + mm + "/" + d.getUTCFullYear();
              }
            }
          }
          const iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T\s].*)?$/);
          if (iso) return iso[3] + "/" + iso[2] + "/" + iso[1];
          const dmy = raw.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
          if (dmy) return dmy[1].padStart(2, "0") + "/" + dmy[2].padStart(2, "0") + "/" + dmy[3];
          const parsed = new Date(raw);
          if (!isNaN(parsed.getTime()) && /[A-Za-z]{3,}|T\d{2}:\d{2}|GMT|UTC/.test(raw)) {
            const dd = String(parsed.getDate()).padStart(2, "0");
            const mm = String(parsed.getMonth() + 1).padStart(2, "0");
            return dd + "/" + mm + "/" + parsed.getFullYear();
          }
          return raw;
        };

        box.classList.remove("hidden");

        try {
          if (!results || results.length === 0) {
            box.innerHTML = `<div class="pd3i-empty-state">Tidak ada kasus yang cocok dengan kriteria pencarian. Longgarkan filter atau ganti kata kunci.</div>`;
            return;
          }

          const isViewerMode = isViewerSession();
          const isAdminMode = isAdminUiRole(SESSION_USER && SESSION_USER.role);
          const workflowActionLabel = getWorkflowSearchActionLabel();
          let html = `<div class="pd3i-search-results-head">
            <div>
              <div class="pd3i-search-results-title">${startNumber}–${endNumber} dari ${total} kasus</div>
              <div class="pd3i-search-results-subtitle">Daftar operasional kasus sesuai filter aktif, hak akses, dan urutan terbaru.</div>
            </div>
            <div class="pd3i-search-results-summary" aria-label="Ringkasan hasil Daftar Kasus">
              <span class="pd3i-search-summary-pill"><strong>${total}</strong> total kasus</span>
              <span class="pd3i-search-summary-pill">Halaman ${page} dari ${totalPages}</span>
              <span class="pd3i-search-summary-pill">${safeEscape(workflowActionLabel)}</span>
            </div>
          </div>`;
          html += `<div class="pd3i-search-results-wrap pd3i-data-list" data-component="DataTable" data-mobile-mode="card">`;

          results.forEach(function(item, index) {
            const recordKeyArg = JSON.stringify(String(item.recordKey || item.recordId || item.epid || ""));
            const statusKasus = item.statusKasus || "Belum ditentukan";
            const statusVerifikasi = item.statusVerifikasi || "Pending";
            const sampelState = String(item.sampelDilakukan || "").trim().toUpperCase() === "YA"
              ? (item.interpretasiSampel || "Menunggu hasil")
              : "Tidak ada sampel";
            const resolvedDx = String(item.dx || item.DX || item.diagnosis || item.kodeDx || item.kode_diagnosis || dx || '').trim().toUpperCase();
            const dxArg = JSON.stringify(resolvedDx);
            const printRecordKey = String(item.recordKey || item.recordId || item.epid || "").trim();
            const printUrl = (typeof buildClientPrintUrl === 'function') ? buildClientPrintUrl(resolvedDx, item.epid, SESSION_TOKEN, printRecordKey) : '';
            const exportPdfUrl = printUrl ? printUrl.replace('action=print', 'action=exportpdf') : '';
            const normalizedVerificationStatus = String(statusVerifikasi || '')
              .trim()
              .toUpperCase()
              .replace(/\s+/g, ' ');
            const isVerifiedCase = normalizedVerificationStatus === 'TERVERIFIKASI';
            const isNonAdminCaseUser = !isAdminMode && !isViewerMode;
            const caseActionLabel = isViewerMode ? 'Buka / Lihat' : (isVerifiedCase && isNonAdminCaseUser ? 'Ajukan perubahan' : workflowActionLabel);
            const isPendingVerification = !normalizedVerificationStatus || ['PENDING', 'BELUM DIVERIFIKASI', 'BELUM VERIFIKASI'].includes(normalizedVerificationStatus);
            const canDeleteRecord = item.canDelete === true || (typeof item.canDelete === 'undefined' && !isViewerMode && (isAdminMode || isPendingVerification));
            const getStatusTone = function(value) {
              const normalized = String(value || '').trim().toUpperCase();
              if (/TERVERIFIKASI|KONFIRMASI|POSITIF|SELESAI/.test(normalized)) return 'status-success';
              if (/DITOLAK|DISCARDED|BUKAN KASUS/.test(normalized)) return 'status-muted';
              if (/ALERT|OUTBREAK|KLB|KRITIS/.test(normalized)) return 'status-danger';
              if (/PROSES|INVESTIGASI|MENUNGGU HASIL|SAMPEL/.test(normalized)) return 'status-info';
              return 'status-warning';
            };
            const statusKasusTone = getStatusTone(statusKasus);
            const statusVerifikasiTone = getStatusTone(statusVerifikasi);
            const sampelTone = getStatusTone(sampelState);
            html += `<div class="pd3i-search-result-card pd3i-mobile-list-card" data-row-action="open-case">
              <div class="pd3i-search-result-leading">
                <span class="pd3i-search-result-index">${startNumber + index}</span>
              </div>
              <div class="min-w-0 flex-1">
                <div class="pd3i-search-result-title-row">
                  <div>
                    <div class="pd3i-search-result-name">${safeEscape(item.nama || "-")}</div>
                    <div class="pd3i-search-result-idline">${safeEscape(item.epid || item.recordId || "-")}</div>
                  </div>
                  <span class="pd3i-search-result-dx">${safeEscape(resolvedDx || '-')}</span>
                </div>
                <div class="pd3i-search-result-meta">
                  <span class="pd3i-search-result-badge"><i class="fas fa-cake-candles"></i> ${safeEscape(normalizeListDate(item.tanggalLahir))}</span>
                  <span class="pd3i-search-result-badge"><i class="fas fa-location-dot"></i> ${safeEscape([item.kecamatan, item.kelurahan].filter(Boolean).join(' / ') || "-")}</span>
                  ${item.orangTua ? `<span class="pd3i-search-result-badge"><i class="fas fa-user-group"></i> ${safeEscape(item.orangTua)}</span>` : ''}
                </div>
                <div class="pd3i-search-result-meta pd3i-search-result-meta-secondary">
                  <span class="pd3i-search-result-badge is-status ${safeEscape(statusKasusTone)}"><i class="fas fa-list-check"></i> ${safeEscape(statusKasus)}</span>
                  <span class="pd3i-search-result-badge is-verify ${safeEscape(statusVerifikasiTone)}"><i class="fas fa-id-card-clip"></i> ${safeEscape(statusVerifikasi)}</span>
                  <span class="pd3i-search-result-badge is-sample ${safeEscape(sampelTone)}"><i class="fas fa-vials"></i> ${safeEscape(sampelState)}</span>
                </div>
                <div class="pd3i-search-result-copy mt-2">
                  ${item.alamat ? safeEscape(item.alamat) : "Alamat belum tersedia"}
                </div>
              </div>
              <div class="pd3i-search-result-cta-wrap">
                <div class="pd3i-search-result-action-label">Tindak lanjut</div>
                <!-- Legacy regression anchor: class="pd3i-search-result-action is-edit"; pd3i-search-result-action is-edit pd3i-action-btn is-secondary; isViewerMode ? 'Buka / Lihat' : 'Edit' -->
                <button type="button" class="pd3i-search-result-action is-edit pd3i-action-btn is-primary" aria-label="${safeEscape(caseActionLabel)} untuk ${safeEscape(item.nama || item.epid || item.recordId || 'kasus ini')}" onclick='window._loadRecordFromSearch_ && window._loadRecordFromSearch_(${recordKeyArg}, ${dxArg}, { triggerButton: this, workspace: &quot;edit&quot;, workflowIntent: &quot;section-pelapor&quot;, skipWorkflowInboxRefresh: true })'>
                  <i class="fas ${isViewerMode ? 'fa-eye' : 'fa-arrow-up-right-from-square'}"></i> ${safeEscape(caseActionLabel)}
                </button>
                ${printUrl
                  ? `<button type="button" class="pd3i-search-result-action pd3i-action-btn is-secondary" onclick='downloadPePdf_(${dxArg}, ${JSON.stringify(String(item.epid || ''))}, this, ${JSON.stringify(printRecordKey)})'><i class="fas fa-file-arrow-down"></i> Download Dokumen PE</button>`
                  : `<span class="pd3i-search-result-action pd3i-action-btn is-secondary is-disabled" aria-disabled="true" title="Dokumen PE belum tersedia"><i class="fas fa-file-circle-xmark"></i> Dokumen PE belum tersedia <small>(Nomor EPID belum tersedia)</small></span>`}
                ${canDeleteRecord ? `<button type="button" class="pd3i-search-result-action is-danger pd3i-action-btn" title="Hapus data kasus ini" onclick='deleteCaseRecordFromList(${recordKeyArg}, ${dxArg}, this)'><i class="fas fa-trash-can"></i> Hapus</button>` : ''}
              </div>
            </div>`;
          });

          html += `</div>`;
          if (totalPages > 1) {
            html += `<div class="pd3i-search-pagination" role="navigation" aria-label="Navigasi halaman Daftar Kasus">
              <button type="button" class="pd3i-search-page-btn" data-search-page-target="${Math.max(1, page - 1)}" ${page <= 1 ? 'disabled' : ''}>
                <i class="fas fa-chevron-left"></i> Sebelumnya
              </button>
              <span class="pd3i-search-page-indicator">Halaman ${page} dari ${totalPages}</span>
              <button type="button" class="pd3i-search-page-btn" data-search-page-target="${Math.min(totalPages, page + 1)}" ${page >= totalPages ? 'disabled' : ''}>
                Berikutnya <i class="fas fa-chevron-right"></i>
              </button>
            </div>`;
          }
          box.innerHTML = html;
          box.querySelectorAll('[data-search-page-target]').forEach(function(btn) {
            if (btn.dataset.bound === '1') return;
            btn.dataset.bound = '1';
            btn.addEventListener('click', function() {
              const targetPage = parseInt(btn.getAttribute('data-search-page-target'), 10) || 1;
              runWorkflowSearchPage(targetPage);
            });
          });
        } catch (err) {
          console.error("_renderSearchResultsList failed:", err);
          box.innerHTML = renderPd3iUiState({ type: 'error', title: 'List kasus gagal dirender', message: 'Silakan refresh halaman, lalu coba lagi.' });
        }
      }

      window.__PD3I_RENDER_SEARCH_RESULTS_LIST = _renderSearchResultsList;

      async function deleteCaseRecordFromList(recordKey, dx, triggerButton) {
        recordKey = String(recordKey || '').trim();
        dx = String(dx || '').trim().toUpperCase();
        if (!recordKey || !dx) return;
        if (isViewerSession()) {
          showPd3iBanner('Mode lihat tidak dapat menghapus data kasus.', { type: 'error' });
          return;
        }
        if (!safeGsRun()) {
          showPd3iBanner('Fitur hapus hanya tersedia di WebApp. Buka melalui URL /exec atau /dev.', { type: 'error' });
          return;
        }
        const confirmed = await pd3iConfirmDialog({
          title: 'Hapus data kasus ini?',
          message: 'Data akan ditandai terhapus dan tidak tampil lagi pada Daftar Kasus.',
          confirmLabel: 'Hapus kasus',
          cancelLabel: 'Batal',
          variant: 'danger'
        });
        if (!confirmed) return;

        const btn = triggerButton && triggerButton.nodeType === 1 ? triggerButton : null;
        const originalHtml = btn ? btn.innerHTML : '';
        if (btn) {
          setPd3iButtonLoading(btn, true, 'Menghapus...');
        }

        google.script.run
          .withSuccessHandler(function(res) {
            if (btn) {
              btn.disabled = false;
              btn.innerHTML = originalHtml;
            }
            if (!res || !res.ok) {
              showTopAlert((res && res.message) || 'Data kasus gagal dihapus.', false);
              return;
            }
            showPd3iToast('Data kasus sudah ditandai terhapus.', { type: 'success' });
            const searchButton = document.getElementById('btn-search-epid');
            if (searchButton && typeof searchButton.click === 'function') searchButton.click();
          })
          .withFailureHandler(function(err) {
            if (btn) {
              btn.disabled = false;
              btn.innerHTML = originalHtml;
            }
            showPd3iBanner('Data kasus belum berhasil dihapus. Periksa koneksi, lalu coba kembali.', { type: 'error' });
            console.error('deleteCaseRecord failed:', err);
          })
          .deleteCaseRecord(SESSION_TOKEN, { dx: dx, recordKey: recordKey });
      }
      window.deleteCaseRecordFromList = deleteCaseRecordFromList;

      window._loadRecordFromSearch_ = function(recordKey, dx, options) {
        const opts = options || {};
        if (!recordKey || !dx) return;
        if (!safeGsRun()) return;
        if (typeof window !== 'undefined') {
          window.__PD3I_SUPPRESS_DRAFT_PROMPT_UNTIL = Date.now() + 4000;
        }

        const inferredIntentWorkspace = normalizeSidebarWorkspace(WORKFLOW_SEARCH_INTENT || '');
        const requestedWorkspace = normalizeSidebarWorkspace(opts.workspace || (['verifikasi', 'sampel', 'status'].includes(inferredIntentWorkspace) ? inferredIntentWorkspace : '') || ACTIVE_SIDEBAR_WORKSPACE || 'search');
        const requestedStageBeforeLoad = opts.workflowIntent
          ? normalizeWorkflowStepId(opts.workflowIntent)
          : ((opts.workspace || ['verifikasi', 'sampel', 'status'].includes(inferredIntentWorkspace))
            ? getWorkspaceStageForSidebar(requestedWorkspace)
            : (WORKFLOW_SEARCH_INTENT || document.querySelector(".pd3i-stepper-item.is-active")?.getAttribute("data-step-target") || getPreferredWorkflowStageForUser()));
        const searchResultsBox = document.getElementById("search-results");
        if (searchResultsBox && !opts.skipSearchHide) searchResultsBox.classList.add("hidden");

        const loadingButton = requestedWorkspace === 'verifikasi'
          ? btnSubmitVerifikasi
          : requestedWorkspace === 'sampel'
            ? btnSubmitSampel
            : requestedWorkspace === 'status'
              ? btnSubmitStatus
              : btnSubmit;
        const triggerButton = opts.triggerButton && opts.triggerButton.nodeType === 1 ? opts.triggerButton : null;
        const triggerButtonOriginalHtml = triggerButton ? triggerButton.innerHTML : '';
        function showOpenRecordLoadingOverlay(label) {
          window.scrollTo({ top: 0 });
          let overlay = document.getElementById('pd3i-open-record-loading');
          if (!overlay) {
            overlay = document.createElement('div');
            overlay.id = 'pd3i-open-record-loading';
            overlay.setAttribute('role', 'status');
            overlay.setAttribute('aria-live', 'polite');
            overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:flex-start;justify-content:center;background:rgba(15,23,42,.38);backdrop-filter:blur(2px);padding:20px;overflow-y:auto;padding-top:8vh;';
            document.body.appendChild(overlay);
          }
          overlay.innerHTML = `
            <div style="width:min(92vw,420px);border-radius:22px;background:#fff;box-shadow:0 24px 70px rgba(15,23,42,.24);border:1px solid rgba(226,232,240,.95);padding:24px;text-align:center;color:#0f172a;margin-bottom:2rem;">
              <div style="width:54px;height:54px;margin:0 auto 14px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:#eff6ff;color:#2563eb;font-size:24px;">
                ${renderPd3iSpinner('', '')}
              </div>
              <div style="font-weight:900;font-size:18px;letter-spacing:-.01em;">Membuka formulir...</div>
              <div style="margin-top:6px;font-size:13px;font-weight:700;color:#64748b;line-height:1.45;">${escapeHtml(label || 'Mohon tunggu, data kasus sedang dimuat ke formulir.')}</div>
            </div>`;
          overlay.classList.remove('hidden');
          overlay.style.display = 'flex';
          document.body.classList.add('pd3i-record-loading-open');
        }
        function hideOpenRecordLoadingOverlay() {
          const overlay = document.getElementById('pd3i-open-record-loading');
          if (overlay) {
            overlay.classList.add('hidden');
            overlay.style.display = 'none';
          }
          document.body.classList.remove('pd3i-record-loading-open');
        }
        function setOpenTriggerLoading() {
          if (triggerButton) {
            triggerButton.dataset.loadingRecord = '1';
            setPd3iButtonLoading(triggerButton, true, 'Membuka...');
            triggerButton.classList.add('opacity-70');
          }
          showOpenRecordLoadingOverlay('Formulir sedang disiapkan. Mohon tidak menekan tombol secara berulang.');
        }
        function resetOpenTriggerLoading() {
          if (triggerButton) {
            setPd3iButtonLoading(triggerButton, false, '', triggerButtonOriginalHtml || 'Buka');
            triggerButton.classList.remove('opacity-70');
            delete triggerButton.dataset.loadingRecord;
          }
          hideOpenRecordLoadingOverlay();
        }
        if (['verifikasi', 'sampel', 'status'].includes(requestedWorkspace) && typeof window !== 'undefined') {
          window.__PD3I_WORKFLOW_LIST_COLLAPSED__ = window.__PD3I_WORKFLOW_LIST_COLLAPSED__ || {};
          window.__PD3I_WORKFLOW_LIST_COLLAPSED__[requestedWorkspace] = true;
        }
        setOpenTriggerLoading();
        if (loadingButton) {
          setPd3iButtonLoading(loadingButton, true, 'Memuat Data...');
        }

        const recordLoadRequestId = Date.now();
        window.__RECORD_LOAD_REQUEST_ID = recordLoadRequestId;
        setTimeout(function() {
          if (window.__RECORD_LOAD_REQUEST_ID !== recordLoadRequestId) return;
          if (loadingButton && !loadingButton.disabled) return;
          resetOpenTriggerLoading();
          if (loadingButton) loadingButton.disabled = false;
          resetSubmitButtonByMode(requestedWorkspace);
          showPd3iBanner('Record belum berhasil dibuka. Coba ulangi dari hasil pencarian.', { type: 'error' });
        }, 10000);

        const recordRunner = google.script.run
          .withSuccessHandler(async function(record) {
            if (window.__RECORD_LOAD_REQUEST_ID !== recordLoadRequestId) return;
            if (!record) {
              showPd3iBanner('Data tidak ditemukan. Periksa kriteria pencarian atau nomor kasus.', { type: 'error' });
              resetOpenTriggerLoading();
              if (loadingButton) loadingButton.disabled = false;
              resetSubmitButtonByMode(requestedWorkspace);
              return;
            }

            const resolvedDx = String(dx || record.dx || '').trim().toUpperCase();
            const requestedStage = requestedStageBeforeLoad;
            const isDedicatedWorkflowWorkspace = ['verifikasi', 'sampel', 'status'].includes(requestedWorkspace);
            const preferredStage = isDedicatedWorkflowWorkspace || canWriteWorkflowStage(SESSION_USER, requestedStage) || isViewerSession()
              ? requestedStage
              : getPreferredWorkflowStageForUser();
            const openedWorkspace = isDedicatedWorkflowWorkspace
              ? requestedWorkspace
              : (normalizeWorkflowStepId(preferredStage) === 'section-pelapor'
                ? (requestedWorkspace === 'edit' ? 'edit' : 'search')
                : normalizeSidebarWorkspace(preferredStage));
            if (resolvedDx) {
              selector.value = resolvedDx;
              renderDxWorkspaceForm(resolvedDx, openedWorkspace);
              await new Promise(function(resolve) { setTimeout(resolve, 220); });
            }

            isEditMode = !isViewer;
            const verifiedRecordForApproval = String(record['Status Verifikasi EPID'] || '').trim().toUpperCase() === 'TERVERIFIKASI';
            window.__PD3I_APPROVAL_REQUEST_MODE__ = verifiedRecordForApproval && !isAdminUiRole(SESSION_USER && SESSION_USER.role);
            if (editBadge) {
              editBadge.hidden = !!isViewer || !['search', 'edit'].includes(openedWorkspace);
            }
            if (btnCancelEdit) {
              if (isViewer || !['search', 'edit'].includes(openedWorkspace)) btnCancelEdit.classList.add("hidden");
              else btnCancelEdit.classList.remove("hidden");
            }
            if (loadingButton) {
              if (isViewer) {
                loadingButton.innerHTML = `<i class="fas fa-eye"></i> Mode Viewer (Read Only)`;
                loadingButton.classList.remove("bg-yellow-600", "bg-blue-600");
                loadingButton.classList.add("opacity-60", "cursor-not-allowed");
                loadingButton.disabled = true;
              } else {
                resetSubmitButtonByMode(openedWorkspace);
                if (loadingButton === btnSubmit) {
                  loadingButton.innerHTML = `<i class="fas fa-pen-to-square"></i> ${window.__PD3I_APPROVAL_REQUEST_MODE__ ? 'Ajukan perubahan' : 'Perbarui Data ' + escapeHtml(recordKey)}`;
                  loadingButton.classList.remove("bg-blue-600", "opacity-60", "cursor-not-allowed");

          { key: 'status', title: 'Status', selectors: ['.pd3i-form-card-status'] }
        ];
        const pickLabel = function(el) {
          const wrapper = el && el.closest && el.closest('.field-wrapper');
          const labelEl = wrapper && wrapper.querySelector && wrapper.querySelector('label');
          return String((labelEl && labelEl.textContent) || el.getAttribute('aria-label') || el.getAttribute('name') || el.id || 'Field').replace(/\s*\*\s*$/, '').trim();
        };
        const pickValue = function(el) {
          if (!el) return '';
          if (el.tagName === 'SELECT') {
            const opt = el.options && el.selectedIndex >= 0 ? el.options[el.selectedIndex] : null;
            return String((opt && opt.textContent) || el.value || '').trim();
          }
          if (el.type === 'checkbox' || el.type === 'radio') return el.checked ? (el.value || 'Ya') : '';
          return String(el.value || '').trim();
        };
        return sectionMap.map(function(section) {
          const roots = section.selectors.map(function(sel) { return form.querySelector(sel); }).filter(Boolean);
          const items = [];
          roots.forEach(function(root) {
            Array.from(root.querySelectorAll('input[name], select[name], textarea[name]')).forEach(function(el) {
              if (!el || el.disabled || el.type === 'hidden') return;
              const wrapper = el.closest('.field-wrapper');
              if (wrapper && wrapper.classList.contains('hidden')) return;
              const label = pickLabel(el);
              const value = pickValue(el);
              const required = el.required || (wrapper && wrapper.getAttribute('data-required') === 'true');
              const invalid = required && !value;
              if (!value && !required) return;
              items.push({ label: label, value: value || 'Belum diisi', invalid: invalid });
