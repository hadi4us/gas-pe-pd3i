        const stage = normalizeWorkflowStepId(activeStageOnSubmit || document.querySelector('.pd3i-stepper-item.is-active')?.getAttribute('data-step-target') || 'section-pelapor');
        const readiness = getPd3iSubmitReadinessState(warnings);
        updatePd3iMobileSubmitBar(readiness);
        const ruleState = readiness.warnings || [];
        const items = getPd3iSubmitReviewItems(mode, stage, ruleState);
        list.innerHTML = renderPd3iSubmitReadinessBadge(readiness) + items.map(function(item) {
          return '<div class="pd3i-submit-review-item"><span>' + escapeHtml(item.label) + '</span><strong>' + escapeHtml(item.value) + '</strong></div>';
        }).join('') + renderPd3iSubmitCompletionSnapshot(stage) + (readiness.errors && readiness.errors.length ? '<div class="pd3i-submit-review-warning is-error"><strong>Blocker</strong><ul>' + readiness.errors.slice(0, 3).map(function(item) { return '<li>' + escapeHtml(item) + '</li>'; }).join('') + '</ul></div>' : ruleState && ruleState.length ? '<div class="pd3i-submit-review-warning"><strong>Catatan validasi</strong><ul>' + ruleState.slice(0, 3).map(function(item) { return '<li>' + escapeHtml(item) + '</li>'; }).join('') + '</ul></div>' : '<div class="pd3i-submit-review-ok">Tidak ada peringatan aktif dari aturan UI.</div>');
        panel.classList.toggle('has-warning', readiness.state === 'warning');
        panel.classList.toggle('has-error', readiness.state === 'blocked');
        if (readiness.state === 'warning' || readiness.state === 'blocked') setPd3iSubmitReviewCollapsed(false);
        else if (PD3I_SUBMIT_REVIEW_USER_COLLAPSED) setPd3iSubmitReviewCollapsed(true);
      }


      function isEpidRecommendationPlaceholder(value) {
        return /^menghitung rekomendasi/i.test(String(value || '').trim());
      }

      function normalizeEpidRecommendationValue(value) {
        const text = String(value || '').trim();
        return isEpidRecommendationPlaceholder(text) ? '' : text;
      }

      function refreshRecommendedEpidForSubmit(dx, dataObj) {
        return new Promise(function(resolve) {
          try {
            if (!safeGsRun() || !dx) return resolve(String((dataObj && dataObj["Nomor EPID"]) || '').trim());
            google.script.run
              .withSuccessHandler(function(res) {
                const recommendation = String((res && res.ok && res.recommendation) || '').trim();
                if (recommendation && dataObj && !String(dataObj["Nomor EPID"] || '').trim()) dataObj["Nomor EPID"] = recommendation;
                resolve(String((dataObj && dataObj["Nomor EPID"]) || recommendation || '').trim());
              })
              .withFailureHandler(function() { resolve(String(dataObj["Nomor EPID"] || '').trim()); })
              .previewRecommendedEpid(dx, dataObj, SESSION_TOKEN);
          } catch (e) {
            resolve(String((dataObj && dataObj["Nomor EPID"]) || '').trim());
          }
        });
      }

      async function confirmVerificationEpidBeforeSave(dataObj) {
        const currentEpid = normalizeEpidRecommendationValue(dataObj && dataObj["Nomor EPID"]);
        const recommended = currentEpid || '-';
        if (typeof pd3iConfirmDialog === 'function') {
          const inputId = 'pd3i-epid-confirm-input';
          const htmlMessage = '<div class="pd3i-epid-confirm-box"><div class="pd3i-epid-confirm-row"><span>Nomor EPID rekomendasi</span><strong>' + escapeHtml(recommended) + '</strong></div><label class="pd3i-epid-final-label" for="' + inputId + '">Nomor EPID</label><input id="' + inputId + '" class="pd3i-generated-control pd3i-epid-final-input" type="text" value="' + escapeHtml(currentEpid) + '" autocomplete="off"><p>Nomor EPID dihitung dari nomor terbesar di kolom Nomor EPID + 1. Admin bisa koreksi sebelum simpan.</p></div>';
          const ok = await pd3iConfirmDialog({ title: 'Konfirmasi Simpan Nomor EPID', htmlMessage: htmlMessage, confirmLabel: 'Konfirmasi Simpan Nomor EPID', cancelLabel: 'Cek lagi', variant: 'primary', beforeClose: function(dialog) { return normalizeEpidRecommendationValue(dialog && dialog.querySelector('#' + inputId) && dialog.querySelector('#' + inputId).value); } });
          if (!ok) return false;
          const epidInput = normalizeEpidRecommendationValue(ok === true ? currentEpid : ok) || currentEpid;
          if (!epidInput) return false;
          dataObj["Nomor EPID"] = epidInput;
          return true;
        }
        const epidInput = window.prompt('Nomor EPID rekomendasi: ' + recommended + '\nNomor EPID:', currentEpid);
        if (epidInput === null) return false;
        dataObj["Nomor EPID"] = normalizeEpidRecommendationValue(epidInput);
        return !!dataObj["Nomor EPID"];
      }

      async function pd3iReviewBeforeSubmit(submitMode, activeStageOnSubmit, warnings) {
        // Edit Kasus saves directly after validation. No review card/dialog remains in edit flow.
        if (submitMode === 'edit' || normalizeSidebarWorkspace(ACTIVE_SIDEBAR_WORKSPACE) === 'edit') return true;
        renderPd3iSubmitReviewPanel(submitMode, activeStageOnSubmit, warnings);
        const readiness = getPd3iSubmitReadinessState(warnings);
        if (readiness.state === 'blocked') {
          showWorkflowSubmitError(submitMode, readiness.message || 'Lengkapi field wajib yang ditandai sebelum menyimpan.');
          return false;
        }
        if (Array.isArray(warnings) && warnings.length && typeof showPd3iBanner === 'function') {
          showPd3iBanner(warnings.join(" "), { type: 'warning' });
        }
        // Verifikasi disimpan langsung setelah validasi; tanpa popup review umum.
        if (submitMode === 'verifikasi') return true;
        if (typeof pd3iConfirmDialog !== 'function') return true;
        return await pd3iConfirmDialog({
          title: 'Review sebelum simpan',
          htmlMessage: renderPd3iSubmitReviewDialogHtml(window.__PD3I_REVIEW_ACTIVE_FORM__ || document, readiness),
          confirmLabel: 'Simpan final',
          cancelLabel: 'Kembali edit',
          variant: 'primary'
        });
      }

      const handleMainFormSubmit = async function(mode) {
        const submitMode = normalizeSidebarWorkspace(mode || 'search');
        const activeFormElement = submitMode === 'input'
          ? inputFormElement
          : submitMode === 'verifikasi'
            ? formElementVerifikasi
            : submitMode === 'sampel'
              ? formElementSampel
              : submitMode === 'status'
                ? formElementStatus
                : formElement;
        const activeSubmitButton = submitMode === 'input'
          ? btnSubmitInput
          : submitMode === 'verifikasi'
            ? btnSubmitVerifikasi
            : submitMode === 'sampel'
              ? btnSubmitSampel
              : submitMode === 'status'
                ? btnSubmitStatus
                : btnSubmit;

        if (isViewer) {
          showWorkflowSubmitError(submitMode, "Role viewer hanya bisa melihat data dan mencetak, tidak bisa menyimpan perubahan.");
          return;
        }
        if (!activeFormElement || !activeSubmitButton) {
          showWorkflowSubmitError(submitMode, 'Form aktif tidak tersedia.');
          return;
        }
        // Edit page can retain stale aria-busy after old duplicate handler. Clear it before fresh edit save.
        if (submitMode === 'edit') {
          activeSubmitButton.disabled = false;
          activeSubmitButton.removeAttribute('aria-busy');
        } else if (activeSubmitButton.getAttribute('aria-busy') === 'true') {
          showWorkflowSubmitError(submitMode, 'Proses simpan sebelumnya masih berjalan. Tunggu sebentar, atau refresh halaman jika lebih dari 1 menit.');
          return;
        }

        const activeStageOnSubmit = submitMode === 'input'
          ? 'section-pelapor'
          : submitMode === 'verifikasi'
            ? 'section-verifikasi'
            : submitMode === 'sampel'
              ? 'section-sampel'
              : submitMode === 'status'
                ? 'section-status'
                : (document.querySelector(".pd3i-stepper-item.is-active")?.getAttribute("data-step-target") || "section-pelapor");
        if (!['input', 'search'].includes(submitMode) && normalizeWorkflowStepId(activeStageOnSubmit) !== "section-pelapor" && !canAccessDeferredWorkflowStages()) {
          showWorkflowSubmitError(submitMode, "Tahap lanjutan hanya bisa disimpan setelah input awal tersimpan / data existing dibuka.");
          resetSubmitButtonByMode(submitMode);
          return;
        }

        if (submitMode !== 'verifikasi') {
          const requiredCheck = validateRequiredVisibleFields(activeFormElement);
          if (!requiredCheck.ok) {
            showWorkflowSubmitError(submitMode, requiredCheck.message || "Masih ada field wajib yang belum lengkap.");
            activeSubmitButton.disabled = false;
            resetSubmitButtonByMode(submitMode);
            return;
          }
        }

        if (submitMode !== 'verifikasi') {
          const numericCheck = (typeof validateNumericOnlyRequiredFields === "function")
            ? validateNumericOnlyRequiredFields(activeFormElement)
            : { ok: true, invalids: [] };

          if (!numericCheck.ok) {
            showWorkflowSubmitError(submitMode, "Field berikut hanya boleh angka: " + numericCheck.invalids.join(", "));
            activeSubmitButton.disabled = false;
            resetSubmitButtonByMode(submitMode);
            return;
          }
        }

        const birthValidation = validateAndApplyBirthUI({ silent: false, hard: true, scope: activeFormElement });
        if (!birthValidation || !birthValidation.ok) {
          activeSubmitButton.disabled = false;
          resetSubmitButtonByMode(submitMode);
          return;
        }

        const dxRuleCheck = validateDxBusinessRules(activeFormElement);
        if (!dxRuleCheck.ok) {
          showWorkflowSubmitError(submitMode, dxRuleCheck.errors.join(" "));
          activeSubmitButton.disabled = false;
          resetSubmitButtonByMode(submitMode);
          return;
        }

        const warnings = checkConsistencyWarnings(activeFormElement).concat(dxRuleCheck.warnings || []);
        if (warnings.length > 0) {
          showPd3iBanner(warnings.join(" "), { type: 'warning' });
        }

        window.__PD3I_REVIEW_ACTIVE_FORM__ = activeFormElement;
        if (!(await pd3iReviewBeforeSubmit(submitMode, activeStageOnSubmit, warnings))) {
          activeSubmitButton.disabled = false;
          resetSubmitButtonByMode(submitMode);
          return;
        }

        updateImunisasiSummary();
        syncStatusHistoryTimeline();

        setPd3iButtonLoading(activeSubmitButton, true, 'Menyimpan...');
        setWorkflowSubmitFeedback(submitMode, 'Menyimpan verifikasi ke server...', null);

        const dataObj = { dx: selector.value, __token: SESSION_TOKEN, __workflowStage: normalizeWorkflowStepId(activeStageOnSubmit), __submitMode: submitMode };
        dataObj.__action = getWorkflowSaveActionForMode(submitMode);
        if (normalizeSidebarWorkspace(ACTIVE_SIDEBAR_WORKSPACE) === 'edit') {
          dataObj.__editMode = 'initial_report';
          if (window.__PD3I_APPROVAL_REQUEST_MODE__) {
            dataObj.__approvalRequest = true;
            dataObj['Edit Reason'] = window.prompt('Alasan perubahan wajib diisi:') || '';
            dataObj['Edit Diff Summary'] = 'Perubahan diajukan melalui form edit pascaverifikasi';
            if (!String(dataObj['Edit Reason']).trim()) {
              showWorkflowSubmitError(submitMode, 'Alasan perubahan wajib diisi untuk permintaan approval admin.');
              resetSubmitButtonByMode(submitMode);
              return;
            }
          }
        }
        activeFormElement.querySelectorAll('input[name], select[name], textarea[name]').forEach((el) => {
          const fieldKey = _getSemanticFieldKey_(el);
          if (!fieldKey) return;
          dataObj[fieldKey] = el.value;
        });
        // Choice buttons are source of truth. Hidden input can be stale after
        // hydration/autofill, which previously turned MR Demam/Ruam "Ya" into
        // "Tidak" on the server fallback.
        activeFormElement.querySelectorAll('.pd3i-choice-btn[data-field-id][aria-pressed="true"]').forEach((btn) => {
          const fieldKey = String(btn.getAttribute('data-field-id') || '').trim();
          const choiceValue = String(btn.getAttribute('data-choice-value') || '').trim();
          if (fieldKey && choiceValue) dataObj[fieldKey] = choiceValue;
        });

        if (!dataObj["ID Registrasi Kasus"] && window.__PD3I_ACTIVE_RECORD_META && window.__PD3I_ACTIVE_RECORD_META["ID Registrasi Kasus"]) {
          dataObj["ID Registrasi Kasus"] = window.__PD3I_ACTIVE_RECORD_META["ID Registrasi Kasus"];
        }
        if (!dataObj.RAW_ROW_NUMBER && window.__PD3I_ACTIVE_RECORD_META && window.__PD3I_ACTIVE_RECORD_META.RAW_ROW_NUMBER) {
          dataObj.RAW_ROW_NUMBER = window.__PD3I_ACTIVE_RECORD_META.RAW_ROW_NUMBER;
        }

        const activeStageNormalized = normalizeWorkflowStepId(activeStageOnSubmit);
        if (!dataObj["Status Verifikasi EPID"] && activeStageNormalized === 'section-pelapor') {
          dataObj["Status Verifikasi EPID"] = 'Pending';
        }
        if (activeStageNormalized === 'section-verifikasi') {
          const currentStatus = String(dataObj["Status Verifikasi EPID"] || '').trim();
          if (!currentStatus || currentStatus === 'Pending') {
            showWorkflowSubmitError(submitMode, 'Pada tahap verifikasi admin harus memilih status Terverifikasi atau Perlu Revisi.');
            activeSubmitButton.disabled = false;
            resetSubmitButtonByMode(submitMode);
            return;
          }
          dataObj["Petugas Verifikator"] = getCurrentSessionActorName();
          dataObj["Tanggal Verifikasi EPID"] = dataObj["Tanggal Verifikasi EPID"] || (typeof getCurrentDateTimeDisplayValue === 'function' ? getCurrentDateTimeDisplayValue() : getTodayInputValue());
          dataObj["Review Admin Terakhir"] = `${currentStatus} oleh ${getCurrentSessionActorName() || 'admin'}`;
          if (currentStatus === 'Terverifikasi') {
            dataObj["Nomor EPID"] = normalizeEpidRecommendationValue(dataObj["Nomor EPID"]);
            if (!dataObj["Nomor EPID"]) {
              await refreshRecommendedEpidForSubmit(dataObj.dx, dataObj);
            }
            if (!dataObj["Nomor EPID"]) {
              showWorkflowSubmitError(submitMode, 'Nomor EPID wajib diisi. Rekomendasi otomatis belum tersedia; isi Nomor EPID manual.');
              activeSubmitButton.disabled = false;
              resetSubmitButtonByMode(submitMode);
              return;
            }
            const epidConfirmOk = await confirmVerificationEpidBeforeSave(dataObj);
            if (!epidConfirmOk) {
              activeSubmitButton.disabled = false;
              resetSubmitButtonByMode(submitMode);
              return;
            }
            dataObj["Nomor EPID"] = normalizeEpidRecommendationValue(dataObj["Nomor EPID"]);
            dataObj["Status Notifikasi Pengampu"] = '';
            dataObj["Reason Notifikasi Pengampu"] = '';
            dataObj["Notifikasi Revisi Dibaca"] = 'Ya';
          }
          if (currentStatus === 'Perlu Revisi') {
            if (!String(dataObj["Catatan Verifikasi EPID"] || '').trim()) {
              showWorkflowSubmitError(submitMode, 'Catatan verifikasi wajib diisi jika status Perlu Revisi.');
              activeSubmitButton.disabled = false;
              resetSubmitButtonByMode(submitMode);
              return;
            }
            dataObj["Nomor EPID"] = '';
            dataObj["Waktu Permintaan Revisi"] = new Date().toISOString();
            dataObj["Notifikasi Revisi Dibaca"] = 'Tidak';
          }
        }

        if (!dataObj["Nama unit pelapor"]) {
          showWorkflowSubmitError(submitMode, "Nama Unit Pelapor wajib dipilih.");
          activeSubmitButton.disabled = false;
          resetSubmitButtonByMode(submitMode);
          return;
        }

        const unitSelect = findScopedFieldControl("Nama unit pelapor", activeFormElement);
        dataObj["FaskesKey"] =
          unitSelect?.options[unitSelect.selectedIndex]?.getAttribute("data-key")
          || (dataObj["Nama unit pelapor"] || "").toUpperCase().replace(/[^A-Z0-9]/g, "");

        const rsSelect = findScopedFieldControl("Nama Rumah Sakit", activeFormElement);
        if (rsSelect) {
          dataObj["Nama Rumah Sakit"] = dataObj["Nama Rumah Sakit"] || rsSelect.value || "";
          if (dataObj["Nama Rumah Sakit"]) {
            dataObj["RumahSakitKey"] =
              rsSelect?.options[rsSelect.selectedIndex]?.getAttribute("data-key")
              || (dataObj["Nama Rumah Sakit"] || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
          }
        }

        activeFormElement.querySelectorAll("table[data-dynamic-table]").forEach(table => {
          const tableId = table.getAttribute("data-dynamic-table");
          const tableData = [];

          table.querySelectorAll("tbody tr").forEach(row => {
            const rowObj = {};
            row.querySelectorAll("input, select, textarea").forEach(i => {
              const name = i.getAttribute("data-name");
              rowObj[name] = name === "Jam Pengambilan Spesimen" && i.value ? i.value + " WIB" : i.value;
            });

            if (tableId === "Riwayat Imunisasi") {
              rowObj["KodeImunisasi"] = row.dataset.kodeImun || "";
              if (rowObj["Jenis Imunisasi"]) tableData.push(rowObj);
            } else if (tableId === "Riwayat Status Kasus") {
              if (rowObj["Tanggal"] || rowObj["Status"]) tableData.push(rowObj);
            } else if (tableId === "Rincian Hasil Sampel") {
              if (rowObj["Jenis Spesimen"] || rowObj["Nomor Spesimen"] || rowObj["Tanggal Hasil"] || rowObj["Hasil"]) tableData.push(rowObj);
            } else {
              if (rowObj["Nama"]) tableData.push(rowObj);
            }
          });

          dataObj[tableId] = tableData.length > 0 ? JSON.stringify(tableData) : "";
        });

        syncSampleResultLegacyFieldsFromTable(dataObj);

        try {
          let res = null;

          try {
            res = await withWorkflowSaveTimeout(saveFormViaGsRun(dataObj), 'Simpan verifikasi EPID');
          } catch (gsErr) {
            const gsMessage = String((gsErr && gsErr.message) || gsErr || '');
            if (!/google\.script\.run tidak tersedia/i.test(gsMessage)) {
              throw gsErr;
            }
            console.warn("google.script.run tidak tersedia, fallback ke POST /exec:", gsErr);
            res = await withWorkflowSaveTimeout(postJsonToWebApp(GOOGLE_SCRIPT_URL, dataObj), 'Simpan verifikasi EPID');
          }

          if (res && res.status === "success") {
            const successMessage = res.message || "Data berhasil disimpan.";
            showPd3iToast(successMessage, { type: 'success' });
            setWorkflowSubmitFeedback(submitMode, successMessage, true);

            let epidSaved = String((res && res.epid) || dataObj["Nomor EPID"] || "").trim();
            let dxSaved = String((res && res.dx) || dataObj.dx || "").trim();
            let printUrl = String((res && res.printUrl) || "").trim();

            const needsPrintMeta = submitMode !== 'input' && (!!epidSaved || activeStageNormalized !== 'section-pelapor');
            if (needsPrintMeta && (!epidSaved || !printUrl) && safeGsRun()) {
              try {
                const metaRes = await resolveLatestSavedMetaViaGsRun(dataObj);
                if (metaRes && metaRes.status === "success") {
                  epidSaved = String(metaRes.epid || epidSaved || "").trim();
                  dxSaved = String(metaRes.dx || dxSaved || "").trim();
                  printUrl = String(metaRes.printUrl || printUrl || "").trim();
                }
              } catch (metaErr) {
                console.warn("resolveLatestSavedMetaViaGsRun gagal:", metaErr);
              }
            }

            if (epidSaved && !dataObj["Nomor EPID"]) {
              dataObj["Nomor EPID"] = epidSaved;
              const epidInput = document.getElementById("Nomor EPID");
              if (epidInput) epidInput.value = epidSaved;
            }
            if (typeof window !== 'undefined') {
              window.__PD3I_ACTIVE_RECORD_META = Object.assign({}, window.__PD3I_ACTIVE_RECORD_META || {}, dataObj || {}, { "Nomor EPID": epidSaved || dataObj["Nomor EPID"] || '' });
            }

            pd3iDebugLog_("Save response:", res);
            pd3iDebugLog_("Resolved print params:", { epidSaved, dxSaved, printUrl });

            clearFormDraft();
            if (typeof clearWorkspaceSearchResultCache === 'function') clearWorkspaceSearchResultCache();
            if (epidSaved && submitMode !== 'input') {
              isEditMode = true;
              updateFormStepperState(document.querySelector(".pd3i-stepper-item.is-active")?.getAttribute("data-step-target") || "section-pelapor");
            }
            resetSubmitButtonByMode(submitMode);
            updateUiShellSummary();
            if (submitMode !== 'input') {
              refreshWorkflowInbox({ forceRefresh: true });
            }
            if (activeStageNormalized === 'section-verifikasi' && res && res.nextWorkflowLabel) {
              showPd3iToast(res.nextWorkflowLabel + '. Daftar kerja sudah diperbarui.', { type: 'success' });
            }

            if (normalizeSidebarWorkspace(ACTIVE_SIDEBAR_WORKSPACE) === 'edit' && window.__PD3I_APPROVAL_REQUEST_MODE__) {
              showPd3iToast('Permintaan perubahan dikirim ke admin. Data utama belum diubah.', { type: 'success' });
              window.__PD3I_APPROVAL_REQUEST_MODE__ = false;
            } else if (normalizeSidebarWorkspace(ACTIVE_SIDEBAR_WORKSPACE) === 'edit') {
              showPd3iToast('Edit inputan awal berhasil disimpan dengan audit perubahan. Tahap verifikasi/sampel/status tidak ikut diubah.', { type: 'success' });
              showSuccessModal(
                res.message || 'Edit inputan berhasil disimpan.',
                printUrl,
                { dx: dxSaved, epid: epidSaved, token: SESSION_TOKEN }
              );
            } else if (activeStageNormalized === 'section-verifikasi') {
              const verificationStatusSaved = String((res && res.verificationStatus) || dataObj["Status Verifikasi EPID"] || '').trim();
              clearActiveRecordContext();
              openSidebarWorkspace('verifikasi', { scroll: false, skipRecordReload: true });
              refreshWorkflowInbox({ forceRefresh: true });
              if (verificationStatusSaved === 'Terverifikasi' && printUrl) {
                showPd3iToast((res.nextWorkflowLabel || res.message || 'Verifikasi selesai') + '. PDF PE sudah tersedia setelah verifikasi EPID.', { type: 'success' });
                showSuccessModal(
                  res.message || 'Verifikasi EPID selesai. PDF PE sudah dapat dicetak.',
                  printUrl,
                  { dx: dxSaved, epid: epidSaved, token: SESSION_TOKEN }
                );
              } else {
                const verificationDoneMessage = (res.nextWorkflowLabel || res.message || 'Verifikasi selesai') + '. Daftar verifikasi sudah diperbarui.';
                showPd3iToast(verificationDoneMessage, { type: 'success' });
                showSuccessModal(
                  verificationDoneMessage,
                  '',
                  { dx: dxSaved, epid: epidSaved, token: SESSION_TOKEN }
                );
              }
            } else if (activeStageNormalized === 'section-sampel') {
              clearActiveRecordContext();
              openSidebarWorkspace('sampel', { scroll: true, skipRecordReload: true });
              refreshWorkflowInbox({ forceRefresh: true });
              showPd3iToast('Hasil pemeriksaan berhasil disimpan. Kasus yang sudah selesai keluar dari daftar menunggu hasil laboratorium.', { type: 'success' });
            } else if (activeStageNormalized === 'section-status') {
              clearActiveRecordContext();
              openSidebarWorkspace('status', { scroll: true, skipRecordReload: true });
              refreshWorkflowInbox({ forceRefresh: true });
              showPd3iToast(res.message || 'Update status berhasil disimpan. Daftar status sudah diperbarui.', { type: 'success' });
            } else {
              showSuccessModal(
                res.message || "Data berhasil disimpan.",
                printUrl,
                { dx: dxSaved, epid: epidSaved, token: SESSION_TOKEN }
              );
              if (submitMode === 'input') {
                setTimeout(function() { refreshWorkflowInbox({ forceRefresh: true }); }, 250);
              }
            }
          } else {
            showWorkflowSubmitError(submitMode, "Error: " + (res?.message || "Gagal menyimpan data."));
            activeSubmitButton.disabled = false;
            resetSubmitButtonByMode(submitMode);
          }
        } catch (err) {
          console.error("submit failed:", err);
          const errMessage = String((err && err.message) || err || "").trim();
          showWorkflowSubmitError(submitMode, errMessage || "Gagal submit. Pastikan URL Web App /exec benar dan deployment terbaru sudah aktif.");
          activeSubmitButton.disabled = false;
          resetSubmitButtonByMode(submitMode);
        }
      };

      function safeHandleMainFormSubmit(mode) {
        const submitMode = normalizeSidebarWorkspace(mode || 'search');
        return Promise.resolve()
          .then(function() { return handleMainFormSubmit(submitMode); })
          .catch(function(err) {
            console.error('submit handler failed before server save:', err);
            const errMessage = String((err && err.message) || err || 'Gagal menyimpan data.').trim();
            showWorkflowSubmitError(submitMode, errMessage || 'Gagal menyimpan data.');
            resetSubmitButtonByMode(submitMode);
            const activeSubmitButton = submitMode === 'input'
              ? btnSubmitInput
              : submitMode === 'verifikasi'
                ? btnSubmitVerifikasi
                : submitMode === 'sampel'
                  ? btnSubmitSampel
                  : submitMode === 'status'
                    ? btnSubmitStatus
                    : btnSubmit;
            if (activeSubmitButton) {
              activeSubmitButton.disabled = false;
              activeSubmitButton.removeAttribute('aria-busy');
            }
          });
      }

      window.__PD3I_SUBMIT_WORKFLOW = function(mode) {
        return safeHandleMainFormSubmit(mode);
      };
      window.__PD3I_SUBMIT_WORKFLOW_CLICK = function(ev, mode) {
        if (ev) {
          ev.preventDefault();
          ev.stopPropagation();
          if (typeof ev.stopImmediatePropagation === 'function') ev.stopImmediatePropagation();
        }
        safeHandleMainFormSubmit(mode);
        return false;
      };

      // btn-submit-input uses inline workflow handler; do not bind second click handler.
      // Verifikasi button already uses inline handler in workspace_verifikasi_form.html.
      // Avoid duplicate listeners that race and leave button looking unresponsive.
      // Workflow submit buttons use inline __PD3I_SUBMIT_WORKFLOW_CLICK only.
      // Do not bind second listeners; double submit races leave stale loading/error state.
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initAppModule);
    } else {
      initAppModule();
    }
  })();
</script>
