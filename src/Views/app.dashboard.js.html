<script>

  function getSafeSessionToken() {
    try {
      if (typeof SESSION_TOKEN !== 'undefined') return SESSION_TOKEN || '';
    } catch (e) {}
    try {
      if (typeof window !== 'undefined' && typeof window.__PD3I_SESSION_TOKEN !== 'undefined') return window.__PD3I_SESSION_TOKEN || '';
    } catch (e) {}
    return '';
  }

  function getSafeSessionUser() {
    try {
      if (typeof SESSION_USER !== 'undefined') return SESSION_USER || null;
    } catch (e) {}
    try {
      if (typeof window !== 'undefined' && typeof window.__PD3I_SESSION_USER !== 'undefined') return window.__PD3I_SESSION_USER || null;
    } catch (e) {}
    return null;
  }

  function escapeHtml(text) {
    return String(text || '')
      .replace(/&/g, '&amp;')
      .replace(new RegExp('<', 'g'), '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function renderHotspotMap(stats, dx, tahun) {
    const mapWrap = document.getElementById('dashboard-hotspot-map');
    const listWrap = document.getElementById('dashboard-hotspot-list');
    const summary = stats && stats.coordinateSummary ? stats.coordinateSummary : null;
    if (!mapWrap) return;

    if (window.__PD3I_DASHBOARD_MAP) {
      try {
        window.__PD3I_DASHBOARD_MAP.remove();
      } catch (e) {}
      window.__PD3I_DASHBOARD_MAP = null;
    }

    const points = summary && Array.isArray(summary.points) ? summary.points : [];
    const topHotspots = summary && Array.isArray(summary.topHotspots) ? summary.topHotspots : [];
    if (!summary || !points.length) {
      mapWrap.innerHTML = '<div class="pd3i-empty-keadaan">Belum ada koordinat valid pada filter dashboard ini.</div>';
      if (listWrap) {
        listWrap.innerHTML = '<div class="pd3i-empty-keadaan">Belum ada hotspot kasus yang dapat ditampilkan.</div>';
      }
      return;
    }

    if (listWrap) {
      listWrap.innerHTML = topHotspots.length
        ? topHotspots.map(function(item, idx) {
            return `<button type="button" class="pd3i-hotspot-list-item" data-dashboard-drilldown-type="hotspot" data-dashboard-drilldown-key="${escapeHtml(item.key || '')}" data-dashboard-drilldown-label="${escapeHtml(item.label || 'Hotspot')}">
              <div>
                <div class="pd3i-hotspot-rank">#${idx + 1} ${escapeHtml(item.label || 'Titik koordinat')}</div>
                <div class="pd3i-helper-text">Lat ${escapeHtml(item.lat)} • Lon ${escapeHtml(item.lon)}</div>
              </div>
              <div class="pd3i-hotspot-count">${item.count || 0}</div>
            </button>`;
          }).join('')
        : '<div class="pd3i-empty-keadaan">Belum ada hotspot kasus yang dapat ditampilkan.</div>';
    }

    if (!window.L) {
      mapWrap.innerHTML = '<div class="pd3i-empty-keadaan">Pustaka peta belum termuat. Muat ulang halaman untuk menampilkan peta hotspot kasus.</div>';
      return;
    }

    mapWrap.innerHTML = '';
    const map = window.L.map(mapWrap, { scrollWheelZoom: false });
    window.__PD3I_DASHBOARD_MAP = map;
    window.L.tileLayer('https:' + '/' + '/tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const bounds = [];
    points.forEach(function(point) {
      const count = Math.max(1, parseInt(point.count || 1, 10));
      const radius = Math.min(26, 7 + (count - 1) * 2.5);
      const color = count >= 5 ? '#dc2626' : count >= 3 ? '#f97316' : '#2563eb';
      const marker = window.L.circleMarker([point.lat, point.lon], {
        radius: radius,
        color: color,
        weight: 2,
        fillColor: color,
        fillOpacity: 0.3
      }).addTo(map);
      marker.bindPopup(`<strong>${escapeHtml(point.label || 'Hotspot')}</strong><br>${escapeHtml([point.kecamatan, point.kelurahan].filter(Boolean).join(' / ') || 'Wilayah tidak diketahui')}<br>Kasus: ${count}<br>Lat: ${escapeHtml(point.lat)}<br>Lon: ${escapeHtml(point.lon)}<br><small>Klik marker untuk lihat daftar kasus.</small>`);
      marker.on('click', function() {
        openDashboardDrilldown('hotspot', point.key, [point.kecamatan, point.kelurahan].filter(Boolean).join(' / ') || point.label || 'Hotspot', dx, tahun);
      });
      bounds.push([point.lat, point.lon]);
    });

    if (bounds.length === 1) {
      map.setView(bounds[0], 14);
    } else {
      map.fitBounds(bounds, { padding: [24, 24] });
    }
    setTimeout(function() {
      try { map.invalidateSize(); } catch (e) {}
    }, 0);
  }


  function renderDashboardDrilldownPanel(result, dx, tahun) {
    const wrap = document.getElementById('dashboard-drilldown-panel');
    if (!wrap) return;

    if (!result || result.status === 'error') {
      wrap.classList.remove('hidden');
      wrap.innerHTML = `<div class="pd3i-empty-keadaan">${escapeHtml((result && result.message) || 'Gagal memuat detail dashboard.')}</div>`;
      return;
    }

    const items = Array.isArray(result.items) ? result.items : [];
    const listHtml = items.length
      ? items.map(function(item) {
          const recordKeyArg = JSON.stringify(String(item.recordKey || item.recordId || item.epid || ''));
          const dxArg = JSON.stringify(String(dx || 'MR'));
          return `<div class="pd3i-dashboard-drilldown-item">
            <div class="flex flex-wrap items-start justify-between gap-3">
              <div>
                <strong>${escapeHtml(item.nama || '-')}</strong>
                <small>${escapeHtml(item.recordId || item.epid || '-')} • ${escapeHtml([item.kecamatan, item.kelurahan, item.rw ? 'RW ' + item.rw : '', item.rt ? 'RT ' + item.rt : ''].filter(Boolean).join(' / ') || '-')}</small>
              </div>
              <button type="button" class="pd3i-search-result-action" onclick='window.__openAdminQueueRecord && window.__openAdminQueueRecord(${recordKeyArg}, ${dxArg}, this)'><i class="fas fa-folder-open"></i> Buka</button>
            </div>
            <div class="pd3i-admin-queue-meta">
              ${item.statusVerifikasi ? `<span class="pd3i-admin-queue-pill">${escapeHtml(item.statusVerifikasi)}</span>` : ''}
              ${item.statusKasus ? `<span class="pd3i-admin-queue-pill">${escapeHtml(item.statusKasus)}</span>` : ''}
              ${item.inputAt ? `<span class="pd3i-admin-queue-pill">Input ${escapeHtml(String(item.inputAt).slice(0, 10))}</span>` : ''}
              ${item.updatedAt ? `<span class="pd3i-admin-queue-pill">Diperbarui ${escapeHtml(String(item.updatedAt).slice(0, 10))}</span>` : ''}
            </div>
            ${item.alamat ? `<small>${escapeHtml(item.alamat)}</small>` : ''}
          </div>`;
        }).join('')
      : '<div class="pd3i-empty-keadaan">Belum ada kasus pada drill-down ini.</div>';

    wrap.innerHTML = `
      <div class="pd3i-card-header-row mt-4">
        <div>
          <div class="pd3i-card-eyebrow">Rincian dashboard</div>
          <h3 class="pd3i-card-title">${escapeHtml(result.label || 'Detail kasus')}</h3>
          <div class="pd3i-helper-text mt-1">Menampilkan <strong>${items.length}</strong> dari total <strong>${result.total || 0}</strong> kasus untuk filter ini.</div>
        </div>
        <button type="button" id="dashboard-drilldown-close" class="pd3i-ghost-button pd3i-inline-button"><i class="fas fa-xmark"></i> Tutup</button>
      </div>
      <div class="pd3i-dashboard-drilldown-list">${listHtml}</div>
    `;
    wrap.classList.remove('hidden');
    const closeBtn = wrap.querySelector('#dashboard-drilldown-close');
    if (closeBtn) {
      closeBtn.addEventListener('click', function() {
        window.__DASHBOARD_DRILLDOWN_STATE = null;
        wrap.classList.add('hidden');
        wrap.innerHTML = '';
      });
    }
  }

  function openDashboardDrilldown(type, key, label, dx, tahun) {
    const wrap = document.getElementById('dashboard-drilldown-panel');
    if (!wrap || !safeGsRun() || !getSafeSessionToken()) return;
    window.__DASHBOARD_DRILLDOWN_STATE = { type: type, key: key, label: label, dx: dx, tahun: tahun };
    wrap.classList.remove('hidden');
    wrap.innerHTML = '<div class="pd3i-empty-keadaan"><i class="fas fa-spinner fa-spin mr-2"></i>Memuat daftar kasus...</div>';
    google.script.run
      .withSuccessHandler(function(res) {
        renderDashboardDrilldownPanel(res, dx, tahun);
      })
      .withFailureHandler(function(err) {
        renderDashboardDrilldownPanel({ status: 'error', message: String(err && err.message ? err.message : err) }, dx, tahun);
      })
      .getDashboardDrilldown(dx, tahun, { type: type, key: key, label: label }, getSafeSessionToken());
  }

  function bindDashboardDrilldownActions(dx, tahun) {
    function runDashboardRetry(actionLabel, runner) {
      const canRunGs = (typeof safeGsRun === 'function') ? safeGsRun() : false;
      if (!canRunGs || !getSafeSessionToken()) {
        showTopAlert(actionLabel + ' hanya berfungsi di lingkungan WebApp (/exec).', false);
        return;
      }
      runner();
    }

    function refreshDashboardAfterRetry() {
      try {
        if (typeof loadDashboardData === 'function') loadDashboardData();
      } catch (e) {}
    }

    window.__openAdminQueueRecord = function(recordKey, dxValue, triggerButton) {
      if (typeof window._loadRecordFromSearch_ === 'function') {
        window._loadRecordFromSearch_(recordKey, dxValue || dx || 'MR', {
          triggerButton: triggerButton,
          workspace: 'edit',
          workflowIntent: 'section-pelapor',
          skipWorkflowInboxRefresh: true
        });
      } else {
        showTopAlert('Fungsi membuka data belum siap. Coba lagi sebentar.', false);
      }
    };

    window.__retryCaseNotify = function(epid, dxValue) {
      runDashboardRetry('Retry notifikasi kasus baru', function() {
        google.script.run
          .withSuccessHandler(function(res) {
            if (res && res.status === 'success') showTopAlert('Retry email kasus baru berhasil.', true);
            else showTopAlert((res && res.message) || 'Retry email kasus baru gagal.', false);
            refreshDashboardAfterRetry();
          })
          .withFailureHandler(function(err) {
            showTopAlert('Retry email kasus baru gagal: ' + String(err && err.message ? err.message : err), false);
          })
          .retryPengampuNotification(epid, dxValue || dx || 'MR', getSafeSessionToken());
      });
    };

    window.__retryCaseSync = function(epid, dxValue) {
      runDashboardRetry('Retry sync pengampu', function() {
        google.script.run
          .withSuccessHandler(function(res) {
            if (res && res.status === 'success') showTopAlert('Retry sync pengampu berhasil.', true);
            else showTopAlert((res && res.message) || 'Retry sync pengampu gagal.', false);
            refreshDashboardAfterRetry();
          })
          .withFailureHandler(function(err) {
            showTopAlert('Retry sync pengampu gagal: ' + String(err && err.message ? err.message : err), false);
          })
          .retryPengampuSync(epid, dxValue || dx || 'MR', getSafeSessionToken());
      });
    };

    window.__retryCaseTelegram = function(epid, dxValue) {
      runDashboardRetry('Retry Telegram kasus baru', function() {
        google.script.run
          .withSuccessHandler(function(res) {
            if (res && res.status === 'success') showTopAlert('Retry Telegram kasus baru berhasil.', true);
            else showTopAlert((res && res.message) || 'Retry Telegram kasus baru gagal.', false);
            refreshDashboardAfterRetry();
          })
          .withFailureHandler(function(err) {
            showTopAlert('Retry Telegram kasus baru gagal: ' + String(err && err.message ? err.message : err), false);
          })
          .retryTelegramPd3iNotification(epid, dxValue || dx || 'MR', getSafeSessionToken());
      });
    };

    window.__retryRevisionNotify = function(recordKey, dxValue) {
      runDashboardRetry('Retry notifikasi revisi', function() {
        google.script.run
          .withSuccessHandler(function(res) {
            if (res && res.status === 'success') showTopAlert('Retry email revisi berhasil.', true);
            else showTopAlert((res && res.message) || 'Retry email revisi gagal.', false);
            refreshDashboardAfterRetry();
          })
          .withFailureHandler(function(err) {
            showTopAlert('Retry email revisi gagal: ' + String(err && err.message ? err.message : err), false);
          })
          .retryRevisionPengampuNotification(recordKey, dxValue || dx || 'MR', getSafeSessionToken());
      });
    };

    window.__retryRevisionTelegram = function(recordKey, dxValue) {
      runDashboardRetry('Retry Telegram revisi', function() {
        google.script.run
          .withSuccessHandler(function(res) {
            if (res && res.status === 'success') showTopAlert('Retry Telegram revisi berhasil.', true);
            else showTopAlert((res && res.message) || 'Retry Telegram revisi gagal.', false);
            refreshDashboardAfterRetry();
          })
          .withFailureHandler(function(err) {
            showTopAlert('Retry Telegram revisi gagal: ' + String(err && err.message ? err.message : err), false);
          })
          .retryRevisionTelegramNotification(recordKey, dxValue || dx || 'MR', getSafeSessionToken());
      });
    };

    document.querySelectorAll('[data-dashboard-drilldown-type]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        const type = String(btn.getAttribute('data-dashboard-drilldown-type') || '').trim();
        const key = String(btn.getAttribute('data-dashboard-drilldown-key') || '').trim();
        const label = String(btn.getAttribute('data-dashboard-drilldown-label') || key).trim();
        if (!type || !key) return;
        openDashboardDrilldown(type, key, label, dx, tahun);
      });
    });
  }


// ============================================================
// DASHBOARD STATISTIK (Req 6.1–6.7)
// ============================================================

  function openDashboardSection(options) {
    if (typeof canAccessSidebarWorkspace === 'function' && !canAccessSidebarWorkspace('dashboard', SESSION_USER)) {
      if (typeof showTopAlert === 'function') showTopAlert('Dashboard hanya tersedia untuk role yang diizinkan.', false);
      if (typeof openSidebarWorkspace === 'function') openSidebarWorkspace('overview', { scroll: false, useRoute: true, replaceRoute: true });
      return;
    }
    const opts = options || {};
    updateDashboardScopeIdentity();
    const section = document.getElementById('section-dashboard');
    const overviewInbox = document.getElementById('overview-work-inbox');
    const overviewSummary = document.getElementById('overview-work-summary');
    if (typeof applySidebarWorkspaceLayout === 'function') applySidebarWorkspaceLayout('dashboard');
    if (section) {
      section.classList.remove('hidden');
      section.style.display = '';
      section.setAttribute('aria-hidden', 'false');
    }
    if (overviewInbox) {
      overviewInbox.classList.add('hidden');
      overviewInbox.style.display = 'none';
      overviewInbox.innerHTML = '';
    }
    if (overviewSummary) {
      overviewSummary.classList.add('hidden');
      overviewSummary.style.display = 'none';
      overviewSummary.innerHTML = '';
    }
    if (typeof initDashboard === 'function') initDashboard();
    if (typeof updateSidebarActiveState === 'function') updateSidebarActiveState('dashboard');
    if (section && opts.scroll !== false) {
      section.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    const content = document.getElementById('dashboard-content');
    const shouldAutoLoad = opts.autoLoad === true || (opts.autoLoad !== false && content && !content.dataset.loaded);
    if (shouldAutoLoad) loadDashboard();
  }

  function updateDashboardScopeIdentity() {
    const user = getSafeSessionUser() || {};
    const role = String(user.role || '').trim().toLowerCase().replace(/[_\s]+/g, '-');
    const scope = String(user.scopeLevel || '').trim().toLowerCase().replace(/[_\s]+/g, '-');
    const isFaskesPelapor = scope === 'faskes-pelapor' || scope === 'faskespelapor';
    const isPuskesmas = scope === 'puskesmas' || ['petugas', 'surveilans', 'editor', 'koordinator'].includes(role);
    const title = document.getElementById('dashboard-scope-title');
    const eyebrow = document.getElementById('dashboard-scope-eyebrow');
    const copy = document.getElementById('dashboard-scope-copy');
    if (isFaskesPelapor) {
      if (title) title.textContent = 'Dashboard KPI Faskes Pelapor';
      if (eyebrow) eyebrow.textContent = 'Dashboard faskes pelapor';
      if (copy) copy.textContent = 'Dashboard light mode untuk memantau laporan faskes ini, kelengkapan data, status proses, dan kasus prioritas.';
    } else if (isPuskesmas) {
      if (title) title.textContent = 'Dashboard KPI Puskesmas Pengampu';
      if (eyebrow) eyebrow.textContent = 'Dashboard puskesmas pengampu';
      if (copy) copy.textContent = 'Dashboard light mode untuk memantau kasus dalam wilayah pengampu, tindak lanjut, kelengkapan data, dan antrean pemeriksaan.';
    }
  }

  function initDashboard() {
    // Isi dropdown tahun (5 tahun terakhir)
    const tahunEl = document.getElementById("dashboard-tahun");
    if (tahunEl && tahunEl.options.length === 0) {
      const now = new Date().getFullYear();
      for (let y = now; y >= now - 4; y--) {
        const opt = document.createElement("option");
        opt.value = y;
        opt.textContent = y;
        tahunEl.appendChild(opt);
      }
    }

    const btnLoad = document.getElementById("btn-load-dashboard");
    if (btnLoad && !btnLoad.dataset.bound) {
      btnLoad.dataset.bound = "1";
      btnLoad.addEventListener("click", loadDashboard);
    }

    const dxEl = document.getElementById("dashboard-dx");
    if (dxEl && !dxEl.dataset.bound) {
      dxEl.dataset.bound = "1";
      dxEl.addEventListener("change", loadDashboard);
    }
    if (tahunEl && !tahunEl.dataset.bound) {
      tahunEl.dataset.bound = "1";
      tahunEl.addEventListener("change", loadDashboard);
    }

    const btnBack = document.getElementById("btn-dashboard-back-to-workspace");
    if (btnBack && !btnBack.dataset.bound) {
      btnBack.dataset.bound = "1";
      btnBack.addEventListener("click", function () {
        if (typeof openSidebarWorkspace === 'function') {
          openSidebarWorkspace('overview', { scroll: true, useRoute: true });
          return;
        }
        const target = document.getElementById('section-overview');
        if (typeof updateSidebarActiveState === 'function') updateSidebarActiveState('overview');
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }

    const btnDashboard = document.getElementById("btn-dashboard");
    if (btnDashboard && !btnDashboard.dataset.bound) {
      btnDashboard.dataset.bound = "1";
      btnDashboard.addEventListener("click", function () {
        const dd = document.getElementById("admin-menu-dropdown");
        if (dd) dd.classList.add("hidden");
        openDashboardSection({ autoLoad: false });
      });
    }

    // Export CSV
    const btnExport = document.getElementById("btn-export-csv");
    if (btnExport && !btnExport.dataset.bound) {
      btnExport.dataset.bound = "1";
      btnExport.addEventListener("click", handleExportCsv);
    }
  }

  function loadDashboard() {
    const dx    = document.getElementById("dashboard-dx")?.value || "MR";
    const tahun = document.getElementById("dashboard-tahun")?.value || new Date().getFullYear();
    const content = document.getElementById("dashboard-content");
    if (!content) return;

    const section = document.getElementById('section-dashboard');
    if (section) section.classList.remove('hidden');
    content.dataset.loaded = '';
    const requestId = String(Date.now());
    content.dataset.loadingRequest = requestId;
    const runtimeGuard = (typeof createWorkspaceRuntimeGuard === 'function')
      ? createWorkspaceRuntimeGuard('dashboard')
      : null;
    content.innerHTML = '<div class="pd3i-dashboard-state is-loading"><span><i class="fas fa-spinner fa-spin mr-2"></i>Memuat data dashboard...</span></div>';

    if (!safeGsRun() || !getSafeSessionToken()) {
      content.innerHTML = '<div class="pd3i-dashboard-state is-error">Tidak dapat terhubung ke server.</div>';
      return;
    }

    google.script.run
      .withSuccessHandler(function (stats) {
        if (content.dataset.loadingRequest !== requestId) return;
        if (runtimeGuard && typeof isWorkspaceRuntimeGuardActive === 'function' && !isWorkspaceRuntimeGuardActive(runtimeGuard)) return;
        renderDashboard(stats, dx, tahun);
      })
      .withFailureHandler(function (err) {
        if (content.dataset.loadingRequest !== requestId) return;
        if (runtimeGuard && typeof isWorkspaceRuntimeGuardActive === 'function' && !isWorkspaceRuntimeGuardActive(runtimeGuard)) return;
        content.innerHTML = '<div class="pd3i-dashboard-state is-error">Gagal memuat data: ' + String(err) + '</div>';
      })
      .getDashboardStats(dx, tahun, getSafeSessionToken());
  }

  function renderDashboard(stats, dx, tahun) {
    const content = document.getElementById("dashboard-content");
    if (!content) return;

    if (!stats || stats.status === "error") {
      content.dataset.loaded = '';
      content.innerHTML = '<div class="pd3i-dashboard-state is-error">' + (stats && stats.message || "Gagal memuat data.") + '</div>';
      return;
    }

    const safeUser = getSafeSessionUser();
    const role = String((safeUser && safeUser.role) || "").trim().toLowerCase().replace(/[_\s]+/g, "-");
    const isAdmin = safeUser && (role === "admin" || role === "super-admin" || role === "superadmin");
    const isViewer = safeUser && safeUser.role === "viewer";
    const scope = String((safeUser && safeUser.scopeLevel) || '').trim().toLowerCase().replace(/[_\s]+/g, '-');
    const isFaskesPelapor = scope === 'faskes-pelapor' || scope === 'faskespelapor';
    const qc = stats.qualityCards || {};
    const epi = stats.epidemiology || {};
    const verificationCounts = (stats.verificationQueue && stats.verificationQueue.counts) || {};

    // KPI Metrics
    const totalCases = Number(stats.totalKasus || 0);
    const verifiedCount = Number(verificationCounts.terverifikasi || 0);
    const pendingPeninjauanCount = Number(verificationCounts.pending || qc.pendingVerification || 0);
    const revisionCount = Number(verificationCounts.perluRevisi || 0);
    const confirmedCount = Number(qc.confirmed || 0);
    const discardedCount = Number(qc.discarded || 0);
    const clinicalCount = Number(qc.clinical || 0);
    const waitingSampleCount = Number(qc.waitingSampleResult || 0);

    const statusCounts = stats.perStatusKasus || {};
    function getStatusCount(names) {
      const wanted = names.map(function(name) { return String(name).trim().toUpperCase(); });
      return Object.keys(statusCounts).reduce(function(sum, key) {
        return wanted.indexOf(String(key).trim().toUpperCase()) !== -1 ? sum + Number(statusCounts[key] || 0) : sum;
      }, 0);
    }
    const sembuhCount = getStatusCount(["Sembuh", "Selesai"]);
    const meninggalCount = getStatusCount(["Meninggal", "Mati"]);

    // Kasus Baru (bulan aktif terakhir di tren perBulan)
    const perMinggu = stats.perMinggu || stats.perBulan || {};
    const bulanKeys = Object.keys(perMinggu).sort();
    const newCases = bulanKeys.length > 0 ? (perMinggu[bulanKeys[bulanKeys.length - 1]] || 0) : 0;
    const latestMonthName = bulanKeys.length > 0 ? (function() {
      const k = bulanKeys[bulanKeys.length - 1];
      const months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Ags", "Sep", "Okt", "Nov", "Des"];
      const mIdx = parseInt(k.substring(4, 6), 10) - 1;
      return (months[mIdx] || "") + " " + k.substring(0, 4);
    })() : "";

    // Kasus Aktif = Total - Sembuh - Meninggal - Discarded
    const activeCases = Math.max(0, totalCases - (sembuhCount + meninggalCount + discardedCount));

    // Calculate rates
    const sameDayRate = epi.sameDayReportTrackingRate != null ? epi.sameDayReportTrackingRate + '%' : '-';
    const completenessRate = epi.workflowCompletenessRate != null ? epi.workflowCompletenessRate + '%' : '-';
    const decisionCount = confirmedCount + discardedCount + clinicalCount;
    const decisionRate = totalCases > 0 ? Math.round((decisionCount / totalCases) * 100) + '%' : '-';

    const notifikasiKasusBaru = stats.statusNotifikasi || { sent: 0, failed: 0, pending: 0 };
    const sinkronisasiPengampu = stats.statusSinkronisasi || { synced: 0, failed: 0, pending: 0 };

    let html = '';

    // ROW 1: KPI CARDS (ringkasan kasus tetap di Dashboard PD3I; KPI operasional/antrian tetap di Beranda)
    html += `
      <div class="pd3i-dashboard-analysis-intro pd3i-dashboard-block mb-6">
        <div class="pd3i-dashboard-block-title">Analisis kasus ${escapeHtml(dx)} tahun ${escapeHtml(tahun)}</div>

            <div class="w-10 h-10 rounded-full bg-blue-500/10 text-blue-700 flex items-center justify-center text-base shrink-0"><i class="fas fa-circle-check"></i></div>

        <div class="pd3i-dashboard-metric-card tone-emerald flex flex-col justify-between h-full">
          <div class="flex justify-between items-start w-full">
            <div><div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Sembuh</div><div class="text-3xl font-black text-emerald-900">${sembuhCount}</div></div>
            <div class="w-10 h-10 rounded-full bg-emerald-500/10 text-emerald-700 flex items-center justify-center text-base shrink-0"><i class="fas fa-heart"></i></div>
          </div>
          <div class="text-[11px] text-slate-400 mt-2">Dinyatakan sembuh/selesai PE</div>
        </div>
        <div class="pd3i-dashboard-metric-card tone-muted flex flex-col justify-between h-full">
          <div class="flex justify-between items-start w-full">
            <div><div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Meninggal</div><div class="text-3xl font-black text-slate-900">${meninggalCount}</div></div>
            <div class="w-10 h-10 rounded-full bg-slate-500/10 text-slate-700 flex items-center justify-center text-base shrink-0"><i class="fas fa-heart-broken"></i></div>

    // ROW 2: PETA SEBARAN & KURVA EPIDEMIOLOGI
    html += `
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">

        <div class="pd3i-dashboard-panel lg:col-span-1">

              <span class="pd3i-hotspot-legend-item flex items-center gap-1"><span class="dot is-mid w-2.5 h-2.5 rounded-full inline-block" style="background:#f97316"></span> 3-4</span>

            <span class="pd3i-dashboard-status-chip text-xs bg-slate-100 text-slate-600 font-bold px-2 py-0.5">W1, W2, W3...</span>

            <span><i class="fas fa-spinner fa-spin mr-2"></i>Menyiapkan kurva epidemiologi...</span>
          </div>

    // ROW 3: TABEL TOP PENYAKIT / WILAYAH (Full Width)
    html += `
      <!-- ROW 3: TABEL WILAYAH -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
        <!-- Tabel Penyakit / Kecamatan Tertinggi (span 3 / Full Width) -->
        <div class="pd3i-dashboard-panel pd3i-dashboard-panel-table overflow-x-auto lg:col-span-3">
          <div class="pd3i-dashboard-block-title flex items-center justify-between mb-3">
            <span><i class="fas fa-hospital-user text-indigo-600 mr-1"></i> Distribusi kecamatan teratas</span>

                <th class="text-left px-4 py-3 font-extrabold w-1/2">Proporsi Kasus</th>

            </thead>
            <tbody id="top-kecamatan-tbody">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </div>
    `;

    // Analisis Distribusi Kasus Berdasarkan Usia & Kelompok Umur Epidemiologis
    const perUsiaSurveilans = stats.perKelompokUsiaSurveilans || {};
    const usiaSurveilansOrder = ["<1 tahun", "1–4 tahun", "5–9 tahun", "10–14 tahun", "15–19 tahun", "20–44 tahun", "45–59 tahun", "≥60 tahun", "Usia tidak diketahui"];
    const usiaSurveilansKeys = usiaSurveilansOrder.filter(function(k) { return perUsiaSurveilans[k] > 0; });
    const maxUsiaSurveilans = usiaSurveilansKeys.length ? Math.max.apply(null, usiaSurveilansKeys.map(function(k) { return perUsiaSurveilans[k] || 0; })) : 0;
    const totalUsiaSurveilans = usiaSurveilansKeys.reduce(function(sum, k) { return sum + (perUsiaSurveilans[k] || 0); }, 0);

    html += `
      <div class="pd3i-dashboard-block mb-6">
        <div class="pd3i-dashboard-block-title">Analisis Distribusi Kasus Berdasarkan Usia</div>
        <div class="pd3i-dashboard-panel pd3i-dashboard-panel-table space-y-3">
          <div class="pd3i-helper-text text-slate-500">Interval analisis surveilans: &lt;1, 1–4, 5–9, 10–14, 15–19, 20–44, 45–59, dan ≥60 tahun. Distribusi Kelompok Umur Epidemiologis umum tetap dipertahaman terpisah.</div>
    `;
    if (!usiaSurveilansKeys.length) {
      html += `<div class="pd3i-empty-keadaan">Belum ada data usia pada filter ini.</div>`;
    } else {
      usiaSurveilansKeys.forEach(function(k) {
        const val = perUsiaSurveilans[k] || 0;
        const pctOfMax = maxUsiaSurveilans > 0 ? Math.round((val / maxUsiaSurveilans) * 100) : 0;
        const pctTotal = totalUsiaSurveilans > 0 ? Math.round((val / totalUsiaSurveilans) * 100) : 0;
        html += `
          <div class="pd3i-dashboard-month-row flex items-center justify-between gap-3 py-1 text-sm">
            <div class="pd3i-dashboard-month-label font-semibold text-slate-700 w-1/4">${escapeHtml(k)}</div>
            <div class="pd3i-dashboard-month-track flex-1 bg-slate-100 rounded-full h-2 overflow-hidden">
              <div class="pd3i-dashboard-month-fill bg-blue-600 h-2 rounded-full" style="width: ${pctOfMax}%"></div>
            </div>
            <div class="pd3i-dashboard-month-value font-extrabold text-slate-800 text-right w-1/6">
              ${val} <span class="text-xs font-semibold text-slate-400">(${pctTotal}%)</span>
            </div>
          </div>
        `;
      });
    }
    html += `
        </div>
      </div>
    `;

    // Distribusi Kelompok Umur Epidemiologis
    const perUmur = stats.perKelompokUmur || {};
    const umurKeys = Object.keys(perUmur).sort(function(a, b) { return perUmur[b] - perUmur[a]; });
    html += `
      <div class="pd3i-dashboard-block mb-6">
        <div class="pd3i-dashboard-panel pd3i-dashboard-panel-table">
          <div class="pd3i-dashboard-block-title is-sub">Distribusi Kelompok Umur Epidemiologis</div>
    `;
    if (!umurKeys.length) {
      html += `<div class="pd3i-empty-keadaan text-slate-400">Belum ada data kelompok umur epidemiologis.</div>`;
    } else {
      umurKeys.forEach(function(k) {
        html += `
          <div class="flex items-center justify-between py-2 border-b border-slate-100 last:border-b-0 gap-3">
            <span class="text-sm font-semibold text-slate-700">${escapeHtml(k)}</span>
            <span class="text-base font-black text-emerald-700">${perUmur[k]}</span>
          </div>
        `;
      });
    }
    html += `
        </div>
      </div>
    `;

    // Drilldown panel placeholder
    html += `<div id="dashboard-drilldown-panel" class="mb-6 hidden"></div>`;

    // Priority Action Alerts
    const actionAlerts = [];
    if (pendingPeninjauanCount > 0) actionAlerts.push(`${pendingPeninjauanCount} kasus masih belum / menunggu verifikasi EPID.`);
    if (waitingSampleCount > 0) actionAlerts.push(`${waitingSampleCount} kasus menunggu hasil pemeriksaan.`);
    if (epi.workflowCompletenessRate != null && epi.workflowCompletenessRate < 70) actionAlerts.push(`Kelengkapan workflow baru ${epi.workflowCompletenessRate}% — perlu perapihan data.`);
    if (epi.medianReportToTrackingDays != null && epi.medianReportToTrackingDays > 2) actionAlerts.push(`Median laporan ke pelacakan ${epi.medianReportToTrackingDays} hari — timeliness perlu dipercepat.`);

    if (actionAlerts.length > 0) {
      html += `
        <div class="pd3i-dashboard-alert mb-6 p-4 bg-amber-50 border border-amber-200">
          <div class="text-xs font-extrabold text-amber-800 mb-2 uppercase tracking-wide flex items-center gap-1.5">
            <i class="fas fa-exclamation-triangle"></i> Prioritas tindak lanjut
          </div>
          <ul class="list-disc pl-5 space-y-1 text-sm font-semibold text-amber-900">
            ${actionAlerts.map(msg => `<li>${msg}</li>`).join('')}
          </ul>
        </div>
      `;
    }

    // Export CSV Actions for non-viewers
    if (!isViewer && isAdmin) {
      html += `
        <div class="pd3i-dashboard-exportbar flex justify-end gap-3 mt-4 pt-4 border-t border-slate-100">
          <button type="button" onclick="handleExportCsv()" class="pd3i-primary-button pd3i-dashboard-export">
            <i class="fas fa-file-csv mr-1.5"></i> Export CSV ${dx} ${tahun}
          </button>
        </div>
      `;
    }

    // Set layout
    content.dataset.loaded = '1';
    content.innerHTML = html;

    // Draw Google Charts and Map
    drawGoogleCharts(stats, dx, tahun);
    renderHotspotMap(stats, dx, tahun);
    bindDashboardDrilldownActions(dx, tahun);

    // Kecamatan List Population with drilldown buttons and sparklines proportion bar
    const topKecamatan = (stats.wilayahSummary && stats.wilayahSummary.topKecamatan) || [];
    const topKecTbody = document.getElementById("top-kecamatan-tbody");
    if (topKecTbody) {
      if (topKecamatan.length > 0) {
        // Find max cases to calculate bar percentage width
        const maxCases = Math.max.apply(Math, topKecamatan.map(function(o) { return o.count || 0; })) || 1;
        topKecTbody.innerHTML = topKecamatan.map(function(item) {
          const pct = Math.min(100, Math.round(((item.count || 0) / maxCases) * 100));
          return `
            <tr class="border-b border-slate-100 hover:bg-slate-50/50 transition">
              <td class="px-4 py-3 font-semibold text-slate-700">
                <button type="button" class="pd3i-dashboard-link-button text-blue-600 hover:underline text-left" data-dashboard-drilldown-type="kecamatan" data-dashboard-drilldown-key="${escapeHtml(item.label || '')}" data-dashboard-drilldown-label="${escapeHtml(item.label || '')}">
                  ${escapeHtml(item.label || '-')}
                </button>
              </td>
              <td class="px-4 py-3">
                <div class="flex items-center gap-3">
                  <div class="w-full bg-slate-100 rounded-full h-2 max-w-[200px] overflow-hidden">
                    <div class="bg-blue-600 h-2 rounded-full" style="width: ${pct}%"></div>
                  </div>
                  <span class="text-xs text-slate-400 font-semibold">${pct}%</span>
                </div>
              </td>
              <td class="px-4 py-3 text-right font-extrabold text-slate-800">${item.count || 0}</td>
            </tr>
          `;
        }).join('');
      } else {
        topKecTbody.innerHTML = `<tr><td colspan="3" class="px-4 py-4 text-center text-slate-400">Belum ada data wilayah.</td></tr>`;
      }
    }

    // Restore drilldown state if match
    if (window.__DASHBOARD_DRILLDOWN_STATE && window.__DASHBOARD_DRILLDOWN_STATE.dx === dx && String(window.__DASHBOARD_DRILLDOWN_STATE.tahun) === String(tahun)) {
      openDashboardDrilldown(
        window.__DASHBOARD_DRILLDOWN_STATE.type,
        window.__DASHBOARD_DRILLDOWN_STATE.key,
        window.__DASHBOARD_DRILLDOWN_STATE.label,
        dx,
        tahun
      );
    }
  }

  // Draw Google Charts Area Trend & Demografi Donut
  function drawGoogleCharts(stats, dx, tahun) {
    let googleChartsSuccess = false;
    if (typeof google !== 'undefined' && google.visualization) {
      runChartsDraw(stats, dx, tahun);
      googleChartsSuccess = true;
    } else if (typeof google !== 'undefined' && google.charts) {
      google.charts.load('current', {'packages':['corechart']});
      google.charts.setOnLoadCallback(function() {
        runChartsDraw(stats, dx, tahun);
      });
      googleChartsSuccess = true;
    } else {
      console.error("Google Charts loader not available");
    }

    if (!googleChartsSuccess) {
      renderHtmlFallbackChart(stats);
      renderHtmlFallbackDemografi(stats);
    }
  }

  function renderHtmlFallbackChart(stats) {
    const chartTrenEl = document.getElementById('chart-tren-bulanan');
    if (!chartTrenEl) return;

    const perMinggu = stats.perMinggu || stats.perBulan || {};
    const bulanKeys = Object.keys(perMinggu).sort();

    if (bulanKeys.length === 0) {
      chartTrenEl.innerHTML = `
        <div class="pd3i-dashboard-chart-state flex flex-col items-center justify-center h-full text-slate-400 bg-slate-50 border border-slate-100">
          <i class="fas fa-info-circle text-2xl mb-1 text-slate-300"></i>
          <span class="text-xs">Tidak ada data tren untuk periode ini</span>
        </div>
      `;
      return;
    }

    let maxVal = 0;
    bulanKeys.forEach(function(k) {
      const val = perMinggu[k] || 0;
      if (val > maxVal) maxVal = val;
    });
    if (maxVal === 0) maxVal = 1;

    let barsHtml = '';
    bulanKeys.forEach(function(k) {
      const val = perMinggu[k] || 0;
      const heightPct = Math.max(8, Math.round((val / maxVal) * 80));
      const rawMonth = k.substring(4, 6);
      const year = k.substring(2, 4);
      const months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agt", "Sep", "Okt", "Nov", "Des"];
      const monthIdx = parseInt(rawMonth, 10) - 1;
      const label = k.indexOf("W") !== -1 ? k.replace(/^\d{4}W0?/, "W") : ((monthIdx >= 0 && monthIdx < 12 ? months[monthIdx] : rawMonth) + " '" + year);

      barsHtml += `
        <div class="flex flex-col items-center flex-1 h-full min-w-[36px] justify-end">
          <div class="text-[10px] font-bold text-blue-600 mb-1">${val}</div>
          <div class="w-6 bg-blue-600/15 hover:bg-blue-600/35 transition rounded-t-sm relative group" style="height: ${heightPct}%">
            <div class="pd3i-dashboard-tooltip absolute -top-8 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-[9px] px-1.5 py-0.5 shadow opacity-0 group-hover:opacity-100 transition whitespace-nowrap pointer-events-none z-10">
              ${val} Kasus
            </div>
          </div>
          <div class="text-[9px] text-slate-400 mt-2 font-semibold whitespace-nowrap overflow-hidden text-ellipsis w-full text-center" title="${label}">${label}</div>
        </div>
      `;
    });

    chartTrenEl.innerHTML = `
      <div class="w-full h-full flex flex-col justify-between p-4 bg-white">
        <div class="flex-1 flex items-end gap-2 h-48 border-b border-slate-100 pb-1 overflow-x-auto">
          ${barsHtml}
        </div>
      </div>
    `;
  }

  function renderHtmlFallbackDemografi(stats) {
    const chartDemoEl = document.getElementById('chart-demografi-usia');
    if (!chartDemoEl) return;

    const overlay = document.getElementById('chart-demografi-usia-overlay');
    if (overlay) {
      overlay.classList.add('hidden');
    }

    const perUsia = stats.perKelompokUsiaSurveilans || {};
    const usiaOrder = ["<1 tahun", "1–4 tahun", "5–9 tahun", "10–14 tahun", "15–19 tahun", "20–44 tahun", "45–59 tahun", "≥60 tahun", "Usia tidak diketahui"];

    let totalUsiaCases = 0;
    usiaOrder.forEach(function(k) {
      totalUsiaCases += (perUsia[k] || 0);
    });
    if (totalUsiaCases === 0) totalUsiaCases = 1;

    let listHtml = '';
    let hasData = false;
    usiaOrder.forEach(function(k) {
      const val = perUsia[k] || 0;
      if (val > 0) {
        hasData = true;
        const pct = Math.min(100, Math.round((val / totalUsiaCases) * 100));
        listHtml += `
          <div class="flex items-center gap-3 text-xs mb-2">
            <span class="w-24 text-slate-500 font-semibold truncate" title="${k}">${k}</span>
            <div class="flex-1 bg-slate-100 h-2 rounded-full overflow-hidden">
              <div class="bg-blue-600 h-2 rounded-full" style="width: ${pct}%"></div>
            </div>
            <span class="w-12 text-right font-extrabold text-slate-700">${val} (${pct}%)</span>
          </div>
        `;
      }
    });

    if (!hasData) {
      chartDemoEl.innerHTML = `
        <div class="pd3i-dashboard-chart-state flex flex-col items-center justify-center h-full text-slate-400 bg-slate-50 border border-slate-100">
          <i class="fas fa-info-circle text-2xl mb-1 text-slate-300"></i>
          <span class="text-xs">Tidak ada data demografi untuk periode ini</span>
        </div>
      `;
      return;
    }

    chartDemoEl.innerHTML = `
      <div class="w-full h-full p-4 overflow-y-auto" style="max-height: 250px;">
        ${listHtml}
      </div>
    `;
  }

  function runChartsDraw(stats, dx, tahun) {
    let trenSuccess = false;
    try {
      if (typeof google !== 'undefined' && google.visualization && google.visualization.AreaChart) {
        // 1. KURVA EPIDEMIOLOGI MINGGUAN AREA CHART
        const perMinggu = stats.perMinggu || stats.perBulan || {};
        const bulanKeys = Object.keys(perMinggu).sort();
        const trenData = [['Minggu', 'Jumlah kasus']];

        if (bulanKeys.length > 0) {
          bulanKeys.forEach(function(k) {
            const label = k.indexOf("W") !== -1 ? k.replace(/^\d{4}W0?/, "W") : (k.substring(0, 4) + "-" + k.substring(4, 6));
            trenData.push([label, perMinggu[k] || 0]);
          });
        } else {
          trenData.push(['No Data', 0]);
        }

        const dtTren = google.visualization.arrayToDataTable(trenData);
        const optTren = {
          title: '',
          hAxis: {
            title: 'Minggu epidemiologi',
            titleTextStyle: { color: '#64748b', fontSize: 11, bold: true },
            textStyle: { color: '#64748b', fontSize: 10 },
            gridlines: { color: 'transparent' }
          },
          vAxis: {
            title: 'Kasus',
            titleTextStyle: { color: '#64748b', fontSize: 11, bold: true },
            textStyle: { color: '#64748b', fontSize: 10 },
            minValue: 0,
            gridlines: { color: '#f1f5f9' },
            baselineColor: '#cbd5e1'
          },
          colors: ['#2563eb'], // Medical Royal Blue
          areaOpacity: 0.08,
          lineWidth: 4,
          curveType: 'function',
          pointSize: 5,
          pointShape: 'circle',
          chartArea: { width: '85%', height: '70%', top: 20, left: '10%' },
          legend: { position: 'none' },
          fontName: 'Inter, system-ui, sans-serif'
        };

        const chartTrenEl = document.getElementById('chart-tren-bulanan');
        if (chartTrenEl) {
          chartTrenEl.innerHTML = '';
          const chartTren = new google.visualization.AreaChart(chartTrenEl);
          chartTren.draw(dtTren, optTren);
          trenSuccess = true;
        }
      }
    } catch(e) {
      console.error("Gagal menggambar Area Chart dengan Google Charts:", e);
    }

    if (!trenSuccess) {
      renderHtmlFallbackChart(stats);
    }

    let demoSuccess = false;
    try {
      if (typeof google !== 'undefined' && google.visualization && google.visualization.PieChart) {
        // 2. DEMOGRAFI USIA DONUT CHART
        const perUsia = stats.perKelompokUsiaSurveilans || {};
        const usiaOrder = ["<1 tahun", "1–4 tahun", "5–9 tahun", "10–14 tahun", "15–19 tahun", "20–44 tahun", "45–59 tahun", "≥60 tahun", "Usia tidak diketahui"];
        const demoData = [['Usia', 'Jumlah kasus']];

        let hasUsiaData = false;
        usiaOrder.forEach(function(k) {
          const count = perUsia[k] || 0;
          if (count > 0) {
            demoData.push([k, count]);
            hasUsiaData = true;
          }
        });

        if (!hasUsiaData) {
          demoData.push(['Tidak ada data', 1]);
        }

        const dtDemo = google.visualization.arrayToDataTable(demoData);
        const optDemo = {
          title: '',
          pieHole: 0.5, // Donut style
          colors: ['#0f172a', '#1e3a8a', '#2563eb', '#38bdf8', '#0d9488', '#10b981', '#f59e0b', '#ef4444', '#94a3b8'], // Navy to Sky to Slate palette
          chartArea: { width: '90%', height: '80%', top: 10 },
          legend: { position: 'right', textStyle: { color: '#334155', fontSize: 11 } },
          fontName: 'Inter, system-ui, sans-serif'
        };

        const chartDemoEl = document.getElementById('chart-demografi-usia');
        if (chartDemoEl) {
          chartDemoEl.innerHTML = '';
          const chartDemo = new google.visualization.PieChart(chartDemoEl);

          // Reposition dynamic overlay to center of the donut hole
          google.visualization.events.addListener(chartDemo, 'ready', function() {
            const svg = chartDemoEl.querySelector('svg');
            if (!svg) return;
            const paths = svg.querySelectorAll('g path');
            if (paths && paths.length > 0) {
              let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
              try {
                paths.forEach(function(p) {
                  const bbox = p.getBBox();
                  if (bbox.width > 0 && bbox.height > 0) {
                    minX = Math.min(minX, bbox.x);
                    maxX = Math.max(maxX, bbox.x + bbox.width);
                    minY = Math.min(minY, bbox.y);
                    maxY = Math.max(maxY, bbox.y + bbox.height);
                  }
                });
              } catch (e) {
                console.warn("Failed to get SVG bounding box for demographic chart:", e);
              }

              if (isFinite(minX) && isFinite(maxX) && isFinite(minY) && isFinite(maxY)) {
                const centerX = minX + (maxX - minX) / 2;
                const centerY = minY + (maxY - minY) / 2;

                const overlay = document.getElementById('chart-demografi-usia-overlay');
                const totalVal = document.getElementById('chart-demografi-total-cases');
                if (totalVal) {
                  totalVal.textContent = Number(stats.totalKasus || 0);
                }
                if (overlay) {
                  overlay.style.left = centerX + 'px';
                  overlay.style.top = centerY + 'px';
                  overlay.classList.remove('hidden');
                }
              }
            }
          });

          chartDemo.draw(dtDemo, optDemo);
          demoSuccess = true;
        }
      }
    } catch(e) {
      console.error("Gagal menggambar Pie/Donut Chart dengan Google Charts:", e);
    }

    if (!demoSuccess) {
      renderHtmlFallbackDemografi(stats);
    }
  }

  // ============================================================
  // EXPORT CSV (Req 7.1–7.6)
  // ============================================================
  function handleExportCsv() {
    const dx = document.getElementById("form-selector")?.value ||
               document.getElementById("dashboard-dx")?.value || "MR";
    if (!dx) { showTopAlert("Pilih jenis penyakit terlebih dahulu.", false); return; }
    if (!safeGsRun() || !getSafeSessionToken()) return;

    const today = new Date().toISOString().split("T")[0].replace(/-/g, "");
    const filename = dx + "_export_" + today + ".csv";

    showTopAlert("Mengekspor data " + dx + "...", true);

    google.script.run
      .withSuccessHandler(function (csv) {
        if (!csv || (typeof csv === "object" && csv.status === "error")) {
          showTopAlert((csv && csv.message) || "Gagal export CSV.", false);
          return;
        }
        // Trigger download
        const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement("a");
        a.href     = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showTopAlert("Export berhasil: " + filename, true);
      })
      .withFailureHandler(function (err) {
        showTopAlert("Gagal export: " + String(err), false);
      })
      .exportToCsv(dx, {}, getSafeSessionToken());
  }

  // ============================================================
  // KONFIRMASI RESET / BATAL EDIT (Req 14.1–14.5)
  // ============================================================

  /**
   * Konfirmasi sebelum reset form.
   * Req 14.1: tampilkan konfirmasi jika form berisi data
   * Req 14.5: reset langsung jika form kosong
   */
  function confirmAndReset() {
    if (_formHasData_()) {
      const confirmed = window.confirm(
        "Semua data yang sudah diisi akan dihapus dan form akan direset.\nLanjutkan?"
      );
      if (!confirmed) return;
    }
    const dx = document.getElementById("form-selector")?.value || "";
    clearFormulirDraft(dx);
    resetForNewEntry();
  }

  // Req 14.4: peringatan browser saat navigasi keluar dengan form berisi data
  window.addEventListener("beforeunload", function (e) {
    if (_formHasData_()) {
      e.preventDefault();
      e.returnValue = "";
    }
  });

  // Override tombol "Batal Edit / Reset Formulir" agar pakai konfirmasi
  // GAS HtmlService: gunakan window.onload sebagai fallback DOMContentLoaded
  function _initDashboardOnLoad_() {
    initDashboard();

    const btnCancel = document.getElementById("btn-cancel-edit");
    if (btnCancel && !btnCancel.dataset.confirmBound) {
      btnCancel.dataset.confirmBound = "1";
      btnCancel.addEventListener("click", function (e) {
        e.preventDefault();
        confirmAndReset();
      });
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", _initDashboardOnLoad_);
  } else {
    // DOM sudah siap (GAS HtmlService sering inject script setelah DOM ready)
    _initDashboardOnLoad_();
  }

</script>
