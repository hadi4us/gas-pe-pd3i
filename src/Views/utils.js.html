<script>
  // ============================================================
  // UTILS.JS.HTML — FINAL (HARDENED)
  // ============================================================

  // ------------------------------------------------------------
  // GLOBAL CONSTANTS
  // ------------------------------------------------------------
  const GOOGLE_SCRIPT_URL = "https:" + "/" + "/script.google.com/macros/s/AKfycbxyOmbssdAKd3Fx7earmhO_tP9j51zivR4NvT5gb6bo4nWDydfV98uxzwHIJHEYDpYIDg/exec";
  const API_WILAYAH_BASE = "https:" + "/" + "/www.emsifa.com/api-wilayah-indonesia/api";

  const OPT_YA_TIDAK = ["Ya", "Tidak", "Tidak Tahu"];
  const OPT_JK = ["Laki-laki", "Perempuan"];

  const todayStr = new Date().toISOString().split("T")[0];

  const SESSION_STORAGE_KEY = "pd3i_session_token";
  const SESSION_USER_KEY = "pd3i_session_user";
  const IDLE_TIMEOUT_MS = 6 * 60 * 60 * 1000; // 6 jam

  // ------------------------------------------------------------
  // GLOBAL STATE
  // ------------------------------------------------------------
  let idleTimer = null;

  let SESSION_TOKEN = "";
  let SESSION_USER = null;

  let REF_IMUN = [];
  let MASTER_FASKES = [];
  let MASTER_WORKFLOW_FILTERS = { kecamatan: [], kelurahanByKecamatan: {}, statusKasus: [] };

  let choicesInstance = null;
  let rsChoicesInstance = null;
  let isEditMode = false;

  let loginCaptchaAnswer = null;
  let pinCaptchaAnswer = null;

  // ------------------------------------------------------------
  // BASIC HELPERS
  // ------------------------------------------------------------
  function safeGsRun() {
    return !!(window.google && google.script && google.script.run);
  }

  function byId(id) {
    return document.getElementById(id);
  }

  function escapeHtml(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(new RegExp("<", "g"), "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function nextTick(fn) {
    window.setTimeout(fn, 0);
  }


  function renderPd3iSpinner(label, spacingClass) {
    const gap = spacingClass || 'mr-2';
    const text = label == null ? '' : String(label);
    return '<i class="fas fa-spinner fa-spin '+escapeHtml(gap)+'" aria-hidden="true"></i>'+escapeHtml(text);
  }

  function setPd3iButtonLoading(btn, loading, label, fallbackHtml) {
    if (!btn) return;
    if (loading) {
      if (!btn.dataset.pd3iOriginalHtml) btn.dataset.pd3iOriginalHtml = btn.innerHTML;
      btn.disabled = true;
      btn.setAttribute('aria-busy', 'true');
      btn.classList.add('cursor-wait');
      btn.innerHTML = renderPd3iSpinner(label || 'Memproses...');
      return;
    }
    btn.disabled = false;
    btn.removeAttribute('aria-busy');
    btn.classList.remove('cursor-wait');
    if (fallbackHtml) {
      btn.innerHTML = fallbackHtml;
    } else if (btn.dataset.pd3iOriginalHtml) {
      btn.innerHTML = btn.dataset.pd3iOriginalHtml;
    }
    delete btn.dataset.pd3iOriginalHtml;
  }

  // ------------------------------------------------------------
  // MODAL HELPERS
  // ------------------------------------------------------------
  function openModal(el) {
    if (!el) return;
    el.classList.remove("hidden");
    el.classList.add("flex");
    document.body.classList.add("modal-open");
  }

  function closeModal(el) {
    if (!el) return;
    el.classList.add("hidden");
    el.classList.remove("flex");
    document.body.classList.remove("modal-open");
  }

  // ------------------------------------------------------------
  // ALERT HELPERS
  // ------------------------------------------------------------
  function setAlert(el, msg, ok) {
    if (!el) return;
    el.className = `pd3i-login-alert mt-5 p-3 text-sm font-bold border ${
      ok
        ? "is-success bg-green-50 text-green-800 border-green-200"
        : "is-error bg-red-50 text-red-800 border-red-200"
    }`;
    el.textContent = msg || "";
    el.classList.remove("hidden");
  }

  function hideAlert(el) {
    if (!el) return;
    el.classList.add("hidden");
    el.textContent = "";
  }

  function createPd3iModalFocusTrap(modalRoot, options) {
    const cfg = options || {};
    const previousFocus = document.activeElement && document.activeElement.focus ? document.activeElement : null;
    const selector = 'a[href], button:not([disabled]), textarea:not([disabled]), input:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])';
    const getFocusable = function() {
      return Array.prototype.slice.call((modalRoot || document).querySelectorAll(selector)).filter(function(el) {
        return !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length);
      });
    };
    const onKeydown = function(e) {
      if (e.key !== 'Tab') return;
      const focusable = getFocusable();
      if (!focusable.length) {
        e.preventDefault();
        if (modalRoot && modalRoot.focus) modalRoot.focus();
        return;
      }
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    };
    document.addEventListener('keydown', onKeydown);
    return function releasePd3iModalFocusTrap() {
      document.removeEventListener('keydown', onKeydown);
      if (cfg.restoreFocus !== false && previousFocus && document.contains(previousFocus)) {
        try { previousFocus.focus(); } catch (e) {}
      }
    };
  }

  function pd3iConfirmDialog(options) {
    const cfg = options || {};
    const title = escapeHtml(cfg.title || 'Konfirmasi tindakan');
    const message = cfg.htmlMessage ? String(cfg.htmlMessage) : escapeHtml(cfg.message || 'Lanjutkan tindakan ini?');
    const confirmLabel = escapeHtml(cfg.confirmLabel || 'Lanjutkan');
    const cancelLabel = escapeHtml(cfg.cancelLabel || 'Batal');
    const danger = cfg.variant === 'danger';
    return new Promise(function(resolve) {
      const existing = document.getElementById('pd3i-confirm-dialog');
      if (existing) existing.remove();
      const wrap = document.createElement('div');
      wrap.id = 'pd3i-confirm-dialog';
      wrap.className = 'pd3i-confirm-backdrop';
      wrap.setAttribute('role', 'presentation');
      wrap.innerHTML = `<div class="pd3i-confirm-card" role="dialog" aria-modal="true" aria-labelledby="pd3i-confirm-title" aria-describedby="pd3i-confirm-message" tabindex="-1">
        <div class="pd3i-confirm-title" id="pd3i-confirm-title">${title}</div>
        <div class="pd3i-confirm-message" id="pd3i-confirm-message">${message}</div>
        <div class="pd3i-confirm-actions">
          <button type="button" class="pd3i-confirm-btn is-secondary" data-pd3i-confirm="cancel">${cancelLabel}</button>
          <button type="button" class="pd3i-confirm-btn ${danger ? 'is-danger' : 'is-primary'}" data-pd3i-confirm="ok">${confirmLabel}</button>
        </div>
      </div>`;
      document.body.appendChild(wrap);
      const card = wrap.querySelector('.pd3i-confirm-card');
      const releaseFocusTrap = createPd3iModalFocusTrap(card);
      const cleanup = function(value) {
        let resolvedValue = value;
        if (value === true && typeof cfg.beforeClose === 'function') {
          try { resolvedValue = cfg.beforeClose(card); } catch (e) { resolvedValue = value; }
        }
        document.removeEventListener('keydown', onKeydown);
        releaseFocusTrap();
        wrap.remove();
        resolve(resolvedValue);
      };
      const onKeydown = function(e) {
        if (e.key === 'Escape') cleanup(false);
      };
      wrap.addEventListener('click', function(e) {
        if (e.target === wrap) cleanup(false);
        const action = e.target && e.target.getAttribute && e.target.getAttribute('data-pd3i-confirm');
        if (action === 'cancel') cleanup(false);
        if (action === 'ok') cleanup(true);
      });
      document.addEventListener('keydown', onKeydown);
      try { card.focus(); } catch (e) {}
    });
  }

  function pd3iPromptDialog(options) {
    const cfg = options || {};
    const title = escapeHtml(cfg.title || 'Isi keterangan');
    const message = escapeHtml(cfg.message || 'Masukkan keterangan untuk melanjutkan.');
    const confirmLabel = escapeHtml(cfg.confirmLabel || 'Simpan');
    const cancelLabel = escapeHtml(cfg.cancelLabel || 'Batal');
    const placeholder = escapeHtml(cfg.placeholder || 'Tulis keterangan...');
    const defaultValue = escapeHtml(cfg.defaultValue || '');
    const required = cfg.required !== false;
    const danger = cfg.variant === 'danger';
    return new Promise(function(resolve) {
      const existing = document.getElementById('pd3i-confirm-dialog');
      if (existing) existing.remove();
      const wrap = document.createElement('div');
      wrap.id = 'pd3i-confirm-dialog';
      wrap.className = 'pd3i-confirm-backdrop';
      wrap.setAttribute('role', 'presentation');
      wrap.innerHTML = `<div class="pd3i-confirm-card" role="dialog" aria-modal="true" aria-labelledby="pd3i-confirm-title" aria-describedby="pd3i-confirm-message" tabindex="-1">
        <div class="pd3i-confirm-title" id="pd3i-confirm-title">${title}</div>
        <div class="pd3i-confirm-message" id="pd3i-confirm-message">${message}</div>
        <label class="pd3i-prompt-label" for="pd3i-prompt-input">Keterangan</label>
        <textarea id="pd3i-prompt-input" class="pd3i-prompt-input" rows="3" placeholder="${placeholder}">${defaultValue}</textarea>
        <div class="pd3i-prompt-error" hidden>Keterangan wajib diisi.</div>
        <div class="pd3i-confirm-actions">
          <button type="button" class="pd3i-confirm-btn is-secondary" data-pd3i-confirm="cancel">${cancelLabel}</button>
          <button type="button" class="pd3i-confirm-btn ${danger ? 'is-danger' : 'is-primary'}" data-pd3i-confirm="ok">${confirmLabel}</button>
        </div>
      </div>`;
      document.body.appendChild(wrap);
      const card = wrap.querySelector('.pd3i-confirm-card');
      const input = wrap.querySelector('#pd3i-prompt-input');
      const error = wrap.querySelector('.pd3i-prompt-error');
      const releaseFocusTrap = createPd3iModalFocusTrap(card);
      const cleanup = function(value) {
        document.removeEventListener('keydown', onKeydown);
        releaseFocusTrap();
        wrap.remove();
        resolve(value);
      };
      const submit = function() {
        const value = String(input.value || '').trim();
        if (required && !value) {
          if (error) error.hidden = false;
          input.focus();
          return;
        }
        cleanup(value);
      };
      const onKeydown = function(e) {
        if (e.key === 'Escape') cleanup(null);
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') submit();
      };
      wrap.addEventListener('click', function(e) {
        if (e.target === wrap) cleanup(null);
        const action = e.target && e.target.getAttribute && e.target.getAttribute('data-pd3i-confirm');
        if (action === 'cancel') cleanup(null);
        if (action === 'ok') submit();
      });
      document.addEventListener('keydown', onKeydown);
      try { input.focus(); input.select(); } catch (e) { try { card.focus(); } catch (_) {} }
    });
  }

  if (typeof window !== 'undefined') {
    window.createPd3iModalFocusTrap = createPd3iModalFocusTrap;
    window.pd3iConfirmDialog = pd3iConfirmDialog;
    window.pd3iPromptDialog = pd3iPromptDialog;
  }

  function renderPd3iSkeleton(options) {
    const cfg = options || {};
    const rows = Math.max(1, Math.min(8, Number(cfg.rows || 3)));
    const variant = String(cfg.variant || 'table').trim().toLowerCase();
    const titleText = cfg.title || 'Memuat data…';
    const title = '<div class="pd3i-skeleton-head"><span class="pd3i-skeleton-spinner" aria-hidden="true"></span><span>'+escapeHtml(titleText)+'</span></div>';
    const hint = cfg.hint ? '<div class="pd3i-skeleton-hint">'+escapeHtml(cfg.hint)+'</div>' : '';
    let body = '';
    for (let i = 0; i < rows; i++) {
      body += '<div class="pd3i-skeleton-row"><span></span><span></span><span></span></div>';
    }
    return '<div class="pd3i-skeleton is-'+escapeHtml(variant)+'" role="status" aria-live="polite" aria-label="Memuat data">'+title+hint+'<div class="pd3i-skeleton-body">'+body+'</div></div>';
  }

  if (typeof window !== 'undefined') {
    window.renderPd3iSkeleton = renderPd3iSkeleton;
    window.renderPd3iSpinner = renderPd3iSpinner;
    window.setPd3iButtonLoading = setPd3iButtonLoading;
  }

  function renderPd3iUiState(options) {
    const cfg = options || {};
    const type = String(cfg.type || 'empty').toLowerCase();
    const title = escapeHtml(cfg.title || (type === 'loading' ? 'Memuat data…' : type === 'error' ? 'Data belum berhasil dimuat' : 'Belum ada data'));
    const message = escapeHtml(cfg.message || '');
    const iconMap = {
      loading: 'fa-spinner fa-spin',
      empty: 'fa-circle-info',
      error: 'fa-triangle-exclamation',
      success: 'fa-check-circle'
    };
    const actionHtml = cfg.actionLabel && cfg.actionAttr
      ? `<button type="button" class="pd3i-state-action" ${cfg.actionAttr}>${escapeHtml(cfg.actionLabel)}</button>`
      : '';
    return `<div class="pd3i-ui-state is-${escapeHtml(type)}" role="status" aria-live="polite">
      <div class="pd3i-ui-state-icon"><i class="fas ${iconMap[type] || iconMap.empty}"></i></div>
      <div class="pd3i-ui-state-body"><div class="pd3i-ui-state-title">${title}</div>${message ? `<div class="pd3i-ui-state-message">${message}</div>` : ''}${actionHtml}</div>
    </div>`;
  }

  function setPd3iUiState(target, options) {
    const el = typeof target === 'string' ? byId(target) : target;
    if (!el) return;
    el.innerHTML = renderPd3iUiState(options || {});
  }

  if (typeof window !== 'undefined') {
    window.renderPd3iUiState = renderPd3iUiState;
    window.setPd3iUiState = setPd3iUiState;
  }

  function showTopAlert(msg, ok) {
    const alertBox = byId("alert-box");
    if (!alertBox) return;

    const safeMsg = String(msg || "").trim();
    if (!safeMsg) {
      hideTopAlert();
      return;
    }

    alertBox.hidden = false;
    alertBox.className = `pd3i-alert-card ${
      ok ? "is-success" : "is-error"
    }`;

    alertBox.innerHTML = `<i class="fas ${
      ok ? "fa-check-circle" : "fa-exclamation-circle"
    } mr-2"></i> ${escapeHtml(safeMsg)}`;

    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function hideTopAlert() {
    const alertBox = byId("alert-box");
    if (!alertBox) return;
    alertBox.hidden = true;
    alertBox.className = "pd3i-alert-card";
    alertBox.innerHTML = "";
  }

  function showPd3iBanner(message, options) {
    const cfg = options || {};
    showTopAlert(message, cfg.type === 'success' || cfg.ok === true);
  }

  function showPd3iToast(message, options) {
    const cfg = options || {};
    const type = String(cfg.type || (cfg.ok === false ? 'error' : 'success')).toLowerCase();
    const stack = byId('pd3i-toast-stack');
    const safeMessage = String(message || '').trim();
    if (!safeMessage) return;
    if (!stack || !document || !document.createElement) {
      showTopAlert(safeMessage, type === 'success');
      return;
    }
    const toast = document.createElement('div');
    toast.className = 'pd3i-toast is-' + (['success','error','warning','info'].includes(type) ? type : 'info');
    toast.setAttribute('role', type === 'error' ? 'alert' : 'status');
    toast.innerHTML = '<div class="pd3i-toast-icon"><i class="fas '+(type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-triangle-exclamation' : type === 'warning' ? 'fa-circle-exclamation' : 'fa-circle-info')+'"></i></div><div class="pd3i-toast-message">'+escapeHtml(safeMessage)+'</div><button type="button" class="pd3i-toast-close" aria-label="Tutup notifikasi">&times;</button>';
    const close = function(){ toast.classList.add('is-hiding'); setTimeout(function(){ try { toast.remove(); } catch(e){} }, 180); };
    toast.querySelector('.pd3i-toast-close').addEventListener('click', close);
    stack.appendChild(toast);
    const ttl = Number(cfg.durationMs || (type === 'error' ? 7000 : 4200));
    if (ttl > 0) setTimeout(close, ttl);
  }

  if (typeof window !== 'undefined') {
    window.showPd3iBanner = showPd3iBanner;
    window.showPd3iToast = showPd3iToast;
  }

  // ------------------------------------------------------------
  // DATE / AGE HELPERS
  // ------------------------------------------------------------
  function parseDateSafe(value) {
    if (!value) return null;
    const d = new Date(value);
    return isNaN(d.getTime()) ? null : d;
  }

  function parseDateOnly(value) {
    if (!value) return null;
    const d = new Date(value);
    return isNaN(d.getTime()) ? null : d;
  }

  function diffAgeParts(birthDate, refDate) {
    if (!birthDate || !refDate) return null;

    let years = refDate.getFullYear() - birthDate.getFullYear();
    let months = refDate.getMonth() - birthDate.getMonth();
    let days = refDate.getDate() - birthDate.getDate();

    if (days < 0) {
      months--;
      days += new Date(refDate.getFullYear(), refDate.getMonth(), 0).getDate();
    }

    if (months < 0) {
      years--;
      months += 12;
    }

    return { years, months, days };
  }

  function agePartsAtDate(birthDate, refDate) {
    if (!birthDate || !refDate) return null;

    let years = refDate.getFullYear() - birthDate.getFullYear();
    let months = refDate.getMonth() - birthDate.getMonth();
    let days = refDate.getDate() - birthDate.getDate();

    if (days < 0) {
      months--;
      days += new Date(refDate.getFullYear(), refDate.getMonth(), 0).getDate();
    }

    if (months < 0) {
      years--;
      months += 12;
    }

    return { years, months, days };
  }

  function calculateAge(birthDateString) {
    if (!birthDateString) return "";
    const birthDate = parseDateSafe(birthDateString);
    if (!birthDate) return "";

    const today = new Date();
    const age = diffAgeParts(birthDate, today);
    if (!age) return "";

    return `${age.years < 0 ? 0 : age.years} tahun ${age.months} bulan ${age.days} hari`;
  }

  function ageInTotalMonths(ageParts) {
    if (!ageParts) return null;
    return (Number(ageParts.years || 0) * 12) + Number(ageParts.months || 0) + (Number(ageParts.days || 0) / 30);
  }

  function ageInMonths(ageParts) {
    if (!ageParts) return null;
    return (Number(ageParts.years || 0) * 12) + Number(ageParts.months || 0);
  }

  function compareMinAge(ageParts, rule) {
    if (!ageParts || !rule) return false;

    const totalDaysAge =
      (Number(ageParts.years || 0) * 365) +
      (Number(ageParts.months || 0) * 30) +
      Number(ageParts.days || 0);

    const totalDaysMin =
      (Number(rule.UmurMinTahun || 0) * 365) +
      (Number(rule.UmurMinBulan || 0) * 30) +
      Number(rule.UmurMinHari || 0);

    return totalDaysAge >= totalDaysMin;
  }

  function compareMaxAge(ageParts, rule) {
    if (!ageParts || !rule) return true;

    const maxDays =
      (Number(rule.UmurMaxTahun || 0) * 365) +
      (Number(rule.UmurMaxBulan || 0) * 30) +
      Number(rule.UmurMaxHari || 0);

    if (maxDays <= 0) return true;

    const ageDays =
      (Number(ageParts.years || 0) * 365) +
      (Number(ageParts.months || 0) * 30) +
      Number(ageParts.days || 0);

    return ageDays <= maxDays;
  }

  function normalizeSex(jk) {
    const v = String(jk || "").trim().toLowerCase();
    if (v === "perempuan" || v === "p") return "P";
    if (v === "laki-laki" || v === "l" || v === "lk") return "L";
    return "";
  }

  function normalizeClassValue(kelas) {
    const raw = String(kelas || "").trim().toUpperCase();
    if (!raw) return null;
    const m = raw.match(/\d+/);
    return m ? Number(m[0]) : null;
  }

  function estimateSchoolAgeFromClass(kelas) {
    const k = normalizeClassValue(kelas);
    if (k === null) return null;

    return {
      minYears: k + 5,
      maxYears: k + 6
    };
  }

  function buildAgePartsFromEstimatedYears(years) {
    if (years === null || years === undefined || isNaN(years)) return null;
    return {
      years: Number(years),
      months: 0,
      days: 0
    };
  }

  function checkIntroduksiEligibility(rule, birthDate) {
    const introDate = parseDateOnly(rule && rule.Introduksi);
    const maxIntroMonths = Number((rule && rule.UmurMaxIntroduksi) || 0);

    if (!introDate || !birthDate || !maxIntroMonths || maxIntroMonths <= 0) {
      return { applies: false, eligible: true };
    }

    const ageAtIntroduksi = agePartsAtDate(birthDate, introDate);
    const monthsAtIntroduksi = ageInMonths(ageAtIntroduksi);

    if (monthsAtIntroduksi === null) {
      return { applies: false, eligible: true };
    }

    return {
      applies: true,
      eligible: monthsAtIntroduksi <= maxIntroMonths,
      monthsAtIntroduksi: monthsAtIntroduksi
    };
  }

  // ------------------------------------------------------------
  // CAPTCHA HELPERS
  // ------------------------------------------------------------
  function setCaptchaQuestion(elementId, questionText) {
    const el = byId(elementId);
    if (!el) {
      console.warn("Captcha element not found:", elementId);
      return false;
    }
    el.textContent = questionText || "...";
    return true;
  }

  function resetCaptchaError(errorId) {
    const errEl = byId(errorId);
    if (!errEl) return;
    errEl.classList.add("hidden");
    errEl.textContent = "";
  }

  function showCaptchaError(errorId, message) {
    const errEl = byId(errorId);
    if (!errEl) return;
    errEl.textContent = message || "Captcha salah";
    errEl.classList.remove("hidden");
  }

  function resetCaptchaInput(inputId) {
    const inputEl = byId(inputId);
    if (inputEl) inputEl.value = "";
  }

  function makeLocalCaptcha(scope) {
    const a = Math.floor(Math.random() * 9) + 1;
    const b = Math.floor(Math.random() * 9) + 1;
    const op = Math.random() < 0.5 ? "+" : "×";
    const answer = op === "+" ? (a + b) : (a * b);
    const question = `${a} ${op} ${b} = ?`;

    if (scope === "login") {
      loginCaptchaAnswer = answer;

      const ok = setCaptchaQuestion("captcha-question", question);
      resetCaptchaError("captcha-error");
      resetCaptchaInput("login-captcha-answer");

      if (!ok) {
        nextTick(() => {
          setCaptchaQuestion("captcha-question", question);
        });
      }
      return;
    }

    if (scope === "pin") {
      pinCaptchaAnswer = answer;

      const ok = setCaptchaQuestion("pin-captcha-question", question);
      resetCaptchaError("pin-captcha-error");
      resetCaptchaInput("pin-captcha-answer");

      if (!ok) {
        nextTick(() => {
          setCaptchaQuestion("pin-captcha-question", question);
        });
      }
    }
  }

  function forceRenderLoginCaptcha(retryCount) {
    const maxRetry = typeof retryCount === "number" ? retryCount : 0;
    const qEl = byId("captcha-question");

    if (qEl) {
      makeLocalCaptcha("login");
      return;
    }

    if (maxRetry < 10) {
      window.setTimeout(function () {
        forceRenderLoginCaptcha(maxRetry + 1);
      }, 80);
    } else {
      console.error("captcha-question tidak ditemukan setelah beberapa percobaan");
      const errEl = byId("captcha-error");
      if (errEl) {
        errEl.textContent = "Captcha gagal dimuat";
        errEl.classList.remove("hidden");
      }
    }
  }

  function forceRenderPinCaptcha(retryCount) {
    const maxRetry = typeof retryCount === "number" ? retryCount : 0;
    const qEl = byId("pin-captcha-question");

    if (qEl) {
      makeLocalCaptcha("pin");
      return;
    }

    if (maxRetry < 10) {
      window.setTimeout(function () {
        forceRenderPinCaptcha(maxRetry + 1);
      }, 80);
    }
  }

  // ------------------------------------------------------------
  // SESSION STORAGE HELPERS
  // ------------------------------------------------------------
  function getBrowserSessionStore() {
    try {
      if (window && window.localStorage) return window.localStorage;
    } catch (e) {}
    try {
      if (window && window.sessionStorage) return window.sessionStorage;
    } catch (e) {}
    return null;
  }

  function saveSessionToBrowser(token, user) {
    try {
      const store = getBrowserSessionStore();
      if (!store) return;
      store.setItem(SESSION_STORAGE_KEY, token || "");
      store.setItem(SESSION_USER_KEY, JSON.stringify(user || null));
    } catch (e) {
      console.warn("Gagal simpan session browser:", e);
    }
  }

  function getSessionTokenFromBrowser() {
    try {
      let token = "";
      if (window && window.localStorage) token = window.localStorage.getItem(SESSION_STORAGE_KEY) || "";
      if (!token && window && window.sessionStorage) token = window.sessionStorage.getItem(SESSION_STORAGE_KEY) || "";
      return token;
    } catch (e) {
      return "";
    }
  }

  function getSessionUserFromBrowser() {
    try {
      let raw = "";
      if (window && window.localStorage) raw = window.localStorage.getItem(SESSION_USER_KEY) || "";
      if (!raw && window && window.sessionStorage) raw = window.sessionStorage.getItem(SESSION_USER_KEY) || "";
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function clearSessionFromBrowser() {
    try {
      try {
        if (window && window.localStorage) {
          window.localStorage.removeItem(SESSION_STORAGE_KEY);
          window.localStorage.removeItem(SESSION_USER_KEY);
        }
      } catch (e) {}
      try {
        if (window && window.sessionStorage) {
          window.sessionStorage.removeItem(SESSION_STORAGE_KEY);
          window.sessionStorage.removeItem(SESSION_USER_KEY);
        }
      } catch (e) {}
    } catch (e) {}
  }

  function diffAgeDetailed(birthDate, refDate) {
    if (!birthDate || !refDate) return null;

    const msPerDay = 24 * 60 * 60 * 1000;
    const start = new Date(birthDate.getFullYear(), birthDate.getMonth(), birthDate.getDate());
    const end = new Date(refDate.getFullYear(), refDate.getMonth(), refDate.getDate());

    let years = end.getFullYear() - start.getFullYear();
    let months = end.getMonth() - start.getMonth();
    let days = end.getDate() - start.getDate();

    if (days < 0) {
      months--;
      days += new Date(end.getFullYear(), end.getMonth(), 0).getDate();
    }
    if (months < 0) {
      years--;
      months += 12;
    }

    const totalDays = Math.floor((end - start) / msPerDay);
    const totalMonths = years * 12 + months;

    return { years, months, days, totalDays, totalMonths };
  }

  function formatAgeDetailed(age) {
    if (!age) return "";
    return `${age.years} tahun ${age.months} bulan ${age.days} hari`;
  }

  function classifyEpiAge(age) {
    if (!age) return "";

    const d = Number(age.totalDays || 0);
    const m = Number(age.totalMonths || 0);
    const y = Number(age.years || 0);

    if (d <= 6) return "Neonatus dini";
    if (d <= 28) return "Neonatus";
    if (m < 12) return "Bayi";
    if (m < 60) return "Balita";
    if (y < 7) return "Prasekolah";
    if (y <= 12) return "Usia sekolah";
    if (y <= 18) return "Remaja";
    if (y <= 59) return "Dewasa";
    return "Lansia";
  }

  function validateBirthDateEpi(birthDateValue, refDateValue) {
    if (!birthDateValue) {
      return { ok: false, message: "Tanggal lahir wajib diisi." };
    }

    const birthDate = parseDateSafe(birthDateValue);
    if (!birthDate) {
      return { ok: false, message: "Format tanggal lahir tidak valid." };
    }

    const refDate = refDateValue ? parseDateSafe(refDateValue) : new Date();
    if (!refDate) {
      return { ok: false, message: "Tanggal pelacakan tidak valid." };
    }

    const birth = new Date(birthDate.getFullYear(), birthDate.getMonth(), birthDate.getDate());
    const ref = new Date(refDate.getFullYear(), refDate.getMonth(), refDate.getDate());

    if (birth > ref) {
      return { ok: false, message: "Tanggal lahir tidak boleh melebihi tanggal pelacakan/hari ini." };
    }

    const age = diffAgeDetailed(birth, ref);
    if (!age) {
      return { ok: false, message: "Umur tidak dapat dihitung." };
    }

    if (age.years > 120) {
      return { ok: false, message: "Umur lebih dari 120 tahun. Periksa kembali tanggal lahir." };
    }

    if (age.totalDays < 0) {
      return { ok: false, message: "Tanggal lahir tidak valid." };
    }

    return {
      ok: true,
      birthDate: birth,
      refDate: ref,
      age,
      ageText: formatAgeDetailed(age),
      epiGroup: classifyEpiAge(age)
    };
  }

  // ------------------------------------------------------------
  // IDLE TIMER HELPERS
  // ------------------------------------------------------------
  function stopIdleTimer() {
    if (idleTimer) {
      clearTimeout(idleTimer);
      idleTimer = null;
    }
  }

  function startIdleTimer(onTimeout) {
    stopIdleTimer();
    idleTimer = setTimeout(() => {
      if (typeof onTimeout === "function") onTimeout();
    }, IDLE_TIMEOUT_MS);
  }

  function bindIdleEvents(onActivity) {
    const events = ["mousemove", "mousedown", "keydown", "scroll", "touchstart", "click"];
    events.forEach(evt => {
      document.addEventListener(evt, onActivity, { passive: true });
    });
  }

  function ensureCaptchaVisible() {
    const el = document.getElementById("captcha-question");
    if (!el || el.textContent === "..." || el.textContent.trim() === "") {
      makeLocalCaptcha("login");
    }
  }

  setTimeout(ensureCaptchaVisible, 300);
</script>
