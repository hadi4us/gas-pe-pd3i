  <section id="section-dashboard" class="pd3i-dashboard-section hidden mt-6">
    <div class="pd3i-shell-card pd3i-dashboard-shell">
      <div class="pd3i-card-header-row pd3i-dashboard-header mb-4">
        <div>
          <div class="pd3i-card-eyebrow">Dasbor statistik</div>
          <h2 class="pd3i-card-title flex items-center gap-2">
            <i class="fas fa-chart-bar text-emerald-600"></i> Dasbor Statistik Kasus
          </h2>
          <div class="pd3i-helper-text mt-2 pd3i-dashboard-hero-copy">Pantau capaian kinerja petugas dan admin, mutu data, distribusi wilayah, dan titik konsentrasi kasus dalam satu halaman analitik.</div>
        </div>
        <button type="button" id="btn-dashboard-back-to-workspace" class="pd3i-ghost-button pd3i-inline-button">
          <i class="fas fa-arrow-up"></i> Kembali ke beranda
        </button>
      </div>
      <div class="pd3i-dashboard-toolbar-panel mb-5">
        <div class="pd3i-dashboard-toolbar-head">
          <div>
            <div class="pd3i-card-eyebrow">Filter analitik</div>

          </div>
          <span class="pd3i-badge-soft">Halaman analitik</span>
        </div>
        <div class="pd3i-dashboard-toolbar">
          <select id="dashboard-dx" class="pd3i-shell-select pd3i-dashboard-filter">
            <option value="MR">Campak/Rubella (MR)</option>
            <option value="DIF">Difteri (DIF)</option>
            <option value="PERT">Pertusis (PERT)</option>
            <option value="TN">Tetanus Neonatorum (TN)</option>

          <button type="button" id="btn-load-dashboard" class="pd3i-primary-button pd3i-dashboard-load">

        </div>

      <div id="dashboard-content" class="pd3i-dashboard-content"><div class="pd3i-dashboard-state">Pilih DX dan tahun, lalu klik "Muat Data".</div></div>
    </div>
