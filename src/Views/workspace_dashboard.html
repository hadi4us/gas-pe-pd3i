  <section id="section-dashboard" class="pd3i-workspace-section pd3i-dashboard-section pd3i-dashboard-light-room hidden mt-6" data-workspace="dashboard">
    <div class="pd3i-shell-card pd3i-dashboard-shell">
      <!-- Header / Title -->
      <div class="pd3i-page-header pd3i-card-header-row pd3i-dashboard-header mb-4">
        <div>
          <div id="dashboard-scope-eyebrow" class="pd3i-card-eyebrow" hidden aria-hidden="true">Dashboard statistik</div>
          <h2 class="pd3i-card-title flex items-center gap-2">
            <i class="fas fa-chart-line pd3i-icon-primary"></i> <span id="dashboard-scope-title">Analisis surveilans PD3I</span>
          </h2>
        </div>
        <button type="button" id="btn-dashboard-back-to-workspace" class="pd3i-ghost-button pd3i-inline-button">
          <i class="fas fa-arrow-up"></i> Kembali ke beranda
        </button>
      </div>

      <!-- Toolbar / Filters -->
      <div class="pd3i-dashboard-toolbar-panel mb-5">
        <div class="pd3i-page-header pd3i-dashboard-toolbar-head">
          <div>
            <div class="pd3i-card-eyebrow">Filter surveilans</div>
            <div class="pd3i-dashboard-toolbar-title">Diagnosis dan tahun analisis</div>
          </div>
        </div>
        <div class="pd3i-dashboard-toolbar">
          <div class="pd3i-dashboard-field">
            <label for="dashboard-dx" class="pd3i-dashboard-field-label">Diagnosis</label>
            <select id="dashboard-dx" class="pd3i-shell-select pd3i-dashboard-filter">
              <option value="MR">Campak/Rubella (MR)</option>
              <option value="DIF">Difteri (DIF)</option>
              <option value="PERT">Pertusis (PERT)</option>
              <option value="TN">Tetanus Neonatorum (TN)</option>
              <option value="AFP">AFP</option>
            </select>
          </div>
          <div class="pd3i-dashboard-field pd3i-dashboard-field-year">
            <label for="dashboard-tahun" class="pd3i-dashboard-field-label">Tahun</label>
            <select id="dashboard-tahun" class="pd3i-shell-select pd3i-dashboard-filter pd3i-dashboard-filter-year"></select>
          </div>
          <div class="pd3i-dashboard-action-field">
            <button type="button" id="btn-load-dashboard" class="pd3i-primary-button pd3i-dashboard-load">
              <i class="fas fa-sync mr-1"></i> Muat data
            </button>
          </div>
        </div>
      </div>

      <!-- Dashboard Main Content Container -->
      <div id="dashboard-content" class="pd3i-dashboard-content">
        <div class="pd3i-dashboard-state">Pilih diagnosis dan tahun, lalu klik "Muat data".</div>
      </div>
    </div>
  </section>
