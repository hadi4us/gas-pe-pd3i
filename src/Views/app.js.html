  function buildClientPrintUrl(dx, epid, token, recordKey) {
    try {
      const safeDx = String(dx || "").trim().toUpperCase();
      const safeEpid = String(epid || "").trim();
      const safeRecordKey = String(recordKey || "").trim();
      const safeToken = String(token || "").trim();
      if (!safeDx || (!safeEpid && !safeRecordKey) || !safeToken) return "";

      const boot = (typeof getRouteBootConfig === "function") ? getRouteBootConfig() : null;
      const baseUrl = String((boot && boot.appUrl) || (document.body && document.body.dataset && document.body.dataset.appUrl) || window.location.href || "").trim();
      const url = new URL(baseUrl, window.location.href);
      url.search = "";
      url.hash = "";
      url.searchParams.set("action", "print");
      url.searchParams.set("dx", safeDx);
      if (safeEpid) url.searchParams.set("epid", safeEpid);
      if (safeRecordKey) url.searchParams.set("recordKey", safeRecordKey);
      url.searchParams.set("token", safeToken);
      return url.toString();
    } catch (e) {
      return "";
    }
  }

  function downloadPePdf_(dx, epid, button, recordKey) {
    if (!window.google || !google.script || !google.script.run) {
      alert('Fitur export PDF hanya tersedia dari aplikasi utama.');
      return;
    }
    const original = button ? button.innerHTML : '';
    if (button) { button.disabled = true; button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyiapkan PDF...'; }
    google.script.run
      .withSuccessHandler(function(result) {
        try {
          if (result && result.driveUrl) {
            const anchor = document.createElement('a');
            anchor.href = result.driveUrl;
            anchor.target = '_blank';
            anchor.rel = 'noopener noreferrer';
            anchor.textContent = 'Buka PDF di Google Drive';
            anchor.className = 'pd3i-drive-pdf-link';
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            if (button) { button.disabled = false; button.innerHTML = original; }
            return;
          }
          const binary = atob(String(result && result.base64 || ''));
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          const blobUrl = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
          const anchor = document.createElement('a');
          anchor.href = blobUrl;
          anchor.download = String(result.name || ('Dokumen_PE_' + epid + '.pdf'));
          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
          setTimeout(function() { URL.revokeObjectURL(blobUrl); }, 1500);
        } catch (err) {
          alert('File PDF gagal diproses di browser.');
        }
        if (button) { button.disabled = false; button.innerHTML = original; }
      })
      .withFailureHandler(function(err) {
        alert((err && err.message) || 'Gagal membuat file PDF. Silakan buka ulang dari aplikasi.');
        if (button) { button.disabled = false; button.innerHTML = original; }
      })
      .exportPdfDocument(dx, epid, SESSION_TOKEN, recordKey);
  }
  window.downloadPePdf_ = downloadPePdf_;

  function showSuccessModal(message, printUrl, fallbackMeta) {
    const modal = document.getElementById("success-modal");
    const msg = document.getElementById("success-modal-message");
    const btnPrint = document.getElementById("btn-print-pdf");
    const btnNew = document.getElementById("btn-new-entry");
    const btnClose = document.getElementById("btn-close-success");

    if (msg) msg.textContent = message || "Data berhasil disimpan.";

    if (btnPrint) {
      let safeUrl = String(printUrl || "").trim();
      const resolvedDx = String((fallbackMeta && fallbackMeta.dx) || document.getElementById("form-selector")?.value || "").trim();
      const resolvedEpid = String((fallbackMeta && fallbackMeta.epid) || document.getElementById("Nomor EPID")?.value || "").trim();
      const resolvedToken = String((fallbackMeta && fallbackMeta.token) || SESSION_TOKEN || "").trim();
      if (!safeUrl) {
        safeUrl = buildClientPrintUrl(resolvedDx, resolvedEpid, resolvedToken);
      }
      btnPrint.href = safeUrl || "javascript:void(0)";
      btnPrint.target = "_blank";
      btnPrint.rel = "noopener noreferrer";

      if (!safeUrl) {
        btnPrint.classList.add("hidden", "opacity-60", "pointer-events-none");
        btnPrint.setAttribute("aria-disabled", "true");
      } else {
        btnPrint.classList.remove("hidden", "opacity-60", "pointer-events-none");
        btnPrint.removeAttribute("aria-disabled");
      }

      if (!btnPrint.dataset.bound) {
        btnPrint.dataset.bound = "1";
        btnPrint.addEventListener("click", function(ev) {
          const href = String(btnPrint.getAttribute("href") || "").trim();
          if (!href || href === "javascript:void(0)") {
            ev.preventDefault();
          }
        });
      }
    }

    if (btnNew && !btnNew.dataset.bound) {
      btnNew.dataset.bound = "1";
      btnNew.addEventListener("click", function(ev) {
        ev.preventDefault();
        resetForNewEntry();
      });
    }

    if (btnClose && !btnClose.dataset.bound) {
      btnClose.dataset.bound = "1";
      btnClose.addEventListener("click", function(ev) {
        ev.preventDefault();
        closeModal(modal);
      });
    }

    openModal(modal);
  }

  async function postJsonToWebApp(url, payload) {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
      redirect: "follow"
    });

    const raw = await res.text();
    try {
      return JSON.parse(raw);
    } catch (e) {
      console.error("Raw response (not JSON):", raw);
      throw new Error("Server tidak mengembalikan JSON dari /exec.");
    }
  }

  const WORKFLOW_SAVE_TIMEOUT_MS = 45000;

  function withWorkflowSaveTimeout(promise, label) {
    return new Promise((resolve, reject) => {
      let done = false;
      const timer = window.setTimeout(function() {
        if (done) return;
        done = true;
        reject(new Error((label || 'Penyimpanan') + ' terlalu lama merespons. Silakan cek koneksi lalu coba lagi.'));
      }, WORKFLOW_SAVE_TIMEOUT_MS);

      Promise.resolve(promise).then(function(value) {
        if (done) return;
        done = true;
        window.clearTimeout(timer);
        resolve(value);
      }).catch(function(err) {
        if (done) return;
        done = true;
        window.clearTimeout(timer);
        reject(err);
      });
    });
  }

  function getWorkflowSaveActionForMode(submitMode) {
    const payload = arguments[1] || {};
    const mode = normalizeSidebarWorkspace(submitMode || 'search');
    const actions = {
      input: 'createInitialCase',
      edit: 'saveInitialReportEdit',
      verifikasi: 'saveVerificationDecision',
      sampel: 'saveSampleResult',
      status: 'saveCaseStatusUpdate',
      search: 'saveInitialReportEdit'
    };
    if (mode === 'edit' && ((payload && payload.__approvalRequest) || window.__PD3I_APPROVAL_REQUEST_MODE__)) return 'requestInitialReportEdit';
    return actions[mode] || 'saveFormData';
  }

  function saveFormViaGsRun(payload) {
    return new Promise((resolve, reject) => {
      if (!safeGsRun()) {
        reject(new Error("google.script.run tidak tersedia"));
        return;
      }

      const action = getWorkflowSaveActionForMode(payload && payload.__submitMode, payload);
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject);
      if (action === 'createInitialCase') return runner.createInitialCase(SESSION_TOKEN, payload);
      if (action === 'requestInitialReportEdit') return runner.requestInitialReportEdit(SESSION_TOKEN, payload);
      if (action === 'saveInitialReportEdit') return runner.saveInitialReportEdit(SESSION_TOKEN, payload);
      if (action === 'saveVerificationDecision') return runner.saveVerificationDecision(SESSION_TOKEN, payload);
      if (action === 'saveSampleResult') return runner.saveSampleResult(SESSION_TOKEN, payload);
      if (action === 'saveCaseStatusUpdate') return runner.saveCaseStatusUpdate(SESSION_TOKEN, payload);
      return runner.saveFormData(payload);
    });
  }

  function resolveLatestSavedMetaViaGsRun(payload) {
    return new Promise((resolve, reject) => {
      if (!safeGsRun()) {
        reject(new Error("google.script.run tidak tersedia"));
        return;
      }

      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .resolveLatestSavedMeta(payload);
    });
  }
