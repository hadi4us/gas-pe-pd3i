<script>
  // ============================================================
  // APP.JS.HTML — runtime
  // ============================================================

  window.rsChoicesInstance = window.rsChoicesInstance || null;
  window.__PD3I_QUEUE_PAGE_STATE__ = window.__PD3I_QUEUE_PAGE_STATE__ || {};
  window.__PD3I_WORKFLOW_LIST_COLLAPSED__ = window.__PD3I_WORKFLOW_LIST_COLLAPSED__ || {};
  const SEARCH_RESULTS_PAGE_SIZE = 10;

  // Sidebar navigation must stay functional even if optional workspace initialization fails.
  document.addEventListener('click', function(evt) {
    if (window.__PD3I_INIT_NAV_BOUND) return;
    const link = evt.target && evt.target.closest && evt.target.closest('[data-sidebar-workspace]');
    if (!link || link.hidden || link.classList.contains('hidden')) return;
    const workspace = String(link.getAttribute('data-sidebar-workspace') || '').trim();
    if (!workspace || typeof openSidebarWorkspace !== 'function') return;
    evt.preventDefault();
    const pieTab = String(link.getAttribute('data-pie-tab') || '').trim();
    const settingsTab = String(link.getAttribute('data-settings-tab') || '').trim();
    if (pieTab) window.__PIE_ACTIVE_TAB = pieTab;
    if (settingsTab) window.__SETTINGS_ACTIVE_TAB = settingsTab;
    window.__ACTIVE_APPROVAL_MENU = String(link.getAttribute('data-approval-menu') || '').trim();
    openSidebarWorkspace(workspace, { autoLoad: workspace === 'dashboard', useRoute: true });
  }, true);

  window.htmlEscape = window.htmlEscape || function(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/\"/g, "&quot;")
      .replace(/'/g, "&#39;");
  };

  // ============================================================
  // RENDER FIELD
  // ============================================================
  function _getNumericFieldHintById(fieldId) {
    const id = String(fieldId || "").trim().toLowerCase();
    if (!id) return "";

    if (id === "nik" || id === "nik pasien") return "Harus 16 digit angka.";
    if (id === "rt" || id === "rw") return "Hanya angka. Otomatis format 3 digit (contoh: 001).";

    const phoneKeys = [
      "no whatsapp petugas",
      "no. kontak orang tua/wali",
      "no telp/wa orang tua/wali",
      "no telp orang tua/wali",
      "no. telp orang tua/wali",
      "no. kontak pasien",
      "no. telepon wali",
      "no. telp dokter afp"
    ];
    if (phoneKeys.includes(id)) {
      return "Hanya angka, 10–15 digit, awalan 08/62. Saat keluar field, 08 akan otomatis jadi 62.";
    }

    return "";
  }

  function _getNeutralFieldName_(fieldId) {
    const str = String(fieldId || "");
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      hash = ((hash << 5) - hash) + str.charCodeAt(i);
      hash |= 0;
    }
    return `pd3i_f_${Math.abs(hash)}`;
  }

  function _getSemanticFieldKey_(el) {
    if (!el) return "";
    return String((el.dataset && el.dataset.fieldId) || el.id || el.name || "").trim();
  }

  const ADDRESS_LIKE_FIELD_IDS = new Set([
    'Alamat', 'RT', 'RW', 'Provinsi Pasien', 'Kab/Kota Pasien', 'Kecamatan', 'Kelurahan',
    'Nama sekolah/tempat bekerja', 'Nama unit pelapor', 'Nama Rumah Sakit',
    'Latitude', 'Longitude', 'Koordinat (lat,lon)'
  ]);
  const PERSON_OR_CONTACT_FIELD_IDS = new Set([
    'Nama Pasien', 'Nama Orang Tua/Wali', 'Nama orang tua/wali', 'Nama Ayah', 'Nama Ibu',
    'Email Petugas', 'No Whatsapp Petugas', 'No. Kontak Orang Tua/Wali', 'No Telp/WA Orang Tua/Wali'
  ]);

  function isAddressLikeFieldId(fieldId) {
    return ADDRESS_LIKE_FIELD_IDS.has(String(fieldId || '').trim());
  }

  function isBrowserAutofillRiskFieldId(fieldId) {
    const key = String(fieldId || '').trim();
    return isAddressLikeFieldId(key) || PERSON_OR_CONTACT_FIELD_IDS.has(key) || /alamat|email|kontak|whatsapp|telepon|telp|nama pasien|orang tua|wali/i.test(key);
  }

  function syncChoiceButtons(inputEl) {
    if (!inputEl) return;
    const group = inputEl.closest('.pd3i-choice-group');
    if (!group) return;
    const currentValue = String(inputEl.value || '').trim();
    group.classList.toggle('is-invalid', Boolean(inputEl.required && !currentValue));
    group.querySelectorAll('.pd3i-choice-btn').forEach(function(btn) {
      const isActive = String(btn.getAttribute('data-choice-value') || '').trim() === currentValue;
      btn.classList.toggle('is-active', isActive);
      btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
    });
  }

  function getFormScopeForElement(el) {
    if (!el || !el.closest) return document;
    return el.closest('#dynamic-form, #dynamic-form-input, #dynamic-form-verifikasi, #dynamic-form-sampel, #dynamic-form-status') || document;
  }

  function findScopedFieldControl(fieldId, scope) {
    const targetId = String(fieldId || '').trim();
    if (!targetId) return null;
    const root = scope && scope.querySelectorAll ? scope : document;
    const controls = root.querySelectorAll('input, select, textarea');
    for (let i = 0; i < controls.length; i++) {
      const el = controls[i];
      const semanticId = String((el.dataset && el.dataset.fieldId) || el.id || '').trim();
      if (semanticId === targetId) return el;
    }
    return null;
  }

  window.__pd3iSelectChoice = function(fieldId, value, scope) {
    const inputEl = findScopedFieldControl(fieldId, scope);
    if (!inputEl || inputEl.disabled) return;
    inputEl.value = String(value || '').trim();
    syncChoiceButtons(inputEl);
    inputEl.dispatchEvent(new Event('change', { bubbles: true }));
  };

  if (!window.__PD3I_CHOICE_BUTTONS_BOUND__) {
    window.__PD3I_CHOICE_BUTTONS_BOUND__ = true;
    document.addEventListener('click', function(evt) {
      const btn = evt.target && evt.target.closest ? evt.target.closest('.pd3i-choice-btn[data-field-id]') : null;
      if (!btn) return;
      const fieldId = String(btn.getAttribute('data-field-id') || '').trim();
      const value = String(btn.getAttribute('data-choice-value') || '').trim();
      if (!fieldId) return;
      window.__pd3iSelectChoice(fieldId, value, getFormScopeForElement(btn));
    });
  }

  function pd3iFormatDateYmd_(value) {
    const raw = String(value == null ? '' : value).trim();
    if (!raw) return '';
    const m = raw.match(/^(\\d{4})[-\\/](\\d{1,2})[-\\/](\\d{1,2})/);
    if (m) return m[1] + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[3]).padStart(2, '0');
    const dmy = raw.match(/^(\\d{1,2})[-\\/](\\d{1,2})[-\\/](\\d{4})$/);
    if (dmy) return dmy[3] + '-' + String(dmy[2]).padStart(2, '0') + '-' + String(dmy[1]).padStart(2, '0');
    return '';
  }

  function pd3iSyncDatePickerValue_(inputEl, value) {
    if (!inputEl) return '';
    const formatted = pd3iFormatDateYmd_(value) || (value instanceof Date ? value.getFullYear() + '-' + String(value.getMonth() + 1).padStart(2, '0') + '-' + String(value.getDate()).padStart(2, '0') : '');
    if (!formatted) return String(inputEl.value || '').trim();
    const changed = String(inputEl.value || '').trim() !== formatted;
    inputEl.value = formatted;
    inputEl.dataset.pd3iDateValue = formatted;
    inputEl.dataset.pd3iLastDateValue = formatted;
    if (changed) {
      inputEl.dispatchEvent(new Event('input', { bubbles: true }));
      inputEl.dispatchEvent(new Event('change', { bubbles: true }));
    }
    inputEl.dispatchEvent(new CustomEvent('changeDate', { bubbles: true, detail: { value: formatted, field: inputEl.id || inputEl.dataset.fieldId || '' } }));
    if (typeof inputEl.onSelect === 'function') inputEl.onSelect(formatted);
    return formatted;
  }

  function pd3iBindDatePickerTarget_(picker, inputEl) {
    if (!picker || !inputEl) return;
    picker.__pd3iDateTarget = inputEl;
    picker.onSelect = function(value) { pd3iSyncDatePickerValue_(inputEl, value); };
    picker.changeDate = picker.onSelect;
  }

  function pd3iOpenDatePicker_(inputEl) {
    if (!inputEl || inputEl.disabled || inputEl.readOnly) return;
    let modal = document.getElementById('pd3i-date-picker-modal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'pd3i-date-picker-modal';
      modal.className = 'pd3i-date-picker-modal hidden';
      modal.innerHTML = '<div class="pd3i-date-picker-card"><div class="pd3i-date-picker-head"><button type="button" data-pd3i-date-prev aria-label="Bulan sebelumnya">‹</button><strong data-pd3i-date-title></strong><button type="button" data-pd3i-date-next aria-label="Bulan berikutnya">›</button></div><div class="pd3i-date-picker-days"><span>Min</span><span>Sen</span><span>Sel</span><span>Rab</span><span>Kam</span><span>Jum</span><span>Sab</span></div><div class="pd3i-date-picker-grid" data-pd3i-date-grid></div><div class="pd3i-date-picker-foot"><button type="button" data-pd3i-date-today>Hari ini</button><button type="button" data-pd3i-date-close>Tutup</button></div></div>';
      document.body.appendChild(modal);
    }
    const wrap = inputEl.closest('.pd3i-date-control-wrap') || inputEl.parentElement || document.body;
    if (modal.parentElement !== wrap) wrap.appendChild(modal);
    const title = modal.querySelector('[data-pd3i-date-title]');
    const grid = modal.querySelector('[data-pd3i-date-grid]');
    const current = /^\d{4}-\d{2}-\d{2}$/.test(inputEl.value || '') ? new Date(inputEl.value + 'T00:00:00') : new Date();
    let year = current.getFullYear();
    let month = current.getMonth();
    function setValue(d) {
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      pd3iSyncDatePickerValue_(inputEl, yyyy + '-' + mm + '-' + dd);
      setTimeout(function() { if (!inputEl.value && inputEl.dataset.pd3iLastDateValue) inputEl.value = inputEl.dataset.pd3iLastDateValue; }, 80);
      modal.classList.add('hidden');
    }
    function render() {
      title.textContent = new Date(year, month, 1).toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
      grid.innerHTML = '';
      const first = new Date(year, month, 1);
      const startPad = first.getDay();
      const days = new Date(year, month + 1, 0).getDate();
      for (let i = 0; i < startPad; i++) grid.appendChild(document.createElement('span'));
      for (let d = 1; d <= days; d++) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = String(d);
        const val = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
        if (inputEl.value === val) btn.className = 'is-selected';
        btn.addEventListener('click', function(e) { e.preventDefault(); setValue(new Date(year, month, d)); });
        grid.appendChild(btn);
      }
    }
    modal.querySelector('[data-pd3i-date-prev]').onclick = function() { month--; if (month < 0) { month = 11; year--; } render(); };
    modal.querySelector('[data-pd3i-date-next]').onclick = function() { month++; if (month > 11) { month = 0; year++; } render(); };
    modal.querySelector('[data-pd3i-date-today]').onclick = function() { setValue(new Date()); };
    modal.querySelector('[data-pd3i-date-close]').onclick = function() { modal.classList.add('hidden'); };
    render();
    modal.classList.remove('hidden');
  }

  if (!window.__PD3I_DATE_PICKER_BOUND__) {
    window.__PD3I_DATE_PICKER_BOUND__ = true;
    document.addEventListener('click', function(evt) {
      const btn = evt.target && evt.target.closest ? evt.target.closest('[data-pd3i-date-open], [data-pd3i-date-row-open]') : null;
      if (!btn) return;
      evt.preventDefault();
      const rowInput = btn.getAttribute('data-pd3i-date-row-open') === '1'
        ? btn.closest('tr')?.querySelector('input[data-name="Tanggal"]')
        : null;
      const scope = getFormScopeForElement(btn);
      const inputEl = rowInput || findScopedFieldControl(btn.getAttribute('data-pd3i-date-open'), scope);
      pd3iOpenDatePicker_(inputEl);
      if (inputEl) pd3iBindDatePickerTarget_(document.getElementById('pd3i-date-picker-modal'), inputEl);
    });
    document.addEventListener('change', function(evt) {
      const el = evt.target;
      if (el && el.matches && el.matches('input[type="date"][data-pd3i-date-control]') && el.value) {
        const formatted = pd3iFormatDateYmd_(el.value);
        if (formatted && formatted !== el.value) {
          el.value = formatted;
          el.dataset.pd3iDateValue = formatted;
          el.dataset.pd3iLastDateValue = formatted;
        }
      }
    });
  }

  if (!window.__PD3I_QUEUE_PAGER_BOUND__) {
    window.__PD3I_QUEUE_PAGER_BOUND__ = true;
    document.addEventListener('click', function(evt) {
      const backBtn = evt.target && evt.target.closest ? evt.target.closest('[data-pd3i-back-to-case-list]') : null;
      if (backBtn) {
        const workspaceKey = normalizeSidebarWorkspace(backBtn.getAttribute('data-pd3i-back-to-case-list') || ACTIVE_SIDEBAR_WORKSPACE || 'search');
        clearActiveRecordContext({ workspace: workspaceKey, keepSearchResults: true });
        if (['verifikasi', 'sampel', 'status'].includes(workspaceKey)) {
          window.__PD3I_WORKFLOW_LIST_COLLAPSED__ = window.__PD3I_WORKFLOW_LIST_COLLAPSED__ || {};
          window.__PD3I_WORKFLOW_LIST_COLLAPSED__[workspaceKey] = false;
          refreshWorkflowInbox({ forceRefresh: true });
        }
        openSidebarWorkspace(['verifikasi', 'sampel', 'status'].includes(workspaceKey) ? workspaceKey : 'search', { scroll: true, skipRecordReload: true });
        return;
      }
      const toggleBtn = evt.target && evt.target.closest ? evt.target.closest('[data-pd3i-workflow-list-toggle]') : null;
      if (toggleBtn) {
        const workspaceKey = normalizeSidebarWorkspace(toggleBtn.getAttribute('data-pd3i-workflow-list-toggle') || ACTIVE_SIDEBAR_WORKSPACE || '');
        if (!workspaceKey) return;
        window.__PD3I_WORKFLOW_LIST_COLLAPSED__[workspaceKey] = !window.__PD3I_WORKFLOW_LIST_COLLAPSED__[workspaceKey];
        if (WORKFLOW_INBOX_CACHE) renderWorkflowInbox(WORKFLOW_INBOX_CACHE);
        return;
      }
      const btn = evt.target && evt.target.closest ? evt.target.closest('.pd3i-queue-page-btn[data-page-key][data-page-target]') : null;
      if (!btn) return;
      const pageKey = String(btn.getAttribute('data-page-key') || '').trim();
      const targetPage = Number(btn.getAttribute('data-page-target') || 1) || 1;
      if (!pageKey) return;
      window.__PD3I_QUEUE_PAGE_STATE__[pageKey] = targetPage;
      if (WORKFLOW_INBOX_CACHE && normalizeSidebarWorkspace(ACTIVE_SIDEBAR_WORKSPACE) !== 'overview') {
        renderWorkflowInbox(WORKFLOW_INBOX_CACHE);
        return;
      }
      if (normalizeSidebarWorkspace(ACTIVE_SIDEBAR_WORKSPACE) === 'overview' && typeof renderOverviewWorkspace === 'function') {
        renderOverviewWorkspace();
      }
    });
  }

  function normalizeDateInputValue(value) {
    if (value === null || value === undefined) return '';
    const raw = String(value).trim();
    if (!raw) return '';
    if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
    const compact = raw.match(/^(\d{4})(\d{2})(\d{2})$/);
    if (compact) return `${compact[1]}-${compact[2]}-${compact[3]}`;

    let match = raw.match(/^(\d{2})[\/\-](\d{2})[\/\-](\d{4})$/);
    if (match) {
      return `${match[3]}-${match[2]}-${match[1]}`;
    }

    match = raw.match(/^(\d{4})[\/\-](\d{2})[\/\-](\d{2})/);
    if (match) {
      return `${match[1]}-${match[2]}-${match[3]}`;
    }

    const parsed = new Date(raw);
    if (!isNaN(parsed.getTime())) {
      const yyyy = parsed.getFullYear();
      const mm = String(parsed.getMonth() + 1).padStart(2, '0');
      const dd = String(parsed.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    return raw;
  }

  function hardenAddressAutofillSuppression(root, options) {
    const opts = options || {};
    const container = root && root.querySelectorAll ? root : document;
    const formSelector = '#dynamic-form, #dynamic-form-input, #dynamic-form-verifikasi, #dynamic-form-sampel, #dynamic-form-status';
    container.querySelectorAll(formSelector).forEach(function(formRoot) {
      formRoot.setAttribute('autocomplete', 'off');
      formRoot.setAttribute('data-form-type', 'other');
      formRoot.setAttribute('data-lpignore', 'true');
      formRoot.setAttribute('data-1p-ignore', 'true');
    });
    container.querySelectorAll(formSelector + ' input, ' + formSelector + ' textarea, ' + formSelector + ' select').forEach(function(el) {
      const fieldId = String((el.dataset && el.dataset.fieldId) || el.id || '').trim();
      const risk = isBrowserAutofillRiskFieldId(fieldId);
      if (!risk && !(el.classList && el.classList.contains('pd3i-generated-control'))) return;
      const neutralName = _getNeutralFieldName_(fieldId || el.name || 'field');
      el.setAttribute('name', neutralName);
      el.setAttribute('autocomplete', risk ? 'new-password' : 'off');
      el.setAttribute('aria-autocomplete', 'none');
      el.setAttribute('autocorrect', 'off');
      el.setAttribute('autocapitalize', 'off');
      el.setAttribute('spellcheck', 'false');
      el.setAttribute('data-form-type', 'other');
      el.setAttribute('data-lpignore', 'true');
      el.setAttribute('data-1p-ignore', 'true');
      if (risk && el.type !== 'hidden') {
        el.setAttribute('readonly', 'readonly');
        if (!opts.keepReadonly) {
          setTimeout(function() {
            if (!el.disabled) el.removeAttribute('readonly');
          }, Number(opts.releaseDelayMs || 300));
        }
      }
    });
  }

  function releaseBrowserAutofillHydrationReadonly(root, delayMs) {
    const container = root && root.querySelectorAll ? root : document;
    const releaseDelay = Number(delayMs || 650);
    setTimeout(function() {
      container.querySelectorAll('input, textarea, select').forEach(function(el) {
        const fieldId = String((el.dataset && el.dataset.fieldId) || el.id || '').trim();
        if (!isBrowserAutofillRiskFieldId(fieldId)) return;
        if (!el.disabled) el.removeAttribute('readonly');
      });
    }, releaseDelay);
  }

  function setBrowserAutofillReviewFieldLock(workspace) {
    const normalizedWorkspace = String(workspace || '').trim().toLowerCase();
    document.querySelectorAll('[data-pd3i-autofill-review-locked="1"]').forEach(function(el) {
      const wasDisabled = el.dataset.pd3iOrigDisabled === '1';
      if (!wasDisabled) el.disabled = false;
      el.removeAttribute('aria-disabled');
      delete el.dataset.pd3iAutofillReviewLocked;
      delete el.dataset.pd3iOrigDisabled;
    });

    if (normalizedWorkspace === 'verifikasi') return;
    if (['sampel', 'status'].indexOf(normalizedWorkspace) === -1) return;
    const formId = normalizedWorkspace === 'sampel'
      ? 'dynamic-form-sampel'
      : 'dynamic-form-status';
    const editableRootId = normalizedWorkspace === 'sampel'
      ? 'sampel-fields-container-workspace'
      : 'status-fields-container-workspace';
    const formRoot = document.getElementById(formId);
    const editableRoot = document.getElementById(editableRootId);
    if (!formRoot) return;

    formRoot.querySelectorAll('input, textarea, select').forEach(function(el) {
      if (!el || el.type === 'hidden') return;
      if (editableRoot && editableRoot.contains(el)) return;
      const fieldId = _getSemanticFieldKey_(el);
      if (!isBrowserAutofillRiskFieldId(fieldId)) return;
      el.dataset.pd3iAutofillReviewLocked = '1';
      el.dataset.pd3iOrigDisabled = el.disabled ? '1' : '0';
      el.disabled = true;
      el.setAttribute('aria-disabled', 'true');
      el.setAttribute('readonly', 'readonly');
      el.setAttribute('autocomplete', 'new-password');
    });
  }

  function generateHTML(field) {
    const htmlEscape = window.htmlEscape;
    const attrEscape = htmlEscape;
    if (field.type === "header") {
      return `<div class="col-span-1 md:col-span-2 lg:col-span-3 mt-8 mb-2 border-b-2 border-slate-200 pb-2 text-lg font-extrabold text-slate-800 uppercase tracking-tight">${htmlEscape(field.label)}</div>`;
    }

    const widthClass = field.fullWidth ? "col-span-1 md:col-span-2 lg:col-span-3" : "";
    const showIfAttr = field.showIf
      ? `data-parent="${htmlEscape(field.showIf.field)}" data-parent-vals='${htmlEscape(JSON.stringify(field.showIf.values))}' data-required="${field.required ? "true" : "false"}"`
      : "";

    const wrapperClass = `${widthClass} field-wrapper pd3i-field-card pd3i-component-field ${field.fullWidth ? "pd3i-field-card-full" : ""} ${field.showIf ? "pd3i-field-card-dependent hidden" : ""}`;
    const fieldWrapperAttrs = `data-pd3i-field-wrapper="1" data-pd3i-field-id="${attrEscape(field.id)}"`;
    const cls = `pd3i-generated-control pd3i-shell-input border border-slate-300 text-sm rounded-lg block w-full p-2.5 shadow-sm ${
      field.readonly
        ? "bg-slate-100 cursor-not-allowed font-extrabold text-slate-600"
        : "bg-white focus:ring-blue-500 focus:border-blue-500"
    }`;
    // Tanggal pemeriksaan/sampel/spesimen bersifat opsional saat input awal.
    // Tanggal meninggal AFP juga opsional; jangan diwariskan required dari konfigurasi lama/cache.
    const fieldSemanticText = [field.id, field.label, field.sectionKey, field.sectionTitle].filter(Boolean).join(' ');
    const isOptionalExaminationDate = String(field.type || '').toLowerCase() === 'date'
      && /(pemeriksaan|sampel|spesimen)/i.test(fieldSemanticText);
    const isOptionalField = String(field.id || '') === 'Tanggal meninggal AFP' || isOptionalExaminationDate;
    const requiredAttr = (field.required && !field.showIf && !isOptionalField) ? "required" : "";

    if (field.type === "dynamic_table") {
      let tableDef = field;
      if (field.id === "Riwayat Imunisasi") tableDef = getImunisasiSectionDefinition();
      if (field.id === "Kontak Erat") tableDef = getContactSectionDefinition();
      if (field.id === "Riwayat Status Kasus") tableDef = field;

      const columns = tableDef.columns || [];
      let extraHtml = "";

      if (field.id === "Riwayat Imunisasi") {
        extraHtml = `
          <div class="mt-4 grid grid-cols-1 md:grid-cols-3 gap-3">
            <div class="rounded-xl border border-blue-200 bg-blue-50 p-4">
              <div class="text-xs font-extrabold uppercase tracking-wide text-blue-800">Ringkasan Dokumentasi Imunisasi</div>
              <div id="imun-summary-text" class="mt-2 text-lg font-black text-blue-900">Belum diringkas</div>
              <div id="imun-summary-subtext" class="mt-1 text-xs font-semibold text-blue-700">
                Menunggu data tanggal lahir / tanggal pelacakan / kelas untuk menandai item imunisasi yang relevan
              </div>
            </div>
            <div class="rounded-xl border border-slate-200 bg-slate-50 p-4">
              <div class="text-xs font-extrabold uppercase tracking-wide text-slate-700">Item Imunisasi Relevan</div>
              <div id="imun-summary-due" class="mt-2 text-2xl font-black text-slate-900">0</div>
            </div>
            <div class="rounded-xl border border-slate-200 bg-slate-50 p-4">
              <div class="text-xs font-extrabold uppercase tracking-wide text-slate-700">Tercatat Ya</div>
              <div id="imun-summary-yes" class="mt-2 text-2xl font-black text-slate-900">0</div>
            </div>
          </div>

  window.addDynamicRow = function(tableId, presetRow, targetRootOrTbody) {
    const target = targetRootOrTbody && targetRootOrTbody.querySelector ? targetRootOrTbody : null;
    const tbody = target && target.tagName === "TBODY"
      ? target
      : (target ? target.querySelector(`#tbody-${CSS.escape(tableId)}`) : document.getElementById(`tbody-${tableId}`));
    if (!tbody) return;

    const def = getDynamicTableDefinition(tableId);
    if (!def || !Array.isArray(def.columns)) return;

    const tr = document.createElement("tr");
    tr.className = "bg-white border-b hover:bg-slate-50 transition";

    if (presetRow && presetRow.__kode) tr.dataset.kodeImun = presetRow.__kode;

    let rowHtml = "";
    def.columns.forEach(col => {
      const cls = `${col.readonly ? "bg-slate-100 cursor-not-allowed font-extrabold" : "bg-slate-50"} border border-slate-300 text-xs rounded block w-full p-1.5 ${col.width || ""}`;
      const rawValue = presetRow && presetRow[col.name] !== undefined ? presetRow[col.name] : "";
      const value = col.type === "date" ? normalizeDateInputValue(rawValue) : (col.type === "time" ? String(rawValue == null ? "" : rawValue).replace(/\s*WIB\s*$/i, "") : String(rawValue == null ? "" : rawValue));

      if (["text", "date", "time", "number", "tel", "email"].includes(col.type)) {
        rowHtml += `<td class="px-2 py-2">
          <input type="${(col.type === 'email' || col.type === 'tel') ? 'text' : col.type}" data-name="${htmlEscape(col.name)}" ${col.type === 'date' ? 'data-pd3i-date-control="1"' : ''} class="${cls}" value="${htmlEscape(value)}" autocomplete="new-password" aria-autocomplete="none" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" data-form-type="other" data-lpignore="true" data-1p-ignore="true" ${(col.type === 'email') ? 'inputmode="email"' : ((col.type === 'tel') ? 'inputmode="tel"' : '')} ${col.readonly ? 'readonly tabindex="-1"' : ""}>
        </td>`;
      } else if (col.type === "textarea") {
        rowHtml += `<td class="px-2 py-2">
          <textarea data-name="${htmlEscape(col.name)}" class="${cls} min-h-[4.5rem]" autocomplete="new-password" aria-autocomplete="none" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" data-form-type="other" data-lpignore="true" data-1p-ignore="true" ${col.readonly ? 'readonly tabindex="-1"' : ""}>${htmlEscape(value)}</textarea>
        </td>`;
      } else {
        const opts = (col.options || []).map(o => `<option value="${htmlEscape(o)}" ${o === value ? "selected" : ""}>${htmlEscape(o)}</option>`).join("");
        rowHtml += `<td class="px-2 py-2">
          <select data-name="${col.name}" class="${cls}" autocomplete="off" data-form-type="other" data-lpignore="true" data-1p-ignore="true">
            <option value="">-</option>${opts}
          </select>
        </td>`;
      }
    });

    rowHtml += `<td class="px-2 py-2 text-center">
      <button type="button" onclick="removeDynamicRow(this, '${tableId}')" class="text-red-400 hover:text-red-600 p-2">
        <i class="fas fa-trash"></i>
      </button>
    </td>`;

    tr.innerHTML = rowHtml;
    tbody.appendChild(tr);

    const tglLahirInput = tr.querySelector('input[data-name="Tanggal Lahir"]');
    const umurInput = tr.querySelector('input[data-name="Umur"]');

    if (tglLahirInput && umurInput) {
      const updateUmurKontakErat = (hardValidate) => {
        const rawDob = String(tglLahirInput.value || "").trim();
        const refValue = document.getElementById("Tanggal Pelacakan")?.value || "";

        if (!isCompleteDateValue(rawDob)) {
          umurInput.value = "";
          return;
        }

        const res = validateBirthDateEpi(
          rawDob,
          isCompleteDateValue(refValue) ? refValue : ""
        );

        if (!res.ok) {
          umurInput.value = "";
          if (hardValidate) {
            tglLahirInput.value = "";
            showTopAlert(res.message, false);
          }
          return;
        }

        umurInput.value = res.ageText || "";
      };

      tglLahirInput.addEventListener("change", function() {
        updateUmurKontakErat(false);
      });

      tglLahirInput.addEventListener("blur", function() {
        updateUmurKontakErat(true);
      });
    }

    if (tableId === "Riwayat Imunisasi") {
      const statusSelect = tr.querySelector('select[data-name="Status"]');
      if (statusSelect) statusSelect.addEventListener("change", updateImunisasiSummary);
    }
  };

  function parseCoordinateSearchQuery(query) {
    const raw = String(query || "").trim();
    if (!raw) return null;

    const cleaned = raw
      .replace(/latitude|longitude|lat|lon|lng/gi, " ")
      .replace(/[;|]/g, ",")
      .replace(/\s+/g, " ")
      .trim();
    const match = cleaned.match(/(-?\d+(?:[.,]\d+)?)\s*[,\s]\s*(-?\d+(?:[.,]\d+)?)/);
    if (!match) return null;

    const lat = Number(String(match[1]).replace(",", "."));
    const lon = Number(String(match[2]).replace(",", "."));
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
    if (lat < -90 || lat > 90 || lon < -180 || lon > 180) return null;
    return { lat: lat, lon: lon };
  }

  async function geocodeDomisiliAddress(query) {
    const url = "https:" + "/" + "/nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=id&q=" + encodeURIComponent(query);
    const res = await fetch(url, {
      method: "GET",
      headers: { "Accept": "application/json" }
    });
    if (!res.ok) {
      throw new Error("Layanan pencarian lokasi sedang gagal.");
    }
    const rows = await res.json();
    return Array.isArray(rows) ? rows[0] : null;
  }

        </div>
        <div class="px-4 sm:px-6 py-4 border-t border-slate-200 flex flex-col sm:flex-row justify-end gap-3 bg-white">
          <button type="button" id="btn-coordinate-picker-cancel" class="px-5 py-3 rounded-xl border border-slate-300 hover:bg-slate-50 text-slate-700 font-extrabold">Batal</button>
          <button type="button" id="btn-coordinate-picker-use" class="px-5 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold shadow-md">
            <i class="fas fa-check mr-2"></i> Gunakan Titik Ini
          </button>
        </div>
      </div>`;
    document.body.appendChild(modal);
    return modal;
  }

  function coordinatePickerStatus(message, color) {
    const statusEl = document.getElementById("coordinate-picker-status");
    if (!statusEl) return;
    const palette = {
      blue: "border-blue-200 bg-blue-50 text-blue-700",
      green: "border-green-200 bg-green-50 text-green-700",
      red: "border-red-200 bg-red-50 text-red-700",
      slate: "border-slate-200 bg-slate-50 text-slate-600"
    };
    statusEl.className = "px-4 py-3 rounded-xl border " + (palette[color] || palette.slate) + " text-sm font-semibold";
    statusEl.textContent = message;
  }

  function setCoordinatePickerPoint(lat, lon, estimatedAddress) {
    const latNum = Number(lat);
    const lonNum = Number(lon);
    if (!Number.isFinite(latNum) || !Number.isFinite(lonNum)) return false;
    if (latNum < -90 || latNum > 90 || lonNum < -180 || lonNum > 180) return false;

    const latText = latNum.toFixed(6);
    const lonText = lonNum.toFixed(6);
    const latInput = document.getElementById("coordinate-picker-lat");
    const lonInput = document.getElementById("coordinate-picker-lon");
    const addressInput = document.getElementById("coordinate-picker-estimated-address");
    if (latInput) latInput.value = latText;
    if (lonInput) lonInput.value = lonText;
    if (addressInput && estimatedAddress !== undefined) addressInput.value = String(estimatedAddress || "");

    const map = window.__PD3I_COORDINATE_PICKER_MAP__;
    if (map && window.L) {
      const ll = [latNum, lonNum];
      if (!window.__PD3I_COORDINATE_PICKER_MARKER__) {
        window.__PD3I_COORDINATE_PICKER_MARKER__ = window.L.marker(ll, { draggable: true }).addTo(map);
        window.__PD3I_COORDINATE_PICKER_MARKER__.on("dragend", function(ev) {
          const pos = ev.target.getLatLng();
          setCoordinatePickerPoint(pos.lat, pos.lng);
          reverseGeocodeCoordinatePickerPoint(pos.lat, pos.lng);
        });
      } else {
        window.__PD3I_COORDINATE_PICKER_MARKER__.setLatLng(ll);
      }
      map.setView(ll, Math.max(map.getZoom() || 15, 15));
    }
    coordinatePickerStatus(`Titik dipilih. Lat: ${latText}, Lon: ${lonText}`, "green");
    return true;
  }

  async function reverseGeocodeCoordinatePickerPoint(lat, lon) {
    const addressInput = document.getElementById("coordinate-picker-estimated-address");
    if (!addressInput) return;
    try {
      const url = "https:" + "/" + "/nominatim.openstreetmap.org/reverse?format=jsonv2&lat=" + encodeURIComponent(lat) + "&lon=" + encodeURIComponent(lon) + "&zoom=18&addressdetails=1";
      const res = await fetch(url, { method: "GET", headers: { "Accept": "application/json" } });
      if (!res.ok) return;
      const row = await res.json();
      if (row && row.display_name) addressInput.value = row.display_name;
    } catch (err) {
      // Reverse geocode hanya bantuan; jangan ganggu pemilihan titik kalau gagal.
    }
  }

  function initCoordinatePickerMap() {
    const mapEl = document.getElementById("coordinate-picker-map");
    if (!mapEl || !window.L) return null;
    if (window.__PD3I_COORDINATE_PICKER_MAP__) {
      setTimeout(function() { window.__PD3I_COORDINATE_PICKER_MAP__.invalidateSize(); }, 80);
      return window.__PD3I_COORDINATE_PICKER_MAP__;
    }

    const currentLat = Number(getElementValueById("Latitude") || "");
    const currentLon = Number(getElementValueById("Longitude") || "");
    const hasCurrent = Number.isFinite(currentLat) && Number.isFinite(currentLon);
    const center = hasCurrent ? [currentLat, currentLon] : PD3I_DEFAULT_MAP_CENTER;
    const map = window.L.map(mapEl, { scrollWheelZoom: true }).setView(center, hasCurrent ? 16 : 11);
    window.L.tileLayer("https:" + "/" + "/tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    map.on("click", function(ev) {
      setCoordinatePickerPoint(ev.latlng.lat, ev.latlng.lng);
      reverseGeocodeCoordinatePickerPoint(ev.latlng.lat, ev.latlng.lng);
    });
    window.__PD3I_COORDINATE_PICKER_MAP__ = map;
    setTimeout(function() { map.invalidateSize(); }, 120);
    if (hasCurrent) setCoordinatePickerPoint(currentLat, currentLon);
    return map;
  }

  function closeCoordinatePickerModal() {
    const modal = document.getElementById("coordinate-picker-modal");
    if (!modal) return;
    modal.classList.add("hidden");
    modal.classList.remove("flex");
    document.body.classList.remove("modal-open");
  }

  async function searchCoordinatePickerAddress() {
    const queryInput = document.getElementById("coordinate-picker-address");
    const btn = document.getElementById("btn-coordinate-picker-search");
    const query = String(queryInput && queryInput.value || "").trim();
    const parsed = parseCoordinateSearchQuery(query);
    if (parsed) {
      setCoordinatePickerPoint(parsed.lat, parsed.lon, "");
      reverseGeocodeCoordinatePickerPoint(parsed.lat, parsed.lon);
      return;
    }
    if (!query) {
      coordinatePickerStatus("Masukkan alamat/kata kunci lokasi dulu, atau klik langsung di peta.", "red");
      return;
    }

    if (btn) {
      setPd3iButtonLoading(btn, true, 'Mencari...');
    }
    coordinatePickerStatus(`Mencari titik dari alamat: ${query}`, "blue");
    try {
      const match = await geocodeDomisiliAddress(query);
      if (!match || !match.lat || !match.lon) throw new Error("Alamat tidak ditemukan. Coba kata kunci yang lebih spesifik atau klik peta manual.");
      setCoordinatePickerPoint(Number(match.lat), Number(match.lon), match.display_name || query);
    } catch (err) {
      coordinatePickerStatus((err && err.message) || "Gagal mencari alamat.", "red");
    } finally {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-magnifying-glass-location"></i> Cari';
      }
    }
  }

  function openCoordinatePickerModal() {
    window.scrollTo({ top: 0 });
    const modal = ensureCoordinatePickerModal();
    modal.classList.remove("hidden");
    modal.classList.add("flex");
    document.body.classList.add("modal-open");

    const addressInput = document.getElementById("coordinate-picker-address");
    const estimatedAddressInput = document.getElementById("coordinate-picker-estimated-address");
    const currentSearch = getElementValueById("geo-search-query") || "";
    const domisiliQuery = buildDomisiliAddressQuery();
    if (addressInput && !addressInput.value) addressInput.value = currentSearch || domisiliQuery;
    if (estimatedAddressInput && !estimatedAddressInput.value) estimatedAddressInput.value = currentSearch || domisiliQuery;

    initCoordinatePickerMap();

    if (modal.dataset.bound !== "1") {
      modal.dataset.bound = "1";
      addCoordinatePickerListener("btn-close-coordinate-picker", "click", closeCoordinatePickerModal);
      addCoordinatePickerListener("btn-coordinate-picker-cancel", "click", closeCoordinatePickerModal);
      addCoordinatePickerListener("btn-coordinate-picker-search", "click", searchCoordinatePickerAddress);
      addCoordinatePickerListener("btn-coordinate-picker-gps", "click", function() {
        if (navigator.geolocation) {
          coordinatePickerStatus("Mencari lokasi GPS Anda...", "blue");
          const gpsBtn = document.getElementById("btn-coordinate-picker-gps");
          if (gpsBtn) {
            setPd3iButtonLoading(gpsBtn, true, 'Mencari...');
          }
          navigator.geolocation.getCurrentPosition(
            function(position) {
              const lat = position.coords.latitude;
              const lon = position.coords.longitude;
              setCoordinatePickerPoint(lat, lon);
              reverseGeocodeCoordinatePickerPoint(lat, lon);
              coordinatePickerStatus("Lokasi GPS berhasil ditemukan.", "green");
              if (gpsBtn) {
                gpsBtn.disabled = false;
                gpsBtn.innerHTML = '<i class="fas fa-location-crosshairs"></i> Lokasi Saya';
              }
            },
            function(error) {
              let msg = error.message;
              if (msg.indexOf("permissions policy") !== -1 || error.code === error.PERMISSION_DENIED) {
                msg = "Akses GPS diblokir oleh Google Sites/browser. Gunakan kolom pencarian alamat di atas.";
              } else {
                msg = "Gagal mendapatkan lokasi GPS: " + msg;
              }
              coordinatePickerStatus(msg, "red");
              if (gpsBtn) {
                gpsBtn.disabled = false;
                gpsBtn.innerHTML = '<i class="fas fa-location-crosshairs"></i> Lokasi Saya';
              }
            },
            { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
          );
        } else {
          coordinatePickerStatus("Browser Anda tidak mendukung deteksi lokasi GPS.", "red");
        }
      });
      addCoordinatePickerListener("coordinate-picker-address", "keydown", function(ev) {
        if (ev.key === "Enter") {
          ev.preventDefault();
          searchCoordinatePickerAddress();
        }
      });
      addCoordinatePickerListener("btn-coordinate-picker-use", "click", function() {
        const lat = Number(String(getElementValueById("coordinate-picker-lat") || "").replace(",", "."));
        const lon = Number(String(getElementValueById("coordinate-picker-lon") || "").replace(",", "."));
        if (!setCoordinatePickerPoint(lat, lon)) {
          coordinatePickerStatus("Latitude/Longitude belum valid. Pilih titik di peta dulu ya.", "red");
          return;
        }
        const latEl = document.getElementById("Latitude");
        const lonEl = document.getElementById("Longitude");
        const geoSearch = document.getElementById("geo-search-query");
        const addressEl = document.getElementById("Alamat");
        const estimatedAddress = String(getElementValueById("coordinate-picker-estimated-address") || "").trim();
        const latText = lat.toFixed(6);
        const lonText = lon.toFixed(6);
        if (latEl) latEl.value = latText;
        if (lonEl) lonEl.value = lonText;
        if (geoSearch && estimatedAddress) geoSearch.value = estimatedAddress;
        if (addressEl && !String(addressEl.value || "").trim() && estimatedAddress) addressEl.value = estimatedAddress;
        setCoordinateManualMode(false);
        const statusEl = document.getElementById("geo-status");
        if (statusEl) {
          statusEl.textContent = `Titik dari peta digunakan. Lat: ${latText}, Lon: ${lonText}${estimatedAddress ? ' • Estimasi alamat: ' + estimatedAddress : ''}`;
          statusEl.className = "lg:w-[32rem] px-4 py-3 rounded-lg border border-green-200 bg-green-50 text-green-700 text-sm font-semibold";
        }
        closeCoordinatePickerModal();
      });
    }
  }

  function setCoordinateManualMode(enabled) {
    const latEl = document.getElementById("Latitude");
    const lonEl = document.getElementById("Longitude");
    const editable = !!enabled && !isViewerSession();

    [latEl, lonEl].forEach(function(el) {
      if (!el) return;

      el.classList.remove("bg-slate-100", "cursor-not-allowed", "font-extrabold", "text-slate-600", "bg-white", "focus:ring-blue-500", "focus:border-blue-500", "border-amber-300", "ring-1", "ring-amber-200");

      if (editable) {
        el.removeAttribute("readonly");
        el.placeholder = "Isi manual jika titik tidak ditemukan";
        el.classList.add("bg-white", "focus:ring-blue-500", "focus:border-blue-500", "border-amber-300", "ring-1", "ring-amber-200");
      } else {
        el.setAttribute("readonly", "readonly");
        el.placeholder = "Akan terisi otomatis / bisa dibuka manual jika gagal";
        el.classList.add("bg-slate-100", "cursor-not-allowed", "font-extrabold", "text-slate-600");
      }
    });
  }

  function initGeoButton() {
    const btn = document.getElementById("btn-ambil-lokasi");
    const btnCariAlamat = document.getElementById("btn-cari-lokasi-alamat");
    const btnPilihTitikPeta = document.getElementById("btn-pilih-titik-peta");
    const latEl = document.getElementById("Latitude");
    const lonEl = document.getElementById("Longitude");
    const statusEl = document.getElementById("geo-status");
    const searchInput = document.getElementById("geo-search-query");

    if (!btn || !latEl || !lonEl || !statusEl) return;
    const geoStatusClass = function(color) {
      const palette = {
        blue: "border-blue-200 bg-blue-50 text-blue-700",
        green: "border-green-200 bg-green-50 text-green-700",
        red: "border-red-200 bg-red-50 text-red-700",
        slate: "border-slate-200 bg-slate-50 text-slate-600"
      };
      return "w-full px-4 py-3 rounded-xl border " + (palette[color] || palette.slate) + " text-xs sm:text-sm font-semibold flex items-center min-h-[48px]";
    };
    setCoordinateManualMode(false);
    if (btn.dataset.bound === "1") return;
    btn.dataset.bound = "1";
    if (btnCariAlamat) btnCariAlamat.dataset.bound = "1";
    if (btnPilihTitikPeta) btnPilihTitikPeta.dataset.bound = "1";

    btn.addEventListener("click", function() {
      if (!navigator.geolocation) {
        setCoordinateManualMode(true);
        statusEl.textContent = "Fitur lokasi perangkat tidak didukung di perangkat atau browser ini. Isi latitude dan longitude secara manual.";
        statusEl.className = geoStatusClass("red");
        return;
      }

      setCoordinateManualMode(false);
      statusEl.textContent = "Sedang mengambil lokasi...";
      statusEl.className = geoStatusClass("blue");

      navigator.geolocation.getCurrentPosition(
        function(position) {
          const lat = position.coords.latitude.toFixed(6);
          const lon = position.coords.longitude.toFixed(6);
          latEl.value = lat;
          lonEl.value = lon;
          setCoordinateManualMode(false);
          statusEl.textContent = `Lokasi berhasil diambil. Lat: ${lat}, Lon: ${lon}`;
          statusEl.className = geoStatusClass("green");
        },
        function(error) {
          let msg = "Gagal mengambil lokasi.";
          if (error.code === 1) msg = "Izin lokasi ditolak.";
          else if (error.code === 2) msg = "Lokasi tidak tersedia.";
          else if (error.code === 3) msg = "Permintaan lokasi timeout.";
          setCoordinateManualMode(true);
          statusEl.textContent = msg + " Isi latitude/longitude manual jika perlu.";
          statusEl.className = geoStatusClass("red");
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    });

    async function runGeoAddressSearch() {
      const manualQuery = searchInput ? String(searchInput.value || "").trim() : "";
      const parsedCoordinate = parseCoordinateSearchQuery(manualQuery);
      if (parsedCoordinate) {
        const lat = parsedCoordinate.lat.toFixed(6);
        const lon = parsedCoordinate.lon.toFixed(6);
        latEl.value = lat;
        lonEl.value = lon;
        setCoordinateManualMode(false);
        statusEl.textContent = `Koordinat diisi dari input. Lat: ${lat}, Lon: ${lon}`;
        statusEl.className = geoStatusClass("green");
        return;
      }

      const query = manualQuery || buildDomisiliAddressQuery();
      if (!query) {
        setCoordinateManualMode(true);
        statusEl.textContent = "Alamat domisili/input search belum cukup lengkap. Isi alamat, wilayah, atau koordinat manual.";
        statusEl.className = geoStatusClass("red");
        return;
      }

      setPd3iButtonLoading(btnCariAlamat, true, 'Mencari...');
      setCoordinateManualMode(false);
      statusEl.textContent = `Mencari koordinat dari: ${query}`;
      statusEl.className = geoStatusClass("blue");

      try {
        const match = await geocodeDomisiliAddress(query);
        if (!match || !match.lat || !match.lon) {
          throw new Error("Alamat tidak ditemukan.");
        }

        const lat = Number(match.lat).toFixed(6);
        const lon = Number(match.lon).toFixed(6);
        latEl.value = lat;
        lonEl.value = lon;
        setCoordinateManualMode(false);
        statusEl.textContent = `Koordinat ditemukan. Lat: ${lat}, Lon: ${lon}`;
        statusEl.className = geoStatusClass("green");
      } catch (err) {
        setCoordinateManualMode(true);
        statusEl.textContent = ((err && err.message) || "Gagal mencari koordinat dari alamat.") + " Isi latitude/longitude manual jika perlu.";
        statusEl.className = geoStatusClass("red");
      } finally {
        btnCariAlamat.disabled = false;
        btnCariAlamat.innerHTML = '<i class="fas fa-magnifying-glass-location"></i> Cari dari Alamat';
      }
    }

    if (btnCariAlamat) {
      btnCariAlamat.addEventListener("click", runGeoAddressSearch);
    }
    if (btnPilihTitikPeta) {
      btnPilihTitikPeta.addEventListener("click", openCoordinatePickerModal);
    }
    if (searchInput) {
      searchInput.addEventListener("keydown", function(ev) {
        if (ev.key === "Enter") {
          ev.preventDefault();
          runGeoAddressSearch();
        }
      });
    }
  }

  function populateWilayahSelectOptions(selectEl, placeholder, items, preservedValue) {
    if (!selectEl) return;
    const keepValue = String(preservedValue != null ? preservedValue : selectEl.value || '').trim();
    selectEl.innerHTML = `<option value="">${placeholder}</option>`;
    (Array.isArray(items) ? items : []).forEach(function(item) {
      const option = document.createElement('option');

      option.textContent = String(item && item.name || '');
      selectEl.appendChild(option);
    });
    if (keepValue) {
      ensureSelectOptionValue(selectEl, keepValue);
      selectEl.value = keepValue;
      stabilizeUserSelectedValue(selectEl, keepValue);

  }

  function initWilayahDropdowns(root) {

      });

  // ============================================================
  // WORKFLOW FILTER MASTER OPTIONS
  // ============================================================
  function normalizeWorkflowFilterKey(value) {
    return String(value || '').trim().toUpperCase().replace(/\s+/g, ' ');
  }

  function uniqueSortedFilterOptions(values) {
    const seen = {};
    (Array.isArray(values) ? values : []).forEach(function(value) {
      const clean = String(value || '').trim();
      if (!clean) return;
      const key = normalizeWorkflowFilterKey(clean);
      if (!seen[key]) seen[key] = clean;
    });
    return Object.keys(seen)
      .map(function(key) { return seen[key]; })
      .sort(function(a, b) { return String(a || '').localeCompare(String(b || ''), 'id', { sensitivity: 'base' }); });
  }

  function appendFilterOptions(selectEl, placeholder, values, preservedValue) {
    if (!selectEl) return;
    const keepValue = String(preservedValue != null ? preservedValue : (selectEl.value || '')).trim();
    selectEl.innerHTML = `<option value="">${placeholder}</option>`;
    uniqueSortedFilterOptions(values).forEach(function(value) {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = value;
      selectEl.appendChild(option);
    });
    if (keepValue) {
      ensureSelectOptionValue(selectEl, keepValue);
      selectEl.value = keepValue;
    }
  }

  function getCaseStatusFilterOptionsForDiagnosis(dx) {
    const selectedDx = String(dx || document.getElementById('search-diagnosis')?.value || 'ALL').trim().toUpperCase();
    if (selectedDx && selectedDx !== 'ALL' && typeof getCaseStatusOptions === 'function') {
      return getCaseStatusOptions(selectedDx);
    }
    if (typeof CASE_STATUS_OPTIONS_BY_DX === 'object' && CASE_STATUS_OPTIONS_BY_DX) {
      return uniqueSortedFilterOptions(Object.keys(CASE_STATUS_OPTIONS_BY_DX).reduce(function(list, key) {
        return list.concat(CASE_STATUS_OPTIONS_BY_DX[key] || []);
      }, []));
    }
    const statusFields = (typeof COMMON_STATUS_FIELDS !== 'undefined' && Array.isArray(COMMON_STATUS_FIELDS)) ? COMMON_STATUS_FIELDS : [];
    const statusField = statusFields.find(function(field) {
      return field && field.id === 'Status Pasien/Kasus';
    });
    return uniqueSortedFilterOptions(statusField && statusField.options);
  }

  function populateWorkflowStatusKasusFilterOptions(preservedValue) {
    const selectEl = document.getElementById('search-status-kasus');
    if (!selectEl) return;
    const backendOptions = MASTER_WORKFLOW_FILTERS && Array.isArray(MASTER_WORKFLOW_FILTERS.statusKasus)
      ? MASTER_WORKFLOW_FILTERS.statusKasus
      : [];
    const options = backendOptions.length ? backendOptions : getCaseStatusFilterOptionsForDiagnosis();
    appendFilterOptions(selectEl, 'Semua status kasus/pasien', options, preservedValue != null ? preservedValue : selectEl.value);
  }

  function populateWorkflowKelurahanFilterOptions(preservedValue) {
    const selectEl = document.getElementById('search-kelurahan');
    if (!selectEl) return;
    const kecamatan = String(document.getElementById('search-kecamatan')?.value || '').trim();
    const byKecamatan = (MASTER_WORKFLOW_FILTERS && MASTER_WORKFLOW_FILTERS.kelurahanByKecamatan) || {};
    let options = [];
    if (kecamatan && Array.isArray(byKecamatan[kecamatan])) {
      options = byKecamatan[kecamatan];
    } else {
      Object.keys(byKecamatan).forEach(function(key) {
        options = options.concat(byKecamatan[key] || []);
      });
    }
    appendFilterOptions(selectEl, kecamatan ? 'Semua kelurahan di ' + kecamatan : 'Semua kelurahan', options, preservedValue != null ? preservedValue : selectEl.value);
  }

  function populateWorkflowFilterDropdowns(preservedValues) {
    const keep = preservedValues || collectWorkflowSearchFilters();
    appendFilterOptions(document.getElementById('search-kecamatan'), 'Semua kecamatan', MASTER_WORKFLOW_FILTERS && MASTER_WORKFLOW_FILTERS.kecamatan, keep.kecamatan);
    populateWorkflowKelurahanFilterOptions(keep.kelurahan);
    populateWorkflowStatusKasusFilterOptions(keep.statusKasus);
  }

  window.loadWorkflowFilterOptions = function(forceReload) {
    const preserved = collectWorkflowSearchFilters();
    populateWorkflowStatusKasusFilterOptions(preserved.statusKasus);
    if (!safeGsRun() || !SESSION_TOKEN) {
      populateWorkflowFilterDropdowns(preserved);
      return Promise.resolve(MASTER_WORKFLOW_FILTERS || {});
    }
    const hasCache = MASTER_WORKFLOW_FILTERS && Array.isArray(MASTER_WORKFLOW_FILTERS.kecamatan) && MASTER_WORKFLOW_FILTERS.kecamatan.length > 0;
    if (hasCache && !forceReload) {
      populateWorkflowFilterDropdowns(preserved);
      return Promise.resolve(MASTER_WORKFLOW_FILTERS);
    }
    return new Promise(function(resolve) {
      google.script.run
        .withSuccessHandler(function(data) {
          MASTER_WORKFLOW_FILTERS = {
            kecamatan: uniqueSortedFilterOptions(data && data.kecamatan),
            kelurahanByKecamatan: (data && data.kelurahanByKecamatan) || {},
            statusKasus: uniqueSortedFilterOptions(data && data.statusKasus)
          };
          populateWorkflowFilterDropdowns(preserved);
          resolve(MASTER_WORKFLOW_FILTERS);
        })
        .withFailureHandler(function(err) {
          console.error('getWorkflowFilterOptions failed:', err);
          populateWorkflowFilterDropdowns(preserved);
          resolve(MASTER_WORKFLOW_FILTERS || {});
        })
        .getWorkflowFilterOptions(SESSION_TOKEN);
    });
  };

  // ============================================================
  // REF FASKES
  // ============================================================
  window.loadFaskesRealtime = function(selectedUnitName, forceReload) {
    return new Promise(function(resolve) {
      if (!safeGsRun() || !SESSION_TOKEN) {
        resolve([]);
        return;
      }

      const hasCache = Array.isArray(MASTER_FASKES) && MASTER_FASKES.length > 0;

        const src = document.getElementById("Sumber Laporan");
        const currentSelected =
          selectedUnitName ||
          document.getElementById("Nama unit pelapor")?.value ||

        if (src && src.value) {

        if (document.getElementById("Nama Rumah Sakit")) {
          const currentRs = document.getElementById("Nama Rumah Sakit")?.value || "";

            selectedUnitName ||

          resolve(MASTER_FASKES || []);

          resolve([]);
        })
        .getFaskesFromSheet(SESSION_TOKEN);

  function normalizeFaskesJenisLabel(value) {
    const raw = String(value || "").trim().toUpperCase().replace(/[\/_-]+/g, " ").replace(/\s+/g, " ").trim();
    if (!raw) return "";
    if (raw === "PKM" || raw.includes("PUSKESMAS") || raw.includes("PUSKES")) return "PUSKESMAS";
    if (raw === "RS" || raw.includes("RUMAH SAKIT") || raw.includes("HOSPITAL") || raw.includes("RUMKIT") || raw.startsWith("RS")) return "RUMAH SAKIT";
    if (raw.includes("KLINIK")) return "KLINIK";
    if (raw.includes("TPMB") || raw.includes("BPM") || raw.includes("BIDAN PRAKTIK")) return "TPMB";
    if (raw.includes("TPMD")) return "TPMD";
    if (raw.includes("PRAKTIK") || raw.includes("DOKTER")) return "PRAKTIK MANDIRI";
    if (raw.includes("LAB")) return "LABORATORIUM";
    if (raw.includes("MASYARAKAT")) return "MASYARAKAT";
    if (raw === "DLL" || raw.includes("DLL") || raw.includes("LAIN")) return "LAINNYA";
    return raw;
  }

  function initChoices(jenis, selectedValue) {
    const selectEl = document.getElementById("Nama unit pelapor");
    if (!selectEl) return;

    const keepValue = String(selectedValue || "").trim();

    if (choicesInstance) {
      try { choicesInstance.destroy(); } catch (e) {}
      choicesInstance = null;
    }

    selectEl.disabled = false;
    selectEl.innerHTML = '<option value="">-- Pilih Unit --</option>';

    const upper = normalizeFaskesJenisLabel(jenis);

    if (!upper) {
      selectEl.disabled = true;
      selectEl.innerHTML = '<option value="">Pilih sumber laporan dahulu...</option>';
    } else if (!["MASYARAKAT", "LAINNYA"].includes(upper)) {
      const filtered = (MASTER_FASKES || []).filter(f => normalizeFaskesJenisLabel(f.jenis || f.nama) === upper);

      filtered.forEach(f => {
        const opt = document.createElement("option");
        opt.value = f.nama;
        opt.textContent = f.nama;
        if (f.key) opt.setAttribute("data-key", f.key);
        selectEl.appendChild(opt);
      });

      if (filtered.length === 0) {
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "(Tidak ada data REF_FASKES untuk jenis ini)";
        selectEl.appendChild(opt);
      }
    } else {
      const opt = document.createElement("option");
      opt.value = upper;
      opt.textContent = upper;
      selectEl.appendChild(opt);
    }

    selectEl.removeAttribute("required");

    if (keepValue) {
      const exists = Array.from(selectEl.options).some(opt => opt.value === keepValue);
      if (exists) selectEl.value = keepValue;
    }
  }

  function initChoicesRumahSakit(selectedValue) {
    const selectEl = document.getElementById("Nama Rumah Sakit");
    if (!selectEl) return;

    const keepValue = String(selectedValue || "").trim();

    if (rsChoicesInstance) {
      try { rsChoicesInstance.destroy(); } catch (e) {}
      rsChoicesInstance = null;
    }

    selectEl.disabled = false;
    selectEl.innerHTML = '<option value="">-- Pilih / ketik Rumah Sakit --</option>';

    const filtered = (MASTER_FASKES || []).filter(f =>
      normalizeFaskesJenisLabel(f.jenis || f.nama) === "RUMAH SAKIT"
    );

    filtered.forEach(f => {
      const opt = document.createElement("option");
      opt.value = f.nama;
      opt.textContent = f.nama;
      if (f.key) opt.setAttribute("data-key", f.key);
      selectEl.appendChild(opt);
    });

    if (keepValue) {
      const exists = Array.from(selectEl.options).some(opt => String(opt.value || "").trim() === keepValue);
      if (!exists) {
        const manualOpt = document.createElement("option");
        manualOpt.value = keepValue;
        manualOpt.textContent = keepValue + " (manual)";
        manualOpt.setAttribute("data-manual", "1");
        selectEl.appendChild(manualOpt);
      }
    }

        searchEnabled: true,
        itemSelectText: "",
        shouldSort: false,
        placeholder: true,
        placeholderValue: "-- Pilih Rumah Sakit --",

          rsChoicesInstance.setChoiceByValue(keepValue);
        } catch (e) {
          console.warn("Gagal restore Nama Rumah Sakit:", e);
        }
      }, 120);
    }

  function isPcvCode(kode) {
    return ["PCV1", "PCV2", "PCV3"].includes(String(kode || "").trim().toUpperCase());
  }

  function collectExistingImunisasiState(tbody) {
    const map = {};
    if (!tbody) return map;

    Array.from(tbody.querySelectorAll("tr")).forEach(row => {
      const kode = String(row.dataset.kodeImun || "").trim().toUpperCase();
      if (!kode) return;
      const status = row.querySelector('select[data-name="Status"]')?.value || "";
      const tanggal = row.querySelector('input[data-name="Tanggal"]')?.value || "";
      const sumber = row.querySelector('select[data-name="Sumber Informasi"]')?.value || "";
      const keterangan = row.querySelector('input[data-name="Keterangan"]')?.value || "";
      const statusOrigin = String(row.dataset.statusOrigin || "").trim().toLowerCase();
      const isManual = statusOrigin === "manual" || ["YA", "TIDAK"].includes(String(status).trim().toUpperCase()) || !!tanggal || !!sumber;

      map[kode] = {
        kode,
        status,
        tanggal,
        sumber,
        keterangan,
        statusOrigin: isManual ? "manual" : (statusOrigin || "auto")
      };
    });

    return map;
  }

  function getRuleMap() {
    const map = {};
    (Array.isArray(REF_IMUN) ? REF_IMUN : []).forEach(rule => {
      const kode = String(rule?.KodeImunisasi || "").trim().toUpperCase();
      if (kode) map[kode] = rule;
    });
    return map;
  }

  function isAutoLockedStatus(status) {
    const s = String(status || "").trim();
    return s === "Belum cukup umur" || s === "Tidak sesuai sasaran";
  }

  function shouldPreserveManualImunisasiState(previousState, ruleMap) {
    if (!previousState) return false;
    if (String(previousState.statusOrigin || "").toLowerCase() === "manual") return true;

    const status = String(previousState.status || "").trim();
    if (!status && !previousState.tanggal && !previousState.sumber && !previousState.keterangan) return false;
    if (status === "Ya" || status === "Tidak") return true;
    if (previousState.tanggal || previousState.sumber) return true;

    if (isPcvCode(previousState.kode)) {
      const rule = ruleMap[String(previousState.kode || "").trim().toUpperCase()];
      if (rule && previousState.keterangan && String(previousState.keterangan).trim() !== String(rule.Catatan || "").trim()) return true;
    }

    return false;
  }

  function getPcvHistoryFromStateMap(existingStateMap) {
    const rows = Object.values(existingStateMap || {}).filter(item => isPcvCode(item.kode));
    const yesRows = rows
      .filter(item => String(item.status || "").trim().toUpperCase() === "YA")
      .map(item => ({ ...item, parsedDate: parseDateSafe(item.tanggal) }))
      .sort((a, b) => {
        if (a.parsedDate && b.parsedDate) return a.parsedDate - b.parsedDate;
        if (a.parsedDate) return -1;
        if (b.parsedDate) return 1;
        return a.kode.localeCompare(b.kode);
      });

    return {
      yesRows,
      givenCount: yesRows.length,
      lastDoseDate: yesRows.length ? (yesRows[yesRows.length - 1].parsedDate || null) : null,
      hasAnyUndatedYes: yesRows.some(item => !item.parsedDate)
    };
  }

  function diffWeeks(fromDate, toDate) {
    if (!(fromDate instanceof Date) || isNaN(fromDate) || !(toDate instanceof Date) || isNaN(toDate)) return null;
    return Math.floor((toDate.getTime() - fromDate.getTime()) / (1000 * 60 * 60 * 24 * 7));
  }

  function getAgeInMonths(ageParts) {
    if (!ageParts) return null;
    return Number(ageParts.years || 0) * 12 + Number(ageParts.months || 0);
  }

  function getPcvCatchupPlan(context) {
    const ageParts = context.ageParts;
    const ageMonths = getAgeInMonths(ageParts);
    if (ageMonths === null) return null;

    if (ageMonths >= 60) {
      return { bucket: "OUT_OF_TARGET", targetTotalDoses: 0, minIntervalWeeks: 8 };
    }
    if (ageMonths >= 24) {
      return { bucket: "24_59_MONTHS", targetTotalDoses: 1, minIntervalWeeks: 8 };
    }
    if (ageMonths >= 12) {
      return { bucket: "12_23_MONTHS", targetTotalDoses: 2, minIntervalWeeks: 8 };
    }
    return { bucket: "LT12_MONTHS", targetTotalDoses: 3, minIntervalWeeks: 8 };
  }

  function evaluatePcvStatus(rule, context) {
    const kode = String(rule.KodeImunisasi || "").trim().toUpperCase();
    const plan = getPcvCatchupPlan(context);
    const bawahUmur = rule.StatusDiBawahUmur || "Belum cukup umur";
    const luarSasaran = rule.StatusDiLuarSasaran || "Tidak sesuai sasaran";
    if (!plan) return bawahUmur;

    const existing = context.existingImunisasiState || {};
    const current = existing[kode] || null;
    if (current && String(current.status || "").trim().toUpperCase() === "YA") return "";

    const history = getPcvHistoryFromStateMap(existing);
    const givenCount = history.givenCount;
    const trackingDate = context.tglPelacakan || new Date();
    const weeksSinceLastDose = history.lastDoseDate ? diffWeeks(history.lastDoseDate, trackingDate) : null;
    const enoughInterval = !history.lastDoseDate ? !history.hasAnyUndatedYes : (weeksSinceLastDose !== null && weeksSinceLastDose >= plan.minIntervalWeeks);

    if (plan.bucket === "OUT_OF_TARGET") return luarSasaran;

    if (plan.bucket === "24_59_MONTHS") {
      if (kode === "PCV1") return givenCount >= 1 ? luarSasaran : "";
      return luarSasaran;
    }

    if (plan.bucket === "12_23_MONTHS") {
      if (kode === "PCV1") return givenCount >= 1 ? luarSasaran : "";
      if (kode === "PCV2") {
        if (givenCount === 0) return bawahUmur;
        if (givenCount >= 2) return luarSasaran;
        return enoughInterval ? "" : bawahUmur;
      }
      return luarSasaran;
    }

    if (kode === "PCV1") {
      return compareMinAge(context.ageParts, rule) ? (givenCount >= 1 ? luarSasaran : "") : bawahUmur;
    }

    if (kode === "PCV2") {
      if (givenCount === 0) return bawahUmur;
      if (givenCount >= 2) return luarSasaran;
      const enoughAge = compareMinAge(context.ageParts, rule);
      return enoughAge && enoughInterval ? "" : bawahUmur;
    }

    if (kode === "PCV3") {
      if (givenCount < 2) return bawahUmur;
      if (givenCount >= 3) return luarSasaran;
      const enoughAge = compareMinAge(context.ageParts, rule);
      return enoughAge && enoughInterval ? "" : bawahUmur;
    }

    return "";
  }

  function hasExplicitMinAge(rule) {
    return Number(rule?.UmurMinHari || 0) > 0 || Number(rule?.UmurMinBulan || 0) > 0 || Number(rule?.UmurMinTahun || 0) > 0;
  }

  function buildRuleWithKelompokUsiaFallback(rule) {
    if (!rule) return rule;
    if (hasExplicitMinAge(rule)) return rule;

    const kelompok = String(rule.KelompokUsia || "").trim().toLowerCase();
    if (!kelompok) return rule;

    const nextRule = { ...rule };
    const match = kelompok.match(/(\d+)\s*(hari|bulan|tahun|sd|smp)/i);
    if (!match) return nextRule;

    const num = Number(match[1] || 0);
    const unit = String(match[2] || "").toLowerCase();

    if (unit === "hari") nextRule.UmurMinHari = num;
    else if (unit === "bulan") nextRule.UmurMinBulan = num;
    else if (unit === "tahun") nextRule.UmurMinTahun = num;

    return nextRule;
  }

  function getImunisasiRuleSortKey(rule) {
    const r = buildRuleWithKelompokUsiaFallback(rule);
    const basis = String(r?.BasisValidasi || "").toUpperCase();
    if (basis === "KELAS") {
      return (Number(r?.KelasMin || 0) * 100) + Number(r?.UrutanDosis || 0);
    }
    return (Number(r?.UmurMinTahun || 0) * 3650) + (Number(r?.UmurMinBulan || 0) * 30) + Number(r?.UmurMinHari || 0) + (Number(r?.UrutanDosis || 0) / 100);
  }

  function evaluateImunisasiStatus(rule, context) {
    const normalizedRule = buildRuleWithKelompokUsiaFallback(rule);
    const jk = normalizeSex(context.jk);
    const kelas = normalizeClassValue(context.kelasSaatIni);
    const statusSekolah = String(context.statusSekolah || "").trim().toUpperCase();

    const actualAgeParts = context.ageParts;
    const hasActualAge = !!actualAgeParts;
    const birthDate = context.birthDate || null;

    const estSchoolAge = estimateSchoolAgeFromClass(context.kelasSaatIni);
    const estimatedAgeParts = estSchoolAge ? buildAgePartsFromEstimatedYears(estSchoolAge.minYears) : null;
    const effectiveAgeParts = hasActualAge ? actualAgeParts : estimatedAgeParts;

    if (normalizedRule.JKTarget && normalizedRule.JKTarget !== "SEMUA" && jk && normalizedRule.JKTarget !== jk) {
      return normalizedRule.StatusDiLuarSasaran || "Tidak sesuai sasaran";
    }

    const introCheck = checkIntroduksiEligibility(normalizedRule, birthDate);
    if (introCheck.applies && introCheck.eligible === false) {
      return normalizedRule.StatusDiLuarSasaran || "Tidak sesuai sasaran";
    }

    const basis = String(normalizedRule.BasisValidasi || "").toUpperCase();

    if (basis === "KELAS") {
      const kelasMin = normalizedRule.KelasMin ? Number(normalizedRule.KelasMin) : null;
      const kelasMax = normalizedRule.KelasMax ? Number(normalizedRule.KelasMax) : null;

      if (hasActualAge) {
        const actualYears = Number(actualAgeParts.years || 0);
        if (actualYears < 6) return normalizedRule.StatusDiBawahUmur || "Belum cukup umur";
      }

      if (String(normalizedRule.ButuhSekolah || "").toUpperCase() === "YA" && statusSekolah !== "Sekolah") {
        if (hasActualAge && Number(actualAgeParts.years || 0) >= 6) return "";
        return normalizedRule.StatusDiBawahUmur || "Belum cukup umur";
      }

      if (kelas === null) {
        if (hasActualAge && Number(actualAgeParts.years || 0) >= 6) return "";
        return normalizedRule.StatusDiBawahUmur || "Belum cukup umur";
      }

      if (kelasMin !== null && kelas < kelasMin) return normalizedRule.StatusDiBawahUmur || "Belum cukup umur";
      if (kelasMax !== null && kelas > kelasMax) return normalizedRule.StatusDiLuarSasaran || "Tidak sesuai sasaran";
      return "";
    }

    if (basis === "UMUR_DAN_KELAS") {
      const cukupUmur = compareMinAge(effectiveAgeParts, normalizedRule);
      const masihMasukUmur = compareMaxAge(effectiveAgeParts, normalizedRule);
      const kelasMin = normalizedRule.KelasMin ? Number(normalizedRule.KelasMin) : null;
      const kelasMax = normalizedRule.KelasMax ? Number(normalizedRule.KelasMax) : null;

      if (!cukupUmur) return normalizedRule.StatusDiBawahUmur || "Belum cukup umur";
      if (!masihMasukUmur) return normalizedRule.StatusDiLuarSasaran || "Tidak sesuai sasaran";

      if (String(normalizedRule.ButuhSekolah || "").toUpperCase() === "YA" && statusSekolah !== "Sekolah") {
        if (hasActualAge && Number(actualAgeParts.years || 0) >= 6) return "";
        return normalizedRule.StatusDiBawahUmur || "Belum cukup umur";
      }

      if (kelas === null) {
        if (hasActualAge && Number(actualAgeParts.years || 0) >= 6) return "";
        return normalizedRule.StatusDiBawahUmur || "Belum cukup umur";
      }

      if (kelasMin !== null && kelas < kelasMin) return normalizedRule.StatusDiBawahUmur || "Belum cukup umur";
      if (kelasMax !== null && kelas > kelasMax) return normalizedRule.StatusDiLuarSasaran || "Tidak sesuai sasaran";

      return "";
    }

    const cukupUmur = compareMinAge(effectiveAgeParts, normalizedRule);
    if (!cukupUmur) return normalizedRule.StatusDiBawahUmur || "Belum cukup umur";
    if (!compareMaxAge(effectiveAgeParts, normalizedRule)) return normalizedRule.StatusDiLuarSasaran || "Tidak sesuai sasaran";
    return "";
  }

  function updateImunisasiSummary() {
    const tbody = document.getElementById("tbody-Riwayat Imunisasi");
    const txt = document.getElementById("imun-summary-text");
    const sub = document.getElementById("imun-summary-subtext");
    const dueEl = document.getElementById("imun-summary-due");
    const yesEl = document.getElementById("imun-summary-yes");
    const hidden = document.getElementById("Ringkasan Riwayat Imunisasi");

    if (!tbody || !txt || !sub || !dueEl || !yesEl || !hidden) return;

    const rows = Array.from(tbody.querySelectorAll("tr"));
    let relevantCount = 0;
    let documentedCount = 0;
    let yesCount = 0;
    let noCount = 0;
    let unknownCount = 0;

    rows.forEach(row => {
      const status = String(row.querySelector('select[data-name="Status"]')?.value || "").trim();
      if (!status || status === "Belum cukup umur" || status === "Tidak sesuai sasaran") return;
      relevantCount++;
      if (["Ya", "Tidak"].includes(status)) documentedCount++;
      if (status === "Ya") yesCount++;
      else if (status === "Tidak") noCount++;
      else unknownCount++;
    });

    dueEl.textContent = String(relevantCount);
    yesEl.textContent = String(yesCount);

    const umurText = document.getElementById("Umur (auto)")?.value || "umur tidak diketahui";
    const jkText = document.getElementById("JK")?.value || "jenis kelamin tidak diketahui";

    let summary = "Belum diringkas";
    const subParts = [`Ringkasan riwayat imunisasi untuk pasien usia ${umurText} dengan jenis kelamin ${jkText}.`];

    if (rows.length === 0) {
      summary = "Belum ada data";
      subParts.push("Baris riwayat imunisasi belum tersedia.");
    } else if (relevantCount === 0) {
      summary = "Belum ada item relevan";
      subParts.push("Belum ada item imunisasi yang relevan untuk usia/sasaran saat ini.");
    } else {
      summary = `${documentedCount}/${relevantCount} item terdokumentasi`;
      subParts.push(`${documentedCount} dari ${relevantCount} item imunisasi yang relevan sudah punya status dokumentasi.`);
      if (yesCount) subParts.push(`${yesCount} item tercatat Ya.`);
      if (noCount) subParts.push(`${noCount} item tercatat Tidak.`);
      if (unknownCount) subParts.push(`${unknownCount} item masih kosong / belum dipastikan.`);
    }

    txt.textContent = summary;
    sub.textContent = subParts.join(" ");
    hidden.value = `${summary} — ${subParts.join(" ")}`;

    if (documentedCount === 0) txt.className = "mt-2 text-lg font-black text-blue-900";
    else if (documentedCount < relevantCount) txt.className = "mt-2 text-lg font-black text-amber-700";
    else txt.className = "mt-2 text-lg font-black text-green-700";
  }

  function buildRiwayatImunisasiRows() {
    const tbody = document.getElementById("tbody-Riwayat Imunisasi");
    if (!tbody) return;

    const existingImunisasiState = collectExistingImunisasiState(tbody);
    const birthDate = parseDateSafe(document.getElementById("Tanggal Lahir")?.value);
    const tglPelacakan = parseDateSafe(document.getElementById("Tanggal Pelacakan")?.value) || new Date();
    const jk = document.getElementById("JK")?.value || "";
    const statusSekolah = document.getElementById("Apakah sekolah/bekerja?")?.value || "";
    const kelasSaatIni = document.getElementById("Kelas Saat Ini")?.value || "";

    tbody.innerHTML = "";

    const ageParts = diffAgeParts(birthDate, tglPelacakan);
    const context = { jk, statusSekolah, kelasSaatIni, ageParts, birthDate, tglPelacakan, existingImunisasiState };
    const hasCoreContext = !!birthDate && !!jk;
    const rules = Array.isArray(REF_IMUN) ? REF_IMUN.filter(r => r && r.KodeImunisasi && r.LabelImunisasi) : [];
    const ruleMap = getRuleMap();

    // debug log intentionally muted in production

    rules.forEach(rule => {
      const kode = String(rule.KodeImunisasi || "").trim().toUpperCase();
      const previous = existingImunisasiState[kode] || null;
      const preserveManualState = shouldPreserveManualImunisasiState(previous, ruleMap);
      const autoStatus = hasCoreContext ? evaluateImunisasiStatus(rule, context) : "";
      const finalStatus = preserveManualState ? (previous?.status || autoStatus || "") : (autoStatus || "");
      const finalTanggal = preserveManualState ? (previous?.tanggal || "") : "";
      const finalSumber = preserveManualState ? (previous?.sumber || "") : "";
      const finalKeterangan = preserveManualState ? (previous?.keterangan || rule.Catatan || "") : (rule.Catatan || "");

      const preset = {
        __kode: rule.KodeImunisasi,
        "Jenis Imunisasi": rule.LabelImunisasi,
        "Status": finalStatus,
        "Tanggal": finalTanggal,
        "Sumber Informasi": finalSumber,
        "Keterangan": finalKeterangan
      };

      window.addDynamicRow("Riwayat Imunisasi", preset);

      const lastRow = tbody.lastElementChild;
      if (!lastRow) return;

      const statusSelect = lastRow.querySelector('select[data-name="Status"]');
      const tglInput = lastRow.querySelector('input[data-name="Tanggal"]');
      const sumberSelect = lastRow.querySelector('select[data-name="Sumber Informasi"]');
      lastRow.dataset.statusOrigin = preserveManualState ? "manual" : "auto";
      if (statusSelect && !statusSelect.dataset.boundImunOrigin) {
        statusSelect.dataset.boundImunOrigin = "1";
        statusSelect.addEventListener("change", () => {
          lastRow.dataset.statusOrigin = ["Ya", "Tidak"].includes(statusSelect.value) ? "manual" : "auto";
          updateImunisasiSummary();
        });
      }
      if (tglInput && !tglInput.dataset.boundImunOrigin) {
        tglInput.dataset.boundImunOrigin = "1";
        tglInput.addEventListener("input", () => { lastRow.dataset.statusOrigin = "manual"; });
      }
      if (sumberSelect && !sumberSelect.dataset.boundImunOrigin) {
        sumberSelect.dataset.boundImunOrigin = "1";
        sumberSelect.addEventListener("change", () => { lastRow.dataset.statusOrigin = "manual"; });
      }
    });

    if (rules.length === 0) {
      // REF_IMUN may still be loading; silent here to avoid noisy console spam.
    }

    updateImunisasiSummary();
  }

  function forceBuildImunisasiWhenReady() {

  function ensureRiwayatImunisasiRowsReady() {
    const tbody = document.getElementById("tbody-Riwayat Imunisasi");
    if (!tbody) return;

    const buildNow = function() {
      const rules = Array.isArray(REF_IMUN) ? REF_IMUN.filter(function(r) {
        return r && r.KodeImunisasi && r.LabelImunisasi;
      }) : [];
      if (!rules.length) return false;
      if (tbody.children.length === 0) {
        buildRiwayatImunisasiRows();
      }
      return tbody.children.length > 0;
    };

    if (buildNow()) return;

    if (typeof safeGsRun === 'function' && safeGsRun() && SESSION_TOKEN) {
      google.script.run
        .withSuccessHandler(function(data) {
          REF_IMUN = Array.isArray(data) ? data : [];
          if (buildNow()) return;

          google.script.run
            .withSuccessHandler(function(simpleData) {
              if (Array.isArray(simpleData) && simpleData.length) {
                renderRiwayatImunisasiRowsSimple(simpleData);
              }
            })
            .withFailureHandler(function(err) {
              console.error("fetchRefImunSimple failed:", err);
            })
            .fetchRefImunSimple(SESSION_TOKEN);
        })
        .withFailureHandler(function(err) {
          console.error("ensureRiwayatImunisasiRowsReady/getRefImunisasi failed:", err);
        })
        .fetchRefImunData(SESSION_TOKEN);
    }
  }
