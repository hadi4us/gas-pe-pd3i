<script>

  function getSafeSessionToken() {
    try {
      if (typeof SESSION_TOKEN !== 'undefined') return SESSION_TOKEN || '';
    } catch (e) {}
    try {
      if (typeof window !== 'undefined' && typeof window.__PD3I_SESSION_TOKEN !== 'undefined') return window.__PD3I_SESSION_TOKEN || '';
    } catch (e) {}
    return '';
  }

  function getSafeSessionUser() {
    try {
      if (typeof SESSION_USER !== 'undefined') return SESSION_USER || null;
    } catch (e) {}
    try {
      if (typeof window !== 'undefined' && typeof window.__PD3I_SESSION_USER !== 'undefined') return window.__PD3I_SESSION_USER || null;
    } catch (e) {}
    return null;
  }

  function escapeHtml(text) {
    return String(text || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function renderAdminVerificationQueue(stats, dx) {
    const wrap = document.getElementById('dashboard-admin-queue');
    if (!wrap) return;

    const queue = stats && stats.verificationQueue ? stats.verificationQueue : null;
    const role = String((getSafeSessionUser() && getSafeSessionUser().role) || '').trim().toLowerCase();
    if (!queue || role !== 'admin') {
      wrap.classList.add('hidden');
      wrap.innerHTML = '';
      return;
    }

    const counts = queue.counts || { pending: 0, perluRevisi: 0, terverifikasi: 0 };
    const activeFilter = String(window.__ADMIN_QUEUE_FILTER || 'pending');
    const filterMap = {
      pending: Array.isArray(queue.pending) ? queue.pending : [],
      perluRevisi: Array.isArray(queue.perluRevisi) ? queue.perluRevisi : [],
      terverifikasi: Array.isArray(queue.terverifikasi) ? queue.terverifikasi : []
    };
    const allRows = filterMap.pending.concat(filterMap.perluRevisi, filterMap.terverifikasi);
    const seenPuskesmas = {};
    const puskesmasOptions = [];
    allRows.forEach(function(item) {
      const name = String(item && item.puskesmas || '').trim();
      if (!name || seenPuskesmas[name]) return;
      seenPuskesmas[name] = true;
      puskesmasOptions.push(name);
    });
    puskesmasOptions.sort(function(a, b) { return a.localeCompare(b); });

    const selectedPuskesmas = seenPuskesmas[String(window.__ADMIN_QUEUE_PUSKESMAS || '').trim()]
      ? String(window.__ADMIN_QUEUE_PUSKESMAS || '').trim()
      : '';
    if (selectedPuskesmas !== String(window.__ADMIN_QUEUE_PUSKESMAS || '').trim()) {
      window.__ADMIN_QUEUE_PUSKESMAS = selectedPuskesmas;
    }
    const selectedDate = String(window.__ADMIN_QUEUE_DATE || '').trim();
    const baseRows = filterMap[activeFilter] || [];
    const rows = baseRows.filter(function(item) {
      const puskesmasMatch = !selectedPuskesmas || String(item.puskesmas || '').trim() === selectedPuskesmas;
      const dateValue = String(item.inputAt || '').trim().slice(0, 10);
      const dateMatch = !selectedDate || dateValue === selectedDate;
      return puskesmasMatch && dateMatch;
    });

    function renderCard(label, count, cls) {
      return `<div class="pd3i-admin-queue-card ${cls}"><div class="pd3i-helper-text font-extrabold uppercase">${label}</div><div class="pd3i-admin-queue-count">${count}</div></div>`;
    }

    function renderTab(key, label, count) {
      const active = key === activeFilter ? ' is-active' : '';
      return `<button type="button" class="pd3i-admin-queue-tab${active}" data-admin-queue-filter="${key}">${label} (${count})</button>`;
    }

    const puskesmasOptionsHtml = ['<option value="">Semua puskesmas</option>']
      .concat(puskesmasOptions.map(function(name) {
        const selectedAttr = name === selectedPuskesmas ? ' selected' : '';
        return `<option value="${escapeHtml(name)}"${selectedAttr}>${escapeHtml(name)}</option>`;
      }))
      .join('');

    const listHtml = rows.length
      ? rows.map(function(item) {
          const recordKeyArg = JSON.stringify(String(item.recordKey || item.recordId || item.epid || ''));
          const dxArg = JSON.stringify(String(dx || document.getElementById('dashboard-dx')?.value || 'MR').trim());
          const inputDateText = String(item.inputAt || '').trim();
          const updatedDateText = String(item.updatedAt || '').trim();
          return `<div class="pd3i-admin-queue-row">
            <div class="flex flex-wrap items-start justify-between gap-3">
              <div>
                <strong>${escapeHtml(item.nama || '-')}</strong>
                <small>${escapeHtml(item.recordId || item.epid || '-')} • ${escapeHtml(item.puskesmas || '-')}</small>
              </div>
              <button type="button" class="pd3i-search-result-action" onclick='window.__openAdminQueueRecord && window.__openAdminQueueRecord(${recordKeyArg}, ${dxArg})'><i class="fas fa-folder-open"></i> Review</button>
            </div>
            <div class="pd3i-admin-queue-meta">
              <span class="pd3i-admin-queue-pill">${escapeHtml(item.statusVerifikasi || '-')}</span>
              <span class="pd3i-admin-queue-pill">${escapeHtml(item.kecamatan || '-')} / ${escapeHtml(item.kelurahan || '-')}</span>
              ${item.epid ? `<span class="pd3i-admin-queue-pill">EPID ${escapeHtml(item.epid)}</span>` : '<span class="pd3i-admin-queue-pill">Belum ada EPID final</span>'}
              ${inputDateText ? `<span class="pd3i-admin-queue-pill">Input ${escapeHtml(inputDateText.slice(0, 10))}</span>` : ''}
              ${updatedDateText ? `<span class="pd3i-admin-queue-pill">Update ${escapeHtml(updatedDateText.slice(0, 10))}</span>` : ''}
            </div>
            ${item.catatanVerifikasi ? `<small>Catatan: ${escapeHtml(item.catatanVerifikasi)}</small>` : ''}
          </div>`;
        }).join('')
      : '<div class="pd3i-empty-state">Belum ada kasus pada kombinasi filter ini.</div>';

    wrap.innerHTML = `
      <div class="pd3i-card-header-row mt-4">
        <div>
          <div class="pd3i-card-eyebrow">Admin verification queue</div>
          <h3 class="pd3i-card-title">Antrian review verifikasi</h3>
        </div>
        <span class="pd3i-badge-soft">Queue</span>
      </div>
      <div class="pd3i-admin-queue-grid">
        ${renderCard('Pending review', counts.pending || 0, 'pending')}
        ${renderCard('Perlu revisi', counts.perluRevisi || 0, 'revisi')}
        ${renderCard('Terverifikasi', counts.terverifikasi || 0, 'verified')}
      </div>
      <div class="pd3i-admin-queue-toolbar">
        ${renderTab('pending', 'Pending', counts.pending || 0)}
        ${renderTab('perluRevisi', 'Perlu Revisi', counts.perluRevisi || 0)}
        ${renderTab('terverifikasi', 'Terverifikasi', counts.terverifikasi || 0)}
      </div>
      <div class="pd3i-admin-queue-filterbar mt-3">
        <select id="dashboard-admin-queue-puskesmas" class="pd3i-shell-input">${puskesmasOptionsHtml}</select>
        <input id="dashboard-admin-queue-date" type="date" class="pd3i-shell-input" value="${escapeHtml(selectedDate)}">
        <button type="button" id="dashboard-admin-queue-reset" class="pd3i-ghost-button pd3i-inline-button"><i class="fas fa-rotate-left"></i> Reset filter</button>
      </div>
      <div class="pd3i-helper-text mt-3">Menampilkan <strong>${rows.length}</strong> dari <strong>${baseRows.length}</strong> kasus pada tab <strong>${escapeHtml(activeFilter)}</strong>.</div>
      <div class="pd3i-admin-queue-list">${listHtml}</div>
    `;
    wrap.classList.remove('hidden');

    wrap.querySelectorAll('[data-admin-queue-filter]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        window.__ADMIN_QUEUE_FILTER = String(btn.getAttribute('data-admin-queue-filter') || 'pending');
        renderAdminVerificationQueue(stats, dx);
      });
    });

    const puskesmasSelect = wrap.querySelector('#dashboard-admin-queue-puskesmas');
    const dateInput = wrap.querySelector('#dashboard-admin-queue-date');
    const resetBtn = wrap.querySelector('#dashboard-admin-queue-reset');
    if (puskesmasSelect) {
      puskesmasSelect.addEventListener('change', function() {
        window.__ADMIN_QUEUE_PUSKESMAS = String(puskesmasSelect.value || '').trim();
        renderAdminVerificationQueue(stats, dx);
      });
    }
    if (dateInput) {
      dateInput.addEventListener('change', function() {
        window.__ADMIN_QUEUE_DATE = String(dateInput.value || '').trim();
        renderAdminVerificationQueue(stats, dx);
      });
    }
    if (resetBtn) {
      resetBtn.addEventListener('click', function() {
        window.__ADMIN_QUEUE_PUSKESMAS = '';
        window.__ADMIN_QUEUE_DATE = '';
        renderAdminVerificationQueue(stats, dx);
      });
    }
  }

  function renderHotspotMap(stats, dx, tahun) {
    const mapWrap = document.getElementById('dashboard-hotspot-map');
    const listWrap = document.getElementById('dashboard-hotspot-list');
    const summary = stats && stats.coordinateSummary ? stats.coordinateSummary : null;
    if (!mapWrap || !listWrap) return;

    if (window.__PD3I_DASHBOARD_MAP) {
      try {
        window.__PD3I_DASHBOARD_MAP.remove();
      } catch (e) {}
      window.__PD3I_DASHBOARD_MAP = null;
    }

    const points = summary && Array.isArray(summary.points) ? summary.points : [];
    const topHotspots = summary && Array.isArray(summary.topHotspots) ? summary.topHotspots : [];
    if (!summary || !points.length) {
      mapWrap.innerHTML = '<div class="pd3i-empty-state">Belum ada koordinat valid pada filter dashboard ini.</div>';
      listWrap.innerHTML = '<div class="pd3i-empty-state">Belum ada hotspot yang bisa ditampilkan.</div>';
      return;
    }

    listWrap.innerHTML = topHotspots.length
      ? topHotspots.map(function(item, idx) {
          return `<button type="button" class="pd3i-hotspot-list-item" data-dashboard-drilldown-type="hotspot" data-dashboard-drilldown-key="${escapeHtml(item.key || '')}" data-dashboard-drilldown-label="${escapeHtml(item.label || 'Hotspot')}">
            <div>
              <div class="pd3i-hotspot-rank">#${idx + 1} ${escapeHtml(item.label || 'Titik koordinat')}</div>
              <div class="pd3i-helper-text">Lat ${escapeHtml(item.lat)} • Lon ${escapeHtml(item.lon)}</div>
            </div>
            <div class="pd3i-hotspot-count">${item.count || 0}</div>
          </button>`;
        }).join('')
      : '<div class="pd3i-empty-state">Belum ada hotspot yang bisa ditampilkan.</div>';

    if (!window.L) {
      mapWrap.innerHTML = '<div class="pd3i-empty-state">Library peta belum termuat. Coba refresh halaman untuk memuat hotspot map.</div>';
      return;
    }

    mapWrap.innerHTML = '';
    const map = window.L.map(mapWrap, { scrollWheelZoom: false });
    window.__PD3I_DASHBOARD_MAP = map;
    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const bounds = [];
    points.forEach(function(point) {
      const count = Math.max(1, parseInt(point.count || 1, 10));
      const radius = Math.min(26, 7 + (count - 1) * 2.5);
      const color = count >= 5 ? '#dc2626' : count >= 3 ? '#f97316' : '#2563eb';
      const marker = window.L.circleMarker([point.lat, point.lon], {
        radius: radius,
        color: color,
        weight: 2,
        fillColor: color,
        fillOpacity: 0.3
      }).addTo(map);
      marker.bindPopup(`<strong>${escapeHtml(point.label || 'Hotspot')}</strong><br>${escapeHtml([point.kecamatan, point.kelurahan].filter(Boolean).join(' / ') || 'Wilayah tidak diketahui')}<br>Kasus: ${count}<br>Lat: ${escapeHtml(point.lat)}<br>Lon: ${escapeHtml(point.lon)}<br><small>Klik marker untuk lihat daftar kasus.</small>`);
      marker.on('click', function() {
        openDashboardDrilldown('hotspot', point.key, [point.kecamatan, point.kelurahan].filter(Boolean).join(' / ') || point.label || 'Hotspot', dx, tahun);
      });
      bounds.push([point.lat, point.lon]);
    });

    if (bounds.length === 1) {
      map.setView(bounds[0], 14);
    } else {
      map.fitBounds(bounds, { padding: [24, 24] });
    }
    setTimeout(function() {
      try { map.invalidateSize(); } catch (e) {}
    }, 0);
  }


  function renderDashboardDrilldownPanel(result, dx, tahun) {
    const wrap = document.getElementById('dashboard-drilldown-panel');
    if (!wrap) return;

    if (!result || result.status === 'error') {
      wrap.classList.remove('hidden');
      wrap.innerHTML = `<div class="pd3i-empty-state">${escapeHtml((result && result.message) || 'Gagal memuat detail dashboard.')}</div>`;
      return;
    }

    const items = Array.isArray(result.items) ? result.items : [];
    const listHtml = items.length
      ? items.map(function(item) {
          const recordKeyArg = JSON.stringify(String(item.recordKey || item.recordId || item.epid || ''));
          const dxArg = JSON.stringify(String(dx || 'MR'));
          return `<div class="pd3i-dashboard-drilldown-item">
            <div class="flex flex-wrap items-start justify-between gap-3">
              <div>
                <strong>${escapeHtml(item.nama || '-')}</strong>
                <small>${escapeHtml(item.recordId || item.epid || '-')} • ${escapeHtml([item.kecamatan, item.kelurahan, item.rw ? 'RW ' + item.rw : '', item.rt ? 'RT ' + item.rt : ''].filter(Boolean).join(' / ') || '-')}</small>
              </div>
              <button type="button" class="pd3i-search-result-action" onclick='window.__openAdminQueueRecord && window.__openAdminQueueRecord(${recordKeyArg}, ${dxArg})'><i class="fas fa-folder-open"></i> Buka</button>
            </div>
            <div class="pd3i-admin-queue-meta">
              ${item.statusVerifikasi ? `<span class="pd3i-admin-queue-pill">${escapeHtml(item.statusVerifikasi)}</span>` : ''}
              ${item.statusKasus ? `<span class="pd3i-admin-queue-pill">${escapeHtml(item.statusKasus)}</span>` : ''}
              ${item.inputAt ? `<span class="pd3i-admin-queue-pill">Input ${escapeHtml(String(item.inputAt).slice(0, 10))}</span>` : ''}
              ${item.updatedAt ? `<span class="pd3i-admin-queue-pill">Update ${escapeHtml(String(item.updatedAt).slice(0, 10))}</span>` : ''}
            </div>
            ${item.alamat ? `<small>${escapeHtml(item.alamat)}</small>` : ''}
          </div>`;
        }).join('')
      : '<div class="pd3i-empty-state">Belum ada kasus pada drill-down ini.</div>';

    wrap.innerHTML = `
      <div class="pd3i-card-header-row mt-4">
        <div>
          <div class="pd3i-card-eyebrow">Dashboard drill-down</div>
          <h3 class="pd3i-card-title">${escapeHtml(result.label || 'Detail kasus')}</h3>
          <div class="pd3i-helper-text mt-1">Menampilkan <strong>${items.length}</strong> dari total <strong>${result.total || 0}</strong> kasus untuk filter ini.</div>
        </div>
        <button type="button" id="dashboard-drilldown-close" class="pd3i-ghost-button pd3i-inline-button"><i class="fas fa-xmark"></i> Tutup</button>
      </div>
      <div class="pd3i-dashboard-drilldown-list">${listHtml}</div>
    `;
    wrap.classList.remove('hidden');
    const closeBtn = wrap.querySelector('#dashboard-drilldown-close');
    if (closeBtn) {
      closeBtn.addEventListener('click', function() {
        window.__DASHBOARD_DRILLDOWN_STATE = null;
        wrap.classList.add('hidden');
        wrap.innerHTML = '';
      });
    }
  }

  function openDashboardDrilldown(type, key, label, dx, tahun) {
    const wrap = document.getElementById('dashboard-drilldown-panel');
    if (!wrap || !safeGsRun() || !getSafeSessionToken()) return;
    window.__DASHBOARD_DRILLDOWN_STATE = { type: type, key: key, label: label, dx: dx, tahun: tahun };
    wrap.classList.remove('hidden');
    wrap.innerHTML = '<div class="pd3i-empty-state"><i class="fas fa-spinner fa-spin mr-2"></i>Memuat daftar kasus...</div>';
    google.script.run
      .withSuccessHandler(function(res) {
        renderDashboardDrilldownPanel(res, dx, tahun);
      })
      .withFailureHandler(function(err) {
        renderDashboardDrilldownPanel({ status: 'error', message: String(err && err.message ? err.message : err) }, dx, tahun);
      })
      .getDashboardDrilldown(dx, tahun, { type: type, key: key, label: label }, getSafeSessionToken());
  }

  function bindDashboardDrilldownActions(dx, tahun) {
    window.__openAdminQueueRecord = function(recordKey, dxValue) {
      if (typeof window._loadRecordFromSearch_ === 'function') {
        window._loadRecordFromSearch_(recordKey, dxValue || dx || 'MR');
      } else {
        showTopAlert('Fungsi buka record belum siap. Coba lagi sebentar.', false);
      }
    };

    document.querySelectorAll('[data-dashboard-drilldown-type]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        const type = String(btn.getAttribute('data-dashboard-drilldown-type') || '').trim();
        const key = String(btn.getAttribute('data-dashboard-drilldown-key') || '').trim();
        const label = String(btn.getAttribute('data-dashboard-drilldown-label') || key).trim();
        if (!type || !key) return;
        openDashboardDrilldown(type, key, label, dx, tahun);
      });
    });
  }


// ============================================================
// DASHBOARD STATISTIK (Req 6.1–6.7)
// ============================================================

  function openDashboardSection(options) {
    const opts = options || {};
    const section = document.getElementById('section-dashboard');
    if (typeof applySidebarWorkspaceLayout === 'function') applySidebarWorkspaceLayout('dashboard');
    if (section) section.classList.remove('hidden');
    if (typeof initDashboard === 'function') initDashboard();
    if (typeof updateSidebarActiveState === 'function') updateSidebarActiveState('dashboard');
    if (section && opts.scroll !== false) {
      section.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    const content = document.getElementById('dashboard-content');
    const shouldAutoLoad = opts.autoLoad === true || (opts.autoLoad !== false && content && !content.dataset.loaded);
    if (shouldAutoLoad) loadDashboard();
  }

  function initDashboard() {
    // Isi dropdown tahun (5 tahun terakhir)
    const tahunEl = document.getElementById("dashboard-tahun");
    if (tahunEl && tahunEl.options.length === 0) {
      const now = new Date().getFullYear();
      for (let y = now; y >= now - 4; y--) {
        const opt = document.createElement("option");
        opt.value = y;
        opt.textContent = y;
        tahunEl.appendChild(opt);
      }
    }

    const btnLoad = document.getElementById("btn-load-dashboard");
    if (btnLoad && !btnLoad.dataset.bound) {
      btnLoad.dataset.bound = "1";
      btnLoad.addEventListener("click", loadDashboard);
    }

    const btnBack = document.getElementById("btn-dashboard-back-to-workspace");
    if (btnBack && !btnBack.dataset.bound) {
      btnBack.dataset.bound = "1";
      btnBack.addEventListener("click", function () {
        if (typeof openSidebarWorkspace === 'function') {
          openSidebarWorkspace('overview', { scroll: true, useRoute: true });
          return;
        }
        const target = document.getElementById('section-overview');
        if (typeof updateSidebarActiveState === 'function') updateSidebarActiveState('overview');
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }

    const btnDashboard = document.getElementById("btn-dashboard");
    if (btnDashboard && !btnDashboard.dataset.bound) {
      btnDashboard.dataset.bound = "1";
      btnDashboard.addEventListener("click", function () {
        const dd = document.getElementById("admin-menu-dropdown");
        if (dd) dd.classList.add("hidden");
        openDashboardSection({ autoLoad: false });
      });
    }

    // Export CSV
    const btnExport = document.getElementById("btn-export-csv");
    if (btnExport && !btnExport.dataset.bound) {
      btnExport.dataset.bound = "1";
      btnExport.addEventListener("click", handleExportCsv);
    }
  }

  function loadDashboard() {
    const dx    = document.getElementById("dashboard-dx")?.value || "MR";
    const tahun = document.getElementById("dashboard-tahun")?.value || new Date().getFullYear();
    const content = document.getElementById("dashboard-content");
    if (!content) return;

    const section = document.getElementById('section-dashboard');
    if (section) section.classList.remove('hidden');
    content.dataset.loaded = '';
    const requestId = String(Date.now());
    content.dataset.loadingRequest = requestId;
    const runtimeGuard = (typeof createWorkspaceRuntimeGuard === 'function')
      ? createWorkspaceRuntimeGuard('dashboard')
      : null;
    content.innerHTML = '<div class="pd3i-dashboard-state is-loading"><span><i class="fas fa-spinner fa-spin mr-2"></i>Memuat data dashboard...</span></div>';

    if (!safeGsRun() || !getSafeSessionToken()) {
      content.innerHTML = '<div class="pd3i-dashboard-state is-error">Tidak dapat terhubung ke server.</div>';
      return;
    }

    google.script.run
      .withSuccessHandler(function (stats) {
        if (content.dataset.loadingRequest !== requestId) return;
        if (runtimeGuard && typeof isWorkspaceRuntimeGuardActive === 'function' && !isWorkspaceRuntimeGuardActive(runtimeGuard)) return;
        renderDashboard(stats, dx, tahun);
      })
      .withFailureHandler(function (err) {
        if (content.dataset.loadingRequest !== requestId) return;
        if (runtimeGuard && typeof isWorkspaceRuntimeGuardActive === 'function' && !isWorkspaceRuntimeGuardActive(runtimeGuard)) return;
        content.innerHTML = '<div class="pd3i-dashboard-state is-error">Gagal memuat data: ' + String(err) + '</div>';
      })
      .getDashboardStats(dx, tahun, getSafeSessionToken());
  }

  function renderDashboard(stats, dx, tahun) {
    const content = document.getElementById("dashboard-content");
    if (!content) return;

    if (!stats || stats.status === "error") {
      content.dataset.loaded = '';
      content.innerHTML = '<div class="pd3i-dashboard-state is-error">' + (stats && stats.message || "Gagal memuat data.") + '</div>';
      return;
    }

    const safeUser = getSafeSessionUser();
    const isAdmin = safeUser && safeUser.role === "admin";
    const isViewer = safeUser && safeUser.role === "viewer";

    let html = '';

    // Total kasus (Req 6.1)
    html += `<div class="pd3i-dashboard-overview-grid mb-6">
      <div class="pd3i-dashboard-metric-card tone-emerald is-hero">
        <div class="text-xs font-extrabold uppercase text-emerald-700 mb-1">Total Kasus ${dx} ${tahun}</div>
        <div class="text-4xl font-black text-emerald-900">${stats.totalKasus || 0}</div>
      </div>`;

    // Status notifikasi email & sinkronisasi MR (Req 6.7) — admin only
    if (isAdmin && dx === "MR" && stats.statusNotifikasi) {
      const n = stats.statusNotifikasi;
      html += `<div class="pd3i-dashboard-metric-card tone-blue">
        <div class="text-xs font-extrabold uppercase text-blue-700 mb-2">Notifikasi Email</div>
        <div class="pd3i-dashboard-submetric-grid">
          <div class="pd3i-dashboard-submetric"><div class="text-xl font-black text-green-700">${n.sent}</div><div class="text-xs text-slate-500">Terkirim</div></div>
          <div class="pd3i-dashboard-submetric"><div class="text-xl font-black text-red-600">${n.failed}</div><div class="text-xs text-slate-500">Gagal</div></div>
          <div class="pd3i-dashboard-submetric"><div class="text-xl font-black text-amber-600">${n.pending}</div><div class="text-xs text-slate-500">Pending</div></div>
        </div>
      </div>`;

      const s = stats.statusSinkronisasi || {};
      html += `<div class="pd3i-dashboard-metric-card tone-purple">
        <div class="text-xs font-extrabold uppercase text-purple-700 mb-2">Sinkronisasi Pengampu</div>
        <div class="pd3i-dashboard-submetric-grid">
          <div class="pd3i-dashboard-submetric"><div class="text-xl font-black text-green-700">${s.synced || 0}</div><div class="text-xs text-slate-500">Synced</div></div>
          <div class="pd3i-dashboard-submetric"><div class="text-xl font-black text-red-600">${s.failed || 0}</div><div class="text-xs text-slate-500">Gagal</div></div>
          <div class="pd3i-dashboard-submetric"><div class="text-xl font-black text-amber-600">${s.pending || 0}</div><div class="text-xs text-slate-500">Pending</div></div>
        </div>
      </div>`;
    }

    html += `</div>`;

    const qc = stats.qualityCards || {};
    html += `<div class="pd3i-dashboard-block mb-6">
      <div class="pd3i-dashboard-block-title">Kartu Mutu / Status Operasional</div>
      <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-5 gap-3">
        <div class="pd3i-dashboard-metric-card tone-amber">
          <div class="text-xs font-extrabold uppercase text-amber-700 mb-1">Belum / Menunggu Verifikasi</div>
          <div class="text-2xl font-black text-amber-900">${qc.pendingVerification || 0}</div>
        </div>
        <div class="pd3i-dashboard-metric-card tone-sky">
          <div class="text-xs font-extrabold uppercase text-sky-700 mb-1">Menunggu Hasil Sampel</div>
          <div class="text-2xl font-black text-sky-900">${qc.waitingSampleResult || 0}</div>
        </div>
        <div class="pd3i-dashboard-metric-card tone-emerald">
          <div class="text-xs font-extrabold uppercase text-emerald-700 mb-1">Kasus Konfirmasi</div>
          <div class="text-2xl font-black text-emerald-900">${qc.confirmed || 0}</div>
        </div>
        <div class="pd3i-dashboard-metric-card tone-rose">
          <div class="text-xs font-extrabold uppercase text-rose-700 mb-1">Discarded</div>
          <div class="text-2xl font-black text-rose-900">${qc.discarded || 0}</div>
        </div>
        <div class="pd3i-dashboard-metric-card tone-indigo">
          <div class="text-xs font-extrabold uppercase text-indigo-700 mb-1">Klinis</div>
          <div class="text-2xl font-black text-indigo-900">${qc.clinical || 0}</div>
        </div>
      </div>
    </div>`;

    const epi = stats.epidemiology || {};
    html += `<div class="pd3i-dashboard-block mb-6">
      <div class="pd3i-dashboard-block-title">Indikator Epidemiologis Ringkas</div>
      <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-3">
        <div class="pd3i-dashboard-metric-card tone-neutral">
          <div class="text-xs font-extrabold uppercase text-slate-500 mb-1">Median laporan → pelacakan</div>
          <div class="text-2xl font-black text-slate-900">${epi.medianReportToTrackingDays != null ? epi.medianReportToTrackingDays + ' hari' : '-'}</div>
        </div>
        <div class="pd3i-dashboard-metric-card tone-neutral">
          <div class="text-xs font-extrabold uppercase text-slate-500 mb-1">Pelacakan hari yang sama</div>
          <div class="text-2xl font-black text-slate-900">${epi.sameDayReportTrackingRate != null ? epi.sameDayReportTrackingRate + '%' : '-'}</div>
        </div>
        <div class="pd3i-dashboard-metric-card tone-neutral">
          <div class="text-xs font-extrabold uppercase text-slate-500 mb-1">Median onset → laporan</div>
          <div class="text-2xl font-black text-slate-900">${epi.medianOnsetToReportDays != null ? epi.medianOnsetToReportDays + ' hari' : '-'}</div>
        </div>
        <div class="pd3i-dashboard-metric-card tone-neutral">
          <div class="text-xs font-extrabold uppercase text-slate-500 mb-1">Kelengkapan workflow</div>
          <div class="text-2xl font-black text-slate-900">${epi.workflowCompletenessRate != null ? epi.workflowCompletenessRate + '%' : '-'}</div>
        </div>
      </div>
    </div>`;

    const actionAlerts = [];
    if ((qc.pendingVerification || 0) > 0) actionAlerts.push(`${qc.pendingVerification} kasus masih belum / menunggu verifikasi EPID.`);
    if ((qc.waitingSampleResult || 0) > 0) actionAlerts.push(`${qc.waitingSampleResult} kasus menunggu hasil sampel.`);
    if (epi.workflowCompletenessRate != null && epi.workflowCompletenessRate < 70) actionAlerts.push(`Kelengkapan workflow baru ${epi.workflowCompletenessRate}% — perlu perapihan data.`);
    if (epi.medianReportToTrackingDays != null && epi.medianReportToTrackingDays > 2) actionAlerts.push(`Median laporan ke pelacakan ${epi.medianReportToTrackingDays} hari — timeliness perlu dipercepat.`);

    if (actionAlerts.length > 0) {
      html += `<div class="pd3i-dashboard-alert mb-6">
        <div class="text-sm font-extrabold text-amber-800 mb-3 uppercase tracking-wide">Prioritas Tindak Lanjut</div>
        <ul class="list-disc pl-5 space-y-2 text-sm font-semibold text-amber-900">`;
      actionAlerts.forEach(function(msg) {
        html += `<li>${msg}</li>`;
      });
      html += `</ul></div>`;
    }

    const coordinateSummary = stats.coordinateSummary || {};
    const coordinatePoints = Array.isArray(coordinateSummary.points) ? coordinateSummary.points : [];
    if (coordinatePoints.length > 0) {
      html += `<div class="pd3i-dashboard-block mb-6">
        <div class="pd3i-dashboard-block-title">Hotspot Koordinat Kasus</div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
          <div class="pd3i-dashboard-metric-card tone-sky">
            <div class="text-xs font-extrabold uppercase text-sky-700 mb-1">Kasus bertitik koordinat</div>
            <div class="text-2xl font-black text-sky-900">${coordinateSummary.totalWithCoordinates || 0}</div>
          </div>
          <div class="pd3i-dashboard-metric-card tone-amber">
            <div class="text-xs font-extrabold uppercase text-orange-700 mb-1">Cluster hotspot</div>
            <div class="text-2xl font-black text-orange-900">${coordinateSummary.clusteredPointCount || 0}</div>
          </div>
          <div class="pd3i-dashboard-metric-card tone-neutral">
            <div class="text-xs font-extrabold uppercase text-slate-600 mb-1">Tanpa koordinat</div>
            <div class="text-2xl font-black text-slate-900">${coordinateSummary.missingCoordinates || 0}</div>
          </div>
        </div>
        <div class="grid grid-cols-1 xl:grid-cols-[minmax(0,2fr)_minmax(320px,1fr)] gap-4">
          <div class="pd3i-dashboard-panel">
            <div class="pd3i-hotspot-legend mb-3">
              <span class="pd3i-hotspot-legend-item"><span class="dot is-low"></span> 1-2 kasus</span>
              <span class="pd3i-hotspot-legend-item"><span class="dot is-mid"></span> 3-4 kasus</span>
              <span class="pd3i-hotspot-legend-item"><span class="dot is-high"></span> ≥5 kasus</span>
            </div>
            <div id="dashboard-hotspot-map" class="pd3i-hotspot-map"></div>
          </div>
          <div class="pd3i-dashboard-panel">
            <div class="text-sm font-extrabold text-slate-700 mb-3 uppercase tracking-wide">Top Hotspot</div>
            <div id="dashboard-hotspot-list" class="pd3i-hotspot-list"></div>
          </div>
        </div>
      </div>`;
    }

    html += `<div id="dashboard-drilldown-panel" class="mb-6 hidden"></div>`;

    if (isAdmin) {
      html += `<div id="dashboard-admin-queue" class="mb-6"></div>`;
    }

    const wilayah = stats.wilayahSummary || {};
    const topKecamatan = Array.isArray(wilayah.topKecamatan) ? wilayah.topKecamatan : [];
    const topKelurahan = Array.isArray(wilayah.topKelurahan) ? wilayah.topKelurahan : [];
    const topRw = Array.isArray(wilayah.topRw) ? wilayah.topRw : [];
    const topRtRw = Array.isArray(wilayah.topRtRw) ? wilayah.topRtRw : [];
    function renderWilayahRows(items, emptyLabel, type) {
      if (!items || !items.length) {
        return `<tr><td colspan="2" class="px-3 py-4 text-sm text-slate-400">${emptyLabel}</td></tr>`;
      }
      return items.map(function(item) {
        return `<tr class="border-b border-slate-100 hover:bg-slate-50">
          <td class="px-3 py-2 font-semibold text-slate-700"><button type="button" class="pd3i-dashboard-link-button" data-dashboard-drilldown-type="${escapeHtml(type || '')}" data-dashboard-drilldown-key="${escapeHtml(item.label || '')}" data-dashboard-drilldown-label="${escapeHtml(item.label || '')}">${escapeHtml(item.label || '-')}</button></td>
          <td class="px-3 py-2 text-right font-extrabold text-emerald-700">${item.count || 0}</td>
        </tr>`;
      }).join('');
    }
    if (topKecamatan.length > 0 || topKelurahan.length > 0 || topRw.length > 0 || topRtRw.length > 0) {
      html += `<div class="pd3i-dashboard-block mb-6">
        <div class="pd3i-dashboard-block-title">Sebaran Wilayah Operasional</div>
        <div class="grid grid-cols-2 xl:grid-cols-4 gap-3 mb-4">
          <div class="pd3i-dashboard-metric-card tone-sky">
            <div class="text-xs font-extrabold uppercase text-cyan-700 mb-1">Kecamatan aktif</div>
            <div class="text-2xl font-black text-cyan-900">${wilayah.kecamatanCount || 0}</div>
          </div>
          <div class="pd3i-dashboard-metric-card tone-emerald">
            <div class="text-xs font-extrabold uppercase text-teal-700 mb-1">Kelurahan aktif</div>
            <div class="text-2xl font-black text-teal-900">${wilayah.kelurahanCount || 0}</div>
          </div>
          <div class="pd3i-dashboard-metric-card tone-indigo">
            <div class="text-xs font-extrabold uppercase text-violet-700 mb-1">RW aktif</div>
            <div class="text-2xl font-black text-violet-900">${wilayah.rwCount || 0}</div>
          </div>
          <div class="pd3i-dashboard-metric-card tone-purple">
            <div class="text-xs font-extrabold uppercase text-fuchsia-700 mb-1">Cluster RT/RW terisi</div>
            <div class="text-2xl font-black text-fuchsia-900">${wilayah.rtRwCount || 0}</div>
          </div>
        </div>
        <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
          <div class="pd3i-dashboard-panel pd3i-dashboard-panel-table overflow-x-auto">
            <div class="text-sm font-extrabold text-slate-700 mb-3 uppercase tracking-wide">Top Kecamatan</div>
            <table class="w-full text-sm">
              <thead><tr class="bg-slate-100"><th class="text-left px-3 py-2 font-extrabold text-slate-600">Wilayah</th><th class="text-right px-3 py-2 font-extrabold text-slate-600">Kasus</th></tr></thead>
              <tbody>${renderWilayahRows(topKecamatan, 'Belum ada data kecamatan.', 'kecamatan')}</tbody>
            </table>
          </div>
          <div class="pd3i-dashboard-panel pd3i-dashboard-panel-table overflow-x-auto">
            <div class="text-sm font-extrabold text-slate-700 mb-3 uppercase tracking-wide">Top Kelurahan</div>
            <table class="w-full text-sm">
              <thead><tr class="bg-slate-100"><th class="text-left px-3 py-2 font-extrabold text-slate-600">Wilayah</th><th class="text-right px-3 py-2 font-extrabold text-slate-600">Kasus</th></tr></thead>
              <tbody>${renderWilayahRows(topKelurahan, 'Belum ada data kelurahan.', 'kelurahan')}</tbody>
            </table>
          </div>
          <div class="pd3i-dashboard-panel pd3i-dashboard-panel-table overflow-x-auto">
            <div class="text-sm font-extrabold text-slate-700 mb-3 uppercase tracking-wide">Top RW</div>
            <table class="w-full text-sm">
              <thead><tr class="bg-slate-100"><th class="text-left px-3 py-2 font-extrabold text-slate-600">Cluster</th><th class="text-right px-3 py-2 font-extrabold text-slate-600">Kasus</th></tr></thead>
              <tbody>${renderWilayahRows(topRw, 'Belum ada data RW.', 'rw')}</tbody>
            </table>
          </div>
          <div class="pd3i-dashboard-panel pd3i-dashboard-panel-table overflow-x-auto">
            <div class="text-sm font-extrabold text-slate-700 mb-3 uppercase tracking-wide">Top Cluster RT/RW</div>
            <table class="w-full text-sm">
              <thead><tr class="bg-slate-100"><th class="text-left px-3 py-2 font-extrabold text-slate-600">Cluster</th><th class="text-right px-3 py-2 font-extrabold text-slate-600">Kasus</th></tr></thead>
              <tbody>${renderWilayahRows(topRtRw, 'Belum ada data RT/RW lengkap.', 'rtrw')}</tbody>
            </table>
          </div>
        </div>
      </div>`;
    }

    const perStatus = stats.perStatusKasus || {};
    const statusKeys = Object.keys(perStatus).sort(function(a, b) { return perStatus[b] - perStatus[a]; });
    if (statusKeys.length > 0) {
      html += `<div class="pd3i-dashboard-block mb-6">
        <div class="pd3i-dashboard-block-title">Distribusi Status Kasus</div>
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">`;
      statusKeys.forEach(function (k) {
        html += `<div class="pd3i-dashboard-metric-card tone-neutral">
          <div class="text-xs font-extrabold uppercase text-slate-500 mb-1">Status</div>
          <div class="text-sm font-bold text-slate-700">${escapeHtml(k)}</div>
          <div class="text-2xl font-black text-blue-700 mt-2">${perStatus[k]}</div>
        </div>`;
      });
      html += `</div></div>`;
    }

    const perJK = stats.perJenisKelamin || {};
    const jkKeys = Object.keys(perJK).sort(function(a, b) { return perJK[b] - perJK[a]; });
    const perUmur = stats.perKelompokUmur || {};
    const umurKeys = Object.keys(perUmur).sort(function(a, b) { return perUmur[b] - perUmur[a]; });
    if (jkKeys.length > 0 || umurKeys.length > 0) {
      html += `<div class="pd3i-dashboard-block mb-6">
      <div class="pd3i-dashboard-two-column">`;
      if (jkKeys.length > 0) {
        html += `<div class="pd3i-dashboard-panel pd3i-dashboard-panel-table">
          <div class="pd3i-dashboard-block-title is-sub">Distribusi Jenis Kelamin</div>`;
        jkKeys.forEach(function(k) {
          html += `<div class="flex items-center justify-between py-2 border-b border-slate-100 last:border-b-0">
            <span class="text-sm font-semibold text-slate-700">${escapeHtml(k)}</span>
            <span class="text-base font-black text-blue-700">${perJK[k]}</span>
          </div>`;
        });
        html += `</div>`;
      }
      if (umurKeys.length > 0) {
        html += `<div class="pd3i-dashboard-panel pd3i-dashboard-panel-table">
          <div class="pd3i-dashboard-block-title is-sub">Distribusi Kelompok Umur</div>`;
        umurKeys.forEach(function(k) {
          html += `<div class="flex items-center justify-between py-2 border-b border-slate-100 last:border-b-0 gap-3">
            <span class="text-sm font-semibold text-slate-700">${escapeHtml(k)}</span>
            <span class="text-base font-black text-emerald-700">${perUmur[k]}</span>
          </div>`;
        });
        html += `</div>`;
      }
      html += `</div></div>`;
    }

    // Distribusi per bulan (Req 6.3)
    const perBulan = stats.perBulan || {};
    const bulanKeys = Object.keys(perBulan).sort();
    if (bulanKeys.length > 0) {
      const maxVal = Math.max(...bulanKeys.map(k => perBulan[k]));
      html += `<div class="pd3i-dashboard-block mb-6">
        <div class="pd3i-dashboard-block-title">Distribusi per Bulan</div>
        <div class="pd3i-dashboard-panel pd3i-dashboard-panel-table space-y-2">`;
      bulanKeys.forEach(function (k) {
        const val = perBulan[k];
        const pct = maxVal > 0 ? Math.round((val / maxVal) * 100) : 0;
        const label = k.substring(0, 4) + "-" + k.substring(4, 6);
        html += `<div class="pd3i-dashboard-month-row">
          <div class="pd3i-dashboard-month-label">${label}</div>
          <div class="pd3i-dashboard-month-track">
            <div class="pd3i-dashboard-month-fill" style="width:${pct}%"></div>
          </div>
          <div class="pd3i-dashboard-month-value">${val}</div>
        </div>`;
      });
      html += `</div></div>`;
    }

    // Distribusi per kecamatan (Req 6.2)
    const perKec = stats.perKecamatan || {};
    const kecKeys = Object.keys(perKec).sort(function (a, b) { return perKec[b] - perKec[a]; });
    if (kecKeys.length > 0) {
      html += `<div class="pd3i-dashboard-block mb-4">
        <div class="pd3i-dashboard-block-title">Distribusi per Kecamatan</div>
        <div class="pd3i-dashboard-panel pd3i-dashboard-panel-table overflow-x-auto"><table class="w-full text-sm">
          <thead><tr class="bg-slate-100">
            <th class="text-left px-3 py-2 font-extrabold text-slate-600">Kecamatan</th>
            <th class="text-right px-3 py-2 font-extrabold text-slate-600">Jumlah Kasus</th>
          </tr></thead>
          <tbody>`;
      kecKeys.forEach(function (k) {
        html += `<tr class="border-b border-slate-100 hover:bg-slate-50">
          <td class="px-3 py-2 font-semibold text-slate-700">${escapeHtml(k)}</td>
          <td class="px-3 py-2 text-right font-extrabold text-emerald-700">${perKec[k]}</td>
        </tr>`;
      });
      html += `</tbody></table></div></div>`;
    }

    // Req 6.6: viewer tidak melihat tombol aksi admin
    if (!isViewer && isAdmin) {
      html += `<div class="pd3i-dashboard-exportbar mt-4 pt-4">
        <button type="button" onclick="handleExportCsv()" class="pd3i-primary-button pd3i-dashboard-export">
          <i class="fas fa-file-csv mr-1"></i> Export CSV ${dx} ${tahun}
        </button>
      </div>`;
    }

    content.dataset.loaded = '1';
    content.innerHTML = html;
    renderHotspotMap(stats, dx, tahun);
    if (isAdmin) {
      renderAdminVerificationQueue(stats, dx);
    }
    bindDashboardDrilldownActions(dx, tahun);
    if (window.__DASHBOARD_DRILLDOWN_STATE && window.__DASHBOARD_DRILLDOWN_STATE.dx === dx && String(window.__DASHBOARD_DRILLDOWN_STATE.tahun) === String(tahun)) {
      openDashboardDrilldown(
        window.__DASHBOARD_DRILLDOWN_STATE.type,
        window.__DASHBOARD_DRILLDOWN_STATE.key,
        window.__DASHBOARD_DRILLDOWN_STATE.label,
        dx,
        tahun
      );
    }
  }

  // ============================================================
  // EXPORT CSV (Req 7.1–7.6)
  // ============================================================
  function handleExportCsv() {
    const dx = document.getElementById("form-selector")?.value ||
               document.getElementById("dashboard-dx")?.value || "MR";
    if (!dx) { showTopAlert("Pilih jenis penyakit terlebih dahulu.", false); return; }
    if (!safeGsRun() || !getSafeSessionToken()) return;

    const today = new Date().toISOString().split("T")[0].replace(/-/g, "");
    const filename = dx + "_export_" + today + ".csv";

    showTopAlert("Mengekspor data " + dx + "...", true);

    google.script.run
      .withSuccessHandler(function (csv) {
        if (!csv || (typeof csv === "object" && csv.status === "error")) {
          showTopAlert((csv && csv.message) || "Gagal export CSV.", false);
          return;
        }
        // Trigger download
        const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement("a");
        a.href     = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showTopAlert("Export berhasil: " + filename, true);
      })
      .withFailureHandler(function (err) {
        showTopAlert("Gagal export: " + String(err), false);
      })
      .exportToCsv(dx, {}, getSafeSessionToken());
  }

  // ============================================================
  // KONFIRMASI RESET / BATAL EDIT (Req 14.1–14.5)
  // ============================================================

  /**
   * Konfirmasi sebelum reset form.
   * Req 14.1: tampilkan konfirmasi jika form berisi data
   * Req 14.5: reset langsung jika form kosong
   */
  function confirmAndReset() {
    if (_formHasData_()) {
      const confirmed = window.confirm(
        "Semua data yang sudah diisi akan dihapus dan form akan direset.\nLanjutkan?"
      );
      if (!confirmed) return;
    }
    const dx = document.getElementById("form-selector")?.value || "";
    clearFormDraft(dx);
    resetForNewEntry();
  }

  // Req 14.4: peringatan browser saat navigasi keluar dengan form berisi data
  window.addEventListener("beforeunload", function (e) {
    if (_formHasData_()) {
      e.preventDefault();
      e.returnValue = "";
    }
  });

  // Override tombol "Batal Edit / Reset Form" agar pakai konfirmasi
  // GAS HtmlService: gunakan window.onload sebagai fallback DOMContentLoaded
  function _initDashboardOnLoad_() {
    initDashboard();

    const btnCancel = document.getElementById("btn-cancel-edit");
    if (btnCancel && !btnCancel.dataset.confirmBound) {
      btnCancel.dataset.confirmBound = "1";
      btnCancel.addEventListener("click", function (e) {
        e.preventDefault();
        confirmAndReset();
      });
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", _initDashboardOnLoad_);
  } else {
    // DOM sudah siap (GAS HtmlService sering inject script setelah DOM ready)
    _initDashboardOnLoad_();
  }

</script>
