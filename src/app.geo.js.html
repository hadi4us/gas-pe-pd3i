<script>
// GEOLOCATION
  // ============================================================
  function initGeoButton() {
    const btn = document.getElementById("btn-ambil-lokasi");
    const latEl = document.getElementById("Latitude");
    const lonEl = document.getElementById("Longitude");
    const statusEl = document.getElementById("geo-status");

    if (!btn || !latEl || !lonEl || !statusEl) return;
    if (btn.dataset.bound === "1") return;
    btn.dataset.bound = "1";

    btn.addEventListener("click", function() {
      if (!navigator.geolocation) {
        statusEl.textContent = "Geolocation tidak didukung di perangkat/browser ini.";
        statusEl.className = "flex-1 px-4 py-3 rounded-lg border border-red-200 bg-red-50 text-red-700 text-sm font-semibold";
        return;
      }

      statusEl.textContent = "Sedang mengambil lokasi...";
      statusEl.className = "flex-1 px-4 py-3 rounded-lg border border-blue-200 bg-blue-50 text-blue-700 text-sm font-semibold";

      navigator.geolocation.getCurrentPosition(
        function(position) {
          const lat = position.coords.latitude.toFixed(6);
          const lon = position.coords.longitude.toFixed(6);
          latEl.value = lat;
          lonEl.value = lon;
          statusEl.textContent = `Lokasi berhasil diambil. Lat: ${lat}, Lon: ${lon}`;
          statusEl.className = "flex-1 px-4 py-3 rounded-lg border border-green-200 bg-green-50 text-green-700 text-sm font-semibold";
        },
        function(error) {
          let msg = "Gagal mengambil lokasi.";
          if (error.code === 1) msg = "Izin lokasi ditolak.";
          else if (error.code === 2) msg = "Lokasi tidak tersedia.";
          else if (error.code === 3) msg = "Permintaan lokasi timeout.";
          statusEl.textContent = msg;
          statusEl.className = "flex-1 px-4 py-3 rounded-lg border border-red-200 bg-red-50 text-red-700 text-sm font-semibold";
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    });
  }

  // ============================================================
  // WILAYAH
  // ============================================================
  function initWilayahDropdowns() {
    fetch(`${API_WILAYAH_BASE}/provinces.json`)
      .then(res => res.json())
      .then(data => {
        const provPelapor = document.getElementById("Provinsi");
        const provPasien = document.getElementById("Provinsi Pasien");

        if (provPelapor) {
          provPelapor.innerHTML = '<option value="">Pilih Provinsi</option>';
          data.forEach(p => {
            provPelapor.innerHTML += `<option value="${p.name}" data-id="${p.id}">${p.name}</option>`;
          });
        }

        if (provPasien) {
          provPasien.innerHTML = '<option value="">Pilih Provinsi</option>';
          data.forEach(p => {
            provPasien.innerHTML += `<option value="${p.name}" data-id="${p.id}">${p.name}</option>`;
          });
        }
      })
      .catch(err => console.error("load provinces failed:", err));
  }

  // ============================================================
  // REF FASKES
  // ============================================================
  window.loadFaskesRealtime = function(selectedUnitName) {
    if (!safeGsRun() || !SESSION_TOKEN) return;

    google.script.run
      .withSuccessHandler(function(data) {
        MASTER_FASKES = Array.isArray(data) ? data : [];

        const src = document.getElementById("Sumber Laporan");
        const currentSelected =
          selectedUnitName ||
          document.getElementById("Nama unit pelapor")?.value ||
          "";

        if (src && src.value) {
          initChoices(src.value, currentSelected);
        }

        if (document.getElementById("Nama Rumah Sakit")) {
          const currentRs = document.getElementById("Nama Rumah Sakit")?.value || "";
          initChoicesRumahSakit(currentRs);
        }
      })
      .withFailureHandler(function(err) {
        console.error("getFaskesFromSheet failed:", err);
        MASTER_FASKES = [];
      })
      .getFaskesFromSheet(SESSION_TOKEN);
  };

  function initChoices(jenis, selectedValue) {
    const selectEl = document.getElementById("Nama unit pelapor");
    if (!selectEl) return;

    const keepValue = String(selectedValue || "").trim();

    if (choicesInstance) {
      try { choicesInstance.destroy(); } catch (e) {}
      choicesInstance = null;
    }

    selectEl.disabled = false;
    selectEl.innerHTML = '<option value="">-- Pilih Unit --</option>';

    const upper = String(jenis || "").trim().toUpperCase();

    if (!upper) {
      selectEl.disabled = true;
      selectEl.innerHTML = '<option value="">Pilih sumber laporan dahulu...</option>';
    } else if (!["MASYARAKAT", "LAINNYA"].includes(upper)) {
      const filtered = (MASTER_FASKES || []).filter(f => String(f.jenis || "").trim().toUpperCase() === upper);

      filtered.forEach(f => {
        const opt = document.createElement("option");
        opt.value = f.nama;
        opt.textContent = f.nama;
        if (f.key) opt.setAttribute("data-key", f.key);
        selectEl.appendChild(opt);
      });

      if (filtered.length === 0) {
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "(Tidak ada data REF_FASKES untuk jenis ini)";
        selectEl.appendChild(opt);
      }
    } else {
      const opt = document.createElement("option");
      opt.value = upper;
      opt.textContent = upper;
      selectEl.appendChild(opt);
    }

    choicesInstance = new Choices(selectEl, {
      searchEnabled: true,
      itemSelectText: "",
      shouldSort: false,
      placeholder: true,
      placeholderValue: "-- Pilih Unit --",
      searchPlaceholderValue: "Cari unit..."
    });

    selectEl.removeAttribute("required");

    if (keepValue) {
      setTimeout(() => {
        try {
          const exists = Array.from(selectEl.options).some(opt => opt.value === keepValue);
          if (exists) {
            choicesInstance.setChoiceByValue(keepValue);
          }
        } catch (e) {
          console.warn("Gagal restore Nama unit pelapor:", e);
        }
      }, 80);
    }
  }

  function initChoicesRumahSakit(selectedValue) {
    const selectEl = document.getElementById("Nama Rumah Sakit");
    if (!selectEl) return;

    const keepValue = String(selectedValue || "").trim();

    if (rsChoicesInstance) {
      try { rsChoicesInstance.destroy(); } catch (e) {}
      rsChoicesInstance = null;
    }

    selectEl.disabled = false;
    selectEl.innerHTML = '<option value="">-- Pilih Rumah Sakit --</option>';

    const filtered = (MASTER_FASKES || []).filter(f =>
      String(f.jenis || "").trim().toUpperCase() === "RUMAH SAKIT"
    );

    filtered.forEach(f => {
      const opt = document.createElement("option");
      opt.value = f.nama;
      opt.textContent = f.nama;
      if (f.key) opt.setAttribute("data-key", f.key);
      selectEl.appendChild(opt);
    });

    rsChoicesInstance = new Choices(selectEl, {
      searchEnabled: true,
      itemSelectText: "",
      shouldSort: false,
      placeholder: true,
      placeholderValue: "-- Pilih Rumah Sakit --",
      searchPlaceholderValue: "Cari rumah sakit..."
    });

    selectEl.removeAttribute("required");

    if (keepValue) {
      setTimeout(() => {
        try {
          const exists = Array.from(selectEl.options).some(opt => opt.value === keepValue);
          if (exists) {
            rsChoicesInstance.setChoiceByValue(keepValue);
          }
        } catch (e) {
          console.warn("Gagal restore Nama Rumah Sakit:", e);
        }
      }, 120);
    }
  }

  // ============================================================
  // REF_IMUN
  // ============================================================
  function loadRefImunisasi() {
    if (!safeGsRun() || !SESSION_TOKEN) return Promise.resolve([]);

    return new Promise((resolve) => {
      google.script.run
        .withSuccessHandler(function(data) {
          REF_IMUN = Array.isArray(data) ? data : [];
          try {
            if (document.getElementById("tbody-Riwayat Imunisasi")) {
              ensureRiwayatImunisasiRowsReady();
            }
          } catch (e) {}
          resolve(REF_IMUN);
        })
        .withFailureHandler(function(err) {
          console.error("getRefImunisasi failed:", err);
          REF_IMUN = [];
          resolve([]);
        })
        .fetchRefImunData(SESSION_TOKEN);
    });
  }

  function evaluateImunisasiStatus(rule, context) {
    const jk = normalizeSex(context.jk);
    const kelas = normalizeClassValue(context.kelasSaatIni);
    const statusSekolah = String(context.statusSekolah || "").trim().toUpperCase();

    const actualAgeParts = context.ageParts;
    const hasActualAge = !!actualAgeParts;
    const birthDate = context.birthDate || null;

    const estSchoolAge = estimateSchoolAgeFromClass(context.kelasSaatIni);
    const estimatedAgeParts = estSchoolAge ? buildAgePartsFromEstimatedYears(estSchoolAge.minYears) : null;
    const effectiveAgeParts = hasActualAge ? actualAgeParts : estimatedAgeParts;

    if (rule.JKTarget && rule.JKTarget !== "SEMUA" && jk && rule.JKTarget !== jk) {
      return rule.StatusDiLuarSasaran || "Tidak sesuai sasaran";
    }

    const introCheck = checkIntroduksiEligibility(rule, birthDate);
    if (introCheck.applies && introCheck.eligible === false) {
      return rule.StatusDiLuarSasaran || "Tidak sesuai sasaran";
    }

    const basis = String(rule.BasisValidasi || "").toUpperCase();

    if (basis === "KELAS") {
      const kelasMin = rule.KelasMin ? Number(rule.KelasMin) : null;
      const kelasMax = rule.KelasMax ? Number(rule.KelasMax) : null;

      if (hasActualAge) {
        const actualYears = Number(actualAgeParts.years || 0);
        if (actualYears < 6) return rule.StatusDiBawahUmur || "Belum cukup umur";
      }

      if (String(rule.ButuhSekolah || "").toUpperCase() === "YA" && statusSekolah !== "SEKOLAH") {
        if (hasActualAge && Number(actualAgeParts.years || 0) >= 6) return "";
        return rule.StatusDiBawahUmur || "Belum cukup umur";
      }

      if (kelas === null) {
        if (hasActualAge && Number(actualAgeParts.years || 0) >= 6) return "";
        return rule.StatusDiBawahUmur || "Belum cukup umur";
      }

      if (kelasMin !== null && kelas < kelasMin) return rule.StatusDiBawahUmur || "Belum cukup umur";
      if (kelasMax !== null && kelas > kelasMax) return "";

      return "";
    }

    if (basis === "UMUR_DAN_KELAS") {
      const cukupUmur = compareMinAge(effectiveAgeParts, rule);
      const kelasMin = rule.KelasMin ? Number(rule.KelasMin) : null;
      const kelasMax = rule.KelasMax ? Number(rule.KelasMax) : null;

      if (!cukupUmur) return rule.StatusDiBawahUmur || "Belum cukup umur";

      if (String(rule.ButuhSekolah || "").toUpperCase() === "YA" && statusSekolah !== "SEKOLAH") {
        if (hasActualAge && Number(actualAgeParts.years || 0) >= 6) return "";
        return rule.StatusDiBawahUmur || "Belum cukup umur";
      }

      if (kelas === null) {
        if (hasActualAge && Number(actualAgeParts.years || 0) >= 6) return "";
        return rule.StatusDiBawahUmur || "Belum cukup umur";
      }

      if (kelasMin !== null && kelas < kelasMin) return rule.StatusDiBawahUmur || "Belum cukup umur";
      if (kelasMax !== null && kelas > kelasMax) return "";

      return "";
    }

    const cukupUmur = compareMinAge(effectiveAgeParts, rule);
    if (!cukupUmur) return rule.StatusDiBawahUmur || "Belum cukup umur";
    return "";
  }

  function updateImunisasiSummary() {
    const tbody = document.getElementById("tbody-Riwayat Imunisasi");
    const txt = document.getElementById("imun-summary-text");
    const sub = document.getElementById("imun-summary-subtext");
    const dueEl = document.getElementById("imun-summary-due");
    const yesEl = document.getElementById("imun-summary-yes");
    const hidden = document.getElementById("Kesimpulan Status Imunisasi");

    if (!tbody || !txt || !sub || !dueEl || !yesEl || !hidden) return;

    const rows = Array.from(tbody.querySelectorAll("tr"));
    let dueCount = 0;
    let yesCount = 0;

    rows.forEach(row => {
      const status = row.querySelector('select[data-name="Status"]')?.value || "";
      if (status === "Belum cukup umur" || status === "Tidak sesuai sasaran") return;
      dueCount++;
      if (status === "Ya") yesCount++;
    });

    dueEl.textContent = String(dueCount);
    yesEl.textContent = String(yesCount);

    const umurText = document.getElementById("Umur (auto)")?.value || "umur tidak diketahui";
    const jkText = document.getElementById("JK")?.value || "jenis kelamin tidak diketahui";

    let summary = "Belum dinilai";
    let subText = `Kesimpulan untuk anak dengan usia ${umurText} dan jenis kelamin ${jkText}.`;

    if (rows.length === 0) {
      summary = "Belum dinilai";
      subText += " Data riwayat imunisasi belum tersedia.";
    } else if (dueCount === 0) {
      summary = "Lengkap";
      subText += " Belum ada imunisasi yang sesuai jadwal sesuai usia/sasaran.";
    } else if (yesCount === dueCount) {
      summary = "Lengkap";
      subText += ` Semua ${dueCount} imunisasi yang sudah sesuai jadwal telah terisi "Ya".`;
    } else {
      summary = "Tidak lengkap";
      subText += ` ${yesCount} dari ${dueCount} imunisasi yang sudah sesuai jadwal terisi "Ya".`;
    }

    txt.textContent = summary;
    sub.textContent = subText;
    hidden.value = `${summary} — anak dengan usia ${umurText} dan jenis kelamin ${jkText}`;

    if (summary === "Lengkap") txt.className = "mt-2 text-lg font-black text-green-700";
    else if (summary === "Tidak lengkap") txt.className = "mt-2 text-lg font-black text-red-700";
    else txt.className = "mt-2 text-lg font-black text-blue-900";
  }

  function buildRiwayatImunisasiRows() {
    const tbody = document.getElementById("tbody-Riwayat Imunisasi");
    if (!tbody) return;

    const birthDate = parseDateSafe(document.getElementById("Tanggal Lahir")?.value);
    const tglPelacakan = parseDateSafe(document.getElementById("Tanggal Pelacakan")?.value) || new Date();
    const jk = document.getElementById("JK")?.value || "";
    const statusSekolah = document.getElementById("Status Sekolah")?.value || "";
    const kelasSaatIni = document.getElementById("Kelas Saat Ini")?.value || "";

    const rules = Array.isArray(REF_IMUN) ? REF_IMUN.filter(r => r && r.KodeImunisasi && r.LabelImunisasi) : [];
    tbody.innerHTML = "";

    if (rules.length === 0) {
      updateImunisasiSummary();
      return;
    }

    const ageParts = diffAgeParts(birthDate, tglPelacakan);
    const context = { jk, statusSekolah, kelasSaatIni, ageParts, birthDate };

    const sumberOptions = ["Buku KIA/KMS", "Kartu/rekam imunisasi", "Aplikasi/Sertifikat", "Ingatan orang tua/wali", "Catatan sekolah", "Tidak diketahui", "Lainnya"];
    const statusOptions = ["Ya", "Tidak", "Belum cukup umur", "Tidak sesuai sasaran"];

    const esc = (v) => String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

    rules.forEach(rule => {
      const autoStatus = evaluateImunisasiStatus(rule, context) || "";
      const locked = autoStatus === "Belum cukup umur" || autoStatus === "Tidak sesuai sasaran";

      const tr = document.createElement("tr");
      tr.className = "bg-white border-b hover:bg-slate-50 transition";
      tr.dataset.kodeImun = rule.KodeImunisasi;

      tr.innerHTML = `
        <td class="px-2 py-2">
          <input type="text" data-name="Jenis Imunisasi" class="bg-slate-100 cursor-not-allowed font-extrabold border border-slate-300 text-xs rounded block w-full p-1.5 w-72" value="${esc(rule.LabelImunisasi)}" readonly tabindex="-1">
        </td>
        <td class="px-2 py-2">
          <select data-name="Status" class="${locked ? 'bg-slate-100 cursor-not-allowed' : 'bg-slate-50'} border border-slate-300 text-xs rounded block w-full p-1.5 w-44" ${locked ? 'disabled' : ''}>
            <option value="">-</option>
            ${statusOptions.map(o => `<option value="${esc(o)}" ${o === autoStatus ? 'selected' : ''}>${esc(o)}</option>`).join("")}
          </select>
        </td>
        <td class="px-2 py-2">
          <input type="date" data-name="Tanggal" class="${locked ? 'bg-slate-100 cursor-not-allowed' : 'bg-slate-50'} border border-slate-300 text-xs rounded block w-full p-1.5 w-40" ${locked ? 'disabled' : ''}>
        </td>
        <td class="px-2 py-2">
          <select data-name="Sumber Informasi" class="${locked ? 'bg-slate-100 cursor-not-allowed' : 'bg-slate-50'} border border-slate-300 text-xs rounded block w-full p-1.5 w-52" ${locked ? 'disabled' : ''}>
            <option value="">-</option>
            ${sumberOptions.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join("")}
          </select>
        </td>
        <td class="px-2 py-2">
          <input type="text" data-name="Keterangan" class="bg-slate-50 border border-slate-300 text-xs rounded block w-full p-1.5 w-56" value="${esc(rule.Catatan || '')}">
        </td>
        <td class="px-2 py-2 text-center">
          <button type="button" onclick="removeDynamicRow(this, 'Riwayat Imunisasi')" class="text-red-400 hover:text-red-600 p-2">
            <i class="fas fa-trash"></i>
          </button>
        </td>
      `;

      tbody.appendChild(tr);

      const statusSelect = tr.querySelector('select[data-name="Status"]');
      if (statusSelect) statusSelect.addEventListener("change", updateImunisasiSummary);
    });

    updateImunisasiSummary();
  }

  function renderRiwayatImunisasiRowsSimple(simpleRows) {
    const tbody = document.getElementById("tbody-Riwayat Imunisasi");
    if (!tbody) return;
    tbody.innerHTML = "";

    const sumberOptions = ["Buku KIA/KMS", "Kartu/rekam imunisasi", "Aplikasi/Sertifikat", "Ingatan orang tua/wali", "Catatan sekolah", "Tidak diketahui", "Lainnya"];
    const statusOptions = ["Ya", "Tidak", "Belum cukup umur", "Tidak sesuai sasaran"];
    const esc = (v) => String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

    (simpleRows || []).forEach(rule => {
      const tr = document.createElement("tr");
      tr.className = "bg-white border-b hover:bg-slate-50 transition";
      tr.dataset.kodeImun = rule.KodeImunisasi;
      tr.innerHTML = `
        <td class="px-2 py-2"><input type="text" data-name="Jenis Imunisasi" class="bg-slate-100 cursor-not-allowed font-extrabold border border-slate-300 text-xs rounded block w-full p-1.5 w-72" value="${esc(rule.LabelImunisasi)}" readonly tabindex="-1"></td>
        <td class="px-2 py-2"><select data-name="Status" class="bg-slate-50 border border-slate-300 text-xs rounded block w-full p-1.5 w-44"><option value="">-</option>${statusOptions.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join("")}</select></td>
        <td class="px-2 py-2"><input type="date" data-name="Tanggal" class="bg-slate-50 border border-slate-300 text-xs rounded block w-full p-1.5 w-40"></td>
        <td class="px-2 py-2"><select data-name="Sumber Informasi" class="bg-slate-50 border border-slate-300 text-xs rounded block w-full p-1.5 w-52"><option value="">-</option>${sumberOptions.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join("")}</select></td>
        <td class="px-2 py-2"><input type="text" data-name="Keterangan" class="bg-slate-50 border border-slate-300 text-xs rounded block w-full p-1.5 w-56" value=""></td>
        <td class="px-2 py-2 text-center"><button type="button" onclick="removeDynamicRow(this, 'Riwayat Imunisasi')" class="text-red-400 hover:text-red-600 p-2"><i class="fas fa-trash"></i></button></td>
      `;
      tbody.appendChild(tr);
      const statusSelect = tr.querySelector('select[data-name="Status"]');
      if (statusSelect) statusSelect.addEventListener("change", updateImunisasiSummary);
    });
    updateImunisasiSummary();
  }

  function ensureRiwayatImunisasiRowsReady() {
    const tbody = document.getElementById("tbody-Riwayat Imunisasi");
    if (!tbody) return;

    const buildNow = () => {
      const rules = Array.isArray(REF_IMUN) ? REF_IMUN.filter(r => r && r.KodeImunisasi && r.LabelImunisasi) : [];
      if (!rules.length) return false;
      if (tbody.children.length === 0) {
        buildRiwayatImunisasiRows();
      }
      return tbody.children.length > 0;
    };

    if (buildNow()) return;

    if (safeGsRun() && SESSION_TOKEN) {
      google.script.run
        .withSuccessHandler(function(data) {
          REF_IMUN = Array.isArray(data) ? data : [];
          if (buildNow()) return;

          google.script.run
            .withSuccessHandler(function(simpleData) {
              if (Array.isArray(simpleData) && simpleData.length) {
                renderRiwayatImunisasiRowsSimple(simpleData);
              }
            })
            .withFailureHandler(function(err) {
              console.error("fetchRefImunSimple failed:", err);
            })
            .fetchRefImunSimple(SESSION_TOKEN);
        })
        .withFailureHandler(function(err) {
          console.error("ensureRiwayatImunisasiRowsReady/getRefImunisasi failed:", err);
        })
        .fetchRefImunData(SESSION_TOKEN);
    }
  }
</script>
