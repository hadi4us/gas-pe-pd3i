<div id="auth-boot-overlay" class="fixed inset-0 z-[99] flex items-center justify-center modal-backdrop px-2 py-3">
  <div class="w-full bg-white rounded-2xl p-4 sm:p-5 modal-card mx-auto text-center" style="max-width: 20rem;">
    <div class="w-14 h-14 rounded-full bg-blue-50 flex items-center justify-center mx-auto mb-3">
      <i class="fas fa-shield-halved text-blue-600 text-xl"></i>
    </div>
    <div class="text-base sm:text-lg font-bold text-slate-900">Memeriksa sesi akses…</div>
    <div class="text-[12px] sm:text-[13px] text-slate-500 mt-1.5 font-medium">Menyiapkan autentikasi aplikasi.</div>
  </div>
</div>

<div id="login-modal" class="fixed inset-0 z-[100] hidden items-start sm:items-center justify-center modal-backdrop overflow-y-auto px-2 py-2.5 sm:px-4 sm:py-4">
  <div id="login-card" class="w-full bg-white rounded-2xl p-4 sm:p-5 modal-card mx-auto my-auto" style="max-width: 21.5rem;">
    <div class="flex flex-col items-center text-center">
      <div class="w-14 h-14 rounded-full bg-blue-50 flex items-center justify-center mb-2.5">
        <i class="fas fa-user-shield text-blue-600 text-xl"></i>
      </div>
      <h1 class="text-lg sm:text-xl font-bold text-slate-900">Akses Surveilans PD3I</h1>
      <p class="text-[12px] sm:text-[13px] text-slate-500 mt-0.5 font-medium">Login petugas (PIN) + Captcha</p>
    </div>

    <div id="login-alert" class="hidden mt-3 p-2.5 rounded-lg text-[12px] sm:text-[13px] font-semibold border"></div>

    <form id="login-form" class="mt-4 space-y-3">
      <div>
        <label class="block text-[9px] sm:text-[10px] font-bold text-slate-600 uppercase tracking-[0.14em] mb-1">Username</label>
        <div class="relative">
          <i class="fas fa-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[10px] sm:text-[11px]"></i>
          <input id="login-username" type="text" autocomplete="username"
            class="w-full pl-8 sm:pl-9 pr-3 py-2 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-500 text-[12px] sm:text-[13px] font-medium"
            placeholder="username" />
        </div>
      </div>

      <div>
        <label class="block text-[9px] sm:text-[10px] font-bold text-slate-600 uppercase tracking-[0.14em] mb-1">Password / PIN</label>
        <div class="relative">
          <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[10px] sm:text-[11px]"></i>
          <input id="login-pin" type="password" autocomplete="current-password"
            class="w-full pl-8 sm:pl-9 pr-9 py-2 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-500 text-[12px] sm:text-[13px] font-medium"
            placeholder="PIN" />
          <button type="button" id="toggle-login-pin"
            class="absolute right-2 top-1/2 -translate-y-1/2 w-7 h-7 rounded-lg hover:bg-slate-100 text-slate-500 text-[10px] sm:text-[11px]">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="border border-slate-200 rounded-lg p-2.5 sm:p-3 bg-slate-50 space-y-1.5">
        <div class="flex items-center justify-between gap-2">
          <div class="text-[9px] sm:text-[10px] font-bold text-slate-600 uppercase tracking-[0.12em]">Captcha</div>
          <button type="button" id="btn-refresh-captcha"
            class="w-6 h-6 shrink-0 rounded-md border border-slate-200 bg-white hover:bg-slate-100 flex items-center justify-center text-[9px] leading-none">
            <i class="fas fa-rotate-right"></i>
          </button>
        </div>

        <div id="captcha-question" class="text-[15px] sm:text-lg font-bold tracking-wide text-slate-900 leading-none min-h-[18px]">...</div>

        <div>
          <input id="login-captcha-answer" inputmode="numeric" pattern="[0-9]*"
            class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-500 text-[11px] sm:text-[12px] font-medium"
            placeholder="Jawaban captcha" />
        </div>

        <div id="captcha-error" class="hidden p-1.5 rounded-lg bg-red-50 border border-red-200 text-red-700 text-[9px] sm:text-[10px] font-semibold">
          Captcha salah
        </div>
      </div>

      <button id="btn-login" type="submit"
        class="w-full mt-1 bg-blue-600 hover:bg-blue-700 text-white font-bold text-[13px] sm:text-sm py-2.5 rounded-xl shadow-lg shadow-blue-200 flex items-center justify-center gap-1.5">
        <span>Masuk</span> <i class="fas fa-arrow-right text-[10px] sm:text-[11px]"></i>
      </button>

      <div class="text-center text-[9px] sm:text-[10px] text-slate-400 font-bold tracking-[0.12em] mt-1.5">
        DINAS KESEHATAN KOTA DEPOK
      </div>
    </form>
  </div>
</div>
