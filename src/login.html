<div id="login-modal" class="fixed inset-0 z-[100] flex items-center justify-center modal-backdrop">
  <div id="login-card" class="w-full max-w-md bg-white rounded-2xl p-6 md:p-8 modal-card mx-4">
    <div class="flex flex-col items-center text-center">
      <div class="w-20 h-20 rounded-full bg-blue-50 flex items-center justify-center mb-4">
        <i class="fas fa-user-shield text-blue-600 text-3xl"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-slate-900">Akses Surveilans PD3I</h1>
      <p class="text-slate-500 mt-1 font-medium">Login petugas (PIN) + Captcha</p>
    </div>

    <div id="login-alert" class="hidden mt-5 p-3 rounded-lg text-sm font-bold border"></div>

    <form id="login-form" class="mt-6 space-y-4">
      <div>
        <label class="block text-xs font-extrabold text-slate-600 uppercase tracking-wider mb-2">Username</label>
        <div class="relative">
          <i class="fas fa-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input id="login-username" type="text" autocomplete="username"
            class="w-full pl-10 pr-3 py-3 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-500 font-bold"
            placeholder="username" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-extrabold text-slate-600 uppercase tracking-wider mb-2">Password / PIN</label>
        <div class="relative">
          <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input id="login-pin" type="password" autocomplete="current-password"
            class="w-full pl-10 pr-10 py-3 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-500 font-bold"
            placeholder="PIN" />
          <button type="button" id="toggle-login-pin"
            class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-lg hover:bg-slate-100 text-slate-500">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="border border-slate-200 rounded-2xl p-4 bg-slate-50">
        <div class="flex items-start justify-between gap-3">
          <div class="flex-1">
            <div class="text-xs font-extrabold text-slate-600 uppercase tracking-wider">Captcha</div>
            <div id="captcha-question" class="mt-1 text-2xl font-black tracking-wide text-slate-900 min-h-[32px]">...</div>
            <div class="mt-3">
              <input id="login-captcha-answer" inputmode="numeric" pattern="[0-9]*"
                class="w-full px-3 py-3 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-500 font-bold"
                placeholder="Jawaban captcha (angka)" />
              <div class="text-xs text-slate-500 mt-2 font-medium">Gunakan angka. Contoh: 8</div>
            </div>
          </div>

          <button type="button" id="btn-refresh-captcha"
            class="w-11 h-11 shrink-0 rounded-xl border border-slate-200 bg-white hover:bg-slate-100 flex items-center justify-center">
            <i class="fas fa-rotate-right"></i>
          </button>
        </div>

        <div id="captcha-error" class="hidden mt-3 p-2 rounded-lg bg-red-50 border border-red-200 text-red-700 text-xs font-bold">
          Captcha salah
        </div>
      </div>

      <button id="btn-login" type="submit"
        class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-lg py-4 rounded-2xl shadow-lg shadow-blue-200 flex items-center justify-center gap-3">
        <span>Masuk</span> <i class="fas fa-arrow-right"></i>
      </button>

      <div class="text-center text-xs text-slate-400 font-extrabold tracking-wider mt-3">
        DINAS KESEHATAN KOTA DEPOK
      </div>
    </form>
  </div>
</div>
