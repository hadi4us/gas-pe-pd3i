<div id="auth-boot-overlay" class="fixed inset-0 z-[99] flex items-center justify-center modal-backdrop">
  <div class="w-full max-w-sm bg-white rounded-2xl p-6 modal-card mx-4 text-center">
    <div class="w-16 h-16 rounded-full bg-blue-50 flex items-center justify-center mx-auto mb-4">
      <i class="fas fa-shield-halved text-blue-600 text-2xl"></i>
    </div>
    <div class="text-lg font-extrabold text-slate-900">Memeriksa sesi akses…</div>
    <div class="text-sm text-slate-500 mt-2 font-medium">Menyiapkan autentikasi aplikasi.</div>
  </div>
</div>

<div id="login-modal" class="fixed inset-0 z-[100] hidden items-start sm:items-center justify-center modal-backdrop overflow-y-auto px-3 py-4 sm:px-4 sm:py-6">
  <div id="login-card" class="w-full max-w-sm bg-white rounded-2xl p-5 sm:p-6 modal-card mx-auto my-auto">
    <div class="flex flex-col items-center text-center">
      <div class="w-16 h-16 rounded-full bg-blue-50 flex items-center justify-center mb-3">
        <i class="fas fa-user-shield text-blue-600 text-2xl"></i>
      </div>
      <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900">Akses Surveilans PD3I</h1>
      <p class="text-sm text-slate-500 mt-1 font-medium">Login petugas (PIN) + Captcha</p>
    </div>

    <div id="login-alert" class="hidden mt-4 p-3 rounded-lg text-sm font-bold border"></div>

    <form id="login-form" class="mt-5 space-y-3.5">
      <div>
        <label class="block text-[11px] font-extrabold text-slate-600 uppercase tracking-wider mb-1.5">Username</label>
        <div class="relative">
          <i class="fas fa-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input id="login-username" type="text" autocomplete="username"
            class="w-full pl-9 pr-3 py-2.5 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-500 font-bold text-sm"
            placeholder="username" />
        </div>
      </div>

      <div>
        <label class="block text-[11px] font-extrabold text-slate-600 uppercase tracking-wider mb-1.5">Password / PIN</label>
        <div class="relative">
          <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input id="login-pin" type="password" autocomplete="current-password"
            class="w-full pl-9 pr-10 py-2.5 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-500 font-bold text-sm"
            placeholder="PIN" />
          <button type="button" id="toggle-login-pin"
            class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-500 text-sm">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="border border-slate-200 rounded-2xl p-3.5 bg-slate-50">
        <div class="flex items-start justify-between gap-3">
          <div class="flex-1 min-w-0">
            <div class="text-[11px] font-extrabold text-slate-600 uppercase tracking-wider">Captcha</div>
            <div id="captcha-question" class="mt-1 text-xl sm:text-2xl font-black tracking-wide text-slate-900 min-h-[28px]">...</div>
            <div class="mt-2.5">
              <input id="login-captcha-answer" inputmode="numeric" pattern="[0-9]*"
                class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-500 font-bold text-sm"
                placeholder="Jawaban captcha (angka)" />
              <div class="text-[11px] text-slate-500 mt-1.5 font-medium">Gunakan angka. Contoh: 8</div>
            </div>
          </div>

          <button type="button" id="btn-refresh-captcha"
            class="w-10 h-10 shrink-0 rounded-xl border border-slate-200 bg-white hover:bg-slate-100 flex items-center justify-center text-sm">
            <i class="fas fa-rotate-right"></i>
          </button>
        </div>

        <div id="captcha-error" class="hidden mt-2.5 p-2 rounded-lg bg-red-50 border border-red-200 text-red-700 text-xs font-bold">
          Captcha salah
        </div>
      </div>

      <button id="btn-login" type="submit"
        class="w-full mt-1 bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-base py-3 rounded-xl shadow-lg shadow-blue-200 flex items-center justify-center gap-2.5">
        <span>Masuk</span> <i class="fas fa-arrow-right"></i>
      </button>

      <div class="text-center text-[11px] text-slate-400 font-extrabold tracking-wider mt-2">
        DINAS KESEHATAN KOTA DEPOK
      </div>
    </form>
  </div>
</div>
