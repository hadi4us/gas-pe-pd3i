<script>
// VALIDASI UMUR / KONSISTENSI EPIDEMIOLOGI
  // ============================================================
  function isCompleteDateValue(value) {
    const s = String(value || "").trim();
    return /^\d{4}-\d{2}-\d{2}$/.test(s);
  }

  function applyBirthValidationUI(res) {
    const umurEl = document.getElementById("Umur (auto)");
    const epiEl = document.getElementById("Kelompok Umur Epidemiologis");

    if (!res || !res.ok) {
      if (umurEl) umurEl.value = "";
      if (epiEl) epiEl.value = "";
      return false;
    }

    if (umurEl) umurEl.value = res.ageText || "";
    if (epiEl) epiEl.value = res.epiGroup || "";
    return true;
  }

  function validateAndApplyBirthUI(options) {
    const opts = options || {};
    const silent = opts.silent === true;
    const hard = opts.hard === true;

    const dobEl = document.getElementById("Tanggal Lahir");
    const refEl = document.getElementById("Tanggal Pelacakan");
    const umurEl = document.getElementById("Umur (auto)");
    const epiEl = document.getElementById("Kelompok Umur Epidemiologis");

    const dobValue = dobEl?.value || "";
    const refValue = refEl?.value || "";

    if (!isCompleteDateValue(dobValue)) {
      if (umurEl) umurEl.value = "";
      if (epiEl) epiEl.value = "";
      return { ok: false, pending: true };
    }

    const safeRefValue = isCompleteDateValue(refValue) ? refValue : "";
    const res = validateBirthDateEpi(dobValue, safeRefValue);

    if (!res.ok) {
      if (umurEl) umurEl.value = "";
      if (epiEl) epiEl.value = "";

      if (!silent && hard) {
        showTopAlert(res.message, false);
      }
      return res;
    }

    if (umurEl) umurEl.value = res.ageText || "";
    if (epiEl) epiEl.value = res.epiGroup || "";

    return res;
  }

  const NUMERIC_ONLY_EXACT_IDS = [
    "NIK Pasien",
    "No WhatsApp Petugas",
    "RT",
    "RW",
    "No. Kontak Orang Tua/Wali",
    "No Telp/WA Orang Tua/Wali",
    "No Telp Orang Tua/Wali",
    "No. Telp Orang Tua/Wali"
  ];

  const NUMERIC_ONLY_KEYWORDS = [
    "nik",
    "whatsapp",
    "no whatsapp",
    "no. whatsapp",
    "no telp",
    "no. telp",
    "kontak",
    "rt",
    "rw"
  ];

  function _normalizeFieldId_(value) {
    return String(value || "").trim().toLowerCase();
  }

  function isNumericOnlyFieldId(fieldId) {
    const id = _normalizeFieldId_(fieldId);
    if (!id) return false;

    if (NUMERIC_ONLY_EXACT_IDS.some(x => _normalizeFieldId_(x) === id)) return true;

    // batasan agar "rt/rw" tidak match ke kata lain sembarangan
    if (id === "rt" || id === "rw") return true;

    return NUMERIC_ONLY_KEYWORDS.some(k => id.includes(k));
  }

  function _sanitizeNumericValue_(value) {
    return String(value || "").replace(/\D+/g, "");
  }

  function enforceNumericOnlyInput(el) {
    if (!el || !el.id || !isNumericOnlyFieldId(el.id)) return;
    const cleaned = _sanitizeNumericValue_(el.value);
    if (String(el.value || "") !== cleaned) {
      el.value = cleaned;
    }
  }

  function validateNumericOnlyRequiredFields() {
    const invalids = [];
    const form = document.getElementById("dynamic-form");
    if (!form) return { ok: true, invalids: [] };

    form.querySelectorAll("input[name], textarea[name]").forEach(function(el) {
      if (!el || el.disabled || !el.id) return;
      if (!isNumericOnlyFieldId(el.id)) return;

      const raw = String(el.value || "").trim();
      if (!raw) return;
      if (!/^\d+$/.test(raw)) {
        invalids.push(el.id);
      }
    });

    return { ok: invalids.length === 0, invalids: invalids };
  }

  function checkConsistencyWarnings() {
    const warnings = [];

    const dobValue = document.getElementById("Tanggal Lahir")?.value || "";
    const refValue = document.getElementById("Tanggal Pelacakan")?.value || "";
    const statusSekolah = String(document.getElementById("Status Sekolah")?.value || "").trim();
    const kelasSaatIni = String(document.getElementById("Kelas Saat Ini")?.value || "").trim();
    const dx = String(document.getElementById("form-selector")?.value || "").toUpperCase();

    if (!isCompleteDateValue(dobValue)) return warnings;

    const val = validateBirthDateEpi(dobValue, isCompleteDateValue(refValue) ? refValue : "");
    if (!val.ok) return warnings;

    const age = val.age || {};
    const years = Number(age.years || 0);
    const totalDays = Number(age.totalDays || 0);

    if (statusSekolah === "Sekolah" && years < 5) {
      warnings.push("Status sekolah terisi 'Sekolah', tetapi umur pasien masih di bawah 5 tahun.");
    }

    const k = normalizeClassValue(kelasSaatIni);
    if (k !== null) {
      const est = estimateSchoolAgeFromClass(kelasSaatIni);
      if (est) {
        if (years < est.minYears - 1 || years > est.maxYears + 2) {
          warnings.push(`Kelas saat ini (${kelasSaatIni}) tampak kurang konsisten dengan umur pasien (${val.ageText}).`);
        }
      }
    }

    if (dx === "TN" && totalDays > 28) {
      warnings.push("Diagnosis TN dipilih, tetapi umur pasien bukan neonatus (lebih dari 28 hari).");
    }

    return warnings;
  }
</script>
